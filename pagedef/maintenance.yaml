title: Routine maintenance
template: maintenance
intro: Do each task at the odometer reading or the time interval in the table.
by_interval: A longer service also includes the tasks of the shorter intervals that come due at the same time.
new_bike: Use these services for a new or rebuilt motorcycle. After the initial 500 mile service, each service is the first time that its interval comes due.
