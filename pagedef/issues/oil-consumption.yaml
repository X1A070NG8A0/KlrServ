title: "Oil consumption at sustained high rpm"
ops: [engine-oil-and-filter]
summary:
  - t: "Clymer gives the correct oil level. The oil must be between the upper and lower marks at the sight glass, and preferably near the upper mark. Do not put too much oil in the crankcase."
    cite: {s: clymer, p: 59}
  - t: "One owner reports that a first generation engine uses oil at 5000 rpm or more, for example at freeway speed. He recommends that you make sure of the oil level at each fuel stop."
    cite: {s: forum, id: gen1-maintenance-opinions, post: 5}
sections:
  - title: "Owner reports of oil use"
    steps:
      - {t: "One forum member says that oil consumption is a concern for some KLR650 engines, mainly when the engine runs at 5,000 rpm for a long time.", cite: {s: forum, id: oil-consumption-piston, post: 1}}
      - {t: "One owner of a late model bike says that the engine uses a small quantity of oil when he runs it all day at more than 5k rpm.", cite: {s: forum, id: weak-doohickeys-frame-bolts, post: 7}}
      - {t: "Another owner says that the engine uses a quart in 1500 miles at 70 mph for long periods. He says that this is not a big problem.", cite: {s: forum, id: weak-doohickeys-frame-bolts, post: 8}}
      - {t: "One member compares the oil drain-back holes of a KLR piston with the holes of a GS400 piston. He suspects that the drain area is small. In his post, this is an idea and not a confirmed cause.", cite: {s: forum, id: oil-consumption-piston, post: 1}}
  - title: "Oil level checks"
    steps:
      - {t: "Make sure of the oil level at each fuel stop.", cite: {s: forum, id: gen1-maintenance-opinions, post: 5},
         conflict: {
           note: "The forum advice is to fill to a level a little above the window of the sight glass. Clymer says to keep the level between the marks, preferably near the upper mark, and not to put too much oil in the crankcase.",
           others: [
             {t: "One owner says to keep the sight glass full to a level a little above the window. He says that this is 2.5 liters, the quantity that Kawasaki gives. He says that the engine can burn up if you run it with a low oil level on a trip.", cite: {s: forum, id: gen1-maintenance-opinions, post: 5}},
             {t: "The oil level must be between the upper and lower marks. Preferably keep it near the upper mark. Do not put too much oil in the crankcase.", cite: {s: clymer, p: 59}}
           ]}}
      - {t: "To get an accurate reading, use the oil and filter procedure.", cite: {s: clymer, p: 59}, op: engine-oil-and-filter}
