# Clymer Chapter Thirteen and Fourteen tables, transcribed from page images (PDF p295, p326).
title: "Rear Suspension and Brakes"
pages:
  - id: rear-suspension
    title: "Rear suspension specifications"
    kind: Specification
    cite: {s: clymer, p: 295, ref: "Chapter Thirteen, Table 1"}
    rows:
      - {item: "Suspension", value: "Uni-Trak, link-type"}
      - {item: "Suspension travel", value: "230 mm (9.1 in.)"}
      - {item: "Shock absorber", value: "Nitrogen-charged, adjustable for preload and rebound damping"}
      - {group: "Pivot spacer outside diameter (swing arm and linkage assembly)", item: "Small spacers", value: "19.979-20.0 mm (0.7866-0.7874)"}
      - {group: "Pivot spacer outside diameter (swing arm and linkage assembly)", item: "Small spacers, service limit", value: "19.95 mm (0.7854 in.)"}
      - {group: "Pivot spacer outside diameter (swing arm and linkage assembly)", item: "Large spacer", value: "27.979-28.0 mm (1.1015-1.1024)"}
      - {group: "Pivot spacer outside diameter (swing arm and linkage assembly)", item: "Large spacer, service limit", value: "27.95 mm (1.1004 in.)"}

  - id: shock-settings
    title: "Shock absorber settings"
    kind: Specification
    cite: {s: clymer, p: 295, ref: "Chapter Thirteen, Table 2"}
    note: "Settings 1 and I are the softest settings and are for riders up to 68 kg (150 lb.)."
    rows:
      - {group: "Spring preload", item: "Rider only", value: "1 or 2"}
      - {group: "Spring preload", item: "Rider and passenger", value: "2 or 3"}
      - {group: "Spring preload", item: "Rider, passenger and load", value: "3, 4 or 5"}
      - {group: "Rebound damper", item: "Rider only", value: "I or II"}
      - {group: "Rebound damper", item: "Rider and passenger", value: "II or III"}
      - {group: "Rebound damper", item: "Rider, passenger and load", value: "III or IIII"}

  - id: rear-suspension-torque
    title: "Rear suspension torque specifications"
    kind: Specification
    format: torque
    cite: {s: clymer, p: 295, ref: "Chapter Thirteen, Table 3"}
    rows:
      - {group: "Shock absorber mounting bolts", item: "Lower", nm: "98", ftlb: "72"}
      - {group: "Shock absorber mounting bolts", item: "Upper", nm: "59", ftlb: "44"}
      - {item: "Swing arm pivot bolt", nm: "98", ftlb: "72"}
      - {item: "Lever-to-frame bolt", nm: "98", ftlb: "72"}
      - {item: "Lever arm bolts", nm: "98", ftlb: "72"}

  - id: brakes
    title: "Brake specifications"
    kind: Specification
    format: limits
    cite: {s: clymer, p: 326, ref: "Chapter Fourteen, Table 1"}
    rows:
      - {group: "Disc thickness", item: "Front", std: "3.8-4.1 (0.15-0.16)", limit: "3.5 (0.14)"}
      - {group: "Disc thickness", item: "Rear", std: "4.8-5.1 (0.19-0.20)", limit: "4.5 (0.18)"}
      - {item: "Disc runout", std: "0-0.2 (0-0.008)", limit: "0.3 (0.012)"}
      - {item: "Pad lining thickness", std: "4.5 (0.18)", limit: "1.0 (0.040)"}
      - {item: "Brake fluid type", std: "DOT 4"}

  - id: brake-torque
    title: "Brake system torque specifications"
    kind: Specification
    format: torque
    cite: {s: clymer, p: 326, ref: "Chapter Fourteen, Table 2"}
    rows:
      - {item: "Brake bleeder valve", nm: "8", inlb: "70"}
      - {item: "Brake disc bolts", nm: "23", ftlb: "17"}
      - {item: "Brake hose banjo bolts", nm: "25", ftlb: "18"}
      - {item: "Brake lever pivot nut", nm: "6", inlb: "52"}
      - {item: "Caliper mounting bolts", nm: "25", ftlb: "18"}
      - {group: "Master cylinder mounting bolts", item: "Front", nm: "9", inlb: "80"}
      - {group: "Master cylinder mounting bolts", item: "Rear", nm: "23", ftlb: "17"}
