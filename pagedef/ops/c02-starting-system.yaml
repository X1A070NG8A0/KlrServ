title: "Starting system troubleshooting"
system: "troubleshooting"
source: clymer
chapter: 2
section: "02/starting-system"
summary: {t: "These lists give the causes of typical starting system problems. If the starter does not operate, use the starting system tests in Chapter Nine.", cite: {p: 49}}
sections:
  - steps:
      - {kind: note, t: "Before you test a component, examine the electrical connections for the component. Look for corrosion and bent or loose connectors. If a connector is not fully locked, it can fail to make a connection. Pull the connector apart and clean the fittings before you assemble it again.", cite: {p: 49}}
  - title: "Starter turns slowly"
    steps:
      - {t: "Examine the battery for weakness.", cite: {p: 49}, op: "battery"}
      - {t: "Examine the battery terminals and cables for corrosion or a poor connection.", cite: {p: 49}, op: "battery"}
      - {t: "Make sure that the starter motor cable is not loose.", cite: {p: 49}, op: "c09-starter-removal-installation"}
      - {t: "Examine the starter for wear or damage.", cite: {p: 49}, op: "c09-starter-inspection-testing"}
  - title: "Starter turns, but does not crank the engine"
    steps:
      - {t: "Examine the starter clutch for wear or damage.", cite: {p: 49}, op: "c09-starter-clutch-test"}
      - {t: "Examine the teeth on the starter motor shaft and the starter gears for damage.", cite: {p: 49}, op: "c09-starter-inspection-testing"}
  - title: "Starter does not operate"
    steps:
      - {t: "Start the tests at the starter relay. Use the system diagram and the test procedures in Chapter Nine.", cite: {p: 49}, op: "c09-starter-relay-test", ref: "09/starting-system"}
