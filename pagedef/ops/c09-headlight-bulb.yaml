title: "Headlight bulb replacement"
system: "electrical system"
source: clymer
chapter: 9
section: "09/headlight"
summary: {t: "This procedure replaces the headlight bulb. You do not have to remove the fairing to remove the cowl or to replace the bulb.", cite: {p: 231}}
spec_refs: ["electrical-general:Light bulbs/Headlight"]
parts:
  - {name: "Headlight bulb (H4 55/60 W)", replace: inspect, cite: {p: 231}, spec_ref: "electrical-general:Light bulbs/Headlight"}
sections:
  - steps:
      - {t: "Remove the cowl from the fairing.", cite: {p: 231}, ref: "15/fairing", figs: [72]}
      - {t: "Unplug the connector. Remove the rubber cover from the back of the headlight.", cite: {p: 231}, figs: [71]}
      - {t: "Push in the socket and turn it counterclockwise to remove it from the headlight lens.", cite: {p: 231}}
      - {t: "Remove the bulb from the socket. For the bulb specification, refer to the electrical system general specifications.", cite: {p: 231}, spec_ref: "electrical-general:Light bulbs/Headlight"}
      - {t: "Clean the socket, the cover and the wire connector.", cite: {p: 231}}
      - {kind: caution, t: "Do not touch the glass of the new bulb with bare hands. Hold the bulb with a clean cloth. Oil or other contaminants on a quartz-halogen bulb prevent heat dissipation and cause a shorter bulb life.", cite: {p: 231}}
      - {t: "Put the new bulb in the socket.", cite: {p: 233}}
      - {t: "Put the socket in the lens. Push it in and turn it clockwise to lock it in the lens.", cite: {p: 233}}
      - {t: "Align the top mark on the cover. Install the cover on the lens. Make sure that the cover is seated and the bulb terminals are fully exposed.", cite: {p: 233}}
      - {t: "Connect the wire connector to the bulb terminals.", cite: {p: 233}}
      - {t: "Turn on the ignition switch. Make sure that the bulb operates on both high beam and low beam.", cite: {p: 233}}
      - {t: "Install the cowl.", cite: {p: 233}, ref: "15/fairing"}
