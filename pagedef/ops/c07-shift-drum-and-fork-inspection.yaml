title: "Shift drum and shift fork inspection"
system: "Transmission and internal shift mechanism"
source: clymer
chapter: 7
section: "07/shift-drum-and-forks"
summary: {t: "Replace parts that are worn or not within the specification.", cite: {p: 181}}
spec_refs: ["transmission:Shift drum groove width", "transmission:Shift fork guide pin diameter", "transmission:Shift fork claw thickness"]
parts:
  - {name: "Shift drum, shift forks and fork shafts", replace: inspect, cite: {p: 181}, note: "Replace parts that are worn or out of limit."}
sections:
  - steps:
      - {t: "Clean all parts in solvent. Dry them with compressed air.", cite: {p: 181}}
      - {t: "Examine the shift drum grooves and cam points for wear. The grooves must have the same width along their length.", cite: {p: 181}}
      - {t: "Measure the width of each shift drum groove in several places. If the width is more than the service limit, replace the shift drum.", cite: {p: 181}, figs: [42], spec_ref: "transmission:Shift drum groove width"}
      - {t: "Examine the shift drum bearing surfaces for wear, heat discoloration and a lack of lubrication.", cite: {p: 181}}
      - {t: "Put the shift drum in the crankcase bearings. Make sure that there is no play.", cite: {p: 181}}
      - {t: "If necessary, replace the shift drum bearings.", cite: {p: 181}, ref: "05/crankcase-bearing-replacement"}
      - {t: "Examine the guide pin of each shift fork. The pin must be symmetrical and not flat on one side.", cite: {p: 181}}
      - {t: "Measure the diameter of each guide pin. If the diameter is less than the service limit, replace the shift fork.", cite: {p: 181}, figs: [43], spec_ref: "transmission:Shift fork guide pin diameter"}
      - {t: "Measure the thickness of both claws at the end of each shift fork. If the thickness is less than the service limit, replace the shift fork.", cite: {p: 181}, figs: [44], spec_ref: "transmission:Shift fork claw thickness"}
      - {t: "Examine the shift fork shafts for wear and damage.", cite: {p: 181}}
      - {t: "Install the No. 1, No. 2 and No. 3 shift forks on the fork shafts.", cite: {p: 181}, figs: [45]}
      - {t: "Make sure that the forks slide and pivot smoothly with no too much play and no tight spots.", cite: {p: 181}}
      - {kind: note, t: "To identify shift forks No. 1 and No. 2, look at the casting around the guide pins. These forks mate with the output shaft gears.", cite: {p: 181}, figs: [46]}
      - {kind: note, t: "Shift fork No. 1 mates with fourth gear. Shift fork No. 2 mates with fifth gear.", cite: {p: 181}}
      - {kind: note, t: "Shift fork No. 3 has a smaller claw diameter. It mates only with third gear on the input shaft.", cite: {p: 181}}
      - {t: "Install the shift drum, the forks and the transmission in the crankcase.", cite: {p: 181}, ref: "05/crankcase"}
