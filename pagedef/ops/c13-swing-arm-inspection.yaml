title: "Swing arm inspection and repair"
system: "Rear suspension"
source: clymer
chapter: 13
section: "13/swing-arm-service"
summary: {t: "This procedure cleans and examines the swing arm, the guides and the pivot bearings. It also installs the seals and pivot spacers. Remove the swing arm first.", cite: {p: 290}}
parts:
  - {name: "Molydisulfide grease or waterproof grease", replace: consumable, cite: {p: 289}, note: "Kawasaki recommends molydisulfide grease for all swing arm bearings. Waterproof grease is durable and resists washout. Which one to use is the choice of the rider."}
  - {name: "Swing arm pivot bolt and nut", replace: inspect, cite: {p: 291}, note: "Replace them if they have rounded flats."}
  - {name: "Swing arm bushings (back of engine)", replace: inspect, cite: {p: 291}, note: "When you replace the bearing sets, always replace the bushing on each side of the engine case."}
  - {name: "Swing arm needle bearings", replace: inspect, cite: {p: 291}}
  - {name: "Swing arm seals", replace: inspect, cite: {p: 291}}
  - {name: "Chain slider", replace: inspect, cite: {p: 290}, note: "Replace the slider if it is worn to more than half of its thickness."}
  - {name: "Brake hose guide", replace: inspect, cite: {p: 290}, note: "Replace the guide if it is corroded or damaged."}
sections:
  - title: "Preparation and guides"
    steps:
      - {kind: note, t: "Do not remove the bearing pivot spacers until you will examine the bearings. The rollers of aftermarket bearings can fall out.", cite: {p: 290}}
      - {t: "Make sure that the spacers are firmly in position before you examine them. If necessary, tape the ends of the bearing bores.", cite: {p: 290}}
      - {t: "Clean the swing arm, in particular around all bearings.", cite: {p: 290}}
      - {t: "Examine the hose guide. If it is corroded or damaged, replace it.", cite: {p: 290}, figs: [37]}
      - {t: "Examine the chain guard and the chain guide. Make sure that all fasteners are tight.", cite: {p: 290}, figs: [38]}
      - {t: "Make sure that the chain guard is locked in the upper and lower brackets at the front of the swing arm.", cite: {p: 290}, figs: [39]}
      - {t: "Examine the chain guide for too much wear.", cite: {p: 290}}
      - {t: "Examine the chain slider and the mounting bolts.", cite: {p: 290}, figs: [40]}
      - {t: "If the slider is worn to more than half of its thickness, replace it. If the slider wears through, the swing arm can get damaged.", cite: {p: 290}, figs: [41]}
      - {t: "Examine the small slider below the swing arm bolt, where the chain returns to the rear wheel.", cite: {p: 290}}
      - {kind: note, t: "To make the work on the bearings easier, remove the chain guard and the chain guide.", cite: {p: 290}}
  - title: "Bearings"
    steps:
      - {t: "At each bearing, remove the pivot spacer.", cite: {p: 291}, figs: [42]}
      - {t: "Remove the seals. Pry the seals at their outer edge.", cite: {p: 291}, figs: [43]}
      - {kind: note, t: "Original equipment bearings have fixed rollers. If the rollers of aftermarket bearings can be removed, put them in a marked container. Install them in their original housing.", cite: {p: 291}}
      - {t: "Clean the bearings, the spacers, the seals and the bores in clean solvent. Dry all parts.", cite: {p: 291}, figs: [44]}
      - {t: "Examine the swing arm for cracks, in particular around the bearing bores.", cite: {p: 291}}
      - {t: "Examine the swing arm pivot bolt and nut for scoring, wear and damage. Replace them if they have rounded flats.", cite: {p: 291}}
      - {t: "Examine the fit of the pivot bolt in the bushings at the back of the engine. If the bushings are worn, drive out both bushings with a drift.", cite: {p: 291}, figs: [45]}
      - {t: "Examine the seals for cracks, wear and damage.", cite: {p: 291}}
      - {t: "Examine the pivot spacers for scoring, wear and damage.", cite: {p: 291}}
      - {t: "Examine the needle bearings for wear, flat spots, rust and discoloration. If the rollers are blue, the bearing was too hot.", cite: {p: 291}}
      - {t: "Lightly lubricate the bearings and the pivot spacers. Put each spacer in its bearing.", cite: {p: 291}, figs: [46]}
      - {t: "Make sure that the parts turn freely and smoothly with no play.", cite: {p: 291}}
      - {t: "If there is play or roughness, replace the bearing set.", cite: {p: 291}, op: c13-swing-arm-bearing-replacement}
      - {t: "When you replace the bearing sets in the swing arm pivots, also replace the bushing on each side of the engine case.", cite: {p: 291}, figs: [47]}
  - title: "Assembly"
    steps:
      - {t: "Pack grease into the bearings and the bores.", cite: {p: 291}, figs: [48]}
      - {t: "Apply grease to the seals, the pivot spacers, the swing arm bushings at the back of the engine and the bolts.", cite: {p: 291}}
      - {t: "Press the seals into position by hand.", cite: {p: 292}}
      - {t: "If the seals do not seat, examine the bearing depth. If necessary, adjust the depth.", cite: {p: 292}}
      - {t: "Hold the seals and twist the pivot spacers into position.", cite: {p: 292}, figs: [49]}
      - {t: "If you removed the chain guard and the chain guide, install them.", cite: {p: 292}}
      - {t: "Install the swing arm.", cite: {p: 292}, op: c13-swing-arm-removal, figs: [50]}
