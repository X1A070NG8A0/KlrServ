title: "Drive chain removal and installation, chain with no master link"
system: "Wheels, tires and drive chain"
source: clymer
chapter: 11
section: "11/drive-chain"
summary: {t: "The motorcycle comes new with an endless O-ring chain. To remove an endless chain, partially disassemble the swing arm so that the chain can pass out of the swing arm pivot.", cite: {p: 253}}
spec_refs: ["wheel-drive-torque:Swing arm pivot bolt", "wheel-drive-torque:Swing arm lever bolts"]
parts:
  - {name: "Drive chain", replace: inspect, cite: {p: 253}, note: "If either the chain or the sprockets are worn, replace all drive components."}
  - {name: "Waterproof grease", replace: consumable, cite: {p: 254}}
sections:
  - steps:
      - {kind: note, t: "Examine the sprockets when you examine the chain. If the chain or the sprockets are worn, replace all drive components. A new chain on worn sprockets, or new sprockets on a worn chain, shortens the life of the new part.", cite: {p: 253}, op: drive-chain-inspect}
      - {t: "Remove the rear wheel.", cite: {p: 253}, op: c11-rear-wheel}
      - {t: "Remove the sprocket guard so that you can remove the chain from the drive sprocket.", cite: {p: 254}, figs: [40]}
      - {t: "Pull the chain forward and remove it from the sprocket. The clearance is small when you move the chain down past the sprocket shaft.", cite: {p: 254}}
      - {t: "Disconnect the lever arms at each end.", cite: {p: 254}, figs: [41], ref: "13/shock-absorber-linkage"}
      - {t: "Position the chain so that it can come out of the chain guard and the guide when you lower the swing arm.", cite: {p: 254}, figs: [42]}
      - {t: "Loosen the swing arm bolt. Support the swing arm while you remove the bolt.", cite: {p: 254}, figs: [40], ref: "13/swing-arm"}
      - {t: "Lower the swing arm. Remove the chain.", cite: {p: 254}}
      - {t: "To install the chain, do the removal steps in reverse order.", cite: {p: 254}}
      - {t: "Clean the bores of the swing arm and the lever arms and examine them before you assemble them. Apply waterproof grease to the parts.", cite: {p: 254}}
      - {t: "Seat the lever arm bolt head in the counterbore of the left arm.", cite: {p: 254}}
      - {t: "Tighten the lever arm bolt to the specified torque.", cite: {p: 254}, spec_ref: "wheel-drive-torque:Swing arm lever bolts"}
      - {t: "Tighten the swing arm bolt to the specified torque.", cite: {p: 254}, spec_ref: "wheel-drive-torque:Swing arm pivot bolt"}
      - {t: "Adjust the drive chain.", cite: {p: 254}, op: drive-chain-adjust}
