title: "Front brake pad replacement"
system: "brakes"
source: clymer
chapter: 14
section: "14/front-brake-pads"
summary: {t: "Remove the front caliper from the fork leg to replace the pads. You do not have to disconnect the brake hose.", cite: {p: 297}}
spec_refs:
  - "brakes:Pad lining thickness"
  - "brake-torque:Caliper mounting bolts"
parts:
  - {name: "Front brake pads", replace: inspect, cite: {p: 299}, note: "Replace the pads if they are worn to within 1 mm (0.040 in.) of the backing plate, or if oil or other chemicals contaminate them."}
  - {name: "Pad spring", replace: inspect, cite: {p: 299}}
  - {name: "Pad pin and lock pin", replace: inspect, cite: {p: 299}}
sections:
  - title: "Removal"
    steps:
      - {t: "Hold the caliper in your hand during this procedure. Keep the caliper supported. Do not let it hang by the brake hose.", cite: {p: 297}}
      - {t: "Remove the caliper mounting bolts.", cite: {p: 297}, figs: [2]}
      - {t: "Remove the lock pin from the pad pin.", cite: {p: 298}, figs: [3]}
      - {t: "Press up on the pads to release the pressure on the pad pin. Then remove the pad pin.", cite: {p: 298}, figs: [4]}
      - {t: "Pivot the outer pad and remove it.", cite: {p: 298}}
      - {t: "Press up on the inner pad to release it. Remove it from the caliper.", cite: {p: 298}, figs: [5]}
      - {t: "Remove the pad spring.", cite: {p: 298}, figs: [6]}
      - {kind: caution, t: "Watch the fluid level in the master cylinder reservoir in the next step. Brake fluid flows back to the reservoir when you press the piston into the bore. Do not let fluid spill from the reservoir. Wash spills immediately with water. Fluid can damage painted and plastic surfaces.", cite: {p: 298}}
      - {t: "Hold the caliper and press the caliper piston into the bore. This makes space for the new pads.", cite: {p: 298}}
      - {kind: note, t: "Do not operate the brake lever when the pads are removed. The caliper piston can come out of the bore.", cite: {p: 298}}
  - title: "Inspection"
    steps:
      - {t: "Clean the inside of the caliper.", cite: {p: 298}}
      - {t: "Examine the area around the piston, the bleeder valve and the hose connection for leaks and damage.", cite: {p: 298}}
      - {t: "Examine the fork seals for leaks. Fork oil contaminates the brake pads.", cite: {p: 298}}
      - {t: "Examine the boots. Replace a boot that is damaged or missing.", cite: {p: 298}}
      - {t: "Move the caliper holder in and out of the caliper. If the drag is too high, or if there is corrosion or water around the slide pin boots, clean the parts. Lubricate them with silicone brake grease.", cite: {p: 298}}
      - {t: "Examine the pad pin, the lock pin and the pad spring. They must be in good condition so that the inner pad can move a small distance.", cite: {p: 299}, figs: [7]}
      - {t: "Make sure that the small tabs on the pad spring are not corroded or missing.", cite: {p: 299}}
      - {t: "Examine the pads for contamination, scoring and wear.", cite: {p: 299}}
      - {t: "If the pads are worn to within 1 mm (0.040 in.) of the backing plate, replace them. Also replace them if oil or other chemicals contaminate them.", cite: {p: 299}, spec_ref: "brakes:Pad lining thickness"}
      - {t: "If the pads wear unevenly, the caliper probably does not slide correctly on the slide pins. Clean the pins. Buildup or corrosion on the pins holds the caliper in one position. This causes brake drag and fast pad wear.", cite: {p: 299}}
  - title: "Installation"
    steps:
      - {t: "Install the pad spring with the narrow arms toward the outside. Seat the spring in the caliper.", cite: {p: 299}}
      - {t: "Put the inner pad in the pad spring and the caliper. Then pivot the outer pad into the caliper.", cite: {p: 299}, figs: [8]}
      - {t: "Seat the outer pad between the small tabs at the top and bottom of the pad spring.", cite: {p: 299}}
      - {t: "Press up on the pads. Align the pad pin and install it.", cite: {p: 299}}
      - {t: "Put the lock pin in the pad pin.", cite: {p: 299}, figs: [9]}
      - {t: "Put the caliper over the brake disc. Guide the disc between the pads.", cite: {p: 299}}
      - {t: "Install the caliper mounting bolts. Tighten them to the specified torque.", cite: {p: 299}, spec_ref: "brake-torque:Caliper mounting bolts"}
      - {t: "Operate the brake lever several times to seat the pads.", cite: {p: 299}}
      - {t: "Examine the brake fluid level in the reservoir. Add or remove fluid as necessary.", cite: {p: 299}, op: brake-fluid-level}
      - {t: "Raise the front wheel. Make sure that the wheel turns freely and that the brake operates correctly.", cite: {p: 299}}
