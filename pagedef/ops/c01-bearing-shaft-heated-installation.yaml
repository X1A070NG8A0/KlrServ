title: "Bearing installation on a shaft with an interference fit"
system: "General information"
source: clymer
chapter: 1
section: "01/repair-methods"
summary: {t: "If a tight fit is necessary, the bearing inside diameter is smaller than the shaft. Heat the bearing in oil before you install it. Do not drive it onto the shaft.", cite: {p: 36}}
sections:
  - steps:
      - {t: "Secure the shaft so that it is ready for the bearing.", cite: {p: 36}}
      - {t: "Clean all residue from the bearing surface of the shaft. Remove burrs with a file or sandpaper.", cite: {p: 36}}
      - {t: "Fill a suitable container with clean mineral oil.", cite: {p: 36}}
      - {t: "Put a thermometer rated more than 248° F (120° C) in the oil. Support it so that it does not touch the bottom or the side of the container.", cite: {p: 36}}
      - {t: "Remove the bearing from its wrapper. Secure it with a piece of heavy wire that holds it in the container.", cite: {p: 36}}
      - {t: "Hang the bearing so that it does not touch the bottom or the sides.", cite: {p: 36}}
      - {t: "Turn the heat on. Monitor the thermometer.", cite: {p: 36}}
      - {t: "When the oil temperature is approximately 248° F (120° C), remove the bearing and install it quickly.", cite: {p: 36}}
      - {t: "If necessary, put a socket on the inner bearing race and tap the bearing into place.", cite: {p: 36}}
      - {t: "Do the installation quickly. The bearing tightens on the shaft as it cools.", cite: {p: 36}}
      - {t: "Make sure that the bearing is installed completely.", cite: {p: 36}}
