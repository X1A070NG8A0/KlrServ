      - {t: "Remove the snap ring.", cite: {p: 172}}
      - {t: "Remove the spline washer.", cite: {p: 172}}
      - {t: "Remove fourth gear.", cite: {p: 172}}
      - {t: "Remove the spline washer.", cite: {p: 172}}
      - {t: "Remove the snap ring.", cite: {p: 172}}
      - {t: "Remove third gear.", cite: {p: 172}}
      - {t: "Remove the snap ring.", cite: {p: 172}}
      - {t: "Remove the thrust washer.", cite: {p: 172}}
