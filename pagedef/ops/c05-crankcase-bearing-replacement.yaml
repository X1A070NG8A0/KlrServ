title: "Crankcase bearing replacement"
system: "Engine lower end"
source: clymer
chapter: 5
section: "05/crankcase-bearing-replacement"
summary: {t: "All the crankcase bearings have an interference fit. Heat the case to remove and install them. Preferably, use a press.", cite: {p: 144}}
parts:
  - {name: "Crankcase bearing", replace: inspect, cite: {p: 145}, note: "Chill the new bearing in a freezer for at least one hour."}
sections:
  - title: "Tools"
    steps:
      - {t: "For more bearing removal and installation techniques, read the section on bearings in Chapter One. Read the section on interference fit if you will use heat.", cite: {p: 144}}
      - {t: "Preferably, remove the crankcase bearings with a press. A press applies the pressure more evenly and you can control it.", cite: {p: 144}}
      - {t: "If you must use bearing drivers and pullers, Kawasaki recommends the bearing driver set, part No. 570011-1129, or an equivalent. Order the set from a dealer.", cite: {p: 144}}
      - {t: "Use a blind bearing puller for the transmission shaft bushings.", cite: {p: 144}}
  - title: "Bearing identification"
    steps:
      - {t: "If a bearing has a retainer, remove the retainer before you remove the bearing. When you install the retainers, clean the screw threads and use threadlocking compound.", cite: {p: 144}, figs: [55]}
      - {t: "Before you remove a bearing, find the size code and record it. Then you install each bearing in its correct bore.", cite: {p: 144}}
      - {t: "Record which way each bearing faces in its bore. Note if the size code faces the inside or the outside of the case. Usually the marks face up when you install the bearing.", cite: {p: 145}}
      - {t: "Use a hydraulic press or a set of bearing drivers to remove and install bearings. Heat makes the removal and installation easier.", cite: {p: 145}}
      - {t: "To remove a bearing that you can get to from one side of the case only, use a blind bearing puller. Put the puller through the bearing and expand it to grip the back side of the bearing. Quickly pull the sliding weight on the tool back to dislodge the bearing.", cite: {p: 145}}
  - title: "Right crankcase bearings"
    steps:
      - {kind: note, t: "Marks that face in face the inside of the case. Marks that face out face the outside of the case.", cite: {p: 145}, figs: [56]}
      - {t: "The front balancer shaft bearing has its marks facing out.", cite: {p: 145}}
      - {t: "The crankshaft bearing has its marks facing in.", cite: {p: 145}}
      - {t: "The rear balancer shaft bearing has its marks facing in.", cite: {p: 145}}
      - {t: "The input shaft bearing has its marks facing in.", cite: {p: 145}}
      - {t: "The shift drum bearing has its marks facing in.", cite: {p: 145}}
      - {t: "The output shaft has a bushing.", cite: {p: 145}}
  - title: "Left crankcase bearings"
    steps:
      - {t: "The output shaft bearing has its marks facing out.", cite: {p: 145}, figs: [57]}
      - {t: "The input shaft has a bushing.", cite: {p: 145}}
      - {t: "The shift drum has a bushing.", cite: {p: 145}}
      - {t: "The rear balancer shaft bearing has its marks facing in.", cite: {p: 145}}
      - {t: "The crankshaft bearing race has its marks facing in. The roller bearing is on the crankshaft.", cite: {p: 145}}
      - {t: "The front balancer shaft bearing has its marks facing out.", cite: {p: 145}}
  - title: "Bearing replacement"
    steps:
      - {t: "Read the complete procedure before you replace a bearing.", cite: {p: 145}}
      - {kind: caution, t: "Before you do this procedure, read the bearing identification steps for the specified bearing. Do not install a bearing until you know the specific information.", cite: {p: 145}}
      - {t: "If the bearing has a seal, remove the seal.", cite: {p: 145}, op: c05-seal-replacement}
      - {t: "Make a note of which side of the bearing faces up.", cite: {p: 145}}
      - {kind: caution, t: "Do not heat the housing or the bearing with a propane or acetylene torch. The direct heat destroys the case hardening of the bearing and can warp the housing.", cite: {p: 145}}
      - {t: "Heat the crankcase. Obey all the safety and handling procedures for a heated case.", cite: {p: 145}}
      - {t: "Support the heated crankcase on wooden blocks. Leave space for the bearing to fall from the bore.", cite: {p: 145}}
      - {t: "Remove the damaged bearing from the bore. Use a press, a hand-driver set or a bearing puller.", cite: {p: 145}}
      - {t: "Clean the bore and examine it. Make sure that all the oil holes are clean.", cite: {p: 145}}
      - {t: "Put the new bearing in a freezer for at least one hour.", cite: {p: 145}}
      - {t: "When the bearing is chilled, heat the crankcase again.", cite: {p: 145}}
      - {t: "Support the heated crankcase on wooden blocks. Lubricate the mating surface of the bore and the bearing.", cite: {p: 145}}
      - {t: "Put the bearing squarely over the bore. Make sure that the orientation is correct.", cite: {p: 145}}
      - {t: "If you do not know the correct orientation of a bearing that is not sealed on either side, install it with the manufacturer marks, stamped on the side of the bearing, facing up.", cite: {p: 145}}
      - {t: "If a bearing has one sealed side, install it with the sealed side facing down.", cite: {p: 146}}
      - {t: "Use a press to install the bearing. Use a driver that fits on the outer bearing race.", cite: {p: 146}}
      - {kind: caution, t: "If you do not have a press, you can seat the bearing by hand with a driver and a hammer. Put the driver squarely over the bearing and drive the bearing into the case. Do not use too much force. The bearing and the case can be damaged.", cite: {p: 146}}
      - {t: "If the bearing has a seal, install the seal.", cite: {p: 146}, op: c05-seal-replacement}
