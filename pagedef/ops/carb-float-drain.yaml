title: "Carburetor float chamber drain"
system: "Fuel system"
source: clymer
chapter: 3
section: "03/maintenance-and-inspection"
summary:
  t: "The float chamber drain removes moisture and sediment. Moisture and sediment can clog the jets and cause poor engine operation. Also drain the float chamber if you store the motorcycle or do not start it for a long time."
  cite: {p: 68}
sections:
  - steps:
      - {kind: warning, t: "Do not drain the float chamber when the engine is hot or when it runs. The fuel can ignite.", cite: {p: 68}}
      - {t: "Support the motorcycle so that it is vertical and level.", cite: {p: 68}}
      - {t: "Connect a hose with a 1/4 in. inside diameter to the drain (A).", cite: {p: 68}, figs: [40],
         gap: "The manual prints \"25 mm (1/4 in.)\". 1/4 in. is 6.35 mm (Clymer Chapter One Table 5 conversion, PDF p41). 25 mm is probably a misprint for about 6 mm."}
      - {t: "Put the other end of the hose in a suitable container.", cite: {p: 68}, figs: [40]}
      - {t: "Turn the drain screw (B) out two turns. Let all the fuel in the chamber flow into the container.", cite: {p: 69}, figs: [40]}
      - {t: "Close the drain screw.", cite: {p: 69}}
      - {t: "Disconnect the drain hose.", cite: {p: 69}}
