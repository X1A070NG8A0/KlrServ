title: "Torque wrench setting with a torque adapter"
system: "General information"
source: clymer
chapter: 1
section: "01/basic-tools"
summary: {t: "A torque adapter can change the effective lever length of a torque wrench. If it does, the reading on the wrench is not the torque on the fastener. This procedure gives the setting to use.", cite: {p: 25}}
sections:
  - steps:
      - {t: "If the torque adapter is at a right angle to the drive head, do not change the torque setting. The effective length does not change.", cite: {p: 25}}
      - {t: "If the adapter changes the effective lever length, calculate the torque wrench setting with this formula: TW = TA x L / (L + A).", cite: {p: 25}}
      - {t: "TW is the setting or dial reading on the wrench. TA is the torque specification, which is the actual torque on the fastener.", cite: {p: 25}}
      - {t: "A is the amount that the adapter adds to the effective lever length, measured along the centerline of the wrench. L is the lever length from the center of the drive to the center of the grip.", cite: {p: 25}}
      - {t: "Set the torque wrench to the value that you calculated.", cite: {p: 25}}
      - {t: "If you use a beam-type wrench, tighten the fastener until the pointer aligns with the calculated value.", cite: {p: 25}}
      - {kind: note, t: "Example: TA is 20 ft.-lb., A is 3 in. and L is 14 in. TW is 16.5 ft.-lb. The actual torque is 20 ft.-lb.", cite: {p: 25}}
