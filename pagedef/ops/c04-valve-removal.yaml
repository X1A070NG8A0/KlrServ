title: "Valve removal"
system: "Engine top end"
source: clymer
chapter: 4
section: "04/valves"
summary: {t: "This procedure removes the valves from the cylinder head with a valve spring compressor. Do the procedure for each valve.", cite: {p: 108}}
parts:
  - {name: "Valve spring compressor, part No. 57001-241 or equivalent", replace: consumable, cite: {p: 108}, note: "Special tool."}
  - {name: "Valve spring compressor adapter, part No. 57001-243 or equivalent", replace: consumable, cite: {p: 108}, note: "Special tool."}
  - {name: "Valve oil seal", replace: always, cite: {p: 109}}
  - {name: "Valve oil seal circlip", replace: always, cite: {p: 109}}
sections:
  - steps:
      - {t: "Remove the cylinder head, the shims and the valve lifters.", cite: {p: 108}, op: c04-cylinder-head-removal}
      - {t: "Do the solvent test on the intake and exhaust valves.", cite: {p: 108}, op: c04-valve-solvent-test}
      - {t: "Put a valve spring compressor (part No. 57001-241 or equivalent) and an adapter (part No. 57001-243 or equivalent) over the valve assembly.", cite: {p: 108}, figs: [54]}
      - {t: "Put the fixed end of the tool squarely over the valve head. Put the other end squarely on the spring retainer.", cite: {p: 108}, figs: [54]}
      - {t: "Tighten the compressor until the spring retainer no longer holds the valve keepers in position.", cite: {p: 109}}
      - {t: "Lift the keepers from the valve stem. A magnetic tool works well.", cite: {p: 109}, figs: [55]}
      - {kind: caution, t: "Do not tighten the compressor too much and compress the valve springs too much. This can cause a loss of valve spring tension.", cite: {p: 109}}
      - {t: "Slowly release the pressure on the valve springs. Remove the compressor from the head.", cite: {p: 109}}
      - {t: "Remove the spring retainer and the valve springs.", cite: {p: 109}}
      - {t: "Slide the circlip on the oil seal down. Remove the oil seal, the circlip and the spring seat.", cite: {p: 109}}
      - {t: "Examine the valve stem for sharp and flared metal around the groove for the keepers.", cite: {p: 109}, figs: [56]}
      - {t: "If necessary, deburr the valve stem before you remove the valve from the head. Burrs on the valve stem can cause damage to the valve guides.", cite: {p: 109}}
      - {t: "Remove the valve from the cylinder head.", cite: {p: 109}}
      - {t: "Keep the parts of each valve assembly with the shim and the valve lifter for that location.", cite: {p: 109}, figs: [57]}
      - {kind: caution, t: "Install valve components that are in specification in their original positions. Replace the oil seal and the circlip.", cite: {p: 109}}
      - {t: "Do again the procedure for the remaining valves.", cite: {p: 109}}
