title: "Gear shift linkage and transmission troubleshooting"
system: "troubleshooting"
source: clymer
chapter: 2
section: "02/gear-shift-linkage-and-transmission"
summary: {t: "Transmission problems are hard to tell from clutch and gear shift linkage problems. For example, a dragging clutch or a shift linkage part can cause gear grind. Start with the easy checks before you disassemble the engine.", cite: {p: 53}}
sections:
  - title: "Engine oil examination"
    steps:
      - {t: "When the transmission has abnormal noise or operation, drain the engine oil.", cite: {p: 53}, op: "engine-oil-and-filter"}
      - {t: "Examine a small quantity of the oil under bright light for a metallic cast or pieces of metal.", cite: {p: 53}}
      - {t: "If you see metal, excessive wear or part failure occurs.", cite: {p: 53}, ref: "07/transmission-inspection"}
  - title: "Difficult shifting: clutch"
    steps:
      - {t: "Make sure that the clutch operates correctly.", cite: {p: 53}, ref: "02/clutch"}
      - {t: "Make sure that the clutch adjustment is correct.", cite: {p: 53}, op: "clutch-adjust"}
      - {t: "Make sure that the engine oil has the correct viscosity.", cite: {p: 53}, op: "c03-fuel-and-lubricants"}
  - title: "Difficult shifting: shift shaft"
    steps:
      - {t: "Make sure that the shift lever is not loose or stripped.", cite: {p: 53}, op: "c06-gearshift-linkage-inspection"}
      - {t: "Examine the shift shaft for bends or damage.", cite: {p: 53}, op: "c06-gearshift-linkage-inspection"}
      - {t: "Examine the engagement points of the pawl plate for wear.", cite: {p: 53}, op: "c06-gearshift-linkage-inspection"}
      - {t: "Examine the pawl plate and the pawl spring for damage.", cite: {p: 53}, op: "c06-gearshift-linkage-inspection"}
      - {t: "Examine the return spring for damage and the spring post for looseness.", cite: {p: 53}, op: "c06-gearshift-linkage-inspection"}
  - title: "Difficult shifting: lever"
    steps:
      - {t: "Examine the lever for damage.", cite: {p: 53}, op: "c06-gearshift-linkage-inspection"}
      - {t: "Examine the lever spring for breaks.", cite: {p: 53}, op: "c06-gearshift-linkage-inspection"}
      - {t: "Make sure that the lever bolt is not loose.", cite: {p: 53}, op: "c06-gearshift-linkage-inspection"}
  - title: "Difficult shifting: shift drum and shift forks"
    steps:
      - {t: "Examine the shift cam for wear or looseness.", cite: {p: 53}, op: "c07-shift-drum-and-fork-inspection"}
      - {t: "Examine the grooves of the shift drum for wear.", cite: {p: 53}, op: "c07-shift-drum-and-fork-inspection"}
      - {t: "Examine the shift forks and the guide pins for wear.", cite: {p: 53}, op: "c07-shift-drum-and-fork-inspection"}
      - {t: "Examine the shift drum bearings for wear.", cite: {p: 53}, op: "c07-shift-drum-and-fork-inspection"}
  - title: "Gears do not stay engaged"
    steps:
      - {t: "Examine the lever for damage.", cite: {p: 54}, op: "c06-gearshift-linkage-inspection"}
      - {t: "Examine the lever spring for breaks.", cite: {p: 54}, op: "c06-gearshift-linkage-inspection"}
      - {t: "Examine the shift cam for wear or looseness.", cite: {p: 54}, op: "c07-shift-drum-and-fork-inspection"}
      - {t: "Examine the grooves of the shift drum for wear.", cite: {p: 54}, op: "c07-shift-drum-and-fork-inspection"}
      - {t: "Examine the shift forks and the guide pins for wear.", cite: {p: 54}, op: "c07-shift-drum-and-fork-inspection"}
      - {t: "Examine the gear dogs and the mating recesses for wear.", cite: {p: 54}, op: "c07-shaft-inspection"}
      - {t: "Examine the gear grooves for the shift forks for wear.", cite: {p: 54}, op: "c07-shaft-inspection"}
      - {t: "Examine the shaft snap rings and the thrust washers for wear or damage.", cite: {p: 54}, op: "c07-shaft-inspection"}
