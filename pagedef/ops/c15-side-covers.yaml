title: "Side cover removal and installation"
system: "body"
source: clymer
chapter: 15
section: "15/side-covers"
summary: {t: "This procedure removes and installs a side cover. A friction barb holds the cover in a grommet.", cite: {p: 327}}
sections:
  - title: "Removal"
    steps:
      - {t: "Remove the screws at the front and rear of the cover.", cite: {p: 327}}
      - {t: "Pull the bottom of the cover out to release the friction barb from the grommet.", cite: {p: 328}}
      - {t: "Remove the cover.", cite: {p: 328}}
  - title: "Installation"
    steps:
      - {t: "Put the rear edge of the cover in first. The cover must fit under the rear fender.", cite: {p: 328}}
      - {t: "Align the friction barb with the grommet.", cite: {p: 328}}
      - {t: "Press the cover into position.", cite: {p: 328}}
      - {t: "Install and tighten the screws.", cite: {p: 328}}
