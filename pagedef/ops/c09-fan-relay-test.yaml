title: "Fan relay test"
system: "electrical system"
source: clymer
chapter: 9
section: "09/fan-system"
summary: {t: "The fan relay is on the right side of the motorcycle, under the fuel tank.", cite: {p: 229}}
spec_refs: ["electrical-test:Fan relay coil resistance"]
sections:
  - steps:
      - {t: "Remove the fuel tank.", cite: {p: 229}, ref: "15/fuel-tank", figs: [65]}
      - {t: "Remove the relay from the mount. Then unplug the relay.", cite: {p: 229}}
      - {t: "Connect a 12-volt battery and an ohmmeter to the relay terminals. Set the ohmmeter to R x 1 ohm.", cite: {p: 229}, figs: [67]}
      - {kind: note, t: "Terminals 1 (red/white) and 2 (white) connect to the relay coil. Terminals 3 (blue) and 4 (white) connect to the relay switch.", cite: {p: 229}}
      - {t: "With the battery connected, test for continuity through the relay switch, terminals 3 and 4. There must be continuity.", cite: {p: 229}}
      - {t: "Disconnect the battery. Test for continuity through the relay switch, terminals 3 and 4. There must be no continuity.", cite: {p: 229}}
      - {t: "With the battery disconnected, measure the relay coil resistance at terminals 1 and 2. Compare it with the specification.", cite: {p: 229}, spec_ref: "electrical-test:Fan relay coil resistance"}
      - {t: "If the relay fails any test, replace the relay.", cite: {p: 229}}
