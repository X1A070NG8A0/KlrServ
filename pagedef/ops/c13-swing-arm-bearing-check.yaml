title: "Swing arm bearing inspection"
system: "Rear suspension"
source: clymer
chapter: 13
section: "13/swing-arm"
summary: {t: "You can examine the swing arm bearings with the swing arm on the motorcycle. Periodically examine the bearings for play, roughness and damage.", cite: {p: 287}}
spec_refs: ["rear-suspension-torque:Swing arm pivot bolt"]
sections:
  - steps:
      - {t: "Remove the rear wheel.", cite: {p: 287}, ref: "11/rear-wheel"}
      - {t: "Loosen the swing arm pivot nut.", cite: {p: 287}, figs: [29]}
      - {t: "Tighten the swing arm pivot nut to the specified torque.", cite: {p: 287}, spec_ref: "rear-suspension-torque:Swing arm pivot bolt", conflict: {note: "Kawasaki gives the same torque for the swing arm pivot bolt and nut.", agrees: true, others: [{t: "The swing arm pivot bolt and nut torque is 98 N-m (72 ft-lb).", cite: {s: kaw-supp, p: 15}}]}}
      - {t: "Remove the pivot bolt from the swing arm and the lever arms.", cite: {p: 287}, figs: [30]}
      - {t: "Separate the linkage so that only the swing arm pivot bolt controls the movement of the swing arm.", cite: {p: 287}}
      - {t: "Ask an assistant to hold the motorcycle steady.", cite: {p: 287}}
      - {t: "Hold the ends of the swing arm. Move the swing arm from side to side.", cite: {p: 287}}
      - {t: "Make sure that there is no play in the bearings.", cite: {p: 287}}
      - {t: "Move the swing arm up and down through its full travel. Make sure that the bearings turn smoothly.", cite: {p: 287}}
      - {t: "If there is play or roughness, remove the swing arm. Examine the bearings and the pivot parts for wear.", cite: {p: 287}, op: c13-swing-arm-removal}
      - {t: "Install the lever arms. Tighten the pivot bolt to the specified torque.", cite: {p: 287}, spec_ref: "rear-suspension-torque:Lever arm bolts"}
