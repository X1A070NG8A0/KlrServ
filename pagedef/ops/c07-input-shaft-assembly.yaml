title: "Input shaft assembly"
system: "Transmission and internal shift mechanism"
source: clymer
chapter: 7
section: "07/input-shaft"
summary: {t: "Install the parts in order, from fifth gear to the snap ring at the end. The direction of each part is in relation to first gear on the shaft.", cite: {p: 172}}
parts:
  - {name: "Snap rings", replace: always, cite: {p: 172}, note: "Have new snap rings ready before you start."}
  - {name: "Engine oil", replace: consumable, cite: {p: 173}}
sections:
  - steps:
      - {t: "If you wish, hold the lower part of the shaft, below first gear, in a padded vise. Hold the shaft vertical. Do not let the vise damage the shaft.", cite: {p: 172}}
      - {kind: caution, t: "Install the notched snap rings with the method in the service notes. The installed snap rings must grip the shaft tightly.", cite: {p: 172}, op: c07-snap-ring-installation}
      - {t: "Clean and dry all parts. Lubricate all parts with engine oil.", cite: {p: 173}}
      - {t: "Install fifth gear. Put the gear dog recesses out, away from first gear.", cite: {p: 173}, figs: [11]}
      - {t: "Install the thrust washer and the snap ring. Seat the snap ring in the shaft groove.", cite: {p: 173}, figs: [12]}
      - {t: "Install third gear. Put the side with the shift fork groove out, away from first gear.", cite: {p: 173}, figs: [13]}
      - {t: "Install the snap ring and the spline washer. Seat the snap ring in the shaft groove. Put the ends of the snap ring out of line with the spline washer teeth.", cite: {p: 173}, figs: [14]}
      - {t: "Install fourth gear. Put the flat side with the recesses in, toward first gear.", cite: {p: 173}, figs: [15]}
      - {t: "Install the spline washer and the snap ring. Seat the snap ring in the shaft groove. Put the ends of the snap ring out of line with the spline washer teeth.", cite: {p: 173}, figs: [16]}
      - {t: "Install second gear. Put the chamfered inner edge of the gear in, toward first gear.", cite: {p: 173}, figs: [17]}
      - {t: "Install the thrust washer and the bearing.", cite: {p: 173}, figs: [18]}
      - {t: "Install the snap ring. Seat the snap ring in the shaft groove. Put the sharp edge of the snap ring out, away from first gear.", cite: {p: 173}, figs: [19]}
      - {t: "Make sure that all parts are secure. Make sure that the gears turn, slide and engage freely on the shaft.", cite: {p: 173}}
      - {t: "Wrap the assembly and store it until you install it in the crankcase.", cite: {p: 173}, ref: "05/crankcase"}
