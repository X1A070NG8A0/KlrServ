title: "Fan fuse test"
system: "electrical system"
source: clymer
chapter: 9
section: "09/fan-system"
summary: {t: "On 1990-on models, the fan circuit fuse is on the right side of the motorcycle, under the fuel tank. The fuse is rated at 10 amps.", cite: {p: 230}}
sections:
  - steps:
      - {t: "Remove the fuel tank.", cite: {p: 230}, ref: "15/fuel-tank"}
      - {t: "Use an ohmmeter to test the fuse for continuity.", cite: {p: 230}, figs: [68]}
      - {kind: note, t: "A fuse can look good but have a fine break in the element. A fine break can show continuity when the fuse is cold and break the circuit when the fuse is under load and hot.", cite: {p: 230}}
