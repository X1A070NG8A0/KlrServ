title: "Steering play check and adjustment"
system: "Front suspension and steering"
source: clymer
chapter: 12
section: "12/steering-stem-and-head"
summary: {t: "Too much play or roughness makes the steering imprecise and causes bearing damage. Do this check before you disassemble the steering head.", cite: {p: 267}}
spec_refs:
  - "front-suspension-torque:Steering stem nut"
  - "front-suspension-torque:Bridge pinch bolts"
sections:
  - title: "Check"
    steps:
      - {t: "Support the motorcycle so that the front wheel is off the ground.", cite: {p: 267}}
      - {t: "Turn the handlebar from lock to lock. Make sure that the movement is smooth with no resistance.", cite: {p: 267}}
      - {t: "Put the handlebar so that the front wheel points straight ahead.", cite: {p: 267}}
      - {t: "Lightly push the end of the handlebar. The front end must turn fully to the side from the center position under its own weight.", cite: {p: 267}}
      - {t: "Do the check in both directions.", cite: {p: 267}}
      - {t: "If the steering stem moves roughly or stops before the frame stop, make sure that all cables have the correct routing.", cite: {p: 267}}
      - {t: "If the cable routing is correct and the steering binds, the adjustment can be too tight. The bearings and races can also need lubrication or replacement.", cite: {p: 267}}
      - {t: "If the steering binds, do the remaining checks before you adjust the steering.", cite: {p: 267}}
      - {t: "Put the fork so that it points straight ahead. Have an assistant hold the motorcycle.", cite: {p: 267}}
      - {t: "Hold the fork legs near the axle. Lever the fork legs in all directions and feel for play.", cite: {p: 267}}
      - {t: "If you feel movement at the steering stem, tighten the steering.", cite: {p: 267}}
      - {t: "If you feel no excessive movement and the steering turns from side to side correctly, the steering is adjusted correctly and is in good condition.", cite: {p: 267}}
  - title: "Adjustment"
    steps:
      - {t: "Remove the handlebar.", cite: {p: 267}, op: c12-handlebar-removal}
      - {t: "Loosen the lower bridge pinch bolts.", cite: {p: 267}, figs: [20]}
      - {t: "Loosen the steering stem nut.", cite: {p: 267}, figs: [7]}
      - {t: "Loosen or tighten the adjust nut with a pin spanner wrench.", cite: {p: 267}, figs: [19]}
      - {t: "Tighten the stem nut to the specified torque.", cite: {p: 268}, spec_ref: "front-suspension-torque:Steering stem nut"}
      - {t: "Tighten the lower bridge nuts.", cite: {p: 268}}
      - {t: "Do the check for bearing play again. Adjust as necessary.", cite: {p: 268}}
      - {t: "Tighten the lower bridge pinch bolts to the specified torque.", cite: {p: 268}, spec_ref: "front-suspension-torque:Bridge pinch bolts"}
      - {t: "Install the handlebar.", cite: {p: 268}, op: c12-handlebar-removal}
