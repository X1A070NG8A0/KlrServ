title: "Crankcase assembly"
system: "Engine lower end"
source: clymer
chapter: 5
section: "05/crankcase"
summary: {t: "This procedure installs the transmission, the crankshaft and the balancer shafts in the crankcase and joins the crankcase halves with liquid gasket sealant. Use the crankshaft installation jig to keep the flywheels aligned.", cite: {p: 140}}
spec_refs: ["lower-end-torque:Crankcase bolts/6 mm", "lower-end-torque:Crankcase bolts/8 mm"]
parts:
  - {name: "Liquid gasket sealant (Kawabond 5 or Yamabond 4)", replace: consumable, cite: {p: 140}, note: "Do not use RTV silicone sealant."}
  - {name: "Rear balancer shaft snap ring", replace: always, cite: {p: 141}}
  - {name: "Engine oil", replace: consumable, cite: {p: 140}}
  - {name: "Grease", replace: consumable, cite: {p: 140}, note: "Lubricate the seal lips with grease."}
sections:
  - title: "Preparation"
    steps:
      - {t: "Read the complete procedure. Make sure that you have all the tools, parts and supplies.", cite: {p: 140}}
      - {t: "Make sure that all mating surfaces are smooth, clean and dry. You can repair small irregularities with an oil stone.", cite: {p: 140}}
      - {t: "Remove all the old sealant. Clean the mating surfaces with a solvent that evaporates fast, such as brake cleaner or electrical contact cleaner. The new sealant does not stay on oily surfaces.", cite: {p: 140}}
      - {t: "Lubricate the crankshaft, the bearings and the transmission assembly with engine oil.", cite: {p: 140}}
      - {t: "Lubricate the seal lips with grease.", cite: {p: 140}}
      - {t: "Get the crankshaft installation jig, part No. 57001-1174, from a Kawasaki dealer. Adjust the jig to fit tightly between the flywheels, opposite the crankpin.", cite: {p: 140}, figs: [47]}
      - {t: "Use liquid gasket sealant, Kawabond 5 or Yamabond 4, to seal the crankcase halves. Both sealants are durable and can be in oil.", cite: {p: 140}}
      - {kind: caution, t: "Do not use RTV silicone sealant from an auto parts store. It does not seal the cases well. Oil can leak and the engine can be damaged.", cite: {p: 140}}
      - {t: "Put the right crankcase on wooden blocks with the open side up.", cite: {p: 140}}
  - title: "Transmission installation"
    steps:
      - {t: "Mesh the input shaft and output shaft assemblies. Keep the gears meshed and the shafts upright. Put the assembly in the case.", cite: {p: 140}, figs: [46]}
      - {t: "Identify the shift forks. You can identify No. 1 and No. 2 by the casting around the guide pins. These forks mate with the output shaft gears.", cite: {p: 140}, figs: [45, 48]}
      - {t: "Shift fork No. 1 mates with fourth gear. Shift fork No. 2 mates with fifth gear.", cite: {p: 140}}
      - {t: "Shift fork No. 3 has a smaller claw diameter. It mates only with third gear on the input shaft.", cite: {p: 140}}
      - {t: "Install the shift forks and engage them with the correct gears. Make sure that the guide pin on each fork points toward the shift drum area.", cite: {p: 141}}
      - {t: "Install the shift drum and engage it with the shift forks. If necessary, raise the transmission shafts a small amount to engage the forks with the shift drum.", cite: {p: 141}, figs: [44]}
      - {kind: note, t: "Shift forks No. 1 and No. 3 use the same groove in the shift drum.", cite: {p: 141}}
      - {t: "Align the bores in the shift forks. Put the shift fork shafts through the forks and into the case.", cite: {p: 141}, figs: [43]}
      - {t: "Make sure that the shafts are fully seated in the case.", cite: {p: 141}}
      - {t: "Turn the shafts and the shift drum. Make sure that the shift drum turns through its complete rotation and that the forks operate smoothly.", cite: {p: 141}}
      - {t: "Put the shift drum in the neutral position. Make sure that both shafts turn freely.", cite: {p: 141}}
      - {t: "The neutral position is when the neutral switch indentation on the shift drum is at the 8 o'clock position. Leave the transmission in neutral during engine assembly.", cite: {p: 141}, figs: [43]}
  - title: "Crankshaft installation"
    steps:
      - {t: "Put the crankshaft installation jig between the crankshaft flywheels. Install the jig opposite the crankpin so that it goes around the rod.", cite: {p: 141}, figs: [49]}
      - {t: "Lubricate the crankshaft and the case bearing.", cite: {p: 141}}
      - {t: "Put the crankshaft in position so that the installation jig is aligned between the cylinder studs.", cite: {p: 141}}
      - {t: "Put the crankshaft in the case bearing. Press the crankshaft into place by hand.", cite: {p: 141}}
      - {t: "If the crankshaft does not fully seat, put supports under the case and around the bearing before you apply more pressure.", cite: {p: 141}}
      - {t: "After the crankshaft is seated, make sure that it moves freely. Temporarily remove the installation jig. Hold the connecting rod and turn the crankshaft.", cite: {p: 141}}
      - {t: "Install the jig again.", cite: {p: 141}}
  - title: "Balancer shafts"
    steps:
      - {t: "Install the rear balancer shaft and weight with the splined end facing out.", cite: {p: 141}, figs: [41]}
      - {t: "At the smooth end of the shaft, make sure that a new snap ring is installed and that the washer is on the shaft. The washer goes between the snap ring and the bearing.", cite: {p: 141}, figs: [9]}
      - {t: "Install the front balancer shaft.", cite: {p: 141}, figs: [40]}
  - title: "Crankcase assembly"
    steps:
      - {t: "Make sure that all mating surfaces are clean and dry.", cite: {p: 141}}
      - {t: "On the right crankcase, put the two dowels in position.", cite: {p: 141}}
      - {t: "Use strong rubber bands to hold the crankshaft installation jig between the cylinder studs.", cite: {p: 142}, figs: [50]}
      - {t: "Apply liquid gasket sealant to all the mating surfaces, also around all the bolt holes.", cite: {p: 142}}
      - {t: "Use enough sealant to fill the voids and make a continuous seal on the complete joint. Do not use too much sealant.", cite: {p: 142}}
      - {t: "Make sure that all the shafts are aligned vertically. Put the left case squarely on the right case.", cite: {p: 142}}
      - {t: "If necessary, tap the left case with a mallet to seat the cases evenly. Do not force the cases.", cite: {p: 142}}
      - {t: "If the cases do not seat, a shaft is probably not aligned with its bore. Lift the case and move it a small amount from side to side until the shafts go into their bores.", cite: {p: 142}}
      - {t: "Remove each crankcase bolt from the template. Put the bolts in the correct holes. Tighten them with your fingers.", cite: {p: 142}}
      - {t: "Tighten the bolts equally in several passes in a crossing pattern. Tighten the 6 mm bolts to the specified torque.", cite: {p: 142}, spec_ref: "lower-end-torque:Crankcase bolts/6 mm"}
      - {t: "Tighten the 8 mm bolts to the specified torque.", cite: {p: 142}, spec_ref: "lower-end-torque:Crankcase bolts/8 mm"}
      - {t: "Turn the crankshaft and the transmission shafts. Make sure that they turn smoothly. If they bind, separate the cases and correct the problem.", cite: {p: 142}}
      - {t: "Let the sealant set for at least an hour before you move the crankcase.", cite: {p: 142}}
      - {t: "Remove the installation jig from the crankshaft.", cite: {p: 142}}
      - {t: "Cover the cylinder opening to keep parts and debris out.", cite: {p: 142}}
      - {t: "If you wish, install the top end components and the components in the side covers at this time.", cite: {p: 142}}
