title: "Battery voltage test, unloaded"
system: "electrical system"
source: clymer
chapter: 9
section: "09/charging-system"
summary: {t: "This test is for a conventional (original equipment) battery. The unloaded voltage shows the basic state of charge. For battery replacement, charging and electrolyte checks, refer to Chapter Three.", cite: {p: 224}}
sections:
  - steps:
      - {t: "Connect a voltmeter to the negative and positive battery terminals. If you do not have a voltmeter, use a syringe hydrometer to measure the specific gravity of the electrolyte.", cite: {p: 224}, figs: [58]}
      - {t: "Measure the voltage.", cite: {p: 224}}
      - {t: "A fully charged battery has a minimum of 12.6 volts (1.265 hydrometer reading).", cite: {p: 224}}
      - {t: "A battery that is approximately 75 percent charged has a minimum of 12.4 volts (1.210 hydrometer reading).", cite: {p: 224}}
      - {t: "A battery that is approximately 50 percent charged has a minimum of 12.1 volts (1.160 hydrometer reading).", cite: {p: 224}}
      - {t: "If the battery needs a charge or a replacement, do the procedure in Chapter Three.", cite: {p: 224}, op: battery}
