title: "Engine noise troubleshooting"
system: "troubleshooting"
source: clymer
chapter: 2
section: "02/engine-noise"
summary: {t: "Noise is often the first sign of an engine problem. If you hear a new noise, stop the motorcycle and find the source at once. If you ignore the noise, more damage and injury can occur.", cite: {p: 49}}
sections:
  - title: "Pinging during acceleration"
    steps:
      - {t: "Examine the fuel for poor quality or contamination.", cite: {p: 49}, op: "c03-fuel-and-lubricants"}
      - {t: "Examine the fuel mixture. A lean mixture is a possible cause.", cite: {p: 49}, ref: "08/carburetor-systems"}
      - {t: "Examine the combustion chamber for too much carbon.", cite: {p: 49}, op: "c04-cylinder-head-inspection"}
      - {t: "Do a test of the exciter coil.", cite: {p: 49}, op: "c09-exciter-coil-test"}
      - {t: "Do a test of the ignition pickup coil.", cite: {p: 49}, op: "c09-pickup-coil-test"}
      - {t: "Examine the ignition timing.", cite: {p: 49}, op: "c03-engine-timing-check"}
  - title: "Knocks, ticks or rattles: engine top end"
    steps:
      - {t: "Make sure that the valve clearance is correct.", cite: {p: 50}, op: "valve-clearance"}
      - {t: "Examine the valve springs for breaks or weakness.", cite: {p: 50}, op: "c04-valve-inspection"}
      - {t: "Examine the compression release for damage.", cite: {p: 50}, op: "c04-camshaft-inspection"}
      - {t: "Examine the cam chain for looseness and the tensioner for damage.", cite: {p: 50}, op: "c04-cam-chain-tensioner-inspection"}
      - {t: "Examine the piston pin and the piston pin bore for wear.", cite: {p: 50}, op: "c04-piston-inspection"}
      - {t: "Examine the small end of the connecting rod for wear.", cite: {p: 50}, op: "c05-crankshaft-inspection"}
      - {t: "Examine the piston, the rings and the cylinder for wear.", cite: {p: 50}, op: "c04-piston-ring-inspection"}
  - title: "Knocks, ticks or rattles: engine bottom end"
    steps:
      - {t: "Make sure that the balancer chain is not loose.", cite: {p: 50}, op: "balancer-chain-tensioner"}
      - {t: "Examine the connecting rod bearing for wear.", cite: {p: 50}, op: "c05-crankshaft-inspection"}
      - {t: "Examine the crankshaft bearings for wear.", cite: {p: 50}, op: "c05-crankcase-inspection"}
      - {t: "Examine the balancer bearings for wear.", cite: {p: 50}, op: "c05-balancer-inspection"}
      - {t: "Examine the transmission bearings for wear.", cite: {p: 50}, op: "c07-shaft-inspection"}
      - {t: "Examine the transmission gears for wear or damage.", cite: {p: 50}, op: "c07-shaft-inspection"}
      - {t: "Make sure that the balancer is correctly installed.", cite: {p: 50}, op: "c05-balancer-installation"}
