title: "Drive chain cleaning and lubrication"
system: "Final drive"
source: clymer
chapter: 3
section: "03/periodic-lubrication"
summary:
  t: "The motorcycle has an O-ring chain. The inside of the chain is lubricated and sealed. Keep the O-rings clean and lubricated. If you do not, the O-rings dry out and break apart."
  cite: {p: 65}
spec_refs:
  - "fluids:Drive chain"
  - "routine-checks:Drive chain play"
parts:
  - {name: "O-ring chain lubricant", replace: consumable, spec_ref: "fluids:Drive chain", cite: {p: 65}}
  - {name: "Kerosene (cleaning)", replace: consumable, cite: {p: 65}}
sections:
  - title: "Cleaning and lubrication"
    steps:
      - {kind: caution, t: "Do not clean the chain with a high-pressure water spray or a strong solvent. A water spray forces water past the O-rings and traps it in the links. A strong solvent makes the O-rings soft, and they tear easily.", cite: {p: 65}}
      - {t: "Remove the drive chain.", cite: {p: 65}, ref: "11/drive-chain"}
      - {kind: note, t: "You can lubricate the chain on the motorcycle. From time to time, remove the chain and clean it fully.", cite: {p: 65}}
      - {t: "Put the chain in kerosene. Move the links to loosen the dirt.", cite: {p: 65}}
      - {t: "Scrub the chain lightly with a soft-bristle brush. Do not use a brush with coarse or wire bristles. It can cause damage to the O-rings.", cite: {p: 65}}
      - {t: "Rinse the chain in clean kerosene and wipe it dry.", cite: {p: 65}}
      - {t: "While the chain is off, make sure that it is within the wear limit.", cite: {p: 65}, op: drive-chain-inspect}
      - {t: "Lubricate the chain with a lubricant made for O-ring chains.", cite: {p: 65}}
      - {t: "Do not use a tacky lubricant or a lubricant for conventional chains. They attract dirt and cause wear on the O-rings.", cite: {p: 65}}
      - {t: "Install the chain.", cite: {p: 66}, ref: "11/drive-chain"}
      - {t: "Adjust the chain.", cite: {p: 66}, op: drive-chain-adjust}
