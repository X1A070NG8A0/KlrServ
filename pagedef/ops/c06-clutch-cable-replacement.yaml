title: "Clutch cable replacement"
system: "Clutch, gearshift linkage and lubrication system"
source: clymer
chapter: 6
section: "06/clutch-cable-replacement"
summary: {t: "This procedure removes the clutch cable and installs a new cable. Adjust the clutch cable after you install it.", cite: {p: 166}}
parts:
  - {name: "Clutch cable", replace: inspect, cite: {p: 166}}
  - {name: "Aerosol cable lubricant", replace: consumable, cite: {p: 166}}
  - {name: "Lithium grease", replace: consumable, cite: {p: 166}}
sections:
  - title: "Removal"
    steps:
      - {t: "Remove the left hand guard. Flex the guard to remove it from the clutch lever assembly.", cite: {p: 166}}
      - {t: "Remove the pivot bolt and the lower nut from the lever.", cite: {p: 166}, figs: [76]}
      - {t: "Loosen the clutch cable locknut.", cite: {p: 166}, figs: [76]}
      - {t: "Turn the adjuster in until you can remove the cable and the lever from the slots in the adjuster assembly.", cite: {p: 166}, figs: [76, 77]}
      - {t: "Remove the cable from the lever.", cite: {p: 166}}
      - {t: "Remove the cable from the release lever and the cable holder.", cite: {p: 166}, figs: [78]}
      - {t: "Remove the cable from the motorcycle. Note the route of the cable.", cite: {p: 166}}
  - title: "Installation"
    steps:
      - {t: "Clean the levers, the pivot bolt and the clutch lever housing.", cite: {p: 166}}
      - {t: "Lubricate the new cable with an aerosol cable lubricant.", cite: {p: 166}, op: control-cables-lube}
      - {t: "Lubricate the lever, the pivot bolt and the cable ends with lithium grease.", cite: {p: 166}}
      - {t: "Put the cable on its route from the handlebar to the release lever.", cite: {p: 166}}
      - {t: "Put the cable in the cable holder. Attach the cable to the release lever.", cite: {p: 166}}
      - {t: "Put the adjuster and the locknuts in the center of the cable holder.", cite: {p: 166}}
      - {t: "At the handlebar, attach the cable to the lever. Install the lever assembly.", cite: {p: 166}}
      - {t: "Adjust the clutch cable.", cite: {p: 166}, op: clutch-adjust}
