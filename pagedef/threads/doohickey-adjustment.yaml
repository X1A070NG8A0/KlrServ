      Re: Doohickey Adjustment??

      Whatever you do, do not rely on MSM's advice on doohickey replacement. Last time I looked, they were eager to sell you a "Gizmo", which is just an '08-spec Kawasaki part marked up a bit. When you replace your balancer quadrant, use a replacement from Eager Mike (unless you can somehow get your hands on one of the rare classic Jakeman parts).
