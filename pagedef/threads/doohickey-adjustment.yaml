    text: |-
      Re: Doohickey Adjustment??

      > KevLuvsRidin650s wrote: Originally posted by KevLuvsRidin650s
      >
      > .....You can torque the adjustment bolt to 9ft. lbs. with the Eager Mike doo .

      I would not do that on my bike. The threaded portion of that bolt is 6mm and the FSM torque spec for a bolt that size is 52-69 in-lb. That torque is independent of the type of doo being used.

      9 ft-lbs represents a 57% overtorque.

      JMHO.
