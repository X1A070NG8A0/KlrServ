    text: |-
      Re: Doohickey Adjustment??

      Yeah, with the engine warm loosen the bolt half a turn. Give the case a wack with a dead blow hammer or two by four and tighter it to 60 - 70 in/lbs. I do it every time I change the oil, about every 30,000 miles . . . wait, that should be 3,000 miles.
