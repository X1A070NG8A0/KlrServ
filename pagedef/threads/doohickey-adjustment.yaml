    text: Hey guys,I have a question concerning the doohickey,I have an 06 and in the owners manual on pg.72 there is a heading called Balancer Chain.This is what it states-Wear of the balancer chain and the chain guide develops slack between them. Adjust the balancer chain tensioner in accordance with the Periodic Maintenance Chart.It's 500mi. for the first adjustment,3000mi for the 2nd, and thereafter every 3000mi. Next up is a CAUTION- If the balancer chain is left unadjusted,the developed slack will make noise and may result in engine damage. CHAIN TENSIONER ADJUSTMENT-Remove the tensioner cap and loosen the tensioner bolt a few turns.Tighten back the bolt and install the cap in the original position.Has anybody ever made these adjustments at the time called for?Do you think the slack that occurs will make the spring fail due to excessive vibration?If these adjustments were made will it prolong the life of the doohicky?Last question-This goes out to all the people who had their doohicky fail-Did you ever adjust your balancer chain using this procedure?Thanks for your time...
