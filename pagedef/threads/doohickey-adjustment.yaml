      Re: Doohickey Adjustment??

      Yup, I got one adjustment out of my stock spring at around 3000 on the clock. I didn't even try a second time, I went ahead and pulled the covers off today and found a broken spring at around 9500 , glad I did too. replaced the doo and used Eager Mikes long spring on it . Works like a charm . You can torque the adjustment bolt to 9ft. lbs. with the Eager Mike doo .
