      I like OEM pads since I've got over 29,000 smiles on my original set and they still probably have another 8,000 smiles in them. I have another set on hand ready for replacement when it's time.

      The OEM don't seem to chew up the rotors and the stopping power is fine for me. I've had both tires chirping fully loaded with touring gear so they can provide more stopping power than my tires.

