    text: Hi Meat Wad, I agree with you about using a lighter shock oil in the dirt. However, I'm 185lbs and the 15w feels really good to me, but I'm 90% a pavement guy. The KLR suspension in stock form is so soft that it's seems close to impossible to make it too stiff.
