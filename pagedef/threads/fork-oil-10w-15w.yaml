    text: Would I get much more out of switching to a heavier oil? I normally use stock weight but that was when bike was street only. Now that I'm in Az. have alot of dirt I would like to stiffen the front end up some more. I did the progressive springs already as well. I'm approx. a 160lbs or so if that helps, thanks
  - id: 2
    title: '10w versus 15w fork oil: post 2'
    kind: Forum post
    author: holycaveman
    date: '2006-02-05'
    permalink: https://www.klr650.net/forums/forum/klr650-forums-klr650-net/klr650-first-generation-forums/18205-10w-versus-15w-fork-oil?p=380317#post380317
    text: If you are bottoming out then I would go with 15-20wt oil. Stock I believe is comparable to about 7wt. 10 is not going to make a substantial difference in my op. If you have stiffer springs then a heavier oil would complement your setup by increasing the dampening because the heavier springs decrease the dampening on the rebound stroke.
