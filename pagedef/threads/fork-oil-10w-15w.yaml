    author: Meat Wad
    date: '2006-02-05'
    permalink: https://www.klr650.net/forums/forum/klr650-forums-klr650-net/klr650-first-generation-forums/18205-10w-versus-15w-fork-oil?p=380410#post380410
    text: 160lbs is pretty light, i would use a 10 weight, remember just because it is off road doesnt mean you necessarily want a stiff suspension. Look at any dirt bike suspension it is plush and soft, not stiff. A heavier weight oil will slow down rebound and act sluggish in the dirt, not a great feature. I'll bet most of the guys running 15w or heavier are over 225lbs and that makes a big difference.
  - id: 6
    title: '10w versus 15w fork oil: post 6'
