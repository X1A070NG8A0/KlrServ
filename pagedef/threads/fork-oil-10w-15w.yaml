    permalink: https://www.klr650.net/forums/forum/klr650-forums-klr650-net/klr650-first-generation-forums/18205-10w-versus-15w-fork-oil?p=380413#post380413
    text: |-
      If you have not changed the fork oil, at your weight, I would try the 7.5 wt first. Fill to 170mm from top of fork leg, springs out, fork legs compressed. If that is not enough, go to 10 wt. At your weight, that's as heavy as I would go....

      all the best,

      Mike
