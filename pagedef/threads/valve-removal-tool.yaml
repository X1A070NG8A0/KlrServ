    text: |-
      Re: Valve removal tool?????

      I applied lapping compound to the underside of the valve.

      I applied engine oil to the valve stem.

      I inserted the valve stem into the valve cylinder.

      I stuck the valve lapping tool to the valve.

      And, I spun......

      Because I have never done this before, I decided to take the cylinder head to my friend, and motorcycle mechanic, Stanley Gardner for his opinion.

      Stanley owns, Gardner Racing Concepts. He specializes in custom crankshafts for racing and drag bikes.

      This past February.

      Stanley took a look at what I had.

      And, even blasted the two Exhaust Valves.

      Stanley's opinion was, "Barry, I would have the head rebuilt professionally. The work will be done by a guy that specializes in this stuff in Massachusetts, and the head will come back looking brand new."

      Stanley was right. I had two exhaust valve replaced, and the head completely, professionally cleaned up. I paid too much for the service though..... I think it cost me around $300, which included the two Exhaust Valves and also shipping both ways from Maine to Mass and back again. I will see if I can find a photo of what the head looked like when it came back.

      Okay, I found a photo of the rebuilt and cleaned head. It DOES NOT do it justice! But, there is NO WAY that I could have ever gotten the head to the "like new" condition it was put in by Stanley's "connection" in Mass. I was very happy about installing it on top of the 658 cylinder and piston you see sitting there next to it.

      Regards,

      Barry
