    text: |-
      Re: Valve removal tool?????

      Hello All, well it has been a few months since I last asked questions or posted any updates on Big Red. Well about 4 weeks ago I got it all put back together.

      EM Doo kit

      EM 685 BB kit

      Exhaust tip Mod

      All done at one time. First off EM products are just as everyone on here has described them. They look great and work just as promised. The instructions were good and easy to follow. I did have a Video going on my laptop while I was doing a few of the things on the job. I now have about 300 miles on it since I got it back together and so far it is working great. Still have not got on it hard as I am still breaking it in, till I hit about 500 miles it anyway.

      Still trying to decide if I like the open exhaust or not, more noise than I care for. I also feel as I lost some of my low-end torque because of the exhaust being so open, but not sure about that.

      Other than that, just glad to be back riding again. Thanks to everyone who answered questions that I was asking.

      Doc.
