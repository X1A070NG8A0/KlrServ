  - id: 7
    title: 'Valve  removal  tool?????: post 7'
    kind: Forum post
    author: Black Lab
    date: '2013-05-11'
    permalink: https://www.klr650.net/forums/forum/klr650-forums-klr650-net/klr650-maintenance-klr-wrenching-modifications-technical-support/110387-valve-removal-tool?p=1805426#post1805426
    text: |-
      Re: Valve removal tool?????

      > Doc Joe wrote: Originally posted by Doc Joe
      >
      > OK, so I have the head off and EM is installing my 685 piston, EM said I should lap the valves. Well the one guy I trust to do it is busy for the next 3 weeks and my cylinder will be back really next week. So I am going to do the valve lap myself, but I have no clue on which ( which one will work) tool I need to remove the valve spring keepers. Who had bought what and had good success with there???
      >
      >
      > Thanks Doc.

      What I am going to share with you below, you can do with a piece of pipe, a deep socket or, what I used; an old bushing from the Pivot Lever.

      Here is the bushing.

      I marked out a section that I wanted to cut out.

      Using my Dremel too, and a Cut-off wheel, I cut the section out.

      The Valve Keepers are "wrapped" around the head of the stem. They hold the Spring Keeper in place; retaining both Valve Springs down in the Valve Cylinder. The Valve Keepers are the little guys that you want to remove.

      Using a C-clamp, positioned "just so"......

      ......you will be able to compress the Valve Spring enough......

      ....to be able to reach through the opening you cut with the Dremel too, with a "Mechanics Magnet", to remove the Valve Keepers.

      Continue to disassemble.

      Regards,

      Barry
