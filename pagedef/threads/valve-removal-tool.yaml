      > Doc Joe wrote: Originally posted by Doc Joe
      >
      > That is a great idea also as he has the cylinder and will ship it back some time this week will have him throw a set in there with it.
      >
      >
      > One more question, what is the best way to get the carbon off the head?? Just a wire brush or should I soak in something and then scrub away at it??
      >
