      Doc, I am not the best person to be answering this question. That's because the KLR that I am rebuilding, is the first time that I have been this deep into an engine. I am flying by the seat of my pants here!

      But, I have a whole bunch of photographs that I can share with you, though.

      My guess is, your Cylinder Head looks something like this, (This from a 1993).

      To begin, I used some kerosene in a squirt bottle and a brass bristled brush to do some mild "scrubbing".

      I let each valve soak in kerosene for awhile before tackling it.

      Then, I carefully chipped away at the carbon with a sharpened utility knife blade, (I sharpened better than what a new blade is.).

      I also measured the valves.

      Being wicked nervous about doing this stuff for the first time, I made a couple of posts on here, and Chuck B, and a few others made some very helpful suggestions that helped me out quite a bit.

      I got serious about cleaning up the head, and even doing what you are doing; lapping the valves back in to the seats.

      I made a "Parts Cleaner" out of household items: A dishwashing tub, a dishwashing drain board, a cooling rack for baking, and a squirt bottle for the kerosene to be spritzed out of.

      Stay tuned, I am off to find some more photographs for you, (and others who might be following this thread.)

      Regards,

      Barry
