    title: 'Valve  removal  tool?????: post 23'
    kind: Forum post
    author: Black Lab
    date: '2013-05-19'
    permalink: https://www.klr650.net/forums/forum/klr650-forums-klr650-net/klr650-maintenance-klr-wrenching-modifications-technical-support/110387-valve-removal-tool?p=1807711#post1807711
    text: |-
      Re: Valve removal tool?????

      > Doc Joe wrote: Originally posted by Doc Joe
      >
      > Berry,
      >
      >
      > What tires are you using on your bike, I like the way they look and wonder how they feel and wear on the road??
      >
      >
      > Thanks Doc.

      Hi Doc,

      Boy, it sounds like you have a lot on your plate right now! I hope Leaa's dialysis is a temporary situation, and not permanent.

      I can't answer all of your tire questions. That's because, I have never ridden a KLR...... I brought the bike home, on a trailer, on December 1, 2012. After I got it off of the trailer, I started the bike, and rode it down to the bottom of my road, then back home. That is a distance of about 1/2 mile total.

      1993 Kawasaki KLR 650; Bringing The Bike Home For The First Time! - 12-01-2012 - YouTube

      After the above, I could never get the bike started again. I began to take the bike apart.......

      As of yesterday, I am now over 1,000 hours of work, and 10,000 photographs shot. I will be organizing the material for my website in the near future.

      I can tell you that, the tires on the KLR are Kenda brand. I will be replacing them before I get into serious riding. I have "test rubber" on the bike right now.

      Even though there is good tread left on the tire, I do not like the way they have worn down. This could be that the previous owner did not have them properly inflated. But, the wear pattern looks very familiar to how Bridgestone Trailwings wore down on my V-Strom. The same could be said for Anakee, and Metzeler Tourance tires as well. (On my V-Strom, I could be categorized as an "aggressive rider". I do not know how my riding style will be when I finally get to ride the KLR!).

      I took a moment yesterday to shoot a couple of images of the tread wear on the Kenda tires for you.

      For me, I have to set out on the KLR, carrying experiences from riding my V-Strom. I will then make adjustments along the way, as I learn what I need to learn about riding a KLR.

      My favorite tires for the V-Strom were, Continental TKC-80 knobby tires. They were awesome on gravel roads and trails, and were just as awesome on wet, or dry, pavement. I could really throw the bike into a corner, and carve a very tight turn with these tires! But, for the first four years of riding my Strom, I was averaging 21,000 miles per season. If I continued to ride on TKC 80s, I would have been spending a small fortune on tires!

      I don't like, Anakee, Tourance, or Karoo tires. For the money that you spend on them, they wear out too quickly, or wear down in a funny way like the Kenda shows in the image above.

      I detest, and will not ever install a Avon Distanzia on any bike that I own again! I rode one for a few thousand miles, then took it off and gave it to a friend of mine, that was interested in trying it. On the Strom, the rear Distanzia kept breaking free on me; on dry pavement!

      The Bridgestone Trailwings were okay. They wore down in a scalloped way, but cost less than the Tourance, or Anakee tires, so I could stomach that.

      Dunlop tires were okay too.

      I really liked the Shinko 705 tires I mounted up. I never had issues with the Shinkos like other riders have had. They were cheap, black and round!

      The thing with me is, I stopped buying tires for my Strom in 2011. That's because I didn't need to buy tires for my bike. People began sending me tires, or giving me tires for me to ride. One person liked to take his Strom to the track for "track days". When the day was through, he would buy new tires to replace the track tires, and he would ship me his track tires for me to ride.

      Other riders don't like to ride on plugged tires. They would get a flat, plug the tire to get themselves to where they needed to go, then replace the plugged tire with a new tire. I would end up with the plugged tire if it had good tread left on it. I didn't care if it was plugged!

      So, over time, I ended up with all the tires that I needed to ride my Strom, and didn't have to buy any.

      The above photo is no joke! Pretty cool, huh?

      Here is my plan for the KLR: I will purchase a knobby set; front and rear. Or, I will purchase a rear "Shinko style" tire, and mount a knobby style tire up front. On the Strom, I would usually replace two rear tires, to one front tire. I am going to guess that, the KLR will be similar. The compromise that I came up with for the Strom was, Shinko style for the rear, and a knobby for the front. It worked nicely for where I liked to ride.

      And, where you like to ride plays a BIG part in tire choice!

      Regards,

      Barry
