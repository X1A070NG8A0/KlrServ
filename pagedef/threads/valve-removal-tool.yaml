    title: 'Valve  removal  tool?????: post 20'
    kind: Forum post
    author: Black Lab
    date: '2013-05-13'
    permalink: https://www.klr650.net/forums/forum/klr650-forums-klr650-net/klr650-maintenance-klr-wrenching-modifications-technical-support/110387-valve-removal-tool?p=1806049#post1806049
    text: |-
      Re: Valve removal tool?????

      > Doc Joe wrote: Originally posted by Doc Joe
      >
      > OMG is all I can say, what are you going for a complete rebuild or just bored??? That 5th picture just floored me, last time I had a bike looking like that was my 1984 Kawasaki Tecate 3 wheeler and I did the same thing complete tear down and rebuild. The previous owner was good at racing it, but his maintenance skills lacked big time.
      >
      >
      > Once again thanks for sharing your story...
      >
      >
      > Thanks Doc.

      Doc,

      First a little "back story". If you notice in my signature, I list a 2007 DL-650 with 111,000 miles on it. Memorial Day Weekend of 2012, as I was coming back from Cape Breton, (my second trip there), and just humming along as the V-Strom is well known to do, I decided that I was bored, and that I needed a new challenge in motorcycling.

      I can't afford to purchase a new motorcycle, nor can I really afford to purchase a used motorcycle! (At least shell out a few thousands bucks in one whack.). And, my V-Strom is absolutely worthless with all of the modifications I have done to it, the crashes I have had with with it, and the high mileage that is on the bike.

      However, I felt that I had some "equity" in the bike that I could "cash out" on. What I decided to do was to give the motorcycle away in a raffle of sorts, targeting the "stromtrooper" community, (A forum like this one). Over the past five years, I have had a presence there, and have made some really good friends. I presented the idea to the forum community, about two charities that I do part time work for, and that I would like to raise money for them; splitting a pot "50 / 50" between the two organizations. The group stepped up to the plate and we raised about $1,200 which I split between, Loki Clan Wolf Refuge, and Alstöm Syndrome International. A fellow in Texas ended up the bike, (which I still have here, and it is for sale. 100% of the money gained from the sale of the bike will go to the wolf refuge.).

      Here are the details of what went on: Black Lab Adventures - 2012 Charity Fundrasier

      I turned around and bought the "$1,000" KLR that you have seen above. My hope was, to buy the bike, do some routine maintenance on it, then dig into the fun part of fabricating my custom parts for it, (crashbars, luggage rack, etc), then do some "shakedown trips" this spring, then ride the bike to Labrador in August.

      It didn't turn out that way.......

      I have already posted many images, that are buried in other threads, so I don't want to bog this thread down anymore then what it is, (I have also hijacked the heck out of it too!).

      But, I found the broken head of a clutch damper spring in the crankcase. I also found a balancer sprocket damper spring there too. There was a lot of rust on the main frame and the subframe. I completely stripped them down to bare metal. And, I welded a crack that I found in the main frame.

      I have replaced all of the wheel bearings with "double sealed" wheel bearings. I have replaced all of the bearings in the Pivot Lever and the Swingarm. I have rebuilt the front forks and I have rebuilt the rear shock. I have gone through every wire on the wiring harness. I completely replaced the wiring harness to the stator, and to the pick up coil. The engine has a 2004 crankshaft in it, and the "new style" balancer sprockets in it. I almost installed a 2004 transmission, but in the end, decided to keep the 1993 transmission, (I think I may have swapped in 2004 shifting forks though.). I have replaced the complete clutch system, yet retained the Kick Start option that came with the bike. The Yamaha petcock has been installed in the fuel tank. A KLX needle and appropriate jets will be installed in the carburetor. I found a used FMF Quietcore muffler for it. It has a new 658 cc cylinder sleeve, with matching piston and rings. A rebuilt cylinder head. Rebuilt water pump. All new seals and o-rings throughout the engine. A newer header pipe. I rebuilt the radiator, (Pics will follow on that one!). I have an Eaglemike forkbrace installed. I just ordered a Therm-O-Bob this evening......

      .....and I did the drilling for the subframe bolt upgrade kit this evening. I will put new tires on the bike, but the object now is to get the bike together, and see if the darn thing runs!

      (Oh yeah, I have a pair of SV650 brake calipers here that I will modify to fit the bike.)

      (Oh yeah, yeah, I advanced the Exhaust Cam one tooth.)

      Yesterday, I shot 464 photographs of installing the engine into the frame. Seriously! I have now shot over 9,000 images of this rebuild project. At some point in the future, all of the "good stuff" will be hosted on my website. I have already begun to make room for it, but I am not committing to the space until I know that I have success on my hands!

      Tonight, I temporarily attached the subframe so that I could do the drilling for the subframe bolt upgrade. For the fun of it, I laid the seat I am going to use, and the repainted fuel tank over the frame, just to boost my spirits a little bit.

      I could have bought a decent used bike for what I have now spent on this machine. But, I have had one heck of a fun winter, and I have learned a tremendous amount about the KLR. I wouldn't change a thing. I just hope the darn thing runs in a few weeks when I attempt to start it!

      Regards,

      Barry

      From a few moments ago.
