      Re: broken subframe bolt

      The klr needs a few upgrades, some are mandatory and some are just suggested. On this one my bolt probably came loose and then broke. Anything loose on the bike will break. The 09 needs the doo spring, the starter shaft bushing (depending on serial number), and some one to keep an eye on the bolts on the sub frame or change them. The list of upgrades (called farkles) is endless. Check the how to and procedures and read on, some thing are a bit over the top, some need/could help a bit. Remember there are alot of people here doing diferent things, make your bike the way you want.
