    text: |-
      Re: broken subframe bolt

      I'm 235 and a complete hoe...

      Hard On Equipment.

      If I hit the trails and don't drop the pig at least twice I feel like I'm not riding hard enough. I ain't bragging. I'm just say'n.

      Don't sound like you need to go through with drilling through. I doubt the bolt was at proper torque to begin with, causing failure. Or it was possibly reused after an excessive torque install? In any case...

      I hate extractors. HATE them. Look for left handed drill bits. Since you have to drill anyway to utilize extractors, most times the bit will grab while drilling and remove the remnants before getting to larger size bits, tapered extractors, or other things that mess up threads.

      A propane torch or heat gun to warm up the Loctite will aid immensely.

      Mech
