    text: |-
      Re: broken subframe bolt

      Left handed drills help but if locktited they can be a bear.

      Blue Locktite is supposed to be removable, Red permanent.

      Either will be softened up with heat and make pulling bolts (especially broken ones ) out easier.

      I believe that Locktite told us some years back it will take 400 degrees F to soften the up the "cured" locktite.

      Also, once the temp comes down the stuff will harden back up again so much easier to remove when hot. Kind of like hot glue in that respect.

      I almost never use the red as the blue is plenty good for most applications.

      Good luck keep us posted.
