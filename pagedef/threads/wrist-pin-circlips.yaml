    text: |-
      Re: Wrist Pin Circlips

      > jetblack357 wrote: Originally posted by jetblack357
      >
      > I've decided to go ahead and install my 685 piston on my new stuff.
      >
      >
      > If I order new circlips for the stock piston will those match with the 685 kit from Eaglemike or no?

      No.

      The JE pistons circlips are about twice the wire diameter and I suggest least 10 times the strength!

      One could probably get the circlips from Schnitz Racing also.
