    text: |-
      Re: thermobob

      At risk of beating a dead horse here...

      T-Bob allows for the engine to warm at a better and more consistent rate.

      That's it.

      Won't make you faster, better looking or run cooler. As EM said, perhaps richer at certain data points...but read carefully:

      The T-bob is a modernization of the coolant system which allows for a more efficient and effective and healthier engine coolant flow. That is all it does!

      T-Bob kicks a$$, and all it does is "modernize" a cooling system which was not even "state of the art" in 1987!

      BTW, the 08+ has an "improved" radiator over the 07-, but the PROCESS by which it warmed, kicked in a thermostat, cooled and warmed again was the SAME arcane system.

      Hope this helps, and ends the beating of this well-dead horse!

      Thanks to Watt-man!
