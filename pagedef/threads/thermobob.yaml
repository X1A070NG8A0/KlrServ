    text: |-
      Re: thermobob

      The stock thermostat is set for 165 degrees F and the thermo-bob stat is set at around 195 degrees F intentionally to maintain a higher minimum temperature.

      So, on not-so-hot days when neither thermostat would be fully open the t-bob stat will maintain a little warmer water temperature as it's design intends it to.

      As Zero says, once the water temperature rises above the set point of either stat, the temperature just floats as necessary to remove the heat being produced in the engine.
