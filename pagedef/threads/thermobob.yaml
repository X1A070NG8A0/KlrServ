      Re: thermobob

      I put the ThermoBob on my brand new bike when it had 38 miles on it. During those first 38 miles the temperature gage needle would raise just above the "C" and that was as hot as it got ("C" = Cold). It would never really "warm up." After installing the TBob the needle slowly rises to half-way between the "C" and the "H" and stays there the rest if the ride. Going down hill it might drop a little but rarely varies from that mid-way point.

      I installed the TBob soon after I bought the bike new because I felt it provided the best thermal environment to break-in my new engine.
