  - id: 5
    title: 'thermobob: post 5'
    kind: Forum post
    author: Zero_Alligator
    date: '2012-06-19'
    permalink: https://www.klr650.net/forums/forum/klr650-forums-klr650-net/klr650-maintenance-klr-wrenching-modifications-technical-support/102553-thermobob?p=1681905#post1681905
    text: |-
      Re: thermobob

      The Thermo-Bob WILL NOT make the bike run cooler under any conditions. It WILL make the coolant in the engine warmer, especially at start up. This prevents hot cold cycling that can damage the engine over time. The Thermo-Bob can be thought of as a bypass valve that lets warm coolant flow directly back to the engine, bypassing the radiator. It is controlled by a thermostat. This isn't exactly how the Thermo-Bob operates but this is a simplistic way of understanding what results it achieves. This is beneficial for the bike prior to all of the coolant warming up to a nice operating temperature. When the coolant is all nice and warm, the Thermo-Bob opens up and your cooling system works as normal.

      It is normal for the temp gauge to rise when the bike is stopped and idling. There is no air flow across the radiator unless the fan kicks on when the bike is stopped. The only thing that will address high idle tempatures is a change to the cooling system such as a second radiator. This really isn't a problem though, unless you are driving in very high tempatures at slow speeds/stop and go traffic.

      -Mark
