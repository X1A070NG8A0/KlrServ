    text: |-
      Re: thermobob

      if its hot out you will still have high temps no matter what. If it's cold the thermo bob will actually let the colant warm up to operating temp rather than warming slightly, creeping your needle up a tiny bit then when your moving slam the thermostat shut and drop the needle off to the bottom again.

      I only ever saw my gauge read over 1/4 up a few times when stopped idling in hot weather. As soon as I'd move bam! straight cold again. Now with thermobob it comes up to 185-215 and stays all day. Now it's right in the middle of the sweep. oh yeah I bought the temp overlay too!
