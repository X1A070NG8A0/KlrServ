      Re: thermobob

      The older KLR has a radiator that is on the edge of adequate when the weather is really hot, load is high on the engine, and airflow is low. I was uncomfortabel with how the temp gage would spike up on my `03, so I ordered and installed the Thermobob I think 3 years ago.

      Since that time the temp gage no longer spiked up often. When conditions are horrible the temp will still rise, but it does so more slowly and tends not to run away as easily. I dunno for sure why, but I suspect the larger diameter thetmostat is less restrictive when open than the smallish stock thermostat.
