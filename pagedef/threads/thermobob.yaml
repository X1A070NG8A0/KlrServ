      I installed a Thermo-Bob on my '02 about 2 weeks ago and immediately noticed a smoother, more consistent idle and operation. The week before that I did the 22 cent carb mod. I was a little hesitant to mod the carb and the cooling system, thinking I might be creating a lot of problems for myself if I screwed up. I have been very happy with the faster and smoother acceleration, and the Thermo-Bob added a high level of predictability to the bike. No more "And how will it run today with the temp at ..?". Very glad I did it. When you do the Thermo-Bob, just remember to take your time, read through and follow the directions on the install. Oh, and double check to make sure you un-screw the cover to the thermostat and not to the water pump cover. Don't ask me how I know.
