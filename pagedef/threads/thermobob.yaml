    text: |-
      Re: thermobob

      The way I understand it, from everything I have read about it, is that the stock KLR set-up only moves water though the engine when the temp rises enough to open the thermostat which then allows cooler water from the radiator into the engine and some of the hot water goes back into the radiator to be cooled. The top of the engine/head can be hotter than the bottom as water only moves when the thermostat is open.

      The Thermo-bob allows the water in the engine to continually circulate, which keeps all the water in the engine at almost the same temp. When the circulating water gets hot enough to open the thermostat in the Thermo-bob, some of the cooler water in the radiator is exchanged for some of the hotter water in the engine.

      The old stock thermostat is removed during the installation, and the new thermostat is housed in the Thermo-bob.

      As mentioned above, Watt-man's site explains it in detail.

      http://www.watt-man.com/Information__Articles.html

      I have watched my engine temp rise up high as well, but only during slow riding and mostly at traffic lights. As Zero_Alligator said, the Thermo-Bob will not keep the bike cooler. It keeps it more even.

      I bought my '08 used, the EM Doo was already done and I added the Thermo-bob before I ever rode it. Yeah, I am a believer of it's function.

      If anyone finds error in my description, please scorn me as you see fit.
