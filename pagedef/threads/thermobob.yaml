    permalink: https://www.klr650.net/forums/forum/klr650-forums-klr650-net/klr650-maintenance-klr-wrenching-modifications-technical-support/102553-thermobob?p=1698076#post1698076
    text: |-
      Re: thermobob

      The peak temperatures with the Thermo-Bob are not higher.

      For instance - you are in 110 degree weather in the summer in a place like Phoenix. Your coolant temperatures aren't hotter with the Thermo-Bob in place than they would be without it. If you are running in 70 degree weather, the coolant temp's with the 'Bob would about about 195f, and without it 165f (or so) when you are cruising down the road at 55mph on your trusty KLR. The engine coolant also warms up faster, and the coolant temp's don't swing during warm-up. This is of course assuming all things are working properly, waterpump, etc.

      No need for a different plug.
