    text: |-
      Re: thermobob

      The temperature stabilization can have an effect on power - although it's likely small. The jetting will be more consistent. If the engine is warmer (30 deg F or so) the jetting will also be slightly richer. This can also make the engine a little smoother.

      I'm sure a few of us can remember when engines didn't last as long as they do today. One of the many reasons is a more stable temperature. Some cars lasted a long time (back in the day) but the general trend today is longer/more miles. Sure, a KLR can last a long time without a Thermo-Bob, but the chances are improved with one.

      I've measured more than a few cylinders. Those with a Thermo-Bob were less out of round than those without. This is also a plus. Some people have also reported less oil use.

      Disclosure - I make the aluminum parts for this project.
