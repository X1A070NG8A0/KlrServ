    text: |-
      Re: thermobob

      > jtwodogs wrote: Originally posted by jtwodogs
      >
      > Just thinking out loud here. Why could you not run without a thermostat during the summer. Put one in to run during the winter?

      You could. As I am sure you know, once the water temperature from the head is above the set point of the t-stat it is running wide open much like having no t-stat except for the restriction of the open t-stat in the line. By running without the t-stat you loose that restriction, but you also loose the all temperature control below that wide open point - warm up, cool mornings, cooler days, nights, ... . You also have to take the tank off and all that requires twice a year to remove and replace the thermostat.

      Someone with oil chemistry knowledge may comment on cold oil and condensation here.
