    text: |-
      Re: Subframe upgrade necessary??

      > Bassplayinroach wrote: Originally posted by Bassplayinroach
      >
      > How much difference is there from the drill through upgrade to just upgrading the bolts??

      Gen I or Gen II?

      My take on it is this:

      Gen I, big difference. Even with the stronger replacement upgrade bolts, you've still got 8 mm bolts vs 10 mm with the drill through upgrade. That's a lot more metal bearing the shear.

      Gen II, a lot less difference. Bolts are already 10 mm which is a big difference from Gen I. The drill through upgrade *will* be stronger than stock, as the shear forces are applied to the non-threaded shank of the bolt, vs being applied to threaded portions of the stock bolts.

      How much stronger, and whether this is a necessary upgrade for Gen II bikes, I don't know. The Gen II has been on the roads for over half a decade by now. If there were *still* common failures at this point, I would think we'd be hearing about it, like we did on the Gen I
