      Re: Subframe upgrade necessary??

      A local fasterner supplier inspected the EM fasteners and declared them to be 12.9. FWIW.

      A friend gave me an EM kit which he had forgotten that he bought. I was curious to confirm the grade and took the kit with me when obtaining some other fasteners.

      I like the EM coated fasteners rather than the black ones which are what we have available so would likely order if need another kit. The drills are very high quality as opposed to some of the ones more generally available. Not sure what is coming from EM now as this kit is 5 years+ old. Perhaps someone has more up to date information?

      I can't imagine that EM is skimping on quality.

      AAlexander: thanks for an excellent appreciation of the issue. You clearly show the advantage of the larger 12.9 even ignoring the higher clamping force due to the higher tension from the 12.9. This should reduce the shear effect even further, IMO, further enhancing strenght but as you stated "the math...".

      > AAlexander wrote: Originally posted by AAlexander
      >
      > If I owned a Gen I, I'd do the drill through upgrade. I haven't been able to determine what grade bolt is in the Eager Mike drill-through upgrade, but comparing the same grade bolts, a 10 mm bolt will be about 60 percent stronger in shear than a 8mm bolt. So if EM's drill though bolt is 12.9 grade, the upgrade will be at least 60 percent stronger then the replacement upgrade bolts. (and Waaaaaaayyy stronge then the stock bolts) If the EM through bolt is 10.9 grade, well lessee ... 12.9 bolts are about 17% stronger than 10.9 for equal size but the larger diameter is 60% stronger for equal grade ... math gets a little fuzzy, but even if the EM through bolt is 10.9 grade, it's still going to be substantially stronger than the 12.9 8mm replacement bolts. Plus the single bolt is a mechanically stronger arrangement.
