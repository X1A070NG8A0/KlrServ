    text: |-
      Re: Subframe upgrade necessary??

      I think Kawasaki may have upgraded some of the bolts on the gen2 KLR650. I can only give you my experience on my 2008 and 2011 KLR650s. I usually take long dirt road trips and I usually have the bike heavily loaded with luggage, tools, spares, extra fuel.... and run on very bumpy dirt roads and trails for thousands of miles. For example from the Atlantic Ocean to the Pacific Ocean across the United States on the Trans-America Trail. I have the SW Motech crash bars, but no sub frame upgrade bolts.

      My 2008 KLR has 105,000 miles. I have cracked and re welded both sides of the sub frame just to the rear of the joint where the upper and lower tubes come together at the rear of the seat. This caused me to weld extra "splints" to the sides of the frame members in that area on both of my KLRs. I have had the lower sub frame bolts on both bikes start to vibrate loose and solved that with blue Loctite. I have also had the horizontal bolts holding the luggage rack vibrate loose and solved that with blue Loctite. I have broken both of the two vertical bolts holding the luggage rack to the rear of the sub frame four times. These are 6mm bolts and even after replacing them with 8mm bolts I managed to break the 8mm bolts, so I carry spare bolts and an Easy Out Extractor. They are easy to remove because they shear rather than corrode and twist off. I also wore out the rear shock at 100,000 miles.

      All of the above is to say that my 2008 KLR has been down many many thousands of miles of bumpy dirt roads and broken a few things, but never the subframe bolts.

      I have always been pleased with the quality and quick shipment of items from Eaglemike, so if you decide to get the bolts for your 2014 KLR you can be sure that the Eagle does not do junk.
