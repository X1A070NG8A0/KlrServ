    text: |-
      Re: Subframe upgrade necessary??

      > GoMotor wrote: Originally posted by GoMotor
      >
      > I think Kawasaki may have upgraded some of the bolts on the gen2 KLR650.

      They have. Specifically, the upper subframe bolts have been increased from 8 mm on the Gen I to 10 mm on the Gen II. The lower subframe bolts are still the same 8 mm bolts.

      From what I've heard the Drill though upgrade was important on the Gen I, and the stock 8 mm bolts did fail. Replacing them with the 10 mm bolt of the drill though replacement added a lot of strength and solved a common failure point. It seems a lot less clear that this is true of the Gen II bikes. Would replacing the 10mm subframe bolts with the 10 mm drill though bolt add some strength? No doubt, but given that the stock bolts are already 10mm, is this solving a problem that doesn't exist? Are the upper sub frame bolts a weak spot on the Gen II bikes despite the stronger stock bolts? I haven't heard anyone report a failure of an upper subframe bolt on a Gen II KLR. Maybe it happens. I bet it happens a lot less than upper subframe bolts on the Gen I bikes.
