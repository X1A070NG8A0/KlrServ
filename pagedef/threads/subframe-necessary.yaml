    text: |-
      Re: Subframe upgrade necessary??

      I've seen several subframe bolts broken off, just to add to the chorus. Not much fun trying to patch a broken and loaded bike together to get out to civilization. Also not fun removing broken bolts away from my own shop. Trusting some unknown person at $100.00 per hour to remove broken bolts is not high on my list although never on my own bike.

      FWIW, you can likely obtain Grade 12.9 bolts locally but for the time and trouble + given that Eager Mike (haven't bought a kit in several years as was away from KLR's) supplies high quality drill bits and guide, makes his kit very worth the money.

      Drop something off your list if money is tight but if doing two up, and/or any loaded and rough road, this is a must do, IME & IMO.

      I'm about to do a subframe bolt kit to a KLR in the garage today.

      Use drilling lubricant, turn the bits at the correct RPM and go slowly, IME.

      HIH

      Norm
