    permalink: https://www.klr650.net/forums/forum/klr650-forums-klr650-net/klr650-maintenance-klr-wrenching-modifications-technical-support/116242-subframe-upgrade-necessary?p=1893507#post1893507
    text: |-
      The upper subframe bolts have sheared after lots of riding, especially loaded heavy and lots of rough roads. Lower bolts can work loose and break. Read "Odyssey To Ushuaia" and see where a guy's upper bolts sheared and he was stranded in the middle of the Bolivian salt desert.

      I highly recommend the drill-through upper bolt upgrade and stronger lower bolts with strong threadlock.

      I like to use a long quarter inch bit to drill first then the larger bits that come with Eager Mike's subframe bolt kit. Use oil when drilling. I use cutting oil, but anything to lube and cool the bit.
