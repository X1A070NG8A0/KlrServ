    text: |-
      Re: Subframe upgrade necessary??

      Hi everybody!

      To those wondering if it's necesary to do it in a GEN II... I will tell you my experience (with my GEN II 2014):

      While in Siberia I found one of the subframe bolts broken (well, I just found the half that was left in the bike).

      Took the bike to a car mechanic... one and a half day to remove the old and make a drill through upgrade.

      But I don't think is failure of the bike, I think I broke it in Mongolia... I took a backpacker with me for a week ... she and her back pack added a lot of weight and the roads were bad.

      so I think is good idea make the upgrade in GEN II bikes. I don't know for sure if this will add some strenght... I guess it does... but at least it will make easier to replace the bolt in the future in case of need.

      Cheers!!
