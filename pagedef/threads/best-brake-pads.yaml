    text: |-
      Re: Best brake pads?

      > JBradley500 wrote: Originally posted by JBradley500
      >
      > I just put those on my klr. Do you have an opinion on best break in procedure with used rotors?

      clean the rotors with maroon (course) scotch brite or 400 grit wet or dry sandpaper....do not over heat the rotor or pads, gentle braking...it is good to gently brake then let the pads/rotor cool and repeat a couple of times....

      wyman
