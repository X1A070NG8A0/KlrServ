    text: |-
      Re: Steering Stem Bearing Adjustment/Health

      I got the races and bearings installed on the KLR this morning. the lower inner on the shaft I used a piece of galvanized pipe of the same ID to tap it on. the lower triple and shaft had been in the freezer for a few days while parts arrived and it went on with little trouble.

      I was going to used a threaded rod, the old bearings and some other metal stock to just pull them in, but I was having an issue with keeping parts aligned, so I ran to harbor freight and picked up a Race and Seal Driver kit ( http://www.harborfreight.com/10-piec...set-95853.html $39.99 on sale for $29.99 and then a 20% coupon to bring it to $23.99+tax.. and totally worth it).

      this kit and a 3lbs hammer and they drove right in.. the dies in the kit were even the proper size that I could countersink the races all the way in to where the originals were.

      so, now to pack the bearings with grease and reassemble the bike! the hard parts are done.. the rest is pretty simple.
