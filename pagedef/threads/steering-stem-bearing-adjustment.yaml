    permalink: https://www.klr650.net/forums/forum/klr650-forums-klr650-net/klr650-maintenance-klr-wrenching-modifications-technical-support/110764-steering-stem-bearing-adjustment-health?p=1868110#post1868110
    text: |-
      Re: Steering Stem Bearing Adjustment/Health

      Got around to changing my bearings and races this weekend. They made it many years without issue, then started the same thing that Bryce had - I'd tighten them up, and a short time later they'd be clunking again. So this was the 100,000 mile service, won't have to do this again till 200,000 miles? I figured the races must be marked up, and sure enough, check it out in picture #1...

      Next, thanks to this thread, I liked Foolhardy's recommendation of how to get the top race out. I had to try and see if I had a properly-sized socket... in this case, I did... a Proto 1 1/8" socket on a half-inch extension. That top race was out in 15 seconds! That's picture #2.

      I was about to grab the TIG welder for the bottom race, but was thinking I might want to disconnect the battery, CDI and so on... so we flipped over the "upper race tool" and I grabbed an old drum brake removal tool (picture #3). It could catch the edge of the lower race, and the Proto socket on the extension worked great as it was piloted inside the steering head - and the lower race was out in about a minute!

      The reinstallation went fine but I did put the old races on the lathe and reduced the OD by about .005 inch, so they were a tool to install the new races without getting stuck in the steering head bores.

      Reinstalling the lower bearing did take some work - I did freeze the stem and heat the bearing, but still, it took some good hits from a PVC tool that I made for the job. No lie, that was the big task here... everything else went well. That's picture #4.

      Thanks to all for the ideas and tips.

