    text: |-
      I know there have been a ton of posts about a knocking coming from the front end and it is usually the steering stem bearing adjustment. I can't get mine figured out. I recently went on a ride, and felt a knocking over bumps and washboards. I pulled the front wheel and tried to wiggle each fork leg to see if they might be the cause because I recently serviced my forks. They didn't budge, so I am almost positive it is the steering stem bearing.

      I have adjusted the steering stem three times in the last year, and liberally greased it top and bottom last summer. The bearings felt fine then, and the races seemed clean. I keep adjusting it tighter each time, and the last time I thought it might be too tight due to me feeling some resistance in spots as I turned the bars.

      Are my bearings and races shot or am I not adjusting it right? I tighten the nut over the bearing, put on the claw washer and the snug down the top and torque. The knock goes away, but only for awhile.
