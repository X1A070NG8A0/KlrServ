    text: |-
      Re: Steering Stem Bearing Adjustment/Health

      I ground mine like Jeff recommends and it works fine. If you happen to nick the center shaft a little, it is not a disaster.

      To remove the outer race, one recommendation is to weld some bead on to for points to drive against with a drift. I did not want to risk welding it to the steering head, so bent the tip of a large screwdriver over 90 degrees and put it up from the bottom to hook the top edge of the race. I had a buddy tap down from the top on the screwdriver and it popped out.
