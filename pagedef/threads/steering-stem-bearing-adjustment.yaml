      > Bassplayinroach wrote: Originally posted by Bassplayinroach
      >
      > I've wanted to check and inspect my steering stem bearing but feel intimidated. Im a rookie at wrenching and this is my second bike but im.learning what I can. The main reason im intimidated is every time I dig in to do something I rum into an issue like a sheared bolt. Or can't get it all the way apart or back together.
