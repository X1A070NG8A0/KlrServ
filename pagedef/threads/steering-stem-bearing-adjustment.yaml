      Re: Steering Stem Bearing Adjustment/Health

      Well, we'll let the pros with some experience chime in, but in the meantime... I'd probably say that race has a tiny press fit onto the steering head, so heat should help. However, you'd need some way to apply a load to "lift" the race, so before heating the race, I'd love to see a step or notch in there to apply load to. I'd make the notch with a die grinder wheel, then heat the race with a torch and quickly hit my notch with a screwdriver / punch to see if it would then slide up the shaft.
