      Re: Steering Stem Bearing Adjustment/Health

      I used All Balls but recall I didn't like the fit up of a seal and ended using a combination of their seal and the stock seal. The bearings fit fine.

      The lower bearing is the same as a BMW Airhead. NAPA part is BR32 and cost is about $16 last time I bought one. Advance Auto Parts might have it as A-32. O'Reilly Auto Parts probably has it as A32.

      I don't have any info on the upper bearing but it is a different size.

      You don't have to have a welder to remove the race but it will make it easier. If you put the bike on a trailer and then pull the front off it you could trailer to a shop that could run a bead for you.

      Best,

      Jeff
