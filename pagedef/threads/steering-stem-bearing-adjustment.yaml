      You don't need to remove anything from the bars. I lay a towel across the tank and put the bars on it. Be sure and have JIS screw drivers. Do not use SAE phillips drivers. Lots of dissimilar metals with fasteners i.e. steel bolts in aluminum threads. As such a little tab of anti seize goes a long ways. Don't believe the hype that KLR's need lots of loctite. VERY few items on the KLR need loctite. You'd be off throwing your loctite away.... Have fun!
