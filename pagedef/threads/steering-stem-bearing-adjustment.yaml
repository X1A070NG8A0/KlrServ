    text: |-
      Re: Steering Stem Bearing Adjustment/Health

      I'd add that the slop in the system that 'shows up' after time could be the fact that the bearing rollers have flat spots in them (just like the races get indents from this point contact) and if you're pulling out the bearings, lubing and reassembling, I'd surmize that the flat spots on the rolers aren't in the 'dips' of the race... but after time riding, they find their way back and suddenly you have a loose setup.

      I had an old Honda XL600 that after 60,000 miles had marks in the bearing races - but only at 6:00 and 12:00 of the bearing race of course. I pushed out the races, rotated them 90 degrees and reinstalled them, and they worked great. Seemed like the bearings were good, the races were the issue.

      On the KLR I see it's not easy to get the races out, so I've tightened mine a few times over it's 95,000 miles... I'm thinking I'm getting close to buying fresh bearings and races, grabbing the TIG and popping in new stuff.

      Anyway, in your case - is the reason that it 'loosens up' actually mis-shapen hardware re-indexing?
