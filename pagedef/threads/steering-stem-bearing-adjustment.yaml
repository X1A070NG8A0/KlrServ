    text: |-
      Re: Steering Stem Bearing Adjustment/Health

      I know this is an older thread, but I was so pleased with the results that I had to share. The welding method is without a doubt the best way to remove the lower steering race. I tried cutting a groove, bending a screwdriver, etc. and nothing would get it to budge. Borrowed a friend's portable arc welder, welded a couple of sloppy beads on it, and the race almost fell out.

      The welder was this one from Horrible Freight Tools:

      Access to this page has been denied

      http://www.harborfreight.com/welding/arc-welders/80-amp-dc-120-volt-inverter-stick-welder-61749.html

      px-captcha

      I might have to go get me one of these ad make excuses to weld stuff together.

      Also, for removing the top race, I used the 1 1/8" socket from the bottom. Came out easily. To get the bearing of the stem, I dremeled and chiseled it off.

      To install the new races and bearings, I took the old races and made a cut with a dremel to give some clearance (The stem bearing was already cracked, then used them to tap in the new races and stem bearing.

      Now that everything is greased up and will be maintained, I don't ever expect to have to do that job again. Thanks for all the tips.
