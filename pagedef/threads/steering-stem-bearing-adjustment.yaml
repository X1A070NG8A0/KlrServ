    text: |-
      Re: Steering Stem Bearing Adjustment/Health

      I'll suggest the issue with the repeatedly loosening nuts has something to do with the way they are assembled/adjusted. I don't know what as I can't see what is actually happening but that is not a common condition for properly assembled and adjusted steering stem components.

      Are you using a torque wrench on the top nut?

      Are the threads clean on the stem and nut?

      Is the upper triple in good condition where the nut is applying pressure?

      Has the stem ever been pressed out of the lower triple?

      Are the bearings original or replacements?

      Just thoughts/questions that immediately come to mind.

      Best,

      Jeff
