      Re: Steering Stem Bearing Adjustment/Health

      Big_rider,

      I just reread your original post. You said there was resistance in spots. I missed that I guess. That is an indication the bearings are shot or the grease is hard. You said you greased them so maybe the bearings are done.

      Since you are willing to pull the front end down so far... why not drop the stem too, clean the bearings and inspect all. Then put the stem back in with clean but not lubed bearings and see how it feels when you adjust it. If it is still notchy then the bearings are shot. If it feels smooth, take it apart, lube the bearings and reassemble. This will probably take you an additional 15-30 minutes if the bearings are still good.

      Best of luck,

      Jeff
