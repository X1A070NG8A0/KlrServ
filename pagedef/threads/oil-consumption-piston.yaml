      > We know that the 685, 688, 705's all work. We do not deny that.
      >
      > What sizes are their oil return holes and how many?
      >
      > And just how many 685's, are starting to use a little oil like John0270's?
      >
      > His "60,000 mile 685 teardown" is part of the reason I and possibly Norm are here.
      >
      > ODD carbon problem on his piston, yes?
      >
      >
      > But what do we do, or can we do, to encourage Kawasaki to get it 100% correct?
      >
      >
      > The only thing I can think of, is to Correctly Identify the Proper problem or problems, and show an appropriate course of action.

      Neat thread!

      This bit above kind of got me thinking...

      I'm a mostly retired road racer. In the search for power, we used to take are brand spanking new bikes down to little pieces and rebuild them "properly". At one time, it seemed that most of the manufacturers did kind of a poor job on the final prep of the cylinders. That resulted in the rings getting beat up during break in as the break in did the final hone. So, the common practice was to plateau hone the cylinders.

      The next trick after that, in the time where one was allowed to use OEM over bored piston sizes up to 1mm, was to use the smaller oil rings on the larger piston. We'd get the cylinder bored straight, plateau hone it, install the top two rings for that piston size (think 1mm over bore), then install the original oil rings on the 1mm piston. Yes, we did use some oil, and we saw some oil depositing on the spark plug which did require more frequent changing of plugs.

      A few years later, a very good engine builder from the south was torn down at one of the AMA events as his rider put the bike on the podium. At tear down, the cylinders were removed, and they had completely left off the oil rings. (They were told they were illegal as they didn't have the engine with all the parts, he replied that the rings were in the oil pan and the AMA had to change the rules to account for those kinds of gray areas... )

      Could Kawasaki's issue be a problem with their bore being straight and/or a poor final finish? Or poor OEM ring tension...like a 351W where even after a couple of hundred thousand miles of use, the cylinder will still have a crosshatch?
