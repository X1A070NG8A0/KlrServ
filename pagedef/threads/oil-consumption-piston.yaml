    text: |-
      Re: Oil consumption- piston study

      So what you're saying is that we should listen to you only based on your experience with 150 cylinder services, education and training in the field, and attention to detail? Could that be enough? (VBG) Of course it is!

      I've been discussing the questions with a bunch of techs from the motorcycle, automotive, marine, small engines, machinists and racing fields. Bottom line is that none are dismissive of increasing the drain back hole size. One or two felt it wouldn't help but the others were between, "It can't hurt to do" to "It may help quite a bit but likely won't completely solve".

      I'm of the view, as said several times, that I would rering and drill the transfer groove holes to about 0.095" to address an oil burner. This assumes that the cylinder is in reasonable condition allowing for deglaze honing or true honing to bring back a true bore. Knurling the piston skirts has been a very satisfactory solution but what about rings? That reminds that I want to look into the Hastings rings which someone mentioned.

      Some of the racers were concerned that the oil rings seemed not to have sufficient cylinder wall pressure. This is an issue with some of the low tension rings in common use. For racing, some guys are expanding these types of rings in order to increase cylinder wall pressure which helps with oil burning according to reports.

      The more which I study this issue and compare the KLR with engines having a similar bore/stroke size and ratio, the more amazed I am that it survives and performs as well as it does. Check with a small block Chev or Ford racer and tell them that you are running a 350 Chev or 351W Ford at 5,000 RPM cruise on the highway for hours with shift points near 7,500 RPM. They will look at you as though you are either full of baloney or lost your mind. Tell them that all works well excepting that it uses more oil than you would like on the highway and they will not know what to say. That's the KLR's life.

      When Wattmann told me that the temperature at the temperature sensor could be 20 F higher than that at thermostat I was shocked. If one has removed the thermostat and looked into the coolant pocket, one will see the temperature sensor. One will also see that the temp. sensor and thermostat are in the same pocket of coolant across the top of the cylinder head. The sensor is around a slight "corner" but that's it. Three inches away in an open pocket! This shows that there cannot be any significant movement of coolant within the the cylinder head which leads me to the conclusion that there also cannot be coolant movement within the cylinder cooling passages or this movement would agitate the coolant in the head causing mixing. I have no idea of the degree of stratification which takes place!

      This certainly supports the view that the great differences in temperature within the cylinder could be responsible for distortion creating inappropriate piston ring fit.

      Very interesting problems..

