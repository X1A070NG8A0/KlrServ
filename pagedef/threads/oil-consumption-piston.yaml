    kind: Forum post
    author: Norm
    date: '2014-01-07'
    permalink: https://www.klr650.net/forums/forum/klr650-forums-klr650-net/klr650-maintenance-klr-wrenching-modifications-technical-support/115635-oil-consumption-piston-study?p=1885199#post1885199
    text: |-
      Re: Oil consumption- piston study

      Coincidence is one of the roots of superstition....do you think saying that might bring bad luck? ;)

      Piston cooling is also assisted by oil splash from beneath, although this varies greatly from engine to engine. Many diesels are hugely dependent on spray from nozzles beneath to provide cooling while other engines use a squirt from a hole drilled through the web of the connecting rod big end. When this hole (also through the upper bearing shell) lines up with the oil hole in the crankshaft throw, the squirt of oil is timed to strike the underside of the piston crown. I don't recall seeing piston oil return holes angled upward but will watch for that orientation as it is generally not something one considers in the repair trade. One simply insures that the oil holes are clear and that's usually it.... Until something new is identified.

      The contact fit between the ring and the piston ring land is important in the transfer of heat, sealing of the ring to piston, trapping of combustion and so on. A poorly fitting ring will combine with heating of the sides of the piston crown but hard to identify whether that is lack of heat transfer or heating by combustion gas leakage. Fortunately, one generally doesn't need to know.

      It would require someone with proven expertise to justify the source of most of the pin lubrication. We were taught that it was throw off of oil from the main & rod bearings which provides the pin lubrication excepting when squirt holes are provided. Given that I cannot determine this, I can only be concerned regarding modification or effect. Perhaps your oil flow work will provide some indication as to the KLR's balance?

      The oil ring of Rick's piston is 2.5 mm, compression rings 1.25 mm.

      Perhaps someone can post other ring widths? I'm also curious as to whether they differ.

