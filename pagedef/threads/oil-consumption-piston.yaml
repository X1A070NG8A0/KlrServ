      PM sent.

      30 sets which are all from oil burners?!? That would be most interesting.

      Are they all stock Cowasaki rings?

      I'm hoping to find someone who has an oil burner who is willing to try reaming the oil drain back holes combined with piston ring & cylinder wall inspection. The oil consumption is likely mostly related to poor oil control ring performance, IME. The piston in the photo which I posted has non-contacting areas extending from both ends of the second ring as Pdwestman noted. He also mentioned encountering repairing several engines with similar problems.

      We used to see many Japanese car engines which had worn out oil rings while the cylinders and compression rings appeared to be 100%. While theory indicates that the second compression ring has a very significant effect on oil control, I cannot support this empiracally. It seems most probable to me that some engines rely more on the contribution of this ring than do others.

      Funny how much the KLR resembles a 350 Chevy, piston and power output like a 300 hp 350. One difference is how much longer the KLR survives than a 350 with high performance build. I'm trying to recall the oil consumption of 350 Chevy engines in some of the lower geared pickups. Guys used to run them at high highway speeds (70 mph or more) for 300 miles in a couple of areas where we were so trying to recall the oil consumption figures. If memory serves, they used a fair bit of oil with good engine condition but lacking in so many oil drain back holes. Interesting stuff, especially trying to recall things from 40 years ago.

      Regardless, I will chase this for a bit and see if can take it anywhere. It will be both amusing and stimulating to investigate, despite that I think the problem has already been identified as poor piston rings.

      Question for Rick and others who have done re-ring or rebore: "How much blow-by gas volume were you experiencing?"

      Were you finding druel in the air box? Did this change after the service?

      There is a great difference between bad compression rings and bad oil rings despite that both can encourage oil consumption. Bad oil rings flood the piston to cylinder gap allowing oil to be forced past the piston. Bad compression rings can allow sufficient blow-by of combustion gasses to blow oil mist from the crankcase via the breather hose and out through the air box. One should, in this event, find druel in the air box.

