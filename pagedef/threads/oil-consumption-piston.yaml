      Jeff, I'm thinking that I'm not going to make a base plate unless I decide to do a head torque plate and do boring for my own work. Too much trouble (translation: getting lazier). I can't answer the question regarding the difference between a base plate and washers but will add that the dowels at the bottom of the cylinder should be included in a base plate as those will also add distortion. Given that the KLR cylinder liner is so thin, the aluminum casting is also not very ridgid, boring them would seem to be a huge challenge and might explain much of the oil consumption problems since it isn't unlikely that they don't bore them properly from the factory. I'm going to check with the local dealer to find out how much it will cost to buy a new cylinder which I will measure and return. I'm betting that the new one will be as wonky as an old sausage but will be very pleasantly surprised if that is not the case. I'm not prepared to buy a new cylinder outright for the purposes of this study so that may be a dead end.

      I'd really like to put a bore gauge into some which have been bored. I do know that the shops in this area all use one guy because they have had poor results from other machine shops. I've been trusting the service as parted with my cylinder bore gauge and stuff. Will see when the new one arrives.

      I hope to take the cylinder and head to a friend who owns a business which repairs helicopter turbines to see what he thinks.

      I'm also interested in how much tool bit or hone stone distortion may be occurring. Was just thinking about the measuring we did and thought that it was a serious omission not to have placed a small jack screw into the cylinder and measured the cylinder wall distortion from mild force. I'm wondering if some of the boring is too aggressive for these thin cylinders and causing distortion while boring. Someone mentioned that one series of bike cylinders which they do requires very, very light cuts with a boring bar but can't recall who said so. I'm pretty certain that the reference was KLR650.

      Perhaps someone who is more current on boring/power honing can comment? I've not done any of this stuff for over a decade so may be missing some aspect or misinterpreting.
