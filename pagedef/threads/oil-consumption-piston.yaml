    text: |-
      Re: Oil consumption- piston study

      Why did you have to do that, Gruff? I've been reading and corresponding with Watt-mann, for ?? 10 years??

      Here was my chance to catch him out on something and you go there before I did! Fair enough but you've had your turn so next 10 years error is mine! Agreed? ;)

      Thanks, as always, Bill. I do recognize the effect of uneven heating/cooling due to cooling system circulation but was interested in another factor which I think has been confused with uneven heating/cooling due to location of piping.

      In order to machine a cylinder so that it is true to size, taper and out of round, one needs duplicate as much as is possible to machine the cylinder so that it will be "true" when operating. The realm of the possible or practical impinge on what is ideal because there will always be some difference in the cooling system's effect within the compromises required for a vehicle. While it would be ideal to duplicate the uneven cooling effect because of the placement of the cooling system inlet and outlets, it is not practical to provide this condition while machining. This must always result in compromise.

      I am completely sold on the Thermo-Bob concept and recommend it highly which doesn't carry more than the empiracle appreciation of the performance of automobiles in cold weather testing/operation. FWIW, I am playing around with an alternative bypass system on my own bike but this is intended only as a means to investigate some questions. IMO, one is better advised to go with the Themo-Bob because it has both engineering and empiracle validation.

      I'm interested in the machining/honing problems so will attempt to duplicate the effects which I can duplicate in order to attempt measurement. It is obvious, for example that many engines require torque plates for cylinder service. I want to see for myself how the KLR is affected, just curious and not disputing what those who have machined cylinders report.

      If one were to identify that some cylinder is greatly affected by uneven heating due to cooling system performance then some remedy such as the Thermo-Bob is indicated---it goes beyond that as one would need to justify that bypass is not needed in order for me to accept the assertion, given experience. That's only my personal motivation but think it is defensible.

      If, one were to determine that a cylinder has a different size, taper & out of round at room temperature than at operating temperature, this should be addressed in machining. That's my level of interest. Doesn't really matter if someone else dismisses as am not working for either their interest or their dollar. I do doubt that this is likely to be a significant factor but want to see for myself.

      FWIW, if any of this appears to be disputing or dismissing anything which Watt-man has said, (likely including when he posted the effect in reverse to his intention) it is the fault of poor craftsmanship on my part in writing this post.

      I'm looking to vet ideas, that is all.

