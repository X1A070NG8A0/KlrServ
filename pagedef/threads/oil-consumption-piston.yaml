      Still playing with a cooling system project and Wymanwinn's shipment of 30 pistons is awaiting inspection. I have three other pistons here in addition, only one of which as been studied to any significant degree. I'm hopinog to spend some hours with an old friend who built automotive racing engines for many years. He's not the typical race engine assembler who buys the latest parts from Crane, Isky, TRW, etc. and assembles and engine. Far and away beyond that. Will see what he comes up with from the limited examples if the pistons and rings along. I have some ideas, a few of which have explored here which will run past him and then try to put together into something coherent to post here. There may be something from that which someone will be able to take to the next level.

      Times like this I'm really bummed out about not having the machine shop available....and the skills I used to have. Oh, well. It's still hugely interesting. I'd like to torque plate and bore a cylinder, then remove plate & remeasure. It would also be really interesting to measure a cylinder, then warm up to 160 & 195 F, then measure the size, taper & out of round at each temperature. It has to make some difference.

      I was speculating regarding torque plate boring & honing regarding the KLR and how few people recognized how much effect that can have when my friend mentioned this Cummins block demonstration. I've shown this effect to over a decade of automotive and heavy equipment students so hope the video both conveys the effect and that the concept is useful: Cylinder Distortion and Deck Plate Honing on Cummins 5.9 - YouTube

      I keep thinking of the thermal stratification of that cylinder under operation with stock cooling system. The reported reduction in oil consumption when Thermo-Bob installed, points to cylinder distortion or piston not expanding to proper clearance or both, right?

      Another is that some of the top end automotive racing builders finish hone the cylinders with torque plates and with the block at operating temperature. They claim that it makes a difference in ring sealing. I'd be amazed if it does not. That brings me back to wanting to check bore with cylinder at different temperatures....

      If there's a member of the year award, Wymanwinn would be my nominee for keeping all those labelled pistons and then taking the trouble to ship them in hope that there might be something come out of it. Hats off to you!

      Norm
