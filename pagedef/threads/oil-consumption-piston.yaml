    text: |-
      Oil consumption has been a concern for some KLR650's especially under protracted 5,000 RPM running. This is a parallel investigation to pdwestman's oil flow investigation with the hope that one or both will provide something useful. Neither of my KLR's have been oil burners but it is still an interesting problem.

      Here is a photo of a KLR650 piston (thanks Rick Jackson) which was replaced by a big bore kit because of oil burning. The KLR650 piston has a row of four drain-back holes in the back of the oil ring groove, plus another row of four holes in the oil groove below the oil ring. There is an identical arrangement to the front and to the rear of the piston. The scraped oil at sides is returned past the slipper sides of the piston.

      The second piston is from a GS400 Suzuki which I rebored a while ago as a comparison.

      I think we discussed some of this in one of pdwestman's threads but it's better separate than as a hijack.

      The KLR piston's drain back holes are about 0.078" diameter making for a total drain area of about 0.0384 square inches per side. This for a 4 inch bore piston.

      The GS400 piston's (5) drain back holes in the back of the oil ring groove are about 0.0076"; added to the (4) holes in the groove below the oil ring of 0.095" equals a total drain area of about 0.0511 square inches. This for a 2.64 inch bore piston.

      I think that my concern regarding oil drain area should be outlined by the comparison. Since I cleverly tossed out all but a couple of GS400 pistons, will have to wait to gather some more pistons as samples/comparisons.

      Piston/bore area for the KLR650 is about double of the GS400 so the KLR's 75% drain area compared makes for some potential investigation.

      One might wonder why Suzuki felt it desireable to provide so much drain back area in comparison to Kawaski for the KLR?

      The GS400 and so many others which have larger oil holes are not pattern oil burners but tying such a conclusion to drain holes would be very premature.

      I would have to question whether I would install a KLR piston without increasing, or at least radiusing the holes.

      Thoughts?
