    text: |-
      Re: Oil consumption- piston study

      I need to borrow another inspection camera as mine is giving problems with focus. I'll recheck but from what I can see of my 1997's piston crown, the color has some brown rather than unformly black as are all other KLR piston tops which I've seen. I have seen over 40 of them so feel that there is a consistency.

      The piston color, as I've stated, screams of low combustion chamber temperature which is why I asked whether others would report color but have only heard two or three reports from friends. It's no easy to see the top of the piston without the fuel tank off and a good light but am asking again whether some of you can have a look.

      What I'm hypothesizing is that the KLR runs colder than ideal. The Thermo-Bob should address this as does the prototyping we've been doing however I'm now trying to see whether the more even temperature combined with 195 F thermostat provides an improvement in temperature. This should be evidenced by a light brown to light tan color to the piston top deposits. Rather than being soft carbon as is typical, they should appear like automotive and sport bikes which have a very hard, tan/brown deposit. For those who have not deal with these deposits, I refer to them as "ceramic" because they are that hard and tough.

      When I borrow another camera or when replacement arrives, I'll take the bike on a 60 mile highway run to revisit the color.

      My bike does almost all around town riding with the odd few miles on the freeway so not as likely to brown the piston as will others which are pulling harder for longer. Anyone recall or can look? Please....
