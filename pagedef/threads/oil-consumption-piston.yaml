    permalink: https://www.klr650.net/forums/forum/klr650-forums-klr650-net/klr650-maintenance-klr-wrenching-modifications-technical-support/115635-oil-consumption-piston-study?p=1884709#post1884709
    text: |-
      Re: Oil consumption- piston study

      pdwestman answered essentially what I would have said regarding build-up of carbon due to poor oil control rings. Carbon as opposed to ash/"ceramic" build-up from oil coming past the rings tends to be softer than the results of fuel or oil by way of the intake (such as valve guide seals). When one pulls down and engine or uses an inspection camera into the spark plug hole, one notices the classic signs of oil control ring issues because the piston is cleaned back from the edge of the piston crown. The distance the piston is cleaned back from the edge is relative to the amount of oil coming past the rings. Around the cleaned area will be a butter soft, wet area of carbon, bordering the harder deposits towards the center.

      I've seen a few very interesting cases in which deposits had built up to the degree that the engine functioned as a diesel which is an amazing amount of deposit as the compression ratio would be well above 20:1. I recall someone destroyed a compression tester when attempting a compression test on one of these but as said, very, very unusual. Typically, a bad oil burner has little in the way of deposits because of the cool combustion temperatures and cleaning effect of the oil.

      This is not to discount Gruf Rude's comment as not much detonation is required to break compression rings, cause piston crown damage, etc. If I were running a bad oil burner, I would do a compression test periodically for a time to see if compression pressures are increasing. FWIW, General Motors sell a combustion chamber cleaner called "Kleans" or "Cleans" which is very effective at ripping deposits from combustion chambers. This can be useful in dealing with gummed up engines. I do caution that decarbonizing and such operations are too often undertaken on bad evidence or poor understanding.

      Detonation or preignition are difficult to hear unless one has good hearing and knows for what sound to monitor.

      If one thinks that one hears such a sound, Gruf Rude's mention of higher octane gas is well repeated. If one hears a high pitched ticking or clacking sound which only occurs on hard pulls with heavy throttle, then try premium gas to see if the sound diminishes or goes away. If so, investigation may be in order.

      > Gruf Rude wrote: Originally posted by Gruf Rude
      >
      > Just one last thought - all that oil is leaving a huge amount of carbon in your combustion chamber. That will provide a nice breeding ground for 'hot spots' leading to pre-ignition or detonation. If your KLR is showing signs of 'pinging' on load or has needed higher octane gas you are seeing the signs . . .
