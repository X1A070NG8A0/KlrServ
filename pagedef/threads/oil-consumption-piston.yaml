    title: 'Oil consumption- piston study: post 39'
    kind: Forum post
    author: Norm
    date: '2014-01-04'
    permalink: https://www.klr650.net/forums/forum/klr650-forums-klr650-net/klr650-maintenance-klr-wrenching-modifications-technical-support/115635-oil-consumption-piston-study?p=1884715#post1884715
    text: |-
      Re: Oil consumption- piston study

      The oil holes in the KLR ring groove can't be enlarged by simply reaming/drilling to a larger size. The top edges of the holes line up with the top oil ring land so increasing the size of the oil return holes by simply boring will groove the top ring land. Such a groove would act as a channel to convey oil past the oil ring which would be a big problem. Oil scraped from the cylinder wall would go behind the oil ring (as intended) but rather than all of the oil either being dragged down the cylinder wall or returning to the crankcase by way of the oil drain back holes in the back of the oil ring groove, some of the oil would enter the groove behind the ring, travel out toward the edge of the ring land by way of the groove and spill into the area between the second compression ring and the oil ring.

      I have sometimes wondered about drilling oil return holes into the back of the second compression ring groove but have never seen this done and tend to think that someone with far more understanding of oil control would have tried this.....a poor argument, I will admit. It is a back handed combination of appeal to authority and denial due to ignorance but that's all I have. ;) I'd love to try this if someone has an oil burner and would like to try some experiments. I loved this aspect of teaching in the colleges as we did manage some research which was able to confirm and discount some important points.

      I had thought of milling the oil ring holes in order to create an oblong hole which would not groove the top land but this seems to be an operation beyond what would be available to any but a very few. If someone.....

      Increasing the diameter of the holes in the oil transfer groove below the oil ring is an easy one. I also note that the holes in the GS400 piston are the same size in the back of the oil ring groove but those below the ring are much larger 95 thou versus 76 or 78 thou. (Can't recall exactly but the point is the same)

      Another possiblity would be to drill the oil ring groove holes at an angle in order to increase diameter but this would require reaming/drilling out the holes so that they angle upwards but this would be counter productive.

      I will ask some of my tech contacts any other questions which someone might credit but keep in mind that this is not a subject area in which techs involved in general repair will have any knowledge. I find that there are very few of us who have even speculated about these things because they have no application in general service so techs tend to concentrate on subject areas which have useful application to their work. Someone may have drilled pistons for some Toyotas or Saturns. Someone may be old enough to have dealt with 1970's Datsuns which had chalked up the holes, but those people are extremely rare.

      An example: I spent 1/2 hour discussing this with an automotive machinist who has 30 years experience in engine machining, is still active in a couple of areas of racing. The guy is very sharp and very knowledgeable but shrugged and said that he has no useful opinion regarding modification of piston oil holes. Even the operation of a 350 Chev under such high RPM is outside his experience area. When I asked what was his knowledge of oil control in this RPM range (7500 - 8500 RPM) his response was: "We want them to use oil to keep things cool and to deal with loading wear." We aren't concerned about this problem at all in racing. A small block Chev or Ford which is running at 5000 RPM is not rolling along for hours at part throttle- different operating conditions completely. How to relate one to the other...??

      I can only develop useful dialogue on these subjects because of the credibility shared with these guys and knowing whom to ask about what. Managing to engage guys who bill out at $110.00 per hour on a subject for which they have no application or interest is a tough go.

      I do recall that there are a couple of snow sled techs on one of the web groups so am hoping that they may have some views as many of these engines are 4-stroke and operate at high RPM. What are they doing regarding oil holes? Anyone?

      Has anyone knowledge of other makes of piston rings as a means of addressing oil burning in a standard bore size?

      > pdwestman wrote: Originally posted by pdwestman
      >
      > Norm,
      >
      > Also think about and ask your tech's these Questions, for me please.
      >
      >
      > What about, Purposely Re-angling and enlarging the oil return holes IN the Ring Land?
      >
      > And Purposely Over-lapping into the Bottom Edge of the Oil Control Land?
      >
      > Sort of like the Lower Holes of the Suzuki Piston, Over-lap into the Skirt.
