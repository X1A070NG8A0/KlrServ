    title: 'Oil consumption- piston study: post 131'
    kind: Forum post
    author: Norm
    date: '2014-02-01'
    permalink: https://www.klr650.net/forums/forum/klr650-forums-klr650-net/klr650-maintenance-klr-wrenching-modifications-technical-support/115635-oil-consumption-piston-study?p=1892606#post1892606
    text: |-
      Re: Oil consumption- piston study

      In a rush to get this posted as heading out for a family dinner. Apologies for typos etc. but if any, will try to clean them up later.

      Two cylinders in question, the first one labelled "S" is a stock bore out of an oil burner which seems to be injesting oil oil by way of the valves. That's another issue.The other, labeled "N" is one I acquired which has been freshly bored first over size but not used. No idea who did the boring.

      Ring end gaps the piston from the cylinder labeled "S":

      Top compression: 0.015"

      Second compression: :0.028"

      Oil side rings: 0.025"

      We measured these two cylinders under three conditions: 1) at room temperature with nothing attached; 2) room temperature, torqued to head with stacked washers and nuts on the head bolts to allow loading without having the cases attached. This to allow measuring of cylinder from below; 3) as in "2)" with head immersed in water at about 180 F. Heat quickly conducted up the cylinder but measurement of bottoms were made immediately so that bottom of cylinder was at room temperature and then remeasured when heat had stabilized. *Thrust side refers to the cylinder at right angles to the wrist pin. *Pin side refers to the cylinder adjacent to the ends of the wrist pin.

      Here are the results:

      1) "S"

      Not torqued, cold

      Top 1/2 thou " taper thrust side

      Pin side 1/2 thou" taper (maximum)

      Top 2 thou" out of round

      Bottom 2-1/2 thou" out of round

      2) Torqued cold

      Taper 5 thou thrust side

      Top out of round 1 thou

      Bottom 5 thou out of round

      1) "N"

      Not torqued, cold

      Top 1-1/2 out of round

      Bottom 6 thou out of round

      Taper 2 thou thrust side

      Taper 2-1/2 Pin side

      2) Torqued cold

      Top 1-1/2 thou out of round

      Bottom 4 thou out of round

      Taper 1/2 thou thrust side

      Taper 2 thou pin side

      3) Torqued hot

      Top 4 thou" out of round

      Bottom (before heat reached area) 5 thou out of round

      Bottom (heat stabilized) 6 thou out of round

      I think this speaks for itself as to whether KLR cylinders require torque & base plate during boring and also concludes that boring at room temperature is ill advised.

      While we had only two cylinders, the results were consistent. Had time allowed, we could have reported more dimensions as many more were taken, all of which showed the same trends.

      Attached Files
