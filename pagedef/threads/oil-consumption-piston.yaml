      > Norm wrote: Originally posted by Norm
      >
      > Attempting to set aside strong feelings of envy..... ;)
      >
      >
      > The accuracy of this new equipment is awe inspiring. The high point of my cylinder boring was the Sunnen Power Hone or careful use of a hand drill operated true hone. Boring bars and the like were the way we did hundreds of cylinders prior to that equipment but these new CNC machines make me think of how an 18th century blacksmith might view 20th century lathe machining. I was going to use the example of stone age but then recalled Robertz's obsidian tools which are sharper than anything I can conceive.
