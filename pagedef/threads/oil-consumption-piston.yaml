      >
      >
      > Wish someone better equipped would do some measurements.
      >
      >
      > FWIW, I just bought a cylinder bore gauge and am still staggered that it cost a tiny percentage of what these commanded only a decade ago.
      >
      > http://www.ebay.com/itm/370986635206...84.m1439.l2649

      Not sure if your familiar with those cheap bore gauges, or setting them up, but i have one and i like it. They are great for checking clearances (where the actual number isn't important) as you can meausre a piston or crank with micrometer, then zero the bore gauge inside the mic, and then check the reading inside the bore or cylinder. If i want good solid numbers with it, i'll set it up with my nice mitutoyo micrometer so i can sort of calibrate my cheap dial bore gauge. I'll put the proper anvil in the bore gauge, and then use my micrometer to push the bore gauge to a reading of .005 (make sure and sweep across micrometer anvils and take the highest reading). Then add .005 to your micrometer reading, and use that as your baseline length for the dial bore gauge.

      You can also put a high quality gauge on those, and then your only limited by whatever inaccuracy is inside the 90 turn mechanism.

      Just some things I've noticed with mine while building my first v8 engine this past year with a mix of budget and quality tools.
