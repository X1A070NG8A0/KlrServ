    title: 'Oil consumption- piston study: post 88'
    kind: Forum post
    author: Watt-man
    date: '2014-01-19'
    permalink: https://www.klr650.net/forums/forum/klr650-forums-klr650-net/klr650-maintenance-klr-wrenching-modifications-technical-support/115635-oil-consumption-piston-study?p=1887135#post1887135
    text: |-
      Re: Oil consumption- piston study

      > Norm wrote: Originally posted by Norm
      >
      > I'd like to torque plate and bore a cylinder, then remove plate & remeasure. It would also be really interesting to measure a cylinder, then warm up to 160 & 195 F, then measure the size, taper & out of round at each temperature. It has to make some difference.
      >
      >
      > I keep thinking of the thermal stratification of that cylinder under operation with stock cooling system. The reported reduction in oil consumption when Thermo-Bob installed, points to cylinder distortion or piston not expanding to proper clearance or both, right?

      I agree with you Norm that these change, but the real key here is the circumferential temp distribution... here's why:

      Imagine we machine a ring of steel that is a perfect circle, and is exactly 4.000 inches in diameter. This is measured at room temperature. There is no stress field. Then we place this ring in the oven and heat it to 195F - the entire ring - and it is now a little larger in diameter due to thermal expansion, but it is still a perfect circle as there is still no thermally-induced stresses - everything is the same temperature throughout the ring.

      NOW - and here's the key - you take an ice cube and place it at one spot of your 195° ring - say "at 12 o'clock". At 3, 6 and 9 o'clock, you still have a 195°F ring - but by your ice cube, it is colder. Now, you DO have thermally-induced stresses in the ring, and it reacts these by distorting the ring's shape away from a perfect circle.

      This is the issue we're describing with a stock cooling system - even though there's a nice water jacket all the way around the cylinder bore, if you look at your bike you'll note that the 'cold water' coming in from the water pump comes up one hose and is introduced to the cylinder at one spot: 12 o'clock. I've measured on a stock bike - and have seen water at this entrance spot 115° colder than the water exiting the cylinder up at the thermostat. This is your issue you're trying to see, and just heating the entire cylinder in an oven wouldn't replicate.

      Adding a Thermo-Bob makes the cooling system like a car - instead of 115° difference between inlet and outlet temps of the cylinder, this drops to 10°-15°. See the upper black line in the plot below? That's the delta in temperatures on a stock bike for the first 20 minutes of operation after a cold start - then look at the lower black line, which shows the delta in temperatures on a Thermo-Bobbed bike over that same ride.

      You want the black line to be close to zero. That is modern cooling system design - high flow-rate, low delta t.

