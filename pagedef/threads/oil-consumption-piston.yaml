    text: |-
      Re: Oil consumption- piston study

      I have just bought three Wiseco pistons for motors I'm currently building , Honda XR650L , Yamaha XT 600 , and Yamaha 660 Raptor. All three have 8 return holes .125 dia and at the bottom of the oil groove. If you need that info to be added.

      On the subject of machined bore out of round , One of my first cylinders I did , with a torque plate used the cylinder was machined to .0028" clearance and was perfect top to bottom, when it was taken out of the machine I remeasured it and found .006" top to bottom variance with the .003" out of round. Once clamped back down it was back to round and as machined in the first place. Cylinders must be torqued to spec when machined. Has anyone measured an oil burner cylinder when it is torqued down to see if they are correctly machined from the factory?

      I can see uneven cooling to have a substantial effect on bore concentricity .

      .
