      > Norm wrote: Originally posted by Norm
      >
      > Jumping in with a different question as it's far easier to ask than to set up to test: "What is the dead head waterpump pressure for the KLR?"
      >
      >
      > If memory serves, some automotive ones we measured were 50 PSI+.

      Norm, I've seen them all over the map. The highest I've measured was 115 psi at 6,000 rpm with the factory stat closed on a certain V8.

      The KLR surprisingly is pretty tame. I've measured 7 psi at 5000 rpm if memory serves. I agree about the concerns of having the radiator on the pressure side - if for no other reason than you 'lose' your cap pressure and don't regain it as soon as rpm comes down after that first time, lowering the nucleate boiling point (I hope I'm using that term correctly).

      With a T-Bob, the reverse flow system is do-able and it won't raise the pressures in the radiator. Leave the T-Bob oriented the same in the hose that goes to the upper radiator tank, and leave the tee in the hose that goes to the lower radiator tank. The switch is to connect the lower radiator tank hose with the stock 'stat location's barb, and the upper radiator tank hose with the water pump "cyl" barb. This therefore requires one other move which takes about 20 seconds - move the hose from the bottom of the cylinder that connects to the water pump "CYL" barb to the other water pump barb. This is a trick I have used in the winter to get more heat into the oil: the coolant will go into the cylinder (top) at 195°F, will leave the bottom of the cylinder at 205°F. For those who think that's too hot, put a 180 'stat in the Bob and it will go in at 180, and come out the bottom of the cylinder at 190.
