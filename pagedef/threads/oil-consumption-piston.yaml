      > Atbmf wrote: Originally posted by Atbmf
      >
      > Yeah thats kind of my thoughts on it too. I've had cars and even other bikes they have burned oil and I've never lost an engine I've just read so much about it on here I was curious as to how serious the problem was. I'll keep oil in it and ride till it dies our gets upgraded . I honestly haven't seen a lot of articles about total engine failure due to this.

      There have been a lot of guys who have lost Gen2 KLR engines due to oil burning. They got caught out by how quickly an oil-burning KLR can drop oil level below critical. The oft-repeated advice, "Check your oil at EVERY gas fill!" is oft-repeated for a reason. A oil-burning KLR can smoke through enough oil in two tanks of fuel if run at 5000+RPM to kill a motor. Not hard to do in a day's ride on high speed highways.

      I met a fellow on my Alaska ride in 2009 on the side of the road in British Columbia. Brand new Gen2, three tanks of gas from the dealership (About 750 miles) on its maiden dual sport adventure. Burned enough oil that the cams seized . . . . Word wasn't out enough on the oil burning problem back then to save him.
  - id: 22
    title: 'Oil consumption- piston study: post 22'
    kind: Forum post
    author: Norm
    date: '2014-01-03'
    permalink: https://www.klr650.net/forums/forum/klr650-forums-klr650-net/klr650-maintenance-klr-wrenching-modifications-technical-support/115635-oil-consumption-piston-study?p=1884556#post1884556
    text: |-
      Re: Oil consumption- piston study

      An engine which is breaking in would be expected to use oil so even more reason to keep an eagle eye on the level.... Too bad to kill and engine like that, especially a new one! Did you hear what happened from there?

      I've been doing some more thinking about the piston which Rick sent and had some conversations with some automotive techs and an automotive machinist. Interesting subject and have some ideas:

      Several reports of users of the Thermobob indicated a reduction in oil consumption and significant increase in fuel mileage. "Hmm", I thought, " shouldn't it be the other way for oil consumption?".

      While I do not know most of those offering these claims, there are two powerful motivators to accept:

      1) The reports claims are based on measurements of data, not on "seat of the pants".

      2) Those whom are known to me are people who are credible (more than credible) in making claims so I would be motivated to accept "seat of the pants" evaluations.

      Here's what I think is happening with the Thermobob:

      Reports indicate that the engine temperature remains higher than usual and uniform. An increase in fuel mileage without other changes can only mean higher combustion efficiency is responsible due to more heat output from the fuel/higher average combustion chamber temperature. Higher combustion temperatures must mean more heat transfer to the piston which, unless outside of design perameters, should result in greater piston expansion. If the engine was designed for a higher cooling system temperature (likely as engines have used 195 F thermostats for 30 years and recent ones 225 or 235 F), and intended for higher combustion chamber temperatures, the piston may be operating with greater piston to cylinder wall clearance than intended. This would almost certainly be responsible for higher oil consumption.

      I've been thinking about this for several days and recall that raw water cooled sailboat engines (running with no thermostat or restriction and using sea water from the ocean as coolant) tended to use more oil than did those with "normal" cooling systems which allowed running with 180F thermostat.

      I also wonder about cylinder deformation as the cylinder will not be expected to expand completely uniformly because it is not uniform in construction. This may not be a significant issue, however, as several reports from competent machinists boring KLR cylinders indicate that they do not require "torque plates" during boring and that there are no recommendations for boring temperatures.

      Having consulted some very knowledgeable engine specialists, including two who build racing engines, not much wiser. Handing them the piston received the observation that it looked like a 350 piston, then they began to comment on the differences before asking what it fit. When I explained the bore and stroke and that these engines had a pattern of oil consumption when running continously over 5,000 RPM, one responded, "I'll bet they do!". Think of running a 327 or 350 Chevy at over 5,000 RPM on the highway for several hours! People in the know would question your sanity. Mention that it runs out of breath around 7,500 RPM but bumping the exhaust cam by a tooth moves that to 8,500 RPM and the conversation is derailed.

      So far, the consensus is to agree with my suggestion to ream the oil return holes in the oil transfer groove....maybe to 95 thou? The holes in the back of the oil ring groove are likely best left alone as they touch the top of the ring land so would have to be milled to oval, downward in order to increase size. One doesn't want to groove the top of the ring land as this will provide a channel by means of which oil will leak past the ring. Remember that the oil control ring is active during the down stroke when it is pressed against the top land.

      There are a couple of contacts whom I wish to consult and also am pursuing another, different, line of investigation. Perhaps Wattmann has some thoughts?
