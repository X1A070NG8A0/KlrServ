    title: 'Oil consumption- piston study: post 157'
    kind: Forum post
    author: airepair777
    date: '2014-02-28'
    permalink: https://www.klr650.net/forums/forum/klr650-forums-klr650-net/klr650-maintenance-klr-wrenching-modifications-technical-support/115635-oil-consumption-piston-study?p=1897499#post1897499
    text: |-
      Re: Oil consumption- torque plate honing

      I run a machining and motorcycle repair shop and am doing a top overhaul on an 08 KLR 650. This was an oil burner but no mystery to it .... the last person who washed the foam air filter didn't think of re-oiling it so it had considerable wear in the bore! The customer is in no hurry since it is winter here, so after reading these posts I decided to do some tests for myself and let folks know the results.

      I had already honed the cylinder .5 mm oversize without torque plating to fit the new OEM piston, I have found that most liquid cooled bike cylinders are quite rigid and don't distort much, especially with the newer style thin laminated steel or o-ring head gaskets. I bore if needed on my 14 X 60 lathe and use a Sunnnen AN815 rigid hone, for finishing and small bore increases, that I modified to run horizontally and turned by a Sunnen LB pin hone (reverse normal rotation).

      To get the cylinders as true as I can I turn the cylinder end for end every time I stop to measure with my bore gauge (set to the micrometer of the piston skirt diameter). This cylinder ended up within 4 tenths of a thou in round and taper measured at the top, mid and spigot, which I consider to be pretty decent. Incidentally the most variance was in the spigot; not surprising as it is the least rigid (it came out .0002-.0004 oversize of the upper half, which is probably mostly due to operator error in allowing the hone to come too far out of the cylinder on that end during the final operation).

      So I was ready to assemble this motor and after reading this post I decided to make a proper torque plate just to see what it would do. The plate I made was for the base only as I was just measuring (unless I found serious distortion and could no longer assemble the motor in good conscience). It is 1.8" thick, 7" dia. 6061 T6 faced flat and bored to slide over the cylinder spigot. I drilled, clearanced and tapped the plate for the head bolts(10X1.25mm) and the two studs (8X1.25mm) and bolted it all together by the book with paper base and metal head gaskets and the actual cylinder head. It is important to clearance or chamfer the tops of the tapped holes as the factory does to the cases, as the threads will always pull up a bit and the chamfer will vastly reduce the case distortion close to the bolts. Much of the case distortion is also taken up by the paper base gasket allowing for a very uniform cylinder compression on the bottom, and the head being very rigid with a metal gasket allows very uniform cylinder squeeze from the topside when the head bolts are torqued down.

      This flat, solid torque plate is very different from a head bolted on top with just nuts and washers on the bottom which will always give you significant cylinder distortion with no applicable education that I am aware of.

      So, what was the result?

      The cylinder went from having the largest diameter at the spigot loose, to having the largest diameter in the middle all torqued between the head and the base plate.

      The spigot went from a max of .0004" loose to .0003 torqued and the mid went from .0001 to .0005 and the top went from .0000 to .0001.

      Before anyone starts making too much of those numbers lets all remember how small a half a thousandth of an inch is. I didn't find a taper or out of round spec in the KLR 650 book, but my CanAm 800 book allows 1.5 thou of taper and 6 tenths out of round for a new cylinder (with a much smaller bore).... I would say this cylinder is better than most from the OEM factory!

      I am always looking to learn though so if those of you with the experience can give some tips to improve my results or question my logic I'm sure we are all glad to hear it!

