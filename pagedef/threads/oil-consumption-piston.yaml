    text: |-
      Re: Oil consumption- piston study

      Where would one add more holes?

      If one does not have a piston to hand, this will not be obvious but once one inverts the piston, the answer is obvious. I looked at this several times as am concerned about the effect of oil drain back along the piston pin sides. I don't properly appreciate the effects of the skirt recesses along the sides of the pin bosses but know that the larger clearance allows for better oil clearing. I also recognize that the small clearance between skirt and cylinder wall act to trap oil increasing pressure on the piston ring to cylinder wall junction. What gives trouble is that the effect falls outside of my intuitive grasp of the dynamics of the oil control problem. I have to keep reminding myself and "sticking it back into the equation".

      One cannot add additional holes in line with the existing string because the piston boss becomes too thick for this to be practical. Drilling through such a thick structure would require such a long hole as to throttle any significant flow. Basically a waste of time, IMO. FWIW, and knowing Jeff already knows this better than I, making a hole longer is the same as making it smaller. Both effects increase restriction. The practical difference is that increasing length makes for a more gradual increase in restriction than does reducing diameter. This from a practical, adjusting by use of drills and hand tools.

      I had considered adding additional holes between some of the existing ones but am concerned about possible weakening of the piston. We used to see piston breakage along the ring grooves in many engines, back when. The spectre of this gives me pause, especially given that our "small block GM or Ford" Cowasaki runs at 50% higher RPM than do these engines. Advance the exhaust cam and the speed goes to 60% higher. For someone to assert that motorcycles are somehow different would require significant support for the assertion. RPM is not a particularly revealing figure of comparison but piston speed/piston acceleration is directly both revealing and comparable. I don't recall the connecting rod ratio for the KLR (should calculate again) but since the stroke of KLR and 350 or 351 are about the same, the average piston speed must also be the same. Piston acceleration is affected by connecting rod ratio but I doubt, from memory of the two rods, that there is a huge difference.

      Regardless, this is aside from the oil consumption question.

      Pdwestman's oil flow invesigation and this piston return hole investigation are likely completely dead ends from the perspective of offering a solution but, from my perspective, both offer several motivations for the investigation. I very much like the practicality of the possibility that some minor external modification to oil flow might offer sufficient remedy. I also recall a number of instances in which modification to the piston has offered advantage.

      I agree that the most rational appreciation of the oil return hole question is that it might provide an additional means of improvement combined with a replacement of rings. I wonder if anyone has evaluated other piston ring alternatives to the Kawasaki rings? We used to source rings from many alternatives when one type of rings was not viable. A slight widening of the ring grooves in order to correct worn ring lands or to allow use of a better or available ring can be a very useful alternative.

      I would strongly resist reboring where the cylinder and piston condition are acceptable enough to allow for a re-ring. I have knurled dozens of pistons and replaced stock rings with 100% success. Many of the engines involved endured longer after knurn and re-ring than did during the initial service. The KLR piston seems to be a very suitable candidate.

      Anyone have size, taper and out of round for the oil burners before rebore?

      Even a feeler guage piston to cylinder clearance would be revealing.

      Too often an engine oil burning problem for a motorcycle is addressed by a rebore rather than to examine alternatives, IME. A GS400 which I did a few months ago is a case in point as would have been a good candidate if one standard piston had been available. That we could only source pistons in pairs meant that we decided to rebore rather than to install two pistons into existing bores.

      I agree that one would not likely reassemble without changing rings excepting if one found an example in which rings looked decent. That would require someone willing to invest in the experiment. I'd be willing to do the work (likely twice) and might kick in a bit on the gaskets just to promote the experiment. We learned some very interesting things through doing some experiments and often showed that what we all knew was incorrect. Much of what I have learned has been quite expensive in times and coin. A big problem, as I often repeat, is sample size. If one were to pull an engine down, ream the holes and then find that the oil consumption was significantly diminished (big "if" IMO), this would not prove or even strongly indicate that there is merit to the hypothesis. At this point in time the experience from both the KLR field and from general practice seems, IMO, to support that piston ring performance is the root cause.

      > jeffsaline wrote: Originally posted by jeffsaline
      >
      > Why not add another couple of holes the same size as already designed?
      >
      >
      > I can't imagine taking a KLR top end apart to get to the piston and then putting it together with a Kawasaki piston and rings. Seems like a waste of time to me. Once it is apart the proven repair is a 685 or similar piston from EagleMike or Schnitz.
