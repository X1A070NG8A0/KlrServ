    text: |-
      Re: Oil consumption- piston study

      Interesting option with the T-Bob as one cannot do that with a conventional by-pass system as seen on some bikes and almost any car.

      My racing engine tech friend just called with some interesting information:

      I purchased a cylinder and piston with the intent of using the cylinder to measure ring end gaps, ring to cylinder pressure, etc. but discovered that it had been bored what appeared to be first oversize, according to the feel of the used piston. When I explained that it wasn't of use to me because I needed a standard one, they guy offered it and a new oil filter for $20.00 so thought, "May as well have it for comparisons."

      My friend took it in to work and did some measurements at lunch today. The cylinder has been bored and finish honed from appearances. Can't tell if it was tool bored or power honed as am getting "past it" in my old age- or at least according to my sons. ;)

      Measuring at room temperature, 1 inch down the cylinder is 1-1/2 thou" out of round.

      There is 3 thou" taper from top to bottom.

      7 thou" out of round at bottom.

      If people are boring them like this it's no wonder they are burning oil and rings not lasting!

      Start out with 3 thou" taper and the rings and lands will be flapping like a scarf on a clothes line on no time.

      If I recall correctly, 3 thou" taper was about the limit to rering a cast iron V8. We'd use a truing hone to take some of that out and knurl pistons which would see the engine another 100,000 miles which was good for the 1970's in our climate.

      7 thou" out of round!!! 2-1/2 thou" is getting to the limit for a hone & rering.

      A friend of a friend called me to say that he'd contacted the guy after I bought the cylinder as he has an oil burner and was wanting another cylinder. Lucky he didn't get that one and try putting together with a new first over piston and rings!

      Hope to measure at operating temperature and with temperature difference top to bottom to see what dimensions change, on the weekend.

