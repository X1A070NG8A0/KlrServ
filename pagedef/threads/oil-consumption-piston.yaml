    text: |-
      Re: Oil consumption- piston study

      pdwestern, as you said the rings do have different contour. It appears the top ring has contact over the majority of the surface so it may have a slight convex or barrel surface. The 2nd ring has a shallow relief chamfer towards the top (chisel) to form a scraper.

      The pictures show:

      1)The std. rings on the old piston with the 2nd ring ends showing little contact on about the last 3/8" (you can see the wear pattern change there).

      2)The new .5mm oversize OEM rings installed on the new piston.

      3) The new .5mm 2nd ring after applying sharpie to the full surface and pushing it once through the full length of the cylinder with the old piston to keep it square; showing uniform wear on the lower contact circumference right to the ends.

      It appears to me that this factory std. 2nd ring had a problem with concentricity at the ends while the new OEM .5mm oversize 2nd ring is looking fine.

      All else being equal if folks are simply re-ringing their bikes for oil consumption, with a good std. cylinder, they should check contact pattern of the new second ring by coloring it and pushing it squarely through the bore, and return new rings to the dealer if found defective. The OEM needs to have returns and complaints if they are still supplying a defective product. If I couldn't get a good new second ring then I would remove only the 2nd and oil rings; install the new top ring in the 2nd groove of the piston and new oil rings and put it back together, a good barrel face ring will seal up fine, 100% better than an oblong chisel face ring.

