    text: |-
      Re: Oil consumption- piston study

      The automotive racing guys are boring and finish honing with torque plates and running hot water through the block. IMO, the KLR cylinder should be treated as a racing engine because of the thin liner and cylinder casting which should make it react more than a thicker assembly.

      I'm completely in the "torque plate and heat everything" camp, based in our measurements and (more important) advice and observations from acquaintences who do high end engine work. Nothing quite as graphic as doing the deed. ;)

      I just ordered a cylinder bore gauge and it looks like will have to pony up to replace the outside mic. set which was sold about 10 years ago because decided I wouldn't do enough of that. Borrowing is a PITA and looks like I can't trust anyone's work.

      I will see if can borrow some cylinders and heads from other bikes to check when my gauge arrives.

      I'm thinking of finish honing with the cylinder (avec torque plate) standing in a canner of hot water inside a plastic bag. If the bag is spaced down from the bottom, one should be able to hone inside the plastic bag so the block temperature will stay even. Heating with a big spud and low flame should work well enough but think it will be easier to maintain an even & correct temperature range with hot water.

      Likely someone has a simpler and more reliable solution?

      > ahamay wrote: Originally posted by ahamay
      >
      > Torqued and heated at final boring would be ideal. That's interesting. Now I wonder if that should be tried with other brands to confirm it is a KLR issue or common. An even heating by a torch when boring should work I would think as long as the flame is moved consistently around the cylinder OD.
