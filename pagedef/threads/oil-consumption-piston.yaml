    text: |-
      Re: Oil consumption- piston study

      > Norm wrote: Originally posted by Norm
      >
      > Lined up a friend to use his bore guages and hoping to try measuring cold and when heated to 180 F or 195 F to see how much cylinder deformation occurs.

      Since this is a thermal test and your part won't have the thermal distribution of a running bike but instead "every ounce" of your sleeve and block will be the same temperature, I don't expect much distortion at all, and certainly for it not to match the running condition, so I'm still not quite sure what this test will tell you.

      Agreed about mechanical loads (head bolt local preload) causing deformation, but you're not trying to get that in this 'thermal' test.

      > Norm wrote: Originally posted by Norm
      >
      > I'll likely pop the sleeve out and post photos of the cooling passages as am interested as to how they are routed.

      Let me save you the trouble. The sleeve OD is round with a few smallish raised rings, and below are three pictures of the block with the sleeve pressed out (shot these back in '07 at Eager Mike's when developing the Thermo-Bob).

      The first picture is from the 'bottom rear', The second is from the 'top front' and the third is from the 'top rear' and a close-up of the coolant inlet port area. Essentially the cooling passage is actually a large annulus of liquid around the entire cylinder sleeve for its entire length. The sleeve is sealed at the top by the press fit and by o-rings at the bottom to "close off" this annulus.

      Here's the mind-blower - to appreciate the flowrate, the "same drop" of coolant makes 17 passes per minute through the engine at 4000 rpm. The coolant coming in that hole is flowing like a wide-open garden hose.

