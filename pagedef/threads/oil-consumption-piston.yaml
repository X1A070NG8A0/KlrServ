    title: 'Oil consumption- piston study: post 5'
    kind: Forum post
    author: Norm
    date: '2014-01-01'
    permalink: https://www.klr650.net/forums/forum/klr650-forums-klr650-net/klr650-maintenance-klr-wrenching-modifications-technical-support/115635-oil-consumption-piston-study?p=1881248#post1881248
    text: |-
      Re: Oil consumption- piston study

      For anyone not experienced with piston oil control, the two top rings are compression (sealing) rings which control compression, power stroke, and exhaust stroke pressure to prevent leakage of combustion chamber pressure past the piston into the crankcase.

      The lower ring is the oil control or sometimes called, "oil scraper" ring. The job of this ring is to scrape oil from the cylinder wall during the piston down strokes, especially the intake stroke in order to reduce oil consumption. The ring scrapes oil down the cylinder wall, resulting in a wave of oil piled against the oil ring, cylinder wall and piston. In order to reduce the amount of oil piling up in this area, there are oil return holes in the back of the oil ring groove and usually placed below the oil control ring. These holes can be seen in the photo, as well as the oil transfer groove intended to hold and direct oil into the oil return holes.

      We saw various issues with plugged oil return holes in various applications due to coolant leaks and other problems. These always resulted in heavy oil consumption.

      Early days but floating the hypothesis that there may be a potential for improving oil control by improving the oil return hole and/or oil transfer groove.

      The obvious downside of this is that it requires removal of the cylinder at minimum. At this time it would make little sense to retain the rings rather than to replace. It is going to be difficult to differentiate between poor ring performance and oil return hole issues. Evaluating cylinder finish and condition from a distance but any contributions of descriptions, photos or other data may help.

      The piston has about the same bore as a classic V8 (4 inch) but turns 50% faster which should challenge oil scraping and return.
