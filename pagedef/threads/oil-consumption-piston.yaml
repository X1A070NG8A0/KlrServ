    text: |-
      Re: Oil consumption- piston study

      I got the 2 cylinders bored,1 I had taken the sleeve out and bored the cylinder itself out 6mm farther the originally to install a sleeve it was never intended for( a project hybrid motor I'm building) so the walls are getting thin. Now these are air cooled, so no water jacket and its associated intricate casting pockets and differing stresses.

      When done boring both with the torque plate (1 I heated with a rosebud,250F with infrared gun, other left cold),the bores were straight and no out-of -roundness.

      The heated cylinder(hybrid cylinder) when released from the plate and base holdowns it came out to .0006" "oval on the bottom but was less than .0003" up top.Those measurements didn't show up until I released the base holdown bolts, not with the torque plate on top.

      The clod cylinder when fully released was .0004" at the bottom and only .0002" up top. I think since these are air cooled and a bit more mass that is more evenly stressed I wasn't too surprised at the relative stabile movement. Both got larger toward the cam chain tunnel
