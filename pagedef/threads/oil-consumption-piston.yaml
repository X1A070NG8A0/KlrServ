    text: |-
      Re: Oil consumption- piston study

      The 'stat wouldn't open unless it were relocated onto the bottom of the cylinder with the wax pellet into the block. That orientation would absolutely require a bypass system as the engine would be a pool of aluminum slag on the floor before it got the bottom of the cylinder to 160 F. Bill will have specifics and numbers, no doubt but can't see why this would address anything in a useful way.

      Even temperatures and an optimum level is the answer. By the look of the cylinder passages that shouldn't be a big deal if one uses a bypass flow to keep things mixed. I'm using an alternate system but it won't see the light of day here. Bill has done the validation for his system and mine is only to answer some personal questions. I'm quite interested to learn whether anyone has found significance in cleaning up the passages?

      Can't post photos as don't think I took photos from those perspectives and left cylinder at a friend's shop.

      Going cross eyed looking at pistons. Wynn sent (30) and I have a couple more.

      In order to do any sort of report will require days of work so hoping that enthusiasm and energy will see me through.

      My friend may have time on the weekend to do some measurements & heating testing. I've done a quick inspection and now down to measuring and weighting.

      My scale only goes to 5-1/2 pounds (2610 grams) so have to pull the wrist pins to weight. Heavy little suckers! Ranging from about 500 grams to 509... more of a range than expected although recall Eager Mike mentioning something about piston weight. I'd be tempted to clean up the casting/forming marks and bell the wrist pin ends if doing one for myself. That, and opening the oil return holes.

      On that subject, I notice that one 2012 piston has no oil transfer goove below the oil ring and the oil ring return holes are centered on the lower ring land. This makes for only 1/2 the return area compared with other pistons. Hadn't seem one of these pistons before so quite a surprise! It also has much narrower oil ring.

      Another interesting factor is that there is one piston with a cooked oil deposit on the underside of the piston. This is almost certainly the sign of high piston temperature but isolated so...lean air/fuel? Speculation at best, especially as didn't record the piston crown appearance.

      Most pistons were clean aluminum underneath the pistons with the others having only a slight brown. Not much sign of high piston temperature so think I'm overly cautious regarding Pdwestman's hypothesis regarding possible benefit of reducing oil throw. I will send some more detailed photos directly his way when have time as they might be of value in helping to estimate.

      This whole project is only possible because of Wymanwinn's offer of the pistons. It is easy to understand why he is so highly regarded here.

      Norm

