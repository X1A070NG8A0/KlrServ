    text: |-
      Re: Oil consumption- piston study

      IMO/IME, one is ill advised not to check oil at every fuel stop. Motorcycles such as Gold Wing, Honda ST's, Concours, are a very different beast from the KLR.

      The KLR is operated in much the same fashion as a NASCAR race car when at highway speeds and the service which they perform leaves me shaking my head in wonder very frequently. That said, we operate them and expect from them, service which is unlike the other highway/road vehicles with which most of us are familar. Would one, for example, operate their motorhome at 85 mph on the highway and not check oil at fuel stops? Not me! I do operate at 55 or 60 mph and feel little need excepting to check each morning before setting out. Were the oil consumption trend to change, my approach would also.

      The KLR is quite different. As long as the silly things have oil and coolant, they will behave like Richard Petty's race car doing laps at silly RPM for huge service life but let some small factor inpinge and oil consumption can spike. The risk factor in running a motorcycle out of oil in highway traffic is the bigger side of the coin for me as locking up the engine with someone inattentive behind is likely to be fatal or worse.

      Even the more extreme oil burners with which I have been associated were still able to get down the highway despite requiring some oil to be added at fuel stops so not a big deal. Were I having to dump oil into my Wing or Honda ST, big difference, but then the ST was cruising in second gear at about the same as the KLR in 5th.

      Most bikes which I see which have engine damage from low oil are run out of oil because of a leak which is known to the rider. They wipe out or seize the camshaft bearings because they didn't check the oil. Seems simple to me but...?.....

      As you know, there are no guarantees so all one can do is to investigate as well as one can and then take precautions.

      One observation from visiting all the bike shops and talking with all the technicians in this area over 10+ years in the course of my business: many of these huge issues referenced on the internet are virtually unknown to the technicians because they are represented in the general motorcycle population to a very minor degree. This does not say that the issues are not real but simply that people who have not experienced a doohickey break, or other highly referenced pattern failure, tend not to post to web groups to discuss things which haven't happened. We are poor with statistics so tend to over estimate or under estimate probabilities.

      Just my $0.02. Hope it is useful.

      Off to pick up a hot water tank relief valve then back to the pistons. ;)
