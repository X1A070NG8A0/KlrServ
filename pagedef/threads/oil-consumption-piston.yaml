    text: |-
      Re: Oil consumption- piston study

      I agree that oil burning, if any was very moderate as the deposits are quite hard and evenly distributed. Here is a photo of a definite oil burner by way of oil passing hte piston. One can see the difference as the periphery is cleaned by the action of the oil spray which swirls over the piston crown as the piston moves downward. It can be difficult to visualize this effect until one is reminded that the oil is not actually passing the piston and rings as we generally express but rather the oil remains in position while the piston and rings pass it. The result is swirling inward away from the cylinder wall and softens the piston crown deposits.

      Possible that someone used a pry tool to open the clearance between bucket and cam lobe, especially if the one doing the adjustment was not thinking the operation through logically. One does not time the piston near TDC when using a valve depressing tool to create space between cam lobe and bucket. Doing so will risk driving the valve into the proximal piston as one should expect as one has placed the piston close to the head in timing to TDC.

      Same drill as a guy who bent a valve while using an an air hold or leak down tester to check for leakage from combustion chamber. He heard a small "hiss" from an exhaust valve so had the brilliant thought that there might be a bit of something between valve and seat. He used a hammer and punch to pop the valve open with the intent that a loose bit might be blown out by the air. Problem was, he smacked the valve into the piston and bent the valve.

      Can't recall for sure regarding extracting a KLR shim so will have to make a tool to try. I tend to agree that the Eler is simple to swap shims do doubt I'd save much time by the time a tool was fabricated and heat treated. Off the shelf fot $10 would be worth while.

