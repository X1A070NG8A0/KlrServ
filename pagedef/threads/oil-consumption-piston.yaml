      I don't know if one can cross oil consumption very well between automotive and the myriad of bikes as the engine designs are very different. The much higher piston speed of the KLR, for example, brings direct comparisons into question in my mind. I don't know how to compare a 5,000 RPM cruising KLR to a 2,500 RPM cruise 350, for example. What is the effect of trying to scrape oil from the cylinder wall when the piston is moving at 2 times the speed? Anyone can calculate the average piston speed, piston accelertion, etc. but the questions regarding the effects of oil control are hugely complex and perhaps the only way for people at our level to study these questions is from empiracle evidence arising from experimentation. Of course, we need to continually remind that what we think is fish may be fowl. We may attribute a result to the wrong effect.

