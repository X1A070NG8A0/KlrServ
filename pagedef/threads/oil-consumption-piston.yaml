    text: |-
      Re: Oil consumption- piston study

      Guess the knitting of socks will have to be suspended until those have all been inspected. ;)

      It seems that the root is not insufficient oil return hole size. I expected that this would not be a magic fix but it does seem that it may be a small assistance. Still and interesting avenue of investigation and one which is still beaconing.

      At this point, if doing a re-ring, I'd ream and radius the oil transfer groove holes as cannot find support for that being detrimental. I would love to try it on an oil burner and then reassemble with rings, etc. as removed but would have to assert that even in the event of an improvement a much large sample size is needed. From a practical stand-point one would replace rings and hone. According to what I have learned, uneven engine temperatures and or low operating temperature seems to be one addressable area.

      I would deal with this issue, perhaps before doing piston ring service for the following reasons:

      1) The apparent improvement in oil consumption may satisfy or delay the need for cylinder service.

      2) Regardless of whether the prosatisfactorilyctorally addressed, the improvement appears to benefit fuel consumption and engine wear.

      HIH

      Norm

