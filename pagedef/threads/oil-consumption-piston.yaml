      Re: Oil consumption- piston study

      I'm hoping that others will chime in with some of the information regarding other pistons. To be candid, I think this is a faint hope but worth investigation for several reasons.

      Were I forced to take a position it would be that the piston rings and cylinder fit/finish of the stock assembly was not adequate. Others have told me that replacing rings with a hone has cured their oil burning. This would be in line with re-ring jobs with which I have been involved over the last 50 years. Done hundreds but there is a possibility that modification might provide some advantage. I cannot imagine that someone would pull down their engine to drill out the return holes without installing new rings and honing. What I can imagine is that we might discover that increasing the size or otherwise modifying the return holes might be an advantage in addition. There have been some really classic cases in which return holes have been inadequate or not present, resulting in big oil burning issues. We also used to see some typical failures such as some Datsuns which developed a tiny coolant weep into the crankcase. Over years, the coolant blocked the piston oil return holes resulting in huge oil burning. Pulling the pistons and drilling out the "lime stone" blocking the holes solved the problem. We always did a hone and re-ring excepting for some experiments. Rings were still OK but not taking that chance with a customer vehicle.

      Someone must have a 685 or 705 piston?

