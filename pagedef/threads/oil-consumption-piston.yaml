    text: |-
      Re: Oil consumption- piston study

      Just a bit of an update as was measuring some factors to follow up on an idea of Pdwestman's.

      I think that I mentioned that several of the 33 pistons checked have sizeable chips out of the plating on the oil ring side rails. I measured one today which would be typical: ring width 2.43 mm. Ring width across chip 2.39 mm, so chip is 0.04 mm deep which is more than sizeable the chip is 2.80 mm long so a very sizeable oil channel, especially if one recognizes that the rail is a scraper so the oil against the ring will be at high pressure. airpair777 and other have mentioned ring end wear so wonder if the problem for some engines is poor quality plating of chrome on the rings, some of which wears prematurely while others chip?

      Paul is interested in using an oil ring side rail as a spacer to widen one of the new style (2.45 mm wide) oil ring sets to fit an old style (2.75 mm piston's oil ring groove). We used to do this as routine when spacing worn top compression ring lands. We used a ring groove cutter to simply shave off some material from the sides of the ring groove and often knurled the piston to compensate for honing some of the cylinder taper. This, of course, in inline 6's and V8's which turned a maximum of about 5,000 RPM so don't know whether the higher KLR piston speed might be an issue. I may have a candidate to try this.
