    permalink: https://www.klr650.net/forums/forum/klr650-forums-klr650-net/klr650-maintenance-klr-wrenching-modifications-technical-support/115635-oil-consumption-piston-study?p=1897574#post1897574
    text: |-
      Re: Oil consumption- piston study

      Thanks Norm and pdwestman. I will have a very close look at these rings to verify the face contour and cylinder contact, especially on #2.

      It is certainly good to try all sorts of things and compare measured results. Often we are surprised by reality when we go beyond the coffee shop talk and go ahead and do the inconvenient.

      If I had the head fully disassembled I would seriously try measuring the torqueplated cylinder after removing it from boiling water, but I have the valves, springs, shims and all ready to go and don't want to get them wet (I'm lazy).

      When dry honing cast iron as I do, the temperature does get significantly above ambient but not up to engine operating temps without a lot of distortion but with a measurable increase in diameter. I wait for the cylinder to cool before final honing and verifying final cylinder/piston clearance. Also in actual operation there are cooler spots like where the coolant enters and hot areas of coolant stagnation and close to where the fire is so although interesting I don't think measuring the cylinder at an even 200F will solve all the world's problems

      Certainly with thinner wall cylinders, especially with exposed studs/bolts like air-cooled VW and Harleys torqueplate honing is an absolute necessity.

      How often do those who say it can't be done get their pride run over by those who are already doing it
