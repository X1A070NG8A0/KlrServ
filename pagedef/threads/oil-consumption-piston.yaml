    text: |-
      Re: Oil consumption- piston study

      I do my cylinders on a cnc mill, we have twin cutter boring heads and then 2 or 3 light finish cuts with a finishing head and high pos inserts for reduced cutter force. Then I have a program with rapid up/down Z moves for 10 seconds for fine honing and crosshatching using an adjustable hone. I repeat the program to desired finish. We don't have a honing machine, so I make do. I have the top of the sleeves also being held down with the plates I made so they are being clamped along with the cylinder so they can't spin.

      Water would indeed be ideal for best results, just would be quite a setup time for me. I have 2 XT600 cylinders to do hopefully Friday or Monday so I'm going to experiment on them to see if some heat works, I'll have to decide how to heat them though since I normally use coolant. I'm so used to working with stainless so it's mandatory. Will probably not do that with these.
