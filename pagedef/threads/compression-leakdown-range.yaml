    text: |-
      Re: Normal range for Compression and Leak Down Tests?

      You will not see 0% leak down. Even the best engines with step gapped rings still see 1-2%. That 6% doesn't worry me especially on an engine as crude and basic as the KLR is. A normal engine can have 10% leakdown. Above that I start to worry.
