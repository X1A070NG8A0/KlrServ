    permalink: https://www.klr650.net/forums/forum/klr650-forums-klr650-net/klr650-maintenance-klr-wrenching-modifications-technical-support/80270-normal-range-for-compression-and-leak-down-tests?p=1360802#post1360802
    text: |-
      Re: Normal range for Compression and Leak Down Tests?

      > binsel wrote: Originally posted by binsel
      >
      > I called them. The throttle was held wide open during the compression test.
      >
      > They said they do not disable auto-decomp., they just do a leak down test.
      >
      > I am not sure %6 @75psi is good or a higher pressure is required.
      >
      > Thanks,

      These are two different and separate tests. A compression test determines one thing a cylinder leak down test is often used as a follow up to a low compression test.

      Standard compression test is done with the throttle wide open and gauge screwed into the spark plug thread and engine is cranking by the starter. Because the KLR has an automatic decompression, depending on its setting, you'll get low readings i.e. 60-75psi. This would be huge warning if you didn't know of the auto decompression. Thus a compression check onto itself is pretty much worthless or at best tells you if your decompression is working properly. Tells you little of cylinder compression/condition.

      Cylinder leak down is done by filling the cylinder with compressed air at TDC then measuring the rate of pressure loss over time. This test gives good information for a KLR.
