    text: |-
      Re: Normal range for Compression and Leak Down Tests?

      I would be happy with the compression test number. Your right in the middle of on spec numbers. Did they do this test with the motor cold or hot? There is alot of difference between the two. The last time I did mine it was 110PSI hot and 78PSI cold. This is on a fresh (less than 4K miles) 685 with stock compression ratio. Here is a cut 'n paste from a previous post.

      -------------------------------------------------------------

      Here are the results of some compression testing I ran this morning. The top part is written more as a procedural...

      Compression testing procedure was performed using the factory base manual, page 3-17 as a guide. Compression specifications were found on page 3-4 of the KLR650 Supplement and also at the front of the Clymer maintenance manual. NOTE- The Clymer manual does not have a procedure for compression testing.

      Personal opinion additions to the following steps have an astrisk before them.

      Compression Measurement

      Thoroughly warm up the engine so that the oil between the piston and cylinder wall will help seal compression as it does during normal running.

      Stop the engine, remove spark plug and attach compression gauge (special tool) into spark plug hole.

      *Most automotive compression testers dont seem to come with the right sized adapter for the KLR plug. Make sure you have one that matches your plug before starting.

      *put a little oil on the threads of the tester/adapter and sealing O-ring. This will keep the O-ring from getting ripped.

      With the throttle fully open, turn the engine over until the compression gauge stops rising; the compression is the highest reading obtainable.

      *If the gauge has leakdown and will not hold pressure you can't get an accurate reading.

      Compression Specifications for the KLR650

      77-124PSI 530-855KPA 5.4-8.7KG/CM2

      With the current posts about compression testing, I performed a few tests this morning. These were performed to see the difference if the factory method is not followed. I did not remove the KACR spring to test that option soley on testers lazyness. The manual does not ask to have that done anyway. Here are the results on a "fresh" 685 set at stock compression ratio. The cylinder head condition is unknown, it's the typical Ebay "low milage" gem.

      Here goes...

      Hot "by the book" -110psi

      Hot throttle closed - 80psi

      Cold open throttle - 95psi

      Cold no throttle -75psi

      Engine "hot" was with the engine run until the cooling fan cycled on and off twice. Engine cold was performed first with the engine at an ambient temperature of 65 degees F.

      RPM on the starter 360RPM (on a Vapor tach) throughout testing.

      ----------------------------------------------------------------

      I can't find the results from leakdown testing but 6% sounds about right. Kawasaki doesn't have a spec for that that I've seen. Clymer says " A cylinder with 5% or less is ideal. A cylinder with more than 10% should be inspected to determine if leakage is caused by normal wear or damage."

      This is another test that has a big difference between hot and cold motor. Clymer calls for the test hot. The leakdown percentage will be a few % higher when done cold. When doing the test listening for air coming from the exhaust would indicate leaking exhaust valve(s). Listening for air leaking through the air box would indicate a leak from the intake valve(s). Listeneing to the air leaking from the open oil fill plug hole will give an indication of ring seal. there will always some air flow from this. It's a judgement call between listening to that and the % number your seeing as to how bad the ring seal is.

      For me the numbers you are seeing are exceptable. A little leak from the intake valves wouldnt be a great concern. Was there a valve lash check done? All on spec?-Tom.
