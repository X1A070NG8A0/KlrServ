      How's this for cheap bastard in a KLR fanatic. I've never run EMGOs in my KLR , but that is what I put in my 4 wheeler . My bud sells them through his shop so I went over and picked a couple of them up to compare them to these photos . The K&N and HF are probably the most popular high quality filters on the market. EMGO somewhere right up in there because of price . I always felt EMGO was lacking on quality so I mostly tried to stay away from their products , except for my 4 wheeler brake parts , which are about par with most of the others . Anyway, here is a couple shots of two EMGO filters compared to the K&N and HiFlo123.

      These have 45 pleats in each one .You can see the pleats aren't very uniform , the one on the right has a couple that are touching . That is the worst spot on both of them. the other sections are pretty straight. The glue is heavy in spots and thin in others . Nice quality control . Look at the box label, it states DO NOT run these filters over 1500 miles . BB sells these for $1.87 ea. , that is if you want to use them. There is another thread going about the best filter deal and EMGO came up . I hate to HiJack your thread , but I thought this was interesting .
