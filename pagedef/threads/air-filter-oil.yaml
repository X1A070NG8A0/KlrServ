      Re: Air Filter Oil?

      I have beeen using the NoToil filter oil and cleaner for several years, first on my DRZ, and now on my KLR. For me, the best part is being able to use warm water with some of the cleaner powder mixed in. It is advertised as biodegradable, and I have used the kitchen sink on occassion to clean my filter, and my wife never knows the difference. Kawasaki now sells it under their own label.
