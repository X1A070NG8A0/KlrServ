    text: |-
      Hey All,

      It's the first time I've cleaned my air filter. I bought K&N Air Filter Cleaner and K&N Air Filter Oil. I assume the cleaner is fine because the clymer manual suggest soapy water or cleaner but is the K&N Air Filter Oil Okay? It says on the package that it is a "Guaze air filter oil" and I am concerned that it may not work correctly with the stock foam air filter I am cleaning..

      Any suggestions???

      Thanks in advance,

      John Biehn
  - id: 2
    title: 'Air Filter Oil?: post 2'
