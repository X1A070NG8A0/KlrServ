      Re: Air Filter Oil?

      I use PJ1 cleaner and Bel Ray foam filter oil. This oil is blue so you can see the coverage. I found that if you get another filter you will always have one ready to go and take your time cleaning and oiling the dirty one.

      I am still using the stock ones and when they wear out will go with better ones.
