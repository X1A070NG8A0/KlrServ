    permalink: https://www.klr650.net/forums/forum/klr650-forums-klr650-net/klr650-second-generation-klr-forum/106404-piston-pin-too-tight?p=1745431#post1745431
    text: |-
      Re: Piston pin too tight?

      I'll suggest that if you got the pin installed by tapping it with a plastic screwdriver handle it is not too tight.

      What I've seen happen a lot with folks that don't do this work often or aren't properly trained is they handle the pin a bunch prior to installation. The heat from a hand is enough to make the pin fit tight.

      The fix is to cool the pin like Chuck B suggested. Heating the piston and rod end with a hair dryer or heat gun works well. The temperature changes make the hole(s) the pin fits in just a tad larger and the pin just a tad smaller. If you don't handle the pin much it should slide in pretty easily.

      Heating the piston a bit for pin removal is also a suggested step in the process. Again, a heat gun or hair dryer should be all that is needed.

      I'll suggest that since you have the pin in place you can finish the engine and ride it. The first heat cycle will take care of any alignment issues.

      Best,

      Jeff
