    text: |-
      Re: Piston pin too tight?

      Kawasaki does not provide any specs relating to the pin to upper conrod. I always freeze my pins before installing. Also, if you don't have a ring compressor you can install the piston into the cylinder then install the cylinder with the piston inserted just far enough to get the pin to slip in.
