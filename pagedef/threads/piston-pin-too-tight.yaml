    text: |-
      Re: Piston pin too tight?

      If you can, use some all thread and a socket or two to install and/or remove the wrist pin if it doesn't slide freely. the bearing down there really isn't designed for side loads. Also if there is a burr on anything that's enough to make things more difficult. A little grease or heavy oil on things can make life easier too.
