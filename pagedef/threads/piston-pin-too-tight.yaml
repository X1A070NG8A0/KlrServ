    text: Hey guys, I'm rebuilding my 08 KLR650, and the wrist pin seems excessively tight on both the rod and the piston. I could not slide it in using hand pressure, I had to tap it in with a plastic screwdriver, and now that it's in, the piston seems too tight. Is there a rule of thumb here? Should the piston rotate under its own weight or something?
