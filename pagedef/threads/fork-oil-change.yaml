  - id: 9
    title: 'Fork Oil Change: post 9'
    kind: Forum post
    author: KLRCARY
    date: '2006-11-26'
    permalink: https://www.klr650.net/forums/forum/klr650-forums-klr650-net/klr650-maintenance-klr-wrenching-modifications-technical-support/21553-fork-oil-change?p=423122#post423122
    text: |-
      You can change the oil, and set the oil level more easily.

      If you remove the air valve from the cap, you can add the new oil with a squirt bottle. For setting the level, use a 2 foot piece of auto brake line. Slide a brake line compression fitting over the line. This becomes an adjustable stop. You can suck out the excess with a squeeze bottle attatched to the brake line. It will eliminate removing the fork caps and springs every time you change oil, and allow you to make small changes in the fork oil level quickly.

      It does require a new spec for height. In my case a level of 190mm, with progressive springs equaled 17 3/4". 170mm was 17". That is the distance to the top of the fork cap, without the air valve. Tubes must still be fully extended. There is no reliable way to center the brake line, so this is with the tip inside the fork tube, facing the back of the bike. As long as you do it the same every time, this is not an issue.

      If you have a level you already like, you can find what that is before you drain it. Just make a dipstick from a coat hanger, and you can then match that height.

      Cary
