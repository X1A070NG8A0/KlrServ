    text: Your front end feels spongy because of the springs, not the oil. (Most likely) The springs on the KLR are notoriously lame and Progressive suspension has a replacement set that is supposed to do the trick. I'm planning on getting a set of them this winter because I hate looking at the road directly in front of my tire when I grab the hooks.
  - id: 4
    title: 'Fork Oil Change: post 4'
    kind: Forum post
    author: Tumbleweed
    date: '2006-11-25'
    permalink: https://www.klr650.net/forums/forum/klr650-forums-klr650-net/klr650-maintenance-klr-wrenching-modifications-technical-support/21553-fork-oil-change?p=423042#post423042
    text: |-
      Stock oil is supposed to be rated at 10W. It didn't seem like it coming out of my bike. AFT is rated at 7.5W or so, this allows the forks to cycle fully, stiffer oil slows down the ability of the fork to absorb impacts and restricts compression. Street normally likes a stiffer oil, off-road goes lighter. This is extremely basic info, there are a TON of variables but fork oil will not fix the spongyness probably.

      I suggest you start with the easy stuff. Fork oil does not compress, air does. The bleed valves on top of the forks should be at atmosphere, that means to depress them and bleed off any pressure in them.

      See if that makes it better or worse. If better, you are doing well. If worse, get out the tire pump and try adding 5Lbs of air to each tube. Better or worse. If it's better an oil change and a bit more oil will probably be a good direction for you.

      Progressive springs retain the stock spring rate for the initial fork travel then have a progressively stiffer spring rate going into mid to full compression.

      For me, Progressive springs, 15W oil at 190mm from the top have worked well but I did both at the same time and will be going to 10W oil to evalute the progressive springs by themselves and allow the forks to cycle a bit easier.

      TW
