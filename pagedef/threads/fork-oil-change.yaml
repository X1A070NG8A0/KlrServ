    text: My KLR has about 2000 mi on the clock and I was thinking of changing the original oil. The front end seems pretty spongy. I've read that 10w might help. I looked at a DIY outline of the proceedure that required tearing down the front end and removing the fork tubes. Is that really required? How about using the drain screws? Can you pre-measure the oil and dump it in through the top caps or do you need to remove the springs to check the level?
  - id: 2
    title: 'Fork Oil Change: post 2'
    kind: Forum post
    author: swjohnsey
    date: '2006-11-25'
    permalink: https://www.klr650.net/forums/forum/klr650-forums-klr650-net/klr650-maintenance-klr-wrenching-modifications-technical-support/21553-fork-oil-change?p=422993#post422993
    text: |-
      If I ain't mistaken, 10 wt is what come in it. You can drain the oil usin' the drain screws. Many folks just dump a measured amount back in. The correct way is to remove the spring, collapse the fork and measure the height of the oil from the top of the tube. You will get a stiffer ride if you increase the oil level from 190 mm to 170 mm. The factory uses a nifty tool that extracts oil down to the proscribed level. You can make your own using a squirt bottle squirter and shorting the pick-up tube to the required length. Use the cap of a 2 liter pop bottle with a hole poked in it to keep the pick-up centered in the fork tube.

      I have been usin' Mobil 1 AFT for fork oil with good results. Dirt bike guys used regular ATF for for oil for year.
