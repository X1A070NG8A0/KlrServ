      Re: &gt;&gt;Dumb question, but what spark plug do you recommend?

      Stock is the NGK dpr8ea-9

      iridium NGK is dpr8eix-9

      I've always used NGK in my bikes and atv's. Anytime I have the tank off the KLR and have accumulated more than 5000 miles I change the plug. The plug can be changed with the tank on but man it's a mother. Stock plugs are cheap and can be had at my local napa store.
