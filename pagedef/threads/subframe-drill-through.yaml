    text: |-
      Re: Drill Through Bolt Upgrade: My Experience

      I did the drill through on my '07 today.

      Used an 18V Ryobi drill on high speed. Used dark cutting fluid (plumbing section at Lowes/Home Depot).

      Drill smoked a bit, but just kept putting more cutting fluid on drill bit to keep it cool.

      Drilled holes were straight and reasonably well centered. Drilled smaller bit from both sides. Bigger bit just from right side (less crap in the way).

      Had to drill subframe holes also on mine. Finally found a use for those wretched Harbor Freight socket rail organizers. Put rail behind hole to catch drill bit after breakthrough. No buggered up frame or messed up wiring/hoses. Only possible use I can come up for these POS.

      http://www.harborfreight.com/media/catalog/product/cache/1/image/9df78eab33525d08d6e5fb8d27136e95/i/m/image_18048.jpg

      Drilled spacers using drill press. Wish I could have used this for everything.
