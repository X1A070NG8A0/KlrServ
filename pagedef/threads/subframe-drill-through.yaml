    permalink: https://www.klr650.net/forums/forum/klr650-forums-klr650-net/klr650-maintenance-klr-wrenching-modifications-technical-support/118960-drill-through-bolt-upgrade-my-experience#post118960
    text: |-
      I'm 215lbs and ride my KLR 80% off road and fairly aggressively off road. I see the drill through bolt kit (Eager Mikes) and upgrade instructions on forums and gave it a shot. I was 100% successful, but have some advice for anyone wanting to follow suit with the drill through.

      1. Its actually an easy procedure although it looks intimidating and was cause for some anxiety beforehand.

      2. I overheated two drills, using drill oil, trying to hop to the 13/32 after that 5/16 hole. To hell with 5/16" straight to 13/32. No way is this a logical way to drill this hole. The bit would catch and torque to a halt in the hole. Instead I used every bit in my craftsman drill kit between 5/16 and 13/32. The slight increase in drilling diameter made the job much easier to the point I could actually accomplish the task.

      3. Tape garbage bags around the hole to be drilled and it keeps the shavings off the bike and away from the carb. (Which should have a rage stuffed in the opening after you remove the boot to let the subframe tilt back)

      4. Get some speed on the bit before entering the hole. Helps reduce the amount of hang up and torquing to a halt on the burs.

      5. I used the SW Motech center stand I have installed on my bike and it worked great. I'd suggest this fine piece of equipment and it's use for regular maintenance.

      6. Just buy the Eager Mikes kit for nothing else other than getting the long cross bolt. On the website choose "kit without bits". Trust me, get your own drill bit set for this. I had all of the parts contained in the Eager Mike's kit except for the M10 7.5" length bolt. I tried to find this bolt all over the net and locally and the closest I came was a special order from the UK and Australia with 2-3 week ship time at $30. For $25 shipped I got the bolt through Eager Mikes shipped in two days.
