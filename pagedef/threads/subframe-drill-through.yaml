    text: |-
      Re: Drill Through Bolt Upgrade: My Experience

      I didn't have a problem with the drill bits supplied by EM. Never overheated, and did their job. You have to drill at a very low speed, that's all. Just takes time and patience.

      Also, since you need to drill through both the subframe and frame, why move the subframe out of the way? The subframe makes for a good jig to keep you drilling straight when you start with the smaller bit. WD-40 worked quite well as cutting oil I found.

      I thought about using a drill bit in between the two sizes supplied by EM, but then I quickly decided that drilling this hole twice is enough!
