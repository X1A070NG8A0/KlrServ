    text: |-
      Re: Drill Through Bolt Upgrade: My Experience

      I moved the subframe out of the way. I used the small bit and then the large bit with no issues. Low speed on my Craftsman 19.2v Li-Ion 1/2" hammer drill (not on hammer setting) and I drilled the frame and subframe holes on one low profile battery. I used some sort of penetrating oil that I had in the garage and it worked pretty well. The bits are still sharp, but I have two Drill Doctors in the garage if I would have managed to mess them up. The only place I got hung up was when the larger bit was entering into the transition from where the smaller bit met from both sides, but that only took a couple of seconds of reversing a couple times and then it ate right through and left me with a nice, straight, clean hole.

      Anyone considering this modification needn't worry about difficulty. It's really easy to do and well worth the peace of mind that your sub frame will be secure forever.
