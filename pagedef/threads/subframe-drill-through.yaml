    text: |-
      Re: Drill Through Bolt Upgrade: My Experience

      When I did this, I used my own bits. Found out the hard way that they were dull and or cheap. Its not a bad idea to get the kit with the bits included, even if you already have a complete drill index...

      Iirc, I used one extra bit to step up between the two sizes EM recommends. Also, I had some trouble getting the 13/32" (or whatever the final bit size is... its been a while and im a burnout..) into the 3/8" chuck of my drill. Def recommend a 1/2 drill but this CAN be done with a decent 3/8ths as long as your 13/32" bit steps down on the chuck side.

      When I finally got the 13/32 drilled thru I noticed there was a very slight "v" in the middle of the hole in the frame. The bolt was a very tight fit bc of this but still was able to seat the bolt by turning clockwise with a ratchet. I was worried at first but the threads did a great job of pulling the bolt all the way to seated.

      Canehdian guy, doesnt look like you were off by much... I think you will be fine especially considering the almost solid metal frame the bolt is going thru now.. good luck
