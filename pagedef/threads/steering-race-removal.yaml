    permalink: https://www.klr650.net/forums/forum/klr650-forums-klr650-net/klr650-maintenance-klr-wrenching-modifications-technical-support/75490-easy-steeering-head-bearing-race-removal?p=1280995#post1280995
    text: |-
      Re: Easy steeering head bearing race removal

      I installed the new races using the old races to drive them in. Lightly tap the new race in untill it stays, then hold the old race up against it and tap it in with a hammer. Tap it in until firmly seated. The race is countersunk when fully seated, so the old race will go into the collar about halfway. I used a set of channellocks to twist the old race back out, but since it is upside down it would be easy to tap it out from the other end.
  - id: 4
    title: 'Easy steeering head bearing race removal: post 4'
    kind: Forum post
    author: Wakasaki
    date: '2010-01-31'
    permalink: https://www.klr650.net/forums/forum/klr650-forums-klr650-net/klr650-maintenance-klr-wrenching-modifications-technical-support/75490-easy-steeering-head-bearing-race-removal?p=1281015#post1281015
    text: |-
      Re: Easy steeering head bearing race removal

      After rereading what you posted I see you were talking about getting the lower bearing onto the shaft. Same idea. To remove the old bearing I cut off the cage holding the rollers and removed them. I then cut a groove into the old race with a dremel to weaken it and whacked it with a chisel to crack it, then twisted it off with channellocks. I tapped the new bearing onto the shaft using the old bearing race turned upside down. Gently tap around it until it is seated all the way down.
