    text: |-
      Re: Easy steeering head bearing race removal

      I didn't have any trouble getting the races out-heated the steering head with a torch. The top race popped out with some prying. The bottom race i used a bent screw driver to get it started-yes it wanted to slip off, but with heat and persistence I was able to get it to move enuf that I could get the big prydriver in there and drive it down with a hammer.

      I am very curious as to your plans for installing the new bearings. I am hung up right now waiting for the correct seals. I am thinking I can use allthread to draw the bearings and races into the steering head, but I am concerned about how I will get the bottom bearing down to the bottom of the steering head without the factory tool....
