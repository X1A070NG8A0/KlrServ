    text: |-
      Re: Easy steeering head bearing race removal

      Doh! After rereading what I originally posted I realized that I did not use the Lower inner bearing race to drive out the upper outer race from the tube. I in fact used the old UPPER inner race, which is just everso slightly larger than the inside diameter of the upper outer race. The tube is just a hair over 1 1/2 inch, and the inner diameter of the upper outer race is almost 1/32 less, leaving a very, very small lip to get a punch on. The socket measures 1 1/2 and barely fits in the tube, yet tried to slip through the race being punched out, which is why I needed to use the old inner race. Maybe I should drink less....
