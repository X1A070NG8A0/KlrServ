  - id: 1
    title: 'Easy steeering head bearing race removal: post 1'
    kind: Forum post
    author: Wakasaki
    date: '2010-01-31'
    permalink: https://www.klr650.net/forums/forum/klr650-forums-klr650-net/klr650-maintenance-klr-wrenching-modifications-technical-support/75490-easy-steeering-head-bearing-race-removal#post75490
    text: |-
      Hey all, in an earlier thread I asked about welding a bead onto the lower steering bearing race in the head tube to remove it. http://www.klr650.net/forums/showthread.php?t=76217

      I got er done last night without welding. I had tried a custom ground punch before, but it would slip off the top of the race, (which I found out after removal has a bevel on top giving my punch no chance). I used a dremel with a cutoff wheel to cut two grooves into the race, across from each other. I cut them horizontally, ie around the inside of the race, like two shelves cut into the race. I made the cuts about 1/3 of the way down from the top. I ground out a recess above the cuts so my punch could get a nice bite. I made the punch from a long square shanked screwdriver, ground to fit into the groove.

      I put the punch down the tube and into a groove, hit it with a two pound hammer a couple times and the whole race moved down enough to get on top of it. I put the punch on top of the bearing and tapped around it a few times and it was out. Easy-peasy. If I had to do this again I think I could cut the grooves and grind the punch in a half an hour or so.

      The upper race looked easy. The inside diameter of the tube is about 1 11/16 inches, the inside of the race is slightly smaller, about 1 1/2inches, giving a slight lip to hit with a punch. Not enough though. The punch would just slip off. So I got creative. I found that the lower inside race,(the one that is pressed onto the bottom of the shaft) was about 1 5/8. Slightly larger than the inside diameter of the upper race, and smaller than the tube. I found a socket measuring just under 1 1/2 inches, put the old lower inside race on top and used an extension to create a tool to drive out the upper race. If I had a slightly larger socket the old race would not have been needed.

      After I found my method, this project was not nearly as difficult as I had thought it would be. Thanks to everyone who responded to the other thread!
