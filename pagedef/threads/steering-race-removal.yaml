      Essentially yes. I did my first race removal since I last posted in this thread. Heat and some modified tools did the trick. For getting the new one seated I cut the old race with a cut off wheel then used it to seat the new race. Cutting the old race removes the tension and allows you to easily remove after seating the new race.
