    text: |-
      Re: First time klr650 owner. Regular maintenance questions.

      If you have the Owners Manual - Read it. All the normal maintenance is in it.

      If you need an owner manual, you can download one from Kawasaki - find the Owner Info area of the website.

      Check out the Maintenance And How-To Procedure section here at KLR650.net.

      Plenty of oil discussions too.

      You want JASO-MA rated oil, as that is stuff that works with our Clutch.

      There are several very good options. I use Rottella 15-40 myself most of the time. But have also used the Valvoline Motorcycle specific oil too. Again, make sure it is the proper JASO rating.

      “Cheap” oil is fine, change it often. No more than 3k miles. The transmission shears the oil in our bikes, which reduces the lubricating properties. Something auto engines do not need to deal with.

      As for the filter, it is normally fine to change every other oil change. 5-6k miles. I order mine in bulk from whoever has the best price online at the time.

      Oh, and be sure to check that your bike has the oil bypass tube in the filter when you do the first change. This tubemust be pulled out and moved to the new filter. All to common to have it thrown away. No bypass tube means no oil filtering- as it is all just flowing through the open bypass.

      Congrats on the new ride. Enjoy.

      TW
