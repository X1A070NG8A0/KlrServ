    text: |-
      Re: Finding oil filters

      I don't know about the cartridge type filters like the KLR uses but the spin-on type moto filters use cardboard endcaps (not a good idea in a hot oily envrionment), out of spec threads and overall shoddy construction. For less money than a Fram you can get a product that is much better.
