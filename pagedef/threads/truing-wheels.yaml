    text: |-
      Tried my hand at truing my front wheel the other day, with mixed results. Managed to eventually get the run-out down to less that factory specs but it could have gone smoother. Anyone know of any good links or tutorials on truing motorcycle wheels? I used to be fairly good with bicycle wheels but the skills don't all seem to transfer.

      Any recommendations for a good spoke wrench? I managed to round off some nipples with the spoke wrench from the OEM tool kit. I notice that some places have little torque wrenches for spoke nipples. How does that work, seems like if you tighten them all to the same torque, your wheel is going to be out of true, as inevitably the tension is going to be a little different from spoke to spoke to pull the rim into true. Or is torquing them all to spec supposed to be a starting point, then true from there?
