    text: |-
      Re: Truing wheels?

      AAlexander,

      Here's the spoke wrench that I've used successfully for building and truing: Kawasaki, Harley, Triumph and Norton wheels.

      Something's gone wrong

      http://www.motorcycle-superstore.com/4679/i/rowe-usa-spoke-wrench

      There may be better wrenches available, but this one has worked well for me.

      When truing a wheel, I always work in pairs. I loosen one spoke and then tighten the opposite spoke using the same amount of rotation used to loosen the mating spoke nipple. I never rotate the nipple more than 1/4-turn at at time.

      Torque is not a good way of tensioning spokes, especially the back wheel where there is typically an offset. An offset wheel will require a greater tension, and thus, a greater torque for the spokes on the "shallow" side.

      But in general, I don't believe torque is worth a hoot for properly tensioning spokes; there are just too many variables relative to friction that throw off the tension. Instead, I simply squeeze pairs of spokes to get an indication of the proper tension by feel and then make adjustments accordingly.

      You can make a truing stand from wood and then clamp it to a bench vice. I use two wood 1" X 4" uprights with V notches for supporting the axle. For the base of the stand I use a 4" X 4" block and attach the 1" X 4" uprights to each end. The length of the uprights and the width of the base should be sized to fit your wheel.

      I clamp the base into the vice with the uprights pointing straight up. Next I install the wheel with the axle laying in the V notches at the top of the uprights. A dial indicator with a magnetic base attached to the vice and the plunger resting against the edge of the wheel rim finishes your home-made truing stand. If you don't have a dial indicator, you can use a length of wire screwed to the stand and the wire bent such that one end of the wire is positioned very near the edge of the rim. You can then spin the wheel and watch for places where the wire rubs the rim.

      This is kind of an abbreviated description of a home-made truing stand, but it should give you an idea of how to build one.

      Remember, make adjustments to the rim by tightening and loosening spokes in pairs and do not rotate more than 1/4 of a turn at a time. Your favorite beer and music helps the process proceed smoothly.

      Good luck!
