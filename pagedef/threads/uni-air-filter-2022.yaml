    text: I’m trying to buy a UNI air filter for a (new to me) 2022 KLR 650. Amazon lists one that fits 1987-2024 models however, UNI doesn’t show one in their online catalog for models past 2018. I’ve spoken with Tom at UNI and he confirms that they don’t make one for Gen 3 bikes. He suggests that they may not have updated their catalog since the Gen 3’s came out but he’s not sure. Does anybody know if all year models use the same filter?
  - id: 2
    title: 'UNI Air Filter for 2022 KLR: post 2'
    kind: Forum post
    author: Glenn
    date: '2025-11-18'
    permalink: https://www.klr650.net/forums/forum/klr650-forums-klr650-net/klr650-maintenance-klr-wrenching-modifications-technical-support/2515213-uni-air-filter-for-2022-klr?p=2515215#post2515215
    text: |-
      They are all the same air filter, for KLR650 all generations, years 1987-2025 and beyond.

      Most companies simply don't update their specifications.

      Unfortunately their company representative is mistaken.

      UNI Part # NU-2378ST

      TwinAir Part # 151602

      Oil filter part number ALL YEARS KLR650 1987-2025+

      HiFloFiltro Part # HF123

      Kawasaki OEM Part # 16099-004
