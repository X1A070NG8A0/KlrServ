    title: 'A few words on fork oil level: post 1'
    kind: Forum post
    author: LeftCoastAdv
    date: '2009-06-17'
    permalink: https://www.klr650.net/forums/forum/klr650-forums-klr650-net/klr650-maintenance-klr-wrenching-modifications-technical-support/66450-a-few-words-on-fork-oil-level#post66450
    text: |-
      Hello all,

      I just installed a set of intiminators and browsed this sub-forum to get any insight before I did. I already have pretty deep knowledge about suspension, but you never know, there may be a hard learned lesson or two that I could benefit from. Thanks to all who asked good questions and those that answered them and contributed to the fantastic knowledge base here.

      One thing that seems to come up over and over, and there seems to be a bit of confusion and bad advice given about, is fork oil level.

      I offer a cursory view of why fork oil level is important and how it affects how the forks work.

      I have an '08 and matching kawi shop manual, so I'll reference that.

      The manual calls for an oil level of 135mm below the top, spring, washer and spacer removed with a tolerance of +/- 2mm. +/- 2 mm is not a lot at all, so that should tell you that oil level is a very precise and very important measurement, not something to be done sloppily or taken lightly. 2mm is less than 1/10 of an inch. Pretty exact.

      The shop manual does say that the fork takes approximately 500ml, but that is no doubt in there to let you know how much to have on hand before you start your service. You CAN NOT fill your forks by measuring the quantity of oil that you put in. You HAVE TO measure from the top. Why? Maybe you didn't get all of the oil out of one or both legs when you drained it. Also, the important measurement is not the quantity of oil, but rather the size of the air space between the top of the oil and the cap on the top of the fork leg (more on this below).

      Also, you can not measure how much oil came out and just replace that amount. By way of example, my left fork had about 100ml LESS oil than my right leg did, and neither was close to 135mm from the top. Chalk one up to the QC at the factory. Same guy that greases the swingarm bearings probably fills the forks too. No wonder the forks were so squishy stock, and constantly bottomed out. This is on a 1 year old, 3500 mile bike.

      Doing the Intiminator install, after you've purged all of the old oil out and let them drain for a while, I suggest that you pour a little fresh 5wt oil in there to rinse them. You'll have plenty of extra oil- 1 bottle is not quite enough for both legs, so you had to buy 2 bottles, leaving you with almost a full bottle extra. Pour in ~200ml or so and pump the leg a few times to rinse the metal dust out. Pump and drain them again, you'll be amazed at how much powdered metal comes out, plus it will flush out the remaining thicker stock oil from the factory.

      Then, pour about 400ml of oil in the leg and pump it to release trapped air from the damping circuit. Let it sit for a few minutes for any bubbles to rise to the surface, then put the Intiminator in. You have to use the spring and spacer to push it through the oil to the bottom, then hold it there and pump the fork a few more times to release any air that got trapped under it.

      Remove the spring and spacer, compress the fork all the way to the bottom, THEN measure 135mm from the top and add oil as needed.

      I've seen suggestions in this sub-forum to measure the oil level BEFORE you put the Intiminator in. This is incorrect. The shop manual calls for the oil level to be set with the spring, washer and spacer removed. The intiminator cartridge will of course displace oil when it goes in, so if you measure 135 THEN add it, your oil level will be way too high- 30 or 40mm I would guess. Again, with a tolerance of +/- 2mm, this would put you way, way out of spec.

      The reason that it's important to measure the air space above the oil is this.

      All forks are by design, "progressive". They have 2 springs- one is the metal coil spring, and the other is that air space trapped above the oil, below the cap, that gets "stiffer" the more you compress it. As the fork compresses, the oil level rises in the tube, compressing that air space (gasses compress, liquids do not).

      That air spring gets very firm just before the fork bottoms out, which is what keeps it from bottoming out.

      No doubt very complex calculations were done by very smart Japanese engineers to determine exactly how much oil needs to be in there to give the correct volume air spring that will compress just enough to prevent bottoming out, but not give a harsh ride at the bottom of the travel. I trust them.

      Hope someone can find this info useful.
