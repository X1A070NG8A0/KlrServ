    title: 'A few words on fork oil level: post 10'
    kind: Forum post
    author: LeftCoastAdv
    date: '2009-10-14'
    permalink: https://www.klr650.net/forums/forum/klr650-forums-klr650-net/klr650-maintenance-klr-wrenching-modifications-technical-support/66450-a-few-words-on-fork-oil-level?p=1222417#post1222417
    text: |-
      Re: A few words on fork oil level

      > grtfshrmn wrote: Originally posted by grtfshrmn
      >
      > My 2008 KLR 650 feels really top heavy or turns like a chopper. Is there some adjustments or specs I should check to make the slow tight turns easier and not feel like I am going to drop it. I have dropped it several times in the dirt trying to make turns. Had another guy that is very experienced try it and he almost went over.
      >
      > Thanks in advance.

      Hi Wayne,

      Good question. There are probably a couple of suspension and set-up related things you could do, but I wouldn't recommend doing any of them. Suspension and set-up are always compromises. If you make the bike handle better at extreme low speeds, it'll probably make it handle terribly at speed. Unless you spend a majority of time poking along, I'd leave it alone.

      I know exactly what you're talking about regarding the slow speed handling. I think there are 3 things that cause it (at least).

      One, is that the bike is very heavy.

      Second, is that that weight is mostly up really high. With a 6 gallon gas tank and you sitting up on the tall bike, it's very top heavy.

      Third, is that the suspension, especially up front, is really soft and mushy.

      Instinctively when we ride slowly and turn, or go over bumps or rocks, etc, the weight of the bike is pushed off balance, and we make adjustments consciously or unconsciously to shift that balance back to center. You move your hips, your shoulders, your knees, your head, elbows, whatever, back and forth to re-establish balance. Push or pull on each side of the handlebar. In addition, you sometimes gently blip the throttle to momentarily make the front a little lighter, or cut the throttle or use the rear brake to make the front heavier and you do all that stuff simultaneously. The more experienced you get the less you're aware of it, it just happens.

      The problem is that with those mushy forks, most of that effort just gets absorbed and not transferred to the bike, so you push a little harder or shift your weight a little more and all of a sudden the suspension loads up, pushes back and really throws you off balance.

      An obvious fix would be to put stiffer springs up front so the bike is stiffer and more predictable, but again, that'll have the unintentional effect of changing the handling a lot at all speeds, maybe not for the better. I think this is the reason the intiminators (to keep it on topic...) are so popular. They add a lot of damping to the hydraulic circuit and give the impression that the forks are stiffer, but when you go faster and hit a bump, they release and you get your plush ride back just when you need it. Cartridge emulators kind of do the same thing. Have you installed anything like that?

      One thing I can recommend, technique-wise, is that when you ride slowly or over uneven ground, stand up on the pegs on the balls of your feet, knees slightly bent. When you are sitting down on the seat, your mass and the bike's mass become one, and you compound the top-heavyness of the bike. If you're up off the seat, your weight and the bike's weight can go in different directions, and it makes it very easy to make radical weighting changes to make up for bumps or lost traction, etc.

      I appreciate that your experienced friend had troubles with the balance of the bike as well, but it could just be that he's not used to your bike, and it's weighting, or more likely, that his brain and muscles have memorized the characteristics of his bike, so when he subconsciously tried to apply that to your bike, it didn't work.

      My best recommendations are to think about doing something to stiffen up the front end (that won't sacrifice high speed handling, like Intiminators or cartridge emulators), but more importantly, just practice riding your bike slowly a lot, to train your brain and muscles how to react when they need to.

      A lot of it is having the strength in your torso, hips and arms to be able to muscle that bike back and forth when you need to, and that also only comes with practice and riding a lot.

      I'll sometimes go months without riding the KLR, just because I'm busy riding other bikes, or it's over 100 degrees every day in the summer and too damned hot to ride, etc, and before I use it to go on a trip or a ride in the back country, I always do at least 30 minutes of slow riding, making turns, going over curbs and rocks, etc just to re-train myself about it's handling and wake those muscles back up.

      Have you ever seen guys on racing bicycles at stop lights doing "track stands", where they're stopped but rocking the bike forwards and backwards gently to maintain balance, or if they're really good, just stopped there perfectly still waiting for the light to change? They do it so they don't have to unclip their shoes from their pedals. That's the extreme example of what I'm talking about. Complete control over their weight and the bike's weight and the ability to make constant micro-changes to maintain balance. That only comes with a lot of practice.

      Hope it helped-
