      Re: A few words on fork oil level

      > Hamilton.Cooper wrote: Originally posted by Hamilton.Cooper
      >
      > And THIS is why we were saying to get the most reliable measure, is to just do it right and take the damn things off. It is only 10 bolts... srsly guys? Also you should replace the fluid while you're at it (unless you just did). It breaks down fairly quick with heavy riding and is pretty cheap.

      'Just taking the damn things off' can become a monumental pain in the ass while working your way through at least the initial set-up of a suspension, which will often involve experiments with different fork oil levels.

      I know I went through that process a few times during the evolution of my KLR's suspension, and I have a 2006 that has fork drain holes. With a 2008, I believe I'd be buying/or making the adjustable, centered-in-the fork suction tool to quickly and easily make up-and-down adjustments to the fork oil level.

      Of course, just changing the oil on the 2008s and beyond requires getting familiar with all those extra bolts . . .
