    text: |-
      Re: A few words on fork oil level

      > Blackheart wrote: Originally posted by Blackheart
      >
      > OR, you could fashion a spacer that keeps the fill/suction line in the center of the fork tube, because the fluid level at the center of the tube of a nearly verticle fork (such as when the bike is on level ground), will be equal to the level of the fluid in a verticle positioned tube. But, as previously mentioned, the level is a tuning starting point, and exactness isn't necessary.

      OR you could make a simple dipstick from a 12-pack beverage box; an elongated T-shape with the dipstick 'blade' width the same as the fork's inner diameter. Mark the lengthwise center line of the blade with a ball point and put a cross at the depth of oil you are looking for.

      Now all you need to do is slide the dipstick into the compressed fork, holding it perpendicular to the angle of the fork. The oil level will show up on the dipstick at an angle but the actual depth of the oil (as measured with the fork held vertically) is at the point where the oil level crosses the lengthwise center line.

      For those having a hard time visualizing this, get a long tall beverage glass, fill it half full and then tilt the glass as if it were a fork tube - you will see that the actual level always remains at the half full mark at the center line of the glass, no matter the tilt.
