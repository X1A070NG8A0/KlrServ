      Another great reply LCA.

      I have been riding my 08 for just over a year & for a while dropped it on nearly every ride (off road of course). I found that as soon as it was a little off balance - timmmmmber...

      I suspected the same reasons that LCA stated.

      I began trying a few things such as only 1/2 filling the tank for shorter rides or when I knew there would be gas after a technical section. Also worked on my abs as I always seemed to hurt my back trying to muscle back up to the balance point. The best thing was watching the Dualsport technique DVD & practising their handling skills & drills.

      Nowadays I can go out riding & really lean the bike over sideways without it falling over simply by 'knowing' what it's likely to do & counteracting with body positioning.

      Where I once was getting really frustrated with it, I now am more in tune with it & have a lot more fun & a lot less painkillers.
