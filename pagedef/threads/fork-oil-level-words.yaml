    text: |-
      Re: A few words on fork oil level

      > lashl wrote: Originally posted by lashl
      >
      > The intiminator instructions say to fill the fork when it is vertical. What level would you set it to when it is still on the bike? Also do you measure from the rear of the fork top (where it would be higher than if you measured from the front) or what?? My KLR is a 2003 and thanks for any help.

      It is because of that inaccuracy that you fill the fork standing up. You have to have it out of the bike in order to drain the oil, well on the 08+ anyway, so may as well fill it at the same time?

      The critical thing is that the level in both forks is the same or it can lead to differing fork action from left to right, so if you could draw the oil out from the same point on each fork it would reduce inaccuracy.

      One way would be a turkey baster with a zip-tie around it or a 20ml syringe and a short tube on the end cut to length. Over fill the forks and then suck it down to as close to the stated level as you can.
