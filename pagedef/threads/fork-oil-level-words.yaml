      OR, you could fashion a spacer that keeps the fill/suction line in the center of the fork tube, because the fluid level at the center of the tube of a nearly verticle fork (such as when the bike is on level ground), will be equal to the level of the fluid in a verticle positioned tube. But, as previously mentioned, the level is a tuning starting point, and exactness isn't necessary.
  - id: 20
    title: 'A few words on fork oil level: post 20'
    kind: Forum post
    author: Gruf Rude
