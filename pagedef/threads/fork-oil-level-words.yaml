      Re: A few words on fork oil level

      > fixer wrote: Originally posted by fixer
      >
      > no coffee yet and i didn't get any sleep last night, so i could very well be misrembering any of those numbers.

      Then, with all due respect, why did you post? My post was intended to clear some very muddy water. Posts like yours with guesses, "IIRC" and misinformation are the reason that people get confused and have trouble with their installations.

      Have your and go re-read the third paragraph of my post. I referenced the '08 installation, which calls for 135mm of air space.

      You have an older bike than that, so your numbers may be correct as well, but have no bearing on what I've written.

      Certainly, most people reading this are intelligent enough to find out the proper oil level for their forks, and substitute that number (and by "find out", I mean go and look at a factory shop manual, don't rely on the "IIRC" crowd to guess for you).

      The entire point of my post, is that oil level is very important, not a loosey-goosey guess as you've implied. People very familiar with suspension, with experience tuning suspension should play with their oil level. Those people already know everything that I've written, so my post was not targeted at them.

      Those who are doing this kind of work for the first time, perhaps confused as to why their forks aren't working as they should after the install would do well to do it by the book. That, and that alone was my point.

      This is from the instructions included with the Intiminators, which you probably would have read had you done the install yourself:

      5. Hold the fork vertical and add fork oil... Cycle the fork slowly without the Intiminator installed to bleed any air.

      6. Install the intiminators and set the oil height.

      7. Install the fork spring, washer and spacer.

      psdeavers' scan of a different part of the install sheet states this as well (thanks for that scan and post!)

      Unless you or others have useful additions or corrections to what I've written, I'd like to keep this thread clear and easy to read and understand.

      Thanks in advance.
