title: "Chapter 12: Front Suspension and Steering"
pages:
  - id: handlebar
    title: "Handlebar"
    kind: Section
    pdf_pages: [261, 263]
    summary:
      - {t: "To change the riding position only, loosen the lower holder cap bolts. Tilt the handlebar and tighten the bolts again.", cite: {p: 261}}
    ops: [c12-handlebar-removal, c12-handlebar-disassembly, c12-handlebar-inspection]
  - id: steering-stem-and-head
    title: "Steering stem and head"
    kind: Section
    pdf_pages: [263, 268]
    summary:
      - {t: "The steering stem pivots in the steering head on tapered roller bearings. The bearings are at the top and the bottom of the steering stem.", cite: {p: 263}}
      - {t: "Do not remove the inner races in the frame or the lower bearing on the steering stem unless they need replacement.", cite: {p: 263}}
      - {t: "Do the steering play check before you disassemble the steering head.", cite: {p: 263}}
    ops: [c12-steering-head-disassembly, c12-steering-head-inspection, c12-steering-race-replacement, c12-steering-stem-bearing-replacement, c12-steering-head-assembly, c12-steering-play-check, c12-steering-bearing-lubrication]
  - id: fork-removal-and-installation
    title: "Fork removal and installation"
    kind: Section
    pdf_pages: [268, 269]
    summary:
      - {t: "Release the air pressure from both fork legs before you remove them. You can drain the fork oil at this time or when you disassemble the legs.", cite: {p: 268}}
    ops: [c12-fork-removal, c12-fork-installation]
  - id: fork-service
    title: "Fork service"
    kind: Section
    pdf_pages: [270, 278]
    summary:
      - {t: "The fork service procedures need special tools. Rebuild one fork leg before you rebuild the other. Do not mix the parts of the two legs.", cite: {p: 270}}
    ops: [c12-fork-disassembly, c12-fork-inspection, c12-fork-assembly]
