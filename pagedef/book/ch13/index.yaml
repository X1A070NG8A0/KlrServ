title: "Chapter 13: Rear Suspension"
pages:
  - id: link-type-suspension-system
    title: "Link-type suspension system"
    kind: Section
    pdf_pages: [279, 279]
    summary:
      - {t: "The link suspension has a swing arm, one shock absorber and a linkage of three parts. The linkage connects the lower end of the shock absorber to the swing arm.", cite: {p: 279}}
      - {t: "When the swing arm moves more, the linkage pivots and increases its leverage on the shock absorber. The damping action becomes progressively firmer.", cite: {p: 279}}
    ops: []
  - id: shock-absorber
    title: "Shock absorber"
    kind: Section
    pdf_pages: [279, 282]
    summary:
      - {t: "The shock absorber is a spring-loaded, hydraulically damped unit with an integral oil and nitrogen reservoir. You cannot rebuild the damper.", cite: {p: 279}}
    ops: [c13-shock-absorber-removal, c13-shock-absorber-inspection]
  - id: shock-absorber-linkage
    title: "Shock absorber linkage"
    kind: Section
    pdf_pages: [282, 287]
    summary:
      - {t: "The shock linkage has a lever, two lever arms, pivot bolts, seals, pivot spacers and needle bearings. The lever arms join the lever to the swing arm.", cite: {p: 282}}
      - {t: "Disassemble and lubricate the linkage at the intervals in Chapter Three. Use molydisulfide grease or waterproof grease.", cite: {p: 282}}
    ops: [c13-lever-removal, c13-lever-arm-inspection, c13-lever-inspection, c13-linkage-lubrication]
  - id: swing-arm
    title: "Swing arm"
    kind: Section
    pdf_pages: [287, 289]
    summary:
      - {t: "You can examine the swing arm bearings with the swing arm on the motorcycle. If the bearings have play or roughness, remove the swing arm and examine the bearings and the pivot parts.", cite: {p: 287}}
      - {t: "If you will remove the linkage parts, loosen all pivot bolts before you remove the swing arm.", cite: {p: 287}}
    ops: [c13-swing-arm-bearing-check, c13-swing-arm-removal]
  - id: swing-arm-service
    title: "Swing arm service"
    kind: Section
    pdf_pages: [289, 294]
    summary:
      - {t: "Use molydisulfide grease or waterproof grease on the swing arm bearings. Kawasaki recommends molydisulfide grease.", cite: {p: 289}}
      - {t: "Do not remove the bearing pivot spacers until you will examine the bearings. Replace the bearings with a press or with a drawbolt and hand tools.", cite: {p: 290}}
    ops: [c13-swing-arm-inspection, c13-swing-arm-bearing-replacement]
  - id: shock-absorber-adjustment
    title: "Shock absorber adjustment"
    kind: Section
    pdf_pages: [294, 295]
    summary:
      - {t: "You can adjust the spring preload and the rebound damping with the shock absorber on the motorcycle.", cite: {p: 294}}
    ops: [c13-shock-preload-adjustment, c13-rebound-damping-adjustment]
