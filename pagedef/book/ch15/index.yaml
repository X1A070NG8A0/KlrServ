title: "Chapter 15: Body"
pages:
  - id: side-covers
    title: "Side covers"
    kind: Section
    pdf_pages: [327, 328]
    summary:
      - {t: "This chapter gives the removal and installation procedures for the body parts. Do not use too much force on the bodywork. It is flexible, but it changes color when it is bent or pinched too much.", cite: {p: 327}}
      - {t: "A friction barb on each side cover goes into a grommet. Screws hold the front and rear of the cover.", cite: {p: 327}}
    ops: [c15-side-covers]
  - id: seat
    title: "Seat"
    kind: Section
    pdf_pages: [327, 328]
    summary:
      - {t: "One bolt on each side holds the seat. The front of the seat engages the fuel tank.", cite: {p: 327}}
    ops: [c15-seat]
  - id: fuel-tank
    title: "Fuel tank"
    kind: Section
    pdf_pages: [328, 328]
    summary:
      - {t: "You remove the fuel tank toward the rear of the motorcycle. The fuel hose and the vacuum hose connect to the fuel valve assembly.", cite: {p: 328}}
    ops: [c15-fuel-tank, fuel-hose]
  - id: radiator-covers
    title: "Radiator covers"
    kind: Section
    pdf_pages: [328, 329]
    summary:
      - {t: "The left cover shrouds the radiator. The right cover shrouds the coolant reserve tank. You can remove the covers with the fuel tank.", cite: {p: 328}}
      - {t: "If the covers stay attached to the fuel tank, support the tank after removal. Do not let the tank rest on the flexible covers.", cite: {p: 328}}
    ops: [c15-radiator-covers]
  - id: skid-plate
    title: "Skid plate"
    kind: Section
    pdf_pages: [329, 329]
    summary:
      - {t: "Three bolts and collars attach the skid plate to the frame. In rough terrain, examine the skid plate often.", cite: {p: 329}}
      - {t: "For rough conditions, Clymer suggests a metal aftermarket skid plate.", cite: {p: 329}}
    ops: []
  - id: front-fender
    title: "Front fender"
    kind: Section
    pdf_pages: [329, 329]
    summary:
      - {t: "Four bolts and washers attach the front fender to the fork.", cite: {p: 329}}
    ops: []
  - id: fairing
    title: "Fairing"
    kind: Section
    pdf_pages: [329, 329]
    summary:
      - {t: "The frame holds the fairing. The fairing contains the headlight and the turn signals.", cite: {p: 329}}
      - {t: "A larger aftermarket windshield gives more coverage. It has more risk of damage in off-road use.", cite: {p: 329}}
    ops: [c15-fairing]
  - id: subframe
    title: "Subframe"
    kind: Section
    pdf_pages: [330, 330]
    summary:
      - {t: "The subframe is the rear part of the frame. To remove it, disconnect the muffler, the battery, and all hoses and wires that go to the rear.", cite: {p: 330}}
    ops: [c15-subframe]
