title: "Chapter 6: Clutch, Gearshift Linkage and Lubrication System"
pages:
  - id: right-crankcase-cover
    title: "Right crankcase cover"
    kind: Section
    pdf_pages: [149, 152]
    summary:
      - {t: "This chapter gives the service procedures for the parts on the right side of the engine crankcase. These are the right crankcase cover, the clutch, the gearshift linkage, the oil pump and the primary drive gear.", cite: {p: 149}}
      - {t: "The right crankcase cover holds the crankshaft oil seal, the clutch release lever, the relief valve and the oil filter housing.", cite: {p: 151}}
    ops: [c06-right-crankcase-cover, c06-right-crankcase-cover-inspection]
  - id: clutch
    title: "Clutch"
    kind: Section
    pdf_pages: [152, 158]
    summary:
      - {t: "The clutch has an outer housing and a clutch hub. Friction plates and clutch plates lock alternately to these two parts. The clutch springs engage the plates. A cable-operated release lever and a lifter disengage them.", cite: {p: 152}}
      - {t: "The clutch runs in the engine oil. Do not add oil additives, because they can cause poor clutch operation.", cite: {p: 152}}
      - {t: "On 1996-on models, the clutch has eight friction plates and seven clutch plates.", cite: {p: 152}}
    ops: [c06-clutch-removal, c06-clutch-inspection, c06-clutch-installation]
  - id: external-gearshift-linkage
    title: "External gearshift linkage"
    kind: Section
    pdf_pages: [159, 161]
    summary:
      - {t: "The external gearshift linkage is behind the right side cover. The clutch partly covers it. You can examine the shift shaft assembly without removal of the clutch.", cite: {p: 159}}
    ops: [c06-gearshift-linkage-removal, c06-gearshift-linkage-inspection, c06-gearshift-linkage-installation]
  - id: oil-pump
    title: "Oil pump"
    kind: Section
    pdf_pages: [161, 164]
    summary:
      - {t: "The engine is a wet-sump engine. It keeps the engine oil in the crankcase. Oil goes from the crankcase oil strainer to the oil pump. The pump sends the oil under pressure through the oil filter to the engine parts.", cite: {p: 161}}
      - {t: "After the oil passes a lubrication point, it falls to the crankcase. A gear on the end of the crankshaft drives the oil pump.", cite: {p: 161}}
    ops: [c06-oil-pump-removal, c06-oil-pump-service]
  - id: primary-drive-gear
    title: "Primary drive gear"
    kind: Section
    pdf_pages: [164, 165]
    summary:
      - {t: "The primary drive gear nut is very tight. Hold the crankshaft with a rotor holder tool or with a jam gear to loosen the nut.", cite: {p: 164}}
    ops: [c06-primary-drive-gear-removal, c06-primary-drive-gear-installation]
  - id: clutch-cable-replacement
    title: "Clutch cable replacement"
    kind: Section
    pdf_pages: [166, 166]
    summary:
      - {t: "To replace the clutch cable, remove the lever assembly at the handlebar and the cable at the release lever. Adjust the clutch cable after you install the new cable.", cite: {p: 166}}
    ops: [c06-clutch-cable-replacement]
  - id: kickstarter
    title: "Kickstarter"
    kind: Section
    pdf_pages: [166, 166]
    summary:
      - {t: "The KLR650 does not come with a kickstarter as standard. A kickstarter kit is available from a Kawasaki dealer. The engine cases are bored and threaded for the kit parts.", cite: {p: 166}}
    ops: [c06-kickstarter-idle-gear]
