# Source registry. Every datum in data/ cites one of these ids plus a PDF page
# number (1-based, as the PDF viewer counts), e.g. {s: clymer, p: 88}.
#
# Conflict rule (set by the owner, 2026-11-16): the bike is a 2006 gen-1
# KLR650. Clymer is the only manual covering 2003-2006, so where sources
# disagree Clymer is shown first, checked against klr650.net consensus, and
# the Kawasaki value is shown beside it with a conflict flag.

clymer:
  title: "Clymer Kawasaki KLR650 1987-2006 (M474-2, 2nd ed., May 2006)"
  short: "Clymer"
  file: "doc/Clymer Kawasaki KLR650, 1987-2006 -- Bogart, Jay -- 2 edition, May 30, 2006 -- Overland Park, Kan_ _ Prism Business Media -- isbn13 9781599690490 -- 9a77ead438f74361b9e6771935b0c42e -- Anna’s Archive.pdf"
  text: "doc/text/clymer"
  covers: "1987-2006"
  rank: 1
  # printed page = PDF page - 12 for the body (PDF 13-330); index and
  # wiring diagrams follow.
  printed_offset: -12
  printed_range: [13, 330]

kaw-supp:
  title: "Kawasaki KLR650/KLR500 Service Manual Supplement (incl. 2000-2001 and 2002 model supplements)"
  short: "Kawasaki 650 supplement"
  file: "doc/Kawasaki KLR500 650 Motorcycles Service Manual PDF.pdf"
  text: "doc/text/kawasaki-klr650-supplement"
  covers: "1987-2002"
  rank: 2
  # printed labels are chapter-page (e.g. 1-6); see doc/text/kawasaki-klr650-supplement/labels.tsv
  note: "Only describes what differs from the KLR600; everything else defers to the KLR600 base manual (P/N 99924-1050-01). See PDF p6."

kaw-600:
  title: "Kawasaki KLR600 Service Manual (P/N 99924-1050-01)"
  short: "Kawasaki KLR600 base"
  file: "doc/KLR600manual.pdf"
  text: "doc/text/kawasaki-klr600"
  covers: "KLR600 (base procedures shared with KLR650)"
  rank: 3
  note: "Scanned without a text layer; doc/text for this source is Tesseract OCR and is unverified until checked against the page image."

# Community sources live in pagedef/threads/<slug>.yaml with URL, author,
# date and the text of each post. Cite them as {s: forum, id: <slug>, post: <n>}.
