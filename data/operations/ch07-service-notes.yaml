operations:
  - id: c07-snap-ring-installation
    title: "Snap ring and transmission part handling"
    system: "Transmission and internal shift mechanism"
    source: clymer
    chapter: 7
    section: "07/service-notes"
    summary: {t: "These notes apply to all work on the transmission shafts. Keep each part in its original position and direction. Always install new snap rings.", cite: {p: 169}}
    parts:
      - {name: "Snap rings", replace: always, cite: {p: 169}, note: "Snap rings fatigue and distort when you remove them. Do not use them again."}
    sections:
      - title: "Before you disassemble"
        steps:
          - {t: "Split the crankcase to remove the transmission and the shift assemblies.", cite: {p: 168}, ref: "05/crankcase"}
          - {t: "Keep the gears, washers and snap rings in the same direction as before disassembly.", cite: {p: 169}}
          - {t: "As you remove the parts, put them on a long dowel or screwdriver. Or put an identification mark on each part to show its position and direction.", cite: {p: 169}}
      - title: "Snap ring installation"
        steps:
          - {t: "Hold the closed side of the new snap ring with pliers.", cite: {p: 169}, figs: [3]}
          - {t: "Spread the open side with snap ring pliers.", cite: {p: 169}, figs: [3]}
          - {t: "Hold the spread ring with both tools. Slide it over the shaft and into position.", cite: {p: 169}}
          - {kind: note, t: "Use this method also to remove the notched type of snap ring. This type of snap ring can bind and grip the shaft when you remove it.", cite: {p: 169}}
          - {t: "Examine the inner and outer edges of each snap ring. A snap ring usually has one round edge and one sharp edge.", cite: {p: 169}, figs: [4]}
          - {t: "If the snap ring has a sharp edge, install it in the same direction as the removed snap ring.", cite: {p: 169}}
          - {t: "If the snap ring has no sharp edge that you can identify, install it in either direction.", cite: {p: 169}}
          - {t: "If the shaft has splines, put the gap of the snap ring over a groove in the shaft.", cite: {p: 169}, figs: [5]}
          - {t: "If a spline washer is next to the snap ring, put the teeth of the spline washer out of line with the ends of the snap ring.", cite: {p: 169}, figs: [6]}
