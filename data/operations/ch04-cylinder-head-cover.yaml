operations:
  - id: c04-cylinder-head-cover
    title: "Cylinder head cover removal and installation"
    system: "Engine top end"
    source: clymer
    chapter: 4
    section: "04/cylinder-head-cover"
    summary: {t: "This procedure removes the cylinder head cover from the left side of the engine and installs it again. The cover goes over the cam chain and the sprockets.", cite: {p: 94}}
    spec_refs: ["top-end-torque:Cylinder head cover bolts", "top-end-torque:Upper engine mounting bolts"]
    parts:
      - {name: "Cylinder head cover gasket", replace: inspect, cite: {p: 94}, note: "Clean the gasket. The gasket has plugs that seal the left side of the cylinder head."}
      - {name: "Cover bolt O-rings", replace: inspect, cite: {p: 94}, note: "Replace the O-rings if they are not in good condition."}
      - {name: "RTV silicone sealant", replace: consumable, cite: {p: 94}}
      - {name: "Dielectric grease", replace: consumable, cite: {p: 95}}
    sections:
      - title: "Removal"
        steps:
          - {t: "Support the motorcycle so that it is stable and secure.", cite: {p: 92}}
          - {t: "Remove the fuel tank.", cite: {p: 92}, ref: "15/fuel-tank"}
          - {t: "Remove the radiator covers.", cite: {p: 92}, ref: "15/radiator-covers"}
          - {t: "Disconnect the fan switch wire.", cite: {p: 92}, figs: [7]}
          - {t: "Remove the wires from the retainers.", cite: {p: 92}, figs: [8]}
          - {t: "Remove the fan mounting bolts. Secure the fan out of the way.", cite: {p: 92}, figs: [8], ref: "10/radiator-and-fan"}
          - {t: "Remove the coil and the leads from the coolant temperature switch and the spark plug.", cite: {p: 92}, figs: [9]}
          - {t: "Remove the bolts that hold the upper engine mounting.", cite: {p: 92}, figs: [10]}
          - {t: "Tape the wires and cables temporarily to the frame to get the maximum clearance.", cite: {p: 94}}
          - {t: "Remove the rubber mounts that support the fuel tank.", cite: {p: 94}, figs: [11]}
          - {t: "Loosen the four cover bolts.", cite: {p: 94}, figs: [11]}
          - {t: "Raise the cylinder head cover. Separate the gasket from the cover. This gives more clearance when you remove the cover.", cite: {p: 94}}
          - {t: "Tilt the left side of the cover up. Remove the cover out of the left side of the engine and over the cam chain and sprockets.", cite: {p: 94}, figs: [12]}
          - {kind: note, t: "On 1996-on models, there is little clearance because the cover must also pass over the upper chain guide (A). Earlier models have a smaller guide in the cover.", cite: {p: 94}, figs: [12]}
          - {t: "If you must measure or adjust the valve clearance, do that procedure now. If valve adjustment is necessary, remove the camshafts.", cite: {p: 94}, op: valve-clearance}
      - title: "Installation"
        steps:
          - {t: "Clean the gasket and the gasket surfaces on the cylinder head and on the cover.", cite: {p: 94}}
          - {t: "Apply RTV silicone sealant to the gasket surface on the left side of the cylinder head. This helps to seal the plugs that are part of the gasket.", cite: {p: 94}, figs: [12]}
          - {t: "Install the gasket on the cylinder head. Seat the cover on the gasket.", cite: {p: 94}}
          - {t: "Make sure that the O-rings on the cover bolts are in good condition. Replace damaged O-rings.", cite: {p: 94}}
          - {t: "Install the cover bolts. The left bolts go into the camshaft caps.", cite: {p: 94}}
          - {t: "Tighten the cover bolts to the specified torque.", cite: {p: 94}, spec_ref: "top-end-torque:Cylinder head cover bolts"}
          - {kind: caution, t: "Do not tighten the cover bolts too much. This can cause damage.", cite: {p: 94}}
          - {t: "Tighten the upper engine mounting bolts to the specified torque.", cite: {p: 94}, spec_ref: "top-end-torque:Upper engine mounting bolts"}
          - {t: "Clean all electrical connections. Apply dielectric grease when you connect them.", cite: {p: 95}}
