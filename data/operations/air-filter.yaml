id: air-filter
title: "Air filter cleaning, lubrication and housing drain"
system: "Fuel and air intake"
source: clymer
chapter: 3
section: "03/periodic-lubrication"
summary:
  t: "The engine has a foam air filter that you can use again. Do not operate the motorcycle without the filter or with a damaged filter. Performance does not get better, and the engine wears quickly."
  cite: {p: 66}
spec_refs:
  - "fluids:Air filter"
parts:
  - {name: "Foam air filter", replace: inspect, cite: {p: 88}, note: "Table 1: replace the filter every 5 cleanings. Do not operate with a damaged filter."}
  - {name: "Foam air filter oil", replace: consumable, spec_ref: "fluids:Air filter", cite: {p: 89}}
  - {name: "Lithium grease (filter lip)", replace: consumable, cite: {p: 66}}
  - {name: "Air filter housing cover gasket", replace: inspect, cite: {p: 66}}
sections:
  - title: "Air filter cleaning and lubrication"
    steps:
      - {t: "Remove the right side cover.", cite: {p: 66}, ref: "15/side-covers"}
      - {t: "Remove the screw and the cover from the air filter housing.", cite: {p: 66}, figs: [31]}
      - {t: "Remove the retaining bolt and the washer from the air filter assembly.", cite: {p: 66}, figs: [32]}
      - {t: "Remove the air filter assembly.", cite: {p: 66}, figs: [32]}
      - {t: "Remove the frame from the air filter.", cite: {p: 66}}
      - {t: "Wash all parts in solvent (kerosene), a commercial filter wash or hot soapy water.", cite: {p: 66}}
      - {t: "Squeeze the cleaner out of the filter. Do not twist the filter. It can tear.", cite: {p: 66}}
      - {t: "Shake out the remaining particles.", cite: {p: 66}}
      - {t: "Let the filter dry fully.", cite: {p: 66}}
      - {t: "Put filter oil on the filter. Squeeze the filter so that the oil spreads evenly. Then squeeze out the extra oil.", cite: {p: 66}}
      - {t: "Wear disposable gloves or use a plastic bag. Obey the instructions of the oil manufacturer.", cite: {p: 66}}
      - {kind: note, t: "Use oil made for foam filters. This oil stays on the foam and traps dust well.", cite: {p: 66}}
      - {t: "Install the frame into the filter, under the foam lip.", cite: {p: 66}, figs: [34]}
      - {t: "Put lithium grease around the filter lip. The grease helps the filter to seal against the housing.", cite: {p: 66}}
      - {t: "Clean the housing and the sealing surface of the filter.", cite: {p: 66}}
      - {t: "Make sure that the drain in the bottom of the housing is open.", cite: {p: 66}}
      - {t: "Clean the housing cover.", cite: {p: 66}}
      - {t: "Examine the gasket of the housing cover. The gasket seals the cover and decreases cover vibration.", cite: {p: 66}, figs: [35]}
      - {t: "Install the filter on the frame with the washer and the retaining bolt.", cite: {p: 66}}
      - {t: "Put the assembly into the housing. Make sure that it is fully seated, then tighten the bolt.", cite: {p: 66}}
      - {t: "Install the cover. Put the tab on the right side of the cover into the housing.", cite: {p: 66}}
      - {t: "Install the screw of the cover.", cite: {p: 66}}
      - {t: "Install the right side cover.", cite: {p: 66}, ref: "15/side-covers"}
  - title: "Air filter housing drain"
    steps:
      - {t: "After you oil the filter, regularly examine the housing drain, behind the rear brake pedal. Look for extra oil that drained from the filter.", cite: {p: 67}, figs: [36]}
      - {t: "If there is oil in the reservoir, remove the plug from the drain hose and let the oil drain.", cite: {p: 67}, figs: [36]}
      - {kind: note, t: "The drain hose does not attach to the drain hole that you can see in the air filter housing. It attaches to a fitting in the housing duct, near the air filter.", cite: {p: 67}}
