operations:
  - id: c13-lever-removal
    title: "Lever and lever arm removal and installation"
    system: "Rear suspension"
    source: clymer
    chapter: 13
    section: "13/shock-absorber-linkage"
    summary: {t: "This procedure removes the lever and the lever arms of the shock linkage and installs them again. You do not need to remove the swing arm or the rear wheel.", cite: {p: 283}}
    spec_refs: ["rear-suspension-torque:Lever arm bolts", "rear-suspension-torque:Lever-to-frame bolt"]
    parts:
      - {name: "Molydisulfide grease or waterproof grease", replace: consumable, cite: {p: 282}, note: "Kawasaki recommends molydisulfide grease for all linkage bearings. Waterproof grease is also correct."}
      - {name: "Pivot bolts and nuts", replace: inspect, cite: {p: 285}, note: "Replace parts that have rounded flats."}
    sections:
      - title: "Removal"
        steps:
          - {kind: note, t: "Note the direction of each bolt that you remove. Install the bolts in their original direction.", cite: {p: 284}}
          - {kind: caution, t: "Do not remove the pivot spacers and do not let them slide out of the bearings. The rollers of aftermarket bearings can fall out. Keep the removed rollers with their bearing housing.", cite: {p: 284}}
          - {t: "Support the motorcycle so that it is stable and secure. The rear wheel must be a little off the ground so that the suspension is fully extended.", cite: {p: 284}}
          - {t: "Remove the nuts and the pivot bolts that connect the lever arms to the swing arm and to the lever.", cite: {p: 284}, figs: [15]}
          - {t: "If you wish, remove the pivot bolt between the lever arms and the lever at the workbench. Hold the bolt stable when you remove the nut, because the bolt is tight.", cite: {p: 284}}
          - {t: "Remove the nut and the pivot bolt from the shock absorber and the lever.", cite: {p: 284}, figs: [15]}
          - {t: "Remove the cap from each side of the frame.", cite: {p: 284}}
          - {t: "Remove the nut and the pivot bolt from the frame.", cite: {p: 284}, figs: [16]}
          - {t: "Pull the shock absorber back. Tap the lever out of the frame.", cite: {p: 284}}
          - {t: "Examine and lubricate the lever and the lever arms.", cite: {p: 284}, op: c13-lever-arm-inspection}
      - title: "Installation"
        steps:
          - {t: "Lubricate all bearings, seals and pivot bolts with grease.", cite: {p: 284}}
          - {t: "Clean the frame mounting bores and the drain holes. Lubricate them with grease.", cite: {p: 284}, figs: [17]}
          - {t: "Tap the lever into the frame.", cite: {p: 284}}
          - {t: "Install the shock absorber mounting bolt to hold the assembly. Then install the pivot bolt through the frame.", cite: {p: 284}, figs: [18]}
          - {t: "Make sure that the heads of the lever arm pivot bolts seat in the counterbores of the left lever arm.", cite: {p: 284}}
          - {t: "Make sure that all pivot spacers are in position before you join the parts.", cite: {p: 284}}
          - {t: "Install all bolts and tighten them by hand.", cite: {p: 284}}
          - {t: "Tighten all linkage bolts to the specified torque.", cite: {p: 285}, spec_ref: "rear-suspension-torque:Lever arm bolts"}

  - id: c13-lever-arm-inspection
    title: "Lever arm inspection"
    system: "Rear suspension"
    source: clymer
    chapter: 13
    section: "13/shock-absorber-linkage"
    summary: {t: "The lever arms have no bearings. You can examine them without disassembly. Replace parts that are worn or damaged.", cite: {p: 285}}
    parts:
      - {name: "Lever arm pivot bolts and nuts", replace: inspect, cite: {p: 285}, note: "Replace nuts and bolts that have rounded flats. A socket cannot grip them and the torque can be incorrect."}
      - {name: "Lever arms", replace: inspect, cite: {p: 285}}
    sections:
      - steps:
          - {t: "Examine the pivot bolts for wear. Make sure that the bolts are a snug fit in the lever arms.", cite: {p: 285}, figs: [19]}
          - {t: "Replace nuts and bolts that have rounded flats.", cite: {p: 285}}
          - {t: "Examine the lever arms for bends or twist. The arms must lie flat.", cite: {p: 285}, figs: [20]}
          - {t: "Examine the lever arm bores for damage and elongation. If a bore is worn or damaged, also replace the pivot bolts.", cite: {p: 285}}
          - {kind: note, t: "The left lever arm has counterbores for the heads of the pivot bolts.", cite: {p: 285}}
          - {t: "Examine the contact point between the lever arm and the pivot spacer. If it is worn or ground away, the pivot bolts did not have enough torque.", cite: {p: 285}}
          - {t: "Install the lever arms.", cite: {p: 285}, op: c13-lever-removal}

  - id: c13-lever-inspection
    title: "Lever inspection and repair"
    system: "Rear suspension"
    source: clymer
    chapter: 13
    section: "13/shock-absorber-linkage"
    summary: {t: "This procedure cleans and examines the lever and its needle bearings, replaces worn bearings and installs the seals and pivot spacers. Remove the lever first.", cite: {p: 285}}
    parts:
      - {name: "Needle bearings (lever)", replace: inspect, cite: {p: 286}, note: "In a bore with two bearings, replace both bearings and the pivot spacer."}
      - {name: "Lever seals", replace: inspect, cite: {p: 286}}
      - {name: "Penetrating oil", replace: consumable, cite: {p: 286}}
      - {name: "Molydisulfide grease or waterproof grease", replace: consumable, cite: {p: 287}}
    sections:
      - title: "Cleaning and inspection"
        steps:
          - {t: "Remove the lever.", cite: {p: 285}, op: c13-lever-removal}
          - {t: "At each bearing, remove the pivot spacer and the seals. Pry the seals at their outer edge.", cite: {p: 285}, figs: [22]}
          - {kind: note, t: "Original equipment bearings have fixed rollers. If the rollers of aftermarket bearings can be removed, put them in a marked container. Install them in their original housing.", cite: {p: 285}}
          - {t: "Clean the lever in clean solvent. Dry all parts.", cite: {p: 285}}
          - {t: "Examine the lever for cracks, in particular around the bearing bores.", cite: {p: 285}}
          - {t: "Examine the frame pivot bolt and nut for scoring, wear and damage. Replace them if they have rounded flats.", cite: {p: 286}}
          - {t: "Examine the seals for cracks, wear and damage.", cite: {p: 286}}
          - {t: "Examine the pivot spacers for scoring, wear and damage.", cite: {p: 286}}
          - {t: "Examine the needle bearings for wear, flat spots, rust and discoloration. If the rollers are blue, the bearing was too hot.", cite: {p: 286}, figs: [23]}
          - {t: "Lightly lubricate the bearings and the pivot spacers. Put each spacer in its bearing.", cite: {p: 286}, figs: [24]}
          - {t: "Make sure that the parts turn freely and smoothly with no play.", cite: {p: 286}}
          - {t: "If there is play or roughness, replace the bearings. In a bore with two bearings, replace both bearings and the pivot spacer.", cite: {p: 286}}
      - title: "Bearing replacement"
        steps:
          - {t: "Apply penetrating oil to the bearings and the bore.", cite: {p: 286}}
          - {t: "Remove the bearings with a press. If the bearings and the bore have no corrosion, you can use a drawbolt.", cite: {p: 286}, ref: "13/swing-arm-service"}
          - {t: "Support the lever on the open side of a large socket. Use a driver or a socket to drive the bearing into the lower socket.", cite: {p: 286}, figs: [25]}
          - {kind: note, t: "The driver must pass through the bore and must be longer than the bore depth. The lower socket must fit on the edge of the bore and be large enough to hold the removed bearing.", cite: {p: 286}}
          - {t: "Clean and examine the mounting bore.", cite: {p: 286}}
          - {t: "Lubricate the new bearings with grease.", cite: {p: 286}}
          - {t: "Put the bearing squarely over the bore with the manufacturer marks out.", cite: {p: 286}, figs: [26]}
          - {t: "Put a driver squarely against the end of the bearing.", cite: {p: 286}, figs: [26]}
          - {t: "Drive the bearing in. When the bearing is in the bore, frequently measure the depth.", cite: {p: 287}, figs: [27]}
          - {t: "Drive all bearings in the lever to 5 mm below the outer edge of the bore. The seals must seat in the bore.", cite: {p: 287}}
          - {t: "Do again for the other bearings.", cite: {p: 287}}
      - title: "Assembly"
        steps:
          - {t: "Pack the bearings, the bearing bores and the seals with grease. Also apply grease to the pivot spacers and the bolts.", cite: {p: 287}}
          - {t: "Press the seals into position by hand.", cite: {p: 287}, figs: [28]}
          - {t: "If the seals do not seat, examine the bearing depth. If necessary, adjust the depth.", cite: {p: 287}}
          - {t: "Install the pivot spacers in the lever. Make sure that the seals stay seated when the spacers go through them.", cite: {p: 287}}
          - {t: "Install the lever.", cite: {p: 287}, op: c13-lever-removal}

  - id: c13-linkage-lubrication
    title: "Swing arm and linkage lubrication"
    system: "Rear suspension"
    source: clymer
    chapter: 13
    section: "13/shock-absorber-linkage"
    summary: {t: "Disassemble and lubricate the shock linkage at the intervals in Chapter Three. If the linkage is often in harsh riding conditions, service it more frequently.", cite: {p: 282}}
    parts:
      - {name: "Molydisulfide grease or waterproof grease", replace: consumable, cite: {p: 282}, note: "Kawasaki recommends molydisulfide grease for all linkage bearings. Waterproof grease is durable and resists washout. Which one to use is the choice of the rider."}
    sections:
      - steps:
          - {t: "Do the swing arm bearing check.", cite: {p: 287}, op: swingarm-linkage}
          - {t: "Remove the lever and the lever arms.", cite: {p: 284}, op: c13-lever-removal}
          - {t: "Examine the lever arms.", cite: {p: 285}, op: c13-lever-arm-inspection}
          - {t: "Clean, examine and grease the lever, its bearings and its seals.", cite: {p: 285}, op: c13-lever-inspection}
          - {t: "If you will lubricate the swing arm bearings, remove the swing arm.", cite: {p: 288}, op: c13-swing-arm-removal}
          - {t: "Clean, examine and grease the swing arm bearings, seals, spacers and bolts.", cite: {p: 290}, op: c13-swing-arm-inspection}
          - {t: "Install the swing arm and the linkage.", cite: {p: 289}}
