operations:
  - id: c09-starter-clutch-test
    title: "Starter clutch test on the motorcycle"
    system: "electrical system"
    source: clymer
    chapter: 9
    section: "09/rotor-and-starter-clutch"
    summary: {t: "You can do a test of the starter clutch for free rotation and lockup without removal of the rotor.", cite: {p: 205}}
    sections:
      - steps:
          - {t: "Turn the clutch gear clockwise. The gear must turn freely and smoothly in this direction.", cite: {p: 205}, figs: [9]}
          - {t: "Try to turn the gear counterclockwise. The gear must not turn.", cite: {p: 205}}
          - {t: "If the gear turns in both directions or is always locked, disassemble and examine the clutch assembly.", cite: {p: 205}, op: c09-starter-clutch-inspection}

  - id: c09-rotor-removal-installation
    title: "Rotor and starter clutch removal and installation"
    system: "electrical system"
    source: clymer
    chapter: 9
    section: "09/rotor-and-starter-clutch"
    summary: {t: "The starter clutch is on the back of the rotor. You must remove the starter gears and the rotor to get to the clutch. Hold the rotor with a rotor holder tool and remove it with a rotor puller.", cite: {p: 205}}
    spec_refs: ["electrical-torque:Rotor bolt (see text)/To seat", "electrical-torque:Rotor bolt (see text)/Final"]
    parts:
      - {name: "Rotor bolt", replace: always, cite: {p: 206}}
      - {name: "Rotor holder tool, Kawasaki part No. 57001-1184", replace: consumable, cite: {p: 205}, note: "Special tool. It is not a part that you replace."}
      - {name: "Rotor puller, Kawasaki part No. 57001-1185", replace: consumable, cite: {p: 205}, note: "Special tool. It is not a part that you replace."}
      - {name: "Penetrating lubricant", replace: consumable, cite: {p: 206}}
      - {name: "Molybdenum disulfide grease", replace: consumable, cite: {p: 206}}
      - {name: "Engine oil", replace: consumable, cite: {p: 206}}
      - {name: "Grease for rotor puller threads", replace: consumable, cite: {p: 206}}
    sections:
      - title: "Removal"
        steps:
          - {t: "Remove the alternator cover.", cite: {p: 205}, op: c09-alternator-cover}
          - {t: "Remove the outer washer and the idle gear.", cite: {p: 205}, figs: [11]}
          - {t: "Remove the idle gear shaft, the bearings and the inner washer.", cite: {p: 205}, figs: [12]}
          - {t: "Remove the starter gear and the washers.", cite: {p: 205}, figs: [13]}
          - {t: "Hold the rotor with the rotor holder tool. Put the tool under the footpeg when you loosen the rotor bolt.", cite: {p: 206}, figs: [14]}
          - {t: "Remove the rotor bolt.", cite: {p: 206}}
          - {t: "Spray penetrating lubricant into the rotor bore and the Woodruff key area.", cite: {p: 206}}
          - {t: "Apply grease to the end and the threads of the rotor puller.", cite: {p: 206}}
          - {t: "Thread the rotor puller into the crankshaft.", cite: {p: 206}, figs: [15]}
          - {t: "Hold the rotor with the rotor holder tool. Put the tool on top of the footpeg when you tighten the rotor puller.", cite: {p: 206}, figs: [15]}
          - {t: "Tighten the rotor puller until the rotor comes free from the crankshaft taper. The rotor is tight. Use a wrench that gives high leverage.", cite: {p: 206}}
          - {t: "Remove the rotor puller from the crankshaft.", cite: {p: 206}}
          - {t: "Remove the rotor and the starter clutch from the crankshaft. Hold the starter clutch so that it does not fall from the rotor.", cite: {p: 206}, figs: [16]}
          - {t: "Remove the Woodruff key and the spacers from the crankshaft.", cite: {p: 206}, figs: [17]}
          - {t: "Examine and lubricate the parts as the inspection procedure describes.", cite: {p: 206}, op: c09-starter-clutch-inspection}
      - title: "Installation"
        steps:
          - {t: "Install the rotor and starter clutch assembly and the starter gears in the reverse order of removal.", cite: {p: 206}}
          - {t: "Install a new rotor bolt.", cite: {p: 206}}
          - {t: "Tighten the rotor bolt to the first torque value, to seat the rotor. Then loosen the bolt.", cite: {p: 206}, spec_ref: "electrical-torque:Rotor bolt (see text)/To seat"}
          - {t: "Tighten the rotor bolt to the final torque value.", cite: {p: 206}, spec_ref: "electrical-torque:Rotor bolt (see text)/Final"}
          - {t: "Lubricate the starter clutch gear bearing, the starter gear shafts and the bores with molybdenum disulfide grease.", cite: {p: 206}}
          - {t: "Lubricate all other parts with engine oil.", cite: {p: 206}}
          - {t: "Install the alternator cover.", cite: {p: 207}, op: c09-alternator-cover}

  - id: c09-starter-clutch-inspection
    title: "Starter clutch and rotor inspection"
    system: "electrical system"
    source: clymer
    chapter: 9
    section: "09/rotor-and-starter-clutch"
    summary: {t: "This procedure examines the starter clutch, the clutch components and the rotor after removal. It also tells how to replace a damaged clutch.", cite: {p: 207}}
    spec_refs: ["electrical-torque:Starter clutch bolts"]
    parts:
      - {name: "Starter clutch", replace: inspect, cite: {p: 207}, note: "Replace the clutch and the coupling if the clutch is damaged."}
      - {name: "Starter clutch coupling", replace: inspect, cite: {p: 207}}
      - {name: "Rotor", replace: inspect, cite: {p: 209}, note: "Replace the rotor if it is damaged."}
      - {name: "Threadlocking compound", replace: consumable, cite: {p: 207}}
    sections:
      - title: "Clutch operation"
        steps:
          - {t: "Put the clutch gear so that it faces up. Turn the gear counterclockwise. The gear must turn freely and smoothly in this direction.", cite: {p: 207}, figs: [18]}
          - {t: "Try to turn the gear clockwise. The gear must not turn.", cite: {p: 207}}
          - {t: "If the gear turns in both directions or is always locked, disassemble and examine the clutch assembly.", cite: {p: 207}}
      - title: "Clutch examination"
        steps:
          - {t: "Turn the clutch sprocket counterclockwise and twist it squarely away from the rotor.", cite: {p: 207}}
          - {t: "Remove the washer from the clutch.", cite: {p: 207}}
          - {t: "Clean the clutch assembly.", cite: {p: 207}, figs: [19]}
          - {t: "Examine the clutch gear teeth for wear or damage.", cite: {p: 207}}
          - {t: "Examine the clutch gear bearing for wear or scoring.", cite: {p: 207}}
          - {t: "Examine the washer for damage.", cite: {p: 207}}
          - {t: "Examine the clutch rollers. They must have no damage and must operate smoothly.", cite: {p: 207}, figs: [20]}
      - title: "Clutch replacement"
        steps:
          - {t: "If the clutch is damaged, remove the six bolts.", cite: {p: 207}, figs: [21]}
          - {t: "Remove the clutch and the coupling from the rotor.", cite: {p: 207}}
          - {t: "Install a new clutch and coupling.", cite: {p: 207}}
          - {t: "Apply threadlocking compound to the bolts.", cite: {p: 207}}
          - {t: "Tighten the bolts equally in several passes to the specified torque.", cite: {p: 207}, spec_ref: "electrical-torque:Starter clutch bolts"}
          - {t: "Lubricate the clutch rollers and the washer with engine oil.", cite: {p: 209}}
          - {t: "Install the washer and the clutch sprocket into the rotor. Turn the sprocket counterclockwise and twist it squarely into the rotor.", cite: {p: 209}}
          - {t: "When the sprocket is fully seated, make sure that it turns only counterclockwise.", cite: {p: 209}}
      - title: "Rotor examination"
        steps:
          - {t: "Clean the rotor components.", cite: {p: 209}}
          - {t: "Examine the rotor for cracks and damage.", cite: {p: 209}}
          - {kind: warning, t: "Replace the rotor if it is damaged. At high crankshaft speed a damaged rotor can break apart and cause serious injury and engine damage.", cite: {p: 209}}
          - {t: "Examine the taper in the rotor bore and on the crankshaft for damage.", cite: {p: 209}}
          - {t: "Examine the Woodruff key, the slot and the spacers for damage.", cite: {p: 209}, figs: [17]}
          - {kind: note, t: "If the Woodruff key is bent or sheared, the rotor does not align correctly on the crankshaft. The ignition timing is then wrong.", cite: {p: 209}}
