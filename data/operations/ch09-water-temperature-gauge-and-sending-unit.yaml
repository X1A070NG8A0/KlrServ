operations:
  - id: c09-water-temp-gauge-circuit-test
    title: "Water temperature gauge circuit test"
    system: "electrical system"
    source: clymer
    chapter: 9
    section: "09/water-temperature-gauge-and-sending-unit"
    summary: {t: "The water temperature sending unit is on top of the cylinder head. It sends a signal to the water temperature gauge. At low coolant temperature the sending unit has high resistance and the gauge shows cold. This test shows if you must test the gauge or the sending unit.", cite: {p: 230}}
    sections:
      - steps:
          - {t: "Remove the fuel tank.", cite: {p: 230}, ref: "15/fuel-tank", figs: [69]}
          - {t: "Disconnect the yellow wire from the terminal on the sending unit. Do not let the loose wire touch the engine or any other grounded surface.", cite: {p: 230}}
          - {t: "Turn on the ignition key and look at the gauge. The needle must show C.", cite: {p: 230}}
          - {kind: caution, t: "Ground the wire only long enough to see the gauge needle move. Too much grounding can cause damage to the gauge.", cite: {p: 230}}
          - {t: "While you look at the gauge, touch the yellow wire for a short time to the engine or another grounded (unpainted) surface. The needle must move toward H.", cite: {p: 230}}
          - {t: "If the gauge passes the test, test the water temperature sending unit.", cite: {p: 231}, op: c09-water-temp-sender-test}
          - {t: "If the gauge does not pass the test, examine the wiring harness for damage or poor connections.", cite: {p: 231}}
          - {t: "If all wiring is in good condition, test the gauge.", cite: {p: 231}, op: c09-water-temp-gauge-test}

  - id: c09-water-temp-gauge-test
    title: "Water temperature gauge test"
    system: "electrical system"
    source: clymer
    chapter: 9
    section: "09/water-temperature-gauge-and-sending-unit"
    summary: {t: "Measure the resistance of the water temperature gauge at the connector plug (B in the figure). The plug is in front of the handlebar gauges, behind the cover.", cite: {p: 231}}
    spec_refs: ["electrical-test:Water temperature gauge resistance/Black/yellow-to-yellow/white wires", "electrical-test:Water temperature gauge resistance/Brown-to-yellow/white wires"]
    sections:
      - steps:
          - {t: "Remove the cover to get to the wiring. If necessary, remove the fairing.", cite: {p: 231}, ref: "15/fairing", figs: [70]}
          - {t: "Disconnect the connector plug.", cite: {p: 231}}
          - {t: "Set the ohmmeter to R x 10 ohms.", cite: {p: 230}}
          - {t: "Connect the ohmmeter to the plug half that goes to the gauge. Connect it to the black/yellow wire and the yellow/white wire. Compare the reading with the specification.", cite: {p: 231}, spec_ref: "electrical-test:Water temperature gauge resistance/Black/yellow-to-yellow/white wires"}
          - {t: "Connect the ohmmeter to the brown wire and the yellow/white wire. Compare the reading with the specification.", cite: {p: 231}, spec_ref: "electrical-test:Water temperature gauge resistance/Brown-to-yellow/white wires"}
          - {t: "If the gauge fails any test, replace or repair the assembly.", cite: {p: 231}}

  - id: c09-water-temp-sender-test
    title: "Water temperature sending unit test"
    system: "electrical system"
    source: clymer
    chapter: 9
    section: "09/water-temperature-gauge-and-sending-unit"
    summary: {t: "This test needs heated water to simulate operating conditions. Read the procedure first so that you have the correct equipment to do the test safely.", cite: {p: 231}}
    spec_refs: ["electrical-test:Water temperature sender resistance/At 80° C (176° F)", "electrical-test:Water temperature sender resistance/At 100° C (212° F)", "electrical-torque:Water temperature sender"]
    sections:
      - steps:
          - {t: "Remove the sending unit from the cylinder head.", cite: {p: 231}, ref: "10/water-temperature-sending-unit"}
          - {t: "Clean the sending unit. Examine it for damage.", cite: {p: 231}}
          - {t: "Connect an ohmmeter to the unit terminal and to the unit threads.", cite: {p: 231}}
          - {t: "Suspend the unit and an accurate thermometer in a container of water. The temperature sensor and the threads must be under water. Do not let the parts touch the bottom or side of the container.", cite: {p: 231}, figs: [66]}
          - {t: "Heat the water slowly. Read the thermometer and the ohmmeter. Do not overheat the sending unit.", cite: {p: 231}}
          - {t: "At the lower specified water temperature, compare the reading with the specification.", cite: {p: 231}, spec_ref: "electrical-test:Water temperature sender resistance/At 80° C (176° F)"}
          - {t: "At the higher specified water temperature, compare the reading with the specification.", cite: {p: 231}, spec_ref: "electrical-test:Water temperature sender resistance/At 100° C (212° F)"}
          - {t: "If the unit does not operate in specification, replace the unit.", cite: {p: 231}}
          - {t: "Install the sending unit. Tighten it to the specified torque.", cite: {p: 231}, ref: "10/water-temperature-sending-unit", spec_ref: "electrical-torque:Water temperature sender"}
