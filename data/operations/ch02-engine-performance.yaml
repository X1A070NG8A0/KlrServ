operations:
  - id: c02-engine-performance
    title: "Engine performance troubleshooting"
    system: "troubleshooting"
    source: clymer
    chapter: 2
    section: "02/engine-performance"
    summary: {t: "These lists give the possible causes of poor engine performance. The easier checks are first. Each cause links to the procedure that finds or fixes it.", cite: {p: 46}}
    sections:
      - title: "Engine does not start or starts and dies: fuel system"
        steps:
          - {kind: note, t: "On California models, an overfilled fuel tank can expand with heat and overflow into the evaporative emission control lines near the filler neck. This can cause hard starting and engine hesitation until the system is clear of fuel.", cite: {p: 47}}
          - {t: "Make sure that the fuel valve is on.", cite: {p: 47}, op: "c08-fuel-valve"}
          - {t: "Make sure that the fuel tank has fuel.", cite: {p: 47}, op: "c03-fuel-and-lubricants"}
          - {t: "Make sure that the choke lever operates correctly.", cite: {p: 47}, op: "choke-cable"}
          - {t: "Make sure that the choke plunger is not stuck open.", cite: {p: 47}, op: "c08-carburetor-cleaning-and-inspection"}
          - {t: "Make sure that the idle speed is not too low.", cite: {p: 47}, op: "idle-speed"}
          - {t: "If the engine is flooded, clear the flood.", cite: {p: 47}, op: "c02-flooded-engine"}
          - {t: "Make sure that the vent in the fuel tank cap is not clogged.", cite: {p: 47}, ref: "15/fuel-tank"}
          - {t: "Examine the fuel for contamination.", cite: {p: 47}, op: "c03-fuel-and-lubricants"}
          - {t: "Examine the fuel valve for a clog.", cite: {p: 47}, op: "c08-fuel-valve"}
          - {t: "Examine the fuel line for a clog.", cite: {p: 47}, op: "fuel-hose"}
          - {t: "Examine the carburetor and the carburetor jets for a clog.", cite: {p: 47}, op: "c08-carburetor-cleaning-and-inspection"}
          - {t: "Examine the air filter for a clog.", cite: {p: 47}, op: "air-filter"}
          - {t: "Make sure that the vacuum hose of the fuel tank diaphragm valve is connected and does not leak.", cite: {p: 47}, ref: "08/evaporative-emissions-control-system-california-models-only"}
          - {t: "Make sure that the fuel tank diaphragm valve operates correctly.", cite: {p: 47}, ref: "08/evaporative-emissions-control-system-california-models-only"}
          - {t: "Adjust the pilot mixture screw if it is not set correctly.", cite: {p: 47}, ref: "08/carburetor-systems"}
          - {t: "Examine the float valve for a clog or sticking.", cite: {p: 48}, op: "c08-float-adjustment"}
          - {t: "Examine the intake duct for air leaks.", cite: {p: 48}, op: "c08-air-filter-housing"}
          - {t: "Make sure that the pilot jet is correct for the altitude.", cite: {p: 48}, ref: "08/carburetor-systems"}
      - title: "Engine does not start or starts and dies: ignition"
        steps:
          - {t: "Examine the spark plug for fouling or a wrong gap.", cite: {p: 48}, op: "spark-plug"}
          - {t: "Examine the spark plug lead and cap for damage or a short circuit.", cite: {p: 48}, op: "c09-ignition-coil-test"}
          - {t: "Examine the ignition system for a loose connection.", cite: {p: 48}, ref: "09/ignition-system"}
          - {t: "Do a test of the ignition coil.", cite: {p: 48}, op: "c09-ignition-coil-test"}
          - {t: "Do a test of the ignition switch.", cite: {p: 48}, op: "c09-ignition-switch-test"}
          - {t: "Do a test of the engine stop switch for dirt or a short circuit.", cite: {p: 48}, op: "c09-starter-button-engine-stop-switch-test"}
          - {t: "Do a test of the exciter coil.", cite: {p: 48}, op: "c09-exciter-coil-test"}
          - {t: "Do a test of the ignition pickup coil.", cite: {p: 48}, op: "c09-pickup-coil-test"}
          - {t: "Examine the ignition timing.", cite: {p: 48}, op: "c03-engine-timing-check"}
          - {t: "Do a test of the CDI unit.", cite: {p: 48}, op: "c09-cdi-unit-test"}
      - title: "Engine does not start or starts and dies: engine"
        steps:
          - {t: "Make sure that the compression release operates correctly.", cite: {p: 48}, op: "c04-camshaft-inspection"}
          - {t: "Make sure that the valves have clearance.", cite: {p: 48}, op: "valve-clearance"}
          - {t: "Examine the cylinder head gasket for a leak.", cite: {p: 48}, op: "c04-cylinder-head-removal"}
          - {t: "Examine the valves for a stuck or seized valve.", cite: {p: 48}, op: "c04-valve-inspection"}
          - {t: "Examine the piston and the cylinder for wear.", cite: {p: 48}, op: "c04-piston-inspection"}
      - title: "Poor idle and low speed performance: fuel system"
        steps:
          - {t: "Make sure that the choke lever operates correctly.", cite: {p: 47}, op: "choke-cable"}
          - {t: "Make sure that the choke plunger is not stuck open.", cite: {p: 47}, op: "c08-carburetor-cleaning-and-inspection"}
          - {t: "Make sure that the idle speed is not too low.", cite: {p: 47}, op: "idle-speed"}
          - {t: "If the engine is flooded, clear the flood.", cite: {p: 47}, op: "c02-flooded-engine"}
          - {t: "Make sure that the vent in the fuel tank cap is not clogged.", cite: {p: 47}, ref: "15/fuel-tank"}
          - {t: "Examine the fuel for contamination.", cite: {p: 47}, op: "c03-fuel-and-lubricants"}
          - {t: "Examine the fuel valve for a clog.", cite: {p: 47}, op: "c08-fuel-valve"}
          - {t: "Examine the fuel line for a clog.", cite: {p: 47}, op: "fuel-hose"}
          - {t: "Examine the carburetor and the carburetor jets for a clog.", cite: {p: 47}, op: "c08-carburetor-cleaning-and-inspection"}
          - {t: "Examine the air filter for a clog.", cite: {p: 47}, op: "air-filter"}
          - {t: "Make sure that the vacuum hose of the fuel tank diaphragm valve is connected and does not leak.", cite: {p: 47}, ref: "08/evaporative-emissions-control-system-california-models-only"}
          - {t: "Make sure that the fuel tank diaphragm valve operates correctly.", cite: {p: 47}, ref: "08/evaporative-emissions-control-system-california-models-only"}
          - {t: "Adjust the pilot mixture screw if it is not set correctly.", cite: {p: 47}, ref: "08/carburetor-systems"}
          - {t: "Examine the float valve for a clog or sticking.", cite: {p: 47}, op: "c08-float-adjustment"}
          - {t: "Examine the intake duct for air leaks.", cite: {p: 47}, op: "c08-air-filter-housing"}
          - {t: "Make sure that the carburetor diaphragm cover is not loose.", cite: {p: 47}, op: "c08-carburetor-cleaning-and-inspection"}
          - {t: "Examine the slide diaphragm for tears or damage.", cite: {p: 47}, op: "c08-carburetor-cleaning-and-inspection"}
          - {t: "Make sure that the carburetor slide does not drag.", cite: {p: 47}, op: "c08-carburetor-cleaning-and-inspection"}
          - {t: "Make sure that the pilot jet is correct for the altitude.", cite: {p: 47}, ref: "08/carburetor-systems"}
          - {t: "Examine the muffler for a clog.", cite: {p: 47}, op: "muffler-clean"}
      - title: "Poor idle and low speed performance: ignition"
        steps:
          - {t: "Examine the spark plug for fouling or a wrong gap.", cite: {p: 47}, op: "spark-plug"}
          - {t: "Examine the spark plug lead and cap for damage or a short circuit.", cite: {p: 47}, op: "c09-ignition-coil-test"}
          - {t: "Examine the ignition system for a loose connection.", cite: {p: 47}, ref: "09/ignition-system"}
          - {t: "Do a test of the ignition coil.", cite: {p: 47}, op: "c09-ignition-coil-test"}
          - {t: "Do a test of the ignition switch.", cite: {p: 47}, op: "c09-ignition-switch-test"}
          - {t: "Do a test of the engine stop switch for dirt or a short circuit.", cite: {p: 47}, op: "c09-starter-button-engine-stop-switch-test"}
          - {t: "Do a test of the exciter coil.", cite: {p: 48}, op: "c09-exciter-coil-test"}
          - {t: "Do a test of the ignition pickup coil.", cite: {p: 48}, op: "c09-pickup-coil-test"}
          - {t: "Examine the ignition timing.", cite: {p: 48}, op: "c03-engine-timing-check"}
          - {t: "Do a test of the CDI unit.", cite: {p: 48}, op: "c09-cdi-unit-test"}
      - title: "Poor idle and low speed performance: engine"
        steps:
          - {t: "Make sure that the compression release operates correctly.", cite: {p: 48}, op: "c04-camshaft-inspection"}
          - {t: "Make sure that the valve clearance is correct.", cite: {p: 48}, op: "valve-clearance"}
          - {t: "Do a compression check. Low compression is a possible cause.", cite: {p: 48}, op: "c03-compression-check"}
          - {t: "Make sure that the valve and camshaft timing is correct.", cite: {p: 48}, ref: "04/camshafts-and-cam-chain-tensioner"}
      - title: "Engine lacks power and acceleration: fuel system"
        steps:
          - {t: "Make sure that the choke lever operates correctly.", cite: {p: 48}, op: "choke-cable"}
          - {t: "Make sure that the choke plunger is not stuck open.", cite: {p: 48}, op: "c08-carburetor-cleaning-and-inspection"}
          - {t: "Examine the fuel for contamination.", cite: {p: 48}, op: "c03-fuel-and-lubricants"}
          - {t: "Examine the fuel valve for a clog.", cite: {p: 48}, op: "c08-fuel-valve"}
          - {t: "Examine the fuel line for a clog.", cite: {p: 48}, op: "fuel-hose"}
          - {t: "Examine the carburetor and the carburetor jets for a clog.", cite: {p: 48}, op: "c08-carburetor-cleaning-and-inspection"}
          - {t: "Examine the air filter for a clog.", cite: {p: 48}, op: "air-filter"}
          - {t: "Make sure that the vacuum hose of the fuel tank diaphragm valve is connected and does not leak.", cite: {p: 48}, ref: "08/evaporative-emissions-control-system-california-models-only"}
          - {t: "Make sure that the fuel tank diaphragm valve operates correctly.", cite: {p: 48}, ref: "08/evaporative-emissions-control-system-california-models-only"}
          - {t: "Examine the float valve for a clog or sticking.", cite: {p: 48}, op: "c08-float-adjustment"}
          - {t: "Examine the intake duct for air leaks.", cite: {p: 48}, op: "c08-air-filter-housing"}
          - {t: "Make sure that the carburetor diaphragm cover is not loose.", cite: {p: 48}, op: "c08-carburetor-cleaning-and-inspection"}
          - {t: "Examine the slide diaphragm for tears or damage.", cite: {p: 48}, op: "c08-carburetor-cleaning-and-inspection"}
          - {t: "Make sure that the carburetor slide does not drag.", cite: {p: 48}, op: "c08-carburetor-cleaning-and-inspection"}
          - {t: "Make sure that the pilot jet and the main jet are correct for the altitude.", cite: {p: 48}, ref: "08/carburetor-systems"}
          - {t: "Examine the muffler for a clog.", cite: {p: 48}, op: "muffler-clean"}
      - title: "Engine lacks power and acceleration: ignition"
        steps:
          - {t: "Examine the spark plug for fouling or a wrong gap.", cite: {p: 48}, op: "spark-plug"}
          - {t: "Examine the spark plug lead and cap for damage or a short circuit.", cite: {p: 48}, op: "c09-ignition-coil-test"}
          - {t: "Examine the ignition system for a loose connection.", cite: {p: 48}, ref: "09/ignition-system"}
          - {t: "Do a test of the ignition coil.", cite: {p: 48}, op: "c09-ignition-coil-test"}
          - {t: "Do a test of the exciter coil.", cite: {p: 48}, op: "c09-exciter-coil-test"}
          - {t: "Do a test of the ignition pickup coil.", cite: {p: 48}, op: "c09-pickup-coil-test"}
          - {t: "Examine the ignition timing.", cite: {p: 48}, op: "c03-engine-timing-check"}
          - {t: "Do a test of the CDI unit.", cite: {p: 48}, op: "c09-cdi-unit-test"}
      - title: "Engine lacks power and acceleration: engine"
        steps:
          - {t: "Make sure that the compression release operates correctly.", cite: {p: 48}, op: "c04-camshaft-inspection"}
          - {t: "Make sure that the valve clearance is correct.", cite: {p: 48}, op: "valve-clearance"}
          - {t: "Do a compression check. Low compression is a possible cause.", cite: {p: 48}, op: "c03-compression-check"}
          - {t: "Make sure that the valve and camshaft timing is correct.", cite: {p: 48}, ref: "04/camshafts-and-cam-chain-tensioner"}
      - title: "Engine lacks power and acceleration: brakes, wheels and clutch"
        steps:
          - {t: "Make sure that the brake pads do not drag on the brake disc.", cite: {p: 48}, op: "c14-front-brake-pads"}
          - {t: "Examine the wheel bearings for wear or seizure.", cite: {p: 48}, op: "c11-hub-bearing-inspection"}
          - {t: "Make sure that the drive chain is not too tight.", cite: {p: 48}, op: "drive-chain-adjust"}
          - {t: "Make sure that the clutch adjustment is correct.", cite: {p: 48}, op: "clutch-adjust"}
          - {t: "Examine the clutch springs for weakness.", cite: {p: 48}, op: "c06-clutch-inspection"}
          - {t: "Examine the clutch plates and discs for wear.", cite: {p: 48}, op: "c06-clutch-inspection"}
      - title: "Poor high speed performance: fuel system"
        steps:
          - {t: "Make sure that the choke lever operates correctly.", cite: {p: 49}, op: "choke-cable"}
          - {t: "Make sure that the choke plunger is not stuck open.", cite: {p: 49}, op: "c08-carburetor-cleaning-and-inspection"}
          - {t: "Examine the fuel for contamination.", cite: {p: 49}, op: "c03-fuel-and-lubricants"}
          - {t: "Examine the fuel valve for a clog.", cite: {p: 49}, op: "c08-fuel-valve"}
          - {t: "Examine the fuel line for a clog.", cite: {p: 49}, op: "fuel-hose"}
          - {t: "Examine the carburetor and the carburetor jets for a clog.", cite: {p: 49}, op: "c08-carburetor-cleaning-and-inspection"}
          - {t: "Examine the air filter for a clog.", cite: {p: 49}, op: "air-filter"}
          - {t: "Examine the intake duct for air leaks.", cite: {p: 49}, op: "c08-air-filter-housing"}
          - {t: "Make sure that the float level is not too high.", cite: {p: 49}, op: "c08-float-adjustment"}
          - {t: "Make sure that the carburetor diaphragm cover is not loose.", cite: {p: 49}, op: "c08-carburetor-cleaning-and-inspection"}
          - {t: "Examine the slide diaphragm for tears or damage.", cite: {p: 49}, op: "c08-carburetor-cleaning-and-inspection"}
          - {t: "Make sure that the carburetor slide does not drag.", cite: {p: 49}, op: "c08-carburetor-cleaning-and-inspection"}
          - {t: "Examine the needle and the jet for wear.", cite: {p: 49}, op: "c08-carburetor-cleaning-and-inspection"}
          - {t: "Make sure that the main jet is correct for the altitude.", cite: {p: 49}, ref: "08/carburetor-systems"}
          - {t: "Examine the muffler for a clog.", cite: {p: 49}, op: "muffler-clean"}
      - title: "Poor high speed performance: ignition and engine"
        steps:
          - {t: "Do a test of the exciter coil.", cite: {p: 49}, op: "c09-exciter-coil-test"}
          - {t: "Do a test of the ignition pickup coil.", cite: {p: 49}, op: "c09-pickup-coil-test"}
          - {t: "Examine the ignition timing.", cite: {p: 49}, op: "c03-engine-timing-check"}
          - {t: "Do a test of the CDI unit.", cite: {p: 49}, op: "c09-cdi-unit-test"}
          - {t: "Make sure that the engine oil level is not too high.", cite: {p: 49}, op: "engine-oil-and-filter"}
          - {t: "Make sure that the valve clearance is correct.", cite: {p: 49}, op: "valve-clearance"}
          - {t: "Examine the valve springs for weakness or breaks.", cite: {p: 49}, op: "c04-valve-inspection"}
      - title: "Engine backfires"
        steps:
          - {t: "Make sure that the pilot mixture screw is not set too lean.", cite: {p: 49}, ref: "08/carburetor-systems"}
          - {t: "Examine the exhaust system for air leaks.", cite: {p: 49}, op: "c04-exhaust-system"}
          - {t: "If the engine backfires during deceleration, examine the air cut-off valve.", cite: {p: 49}, ref: "08/carburetor-systems"}
          - {t: "Do a test of the exciter coil.", cite: {p: 49}, op: "c09-exciter-coil-test"}
          - {t: "Do a test of the ignition pickup coil.", cite: {p: 49}, op: "c09-pickup-coil-test"}
          - {t: "Examine the ignition timing.", cite: {p: 49}, op: "c03-engine-timing-check"}
      - title: "Engine overheating: cooling system"
        steps:
          - {kind: note, t: "Engine overheating can occur when you operate the motorcycle at slow speed and high rpm, for example in severe off-road conditions. The fan can turn on and the engine can still overheat. Stop and let the engine cool. If overheating continues at moderate speed and lower rpm, find the cause.", cite: {p: 48}}
          - {t: "Make sure that the coolant level is not low.", cite: {p: 49}, op: "cooling-system-inspect"}
          - {t: "Examine the coolant for water with no coolant mix.", cite: {p: 49}, op: "coolant-replace"}
          - {t: "Examine the cooling system for air.", cite: {p: 49}, op: "coolant-replace"}
          - {t: "Examine the radiator for a clog.", cite: {p: 49}, op: "c10-radiator-inspection"}
          - {t: "Examine the radiator cap for damage.", cite: {p: 49}, op: "c10-radiator-cap-removal"}
          - {t: "Examine the thermostat for damage.", cite: {p: 49}, op: "c10-thermostat-removal"}
          - {t: "Do a test of the fan fuse.", cite: {p: 49}, op: "c09-fan-fuse-test"}
          - {t: "Do a test of the fan relay.", cite: {p: 49}, op: "c09-fan-relay-test"}
          - {t: "Do a test of the fan switch.", cite: {p: 49}, op: "c09-fan-switch-test"}
          - {t: "Make sure that the fan shaft is not seized.", cite: {p: 49}, op: "c10-fan-removal"}
          - {t: "Make sure that the water pump impeller is not loose or damaged.", cite: {p: 49}, op: "c10-water-pump-removal"}
          - {t: "Do a test of the water temperature sending unit.", cite: {p: 49}, op: "c09-water-temp-sender-test"}
          - {t: "Do a test of the water temperature gauge.", cite: {p: 49}, op: "c09-water-temp-gauge-test"}
      - title: "Engine overheating: engine"
        steps:
          - {t: "Do not idle the engine too long.", cite: {p: 49}}
          - {t: "Make sure that the engine oil level and viscosity are correct.", cite: {p: 49}, op: "engine-oil-and-filter"}
          - {t: "Make sure that the spark plug heat range is correct.", cite: {p: 49}, op: "c03-spark-plug-selection"}
          - {t: "Examine the crankcase oil strainer for a clog.", cite: {p: 49}, ref: "06/oil-pump"}
          - {t: "Examine the piston for too much carbon.", cite: {p: 49}, op: "c04-piston-inspection"}
          - {t: "Examine the cylinder head for too much carbon.", cite: {p: 49}, op: "c04-cylinder-head-inspection"}
      - title: "Engine overheating: fuel system and ignition"
        steps:
          - {t: "Make sure that the hose of the fuel tank cap vent is not clogged or pinched. A clog causes a lean mixture.", cite: {p: 49}, ref: "15/fuel-tank"}
          - {t: "Examine the intake duct for air leaks.", cite: {p: 49}, op: "c08-air-filter-housing"}
          - {t: "Make sure that the pilot jet and the main jet are correct for the altitude.", cite: {p: 49}, ref: "08/carburetor-systems"}
          - {t: "Examine the carburetor jets for a clog.", cite: {p: 49}, op: "c08-carburetor-cleaning-and-inspection"}
          - {t: "Make sure that the float level is not too low.", cite: {p: 49}, op: "c08-float-adjustment"}
          - {t: "Make sure that the spark plug heat range is correct.", cite: {p: 49}, op: "c03-spark-plug-selection"}
          - {t: "Do a test of the exciter coil.", cite: {p: 49}, op: "c09-exciter-coil-test"}
          - {t: "Do a test of the ignition pickup coil.", cite: {p: 49}, op: "c09-pickup-coil-test"}
          - {t: "Examine the ignition timing.", cite: {p: 49}, op: "c03-engine-timing-check"}

