operations:
  - id: c09-charging-system-precautions
    title: "Charging system precautions"
    system: "electrical system"
    source: clymer
    chapter: 9
    section: "09/charging-system"
    summary: {t: "The charging system components can be damaged if you do not obey these precautions during tests and troubleshooting.", cite: {p: 222}}
    sections:
      - steps:
          - {t: "Do not disconnect electrical connections while the engine runs or cranks.", cite: {p: 222}}
          - {t: "Turn off the ignition switch before you disconnect or connect electrical components.", cite: {p: 222}}
          - {t: "Handle the parts with care.", cite: {p: 222}}
          - {t: "Before you replace a component, examine the wiring for poor connections, corrosion and shorts.", cite: {p: 223}}
          - {t: "Before you test components, make sure that the battery is in good condition and does not cause poor performance.", cite: {p: 223}, op: battery}
          - {t: "Work slowly and in order. Use test equipment in good condition. Record all measurements.", cite: {p: 223}}

  - id: c09-fuse-test
    title: "Fuse holder and fuse test"
    system: "electrical system"
    source: clymer
    chapter: 9
    section: "09/charging-system"
    summary: {t: "The fuse holder is under the seat, on top of the battery case. It holds two fuses. The 10 amp fuse protects the headlight, taillight and instrument gauge bulbs. The 20 amp main circuit fuse protects the rest of the motorcycle.", cite: {p: 224}}
    sections:
      - steps:
          - {kind: note, t: "On 1990-on models, the fan circuit has its own fuse under the fuel tank. The fan circuit of all models also receives power from the main circuit that has the 20 amp fuse.", cite: {p: 224}}
          - {t: "Use an ohmmeter to test the fuse for continuity.", cite: {p: 224}, figs: [57]}
          - {kind: note, t: "A fuse can look good but have a fine break in the element. A fine break can show continuity when the fuse is cold and break the circuit when the fuse is under load and hot.", cite: {p: 224}}

  - id: c09-battery-voltage-unloaded
    title: "Battery voltage test, unloaded"
    system: "electrical system"
    source: clymer
    chapter: 9
    section: "09/charging-system"
    summary: {t: "This test is for a conventional (original equipment) battery. The unloaded voltage shows the basic state of charge. For battery replacement, charging and electrolyte checks, refer to Chapter Three.", cite: {p: 224}}
    sections:
      - steps:
          - {t: "Connect a voltmeter to the negative and positive battery terminals. If you do not have a voltmeter, use a syringe hydrometer to measure the specific gravity of the electrolyte.", cite: {p: 224}, figs: [58]}
          - {t: "Measure the voltage.", cite: {p: 224}}
          - {t: "A fully charged battery has a minimum of 12.6 volts (1.265 hydrometer reading).", cite: {p: 224}}
          - {t: "A battery that is approximately 75 percent charged has a minimum of 12.4 volts (1.210 hydrometer reading).", cite: {p: 224}}
          - {t: "A battery that is approximately 50 percent charged has a minimum of 12.1 volts (1.160 hydrometer reading).", cite: {p: 224}}
          - {t: "If the battery needs a charge or a replacement, do the procedure in Chapter Three.", cite: {p: 224}, op: battery}

  - id: c09-battery-voltage-loaded
    title: "Battery voltage test, loaded"
    system: "electrical system"
    source: clymer
    chapter: 9
    section: "09/charging-system"
    summary: {t: "This test is for a conventional (original equipment) battery. A load test makes the battery discharge current. It shows if the battery is good enough to operate the motorcycle.", cite: {p: 224}}
    sections:
      - steps:
          - {t: "Connect a voltmeter to the negative and positive battery terminals.", cite: {p: 224}, figs: [58]}
          - {t: "Turn on the headlight to high beam.", cite: {p: 224}}
          - {t: "Measure the voltage. A battery in good condition has a minimum of 11.5 volts.", cite: {p: 224}}
          - {t: "If the battery needs a charge or a replacement, do the procedure in Chapter Three.", cite: {p: 224}, op: battery}

  - id: c09-battery-current-draw-test
    title: "Battery current draw test"
    system: "electrical system"
    source: clymer
    chapter: 9
    section: "09/charging-system"
    summary: {t: "Do this test if a good battery discharges quickly when the motorcycle is not in use. On the KLR650, any current draw with all electrical devices off shows a problem. A short in a wire or component, or dirt and moisture, can let the battery discharge to ground.", cite: {p: 224}}
    sections:
      - steps:
          - {t: "Remove the fuel tank.", cite: {p: 225}, ref: "15/fuel-tank"}
          - {t: "Turn the ignition switch off.", cite: {p: 225}}
          - {t: "Disconnect the negative battery cable.", cite: {p: 225}}
          - {t: "Make sure that the battery is fully charged.", cite: {p: 225}}
          - {kind: caution, t: "Set the ammeter to the highest amperage range before you connect it. If too much current flows, the meter can be damaged.", cite: {p: 225}}
          - {t: "Connect the ammeter to the negative battery cable and terminal.", cite: {p: 225}, figs: [59]}
          - {t: "The meter must show no current draw. If it shows a current draw, continue the test.", cite: {p: 225}}
          - {t: "Remove the fuses from the headlight/taillight circuit and the fan circuit (1990-on models). Read the meter.", cite: {p: 225}}
          - {t: "If the current draw becomes less, the problem is in one of the fused circuits. Install the fuses. Separate the connectors in the circuit to find the problem.", cite: {p: 225}}
          - {t: "If the current draw stays the same, the problem is in the main circuit.", cite: {p: 225}}
          - {t: "Refer to the system diagrams in this chapter and, if necessary, the wiring diagram at the back of the manual to identify circuits and parts.", cite: {p: 225}}
          - {t: "Disconnect and connect the individual connectors of the related parts, one connector at a time, until the meter shows no current draw. The shorted circuit is then found.", cite: {p: 225}}

  - id: c09-regulator-output-voltage-test
    title: "Regulator/rectifier output voltage test"
    system: "electrical system"
    source: clymer
    chapter: 9
    section: "09/charging-system"
    summary: {t: "The regulator/rectifier is under the seat. It changes the alternating current of the alternator to direct current, and it regulates the charging voltage. It sends extra voltage out as heat from the finned regulator. The battery must be in good condition and charged before this test.", cite: {p: 225}}
    spec_refs: ["electrical-test:Regulator/rectifier output voltage"]
    sections:
      - steps:
          - {t: "Start the engine and let it get to operating temperature. Then turn off the engine.", cite: {p: 225}, figs: [60]}
          - {t: "Set a voltmeter to DC volts. Use a scale in the 25-50 volt range.", cite: {p: 225}}
          - {t: "Connect the voltmeter to the battery terminals.", cite: {p: 226}, figs: [58]}
          - {t: "Start the engine. Read the meter at idle and while you increase the engine speed.", cite: {p: 226}}
          - {t: "Unplug the headlight. Do the check again.", cite: {p: 226}}
          - {t: "In both checks, the meter must show at least 12 volts at idle, increasing to 14-15 volts as the engine speed increases.", cite: {p: 226}, spec_ref: "electrical-test:Regulator/rectifier output voltage"}
          - {t: "If the output voltage is much more than 15 volts, the regulator/rectifier can have a poor ground or be faulty.", cite: {p: 226}}
          - {t: "If the output voltage does not increase with engine speed, the regulator/rectifier or the stator coils are faulty.", cite: {p: 226}}
          - {t: "Before you replace parts, examine the wiring harness and the battery.", cite: {p: 226}}

  - id: c09-regulator-resistance-test
    title: "Regulator/rectifier resistance test"
    system: "electrical system"
    source: clymer
    chapter: 9
    section: "09/charging-system"
    summary: {t: "This test checks the directional resistance of the regulator/rectifier. No specific resistance is specified. The purpose is to find low resistance in one direction and infinite resistance in the other direction.", cite: {p: 226}}
    sections:
      - steps:
          - {t: "Use an analog ohmmeter set to the R x 10 or R x 100 scale.", cite: {p: 226}}
          - {t: "Remove the plug connector from the regulator/rectifier.", cite: {p: 226}, figs: [61]}
          - {t: "Connect the positive meter probe to the B terminal. Keep the probe on the B terminal and touch the negative probe to terminals 1, 2 and 3. The meter must read zero to approximately one-half of the meter scale at all terminals.", cite: {p: 226}}
          - {t: "Connect the negative meter probe to the B terminal. Keep the probe on the B terminal and touch the positive probe to terminals 1, 2 and 3. The meter must read infinity at all terminals.", cite: {p: 226}}
          - {t: "Connect the positive meter probe to the G terminal. Keep the probe on the G terminal and touch the negative probe to terminals 1, 2 and 3. The meter must read infinity at all terminals.", cite: {p: 226}}
          - {t: "Connect the negative meter probe to the G terminal. Keep the probe on the G terminal and touch the positive probe to terminals 1, 2 and 3. The meter must read zero to approximately one-half of the meter scale at all terminals.", cite: {p: 226}}
          - {t: "If any check gives a high or low reading in both directions, the regulator/rectifier is faulty.", cite: {p: 226}}

  - id: c09-stator-charging-coil-test
    title: "Stator charging coil test"
    system: "electrical system"
    source: clymer
    chapter: 9
    section: "09/charging-system"
    summary: {t: "The charging coils are in the alternator cover. Measure their resistance and test for continuity.", cite: {p: 226}}
    spec_refs: ["electrical-test:Stator coil resistance (yellow-to-yellow wires)"]
    sections:
      - steps:
          - {t: "Remove the fuel tank.", cite: {p: 226}, ref: "15/fuel-tank"}
          - {t: "Disconnect the connector on the right side of the frame.", cite: {p: 227}, figs: [51]}
          - {t: "Identify the connector half that goes to the stator.", cite: {p: 227}}
          - {t: "Set the ohmmeter to R x 1 ohm.", cite: {p: 227}}
          - {t: "Put the meter probes into the terminals of the yellow wires. Measure all three combinations of the yellow wires. Each pair must be in specification.", cite: {p: 227}, spec_ref: "electrical-test:Stator coil resistance (yellow-to-yellow wires)"}
          - {t: "If the charging coils are not in specification, examine the plug and the wiring harness for damage and shorts.", cite: {p: 227}}
          - {t: "If necessary, remove the alternator cover. Examine the wiring harness and the coils again.", cite: {p: 227}, op: c09-alternator-cover, figs: [52]}
          - {t: "Test the full length of each harness wire for continuity. All wires must have near zero resistance. Flex the harness during the test to find erratic continuity.", cite: {p: 227}}
          - {t: "If the harness has no short, measure the coils at the yellow wire connections on the stator.", cite: {p: 227}}
          - {t: "If the coils fail the test, unsolder the harness connections and measure the coils again.", cite: {p: 227}}
          - {t: "If the coils are in specification, a solder joint was poor or the wiring harness is shorted.", cite: {p: 227}}
          - {t: "If the coils still fail the test, replace the stator.", cite: {p: 227}}
          - {t: "Set the ohmmeter to R x 1 ohm.", cite: {p: 227}}
          - {t: "Ground one meter probe to the engine, or to the alternator cover if you removed it. Touch the other probe to the yellow wires. The resistance must be infinity.", cite: {p: 227}}
          - {t: "If you get any other reading, there is a short. Replace the stator.", cite: {p: 227}}
