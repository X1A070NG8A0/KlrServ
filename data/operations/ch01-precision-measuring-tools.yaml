operations:
  - id: c01-vernier-caliper-reading
    title: "Vernier caliper use and reading"
    system: "General information"
    source: clymer
    chapter: 1
    section: "01/precision-measuring-tools"
    summary: {t: "A caliper measures outside and depth dimensions, usually to within 0.05 mm (0.001 in.). This procedure shows how to read a vernier caliper in millimeters.", cite: {p: 28}}
    sections:
      - title: "Use"
        steps:
          - {t: "Make sure that there is no dirt or burrs between the caliper and the object.", cite: {p: 28}}
          - {t: "Close the caliper around the highest point of the object so that you can remove it with a slight drag.", cite: {p: 28}}
          - {kind: caution, t: "Do not force the caliper closed around an object.", cite: {p: 28}}
      - title: "Reading"
        steps:
          - {t: "Look at where the 0 line on the movable scale is in relation to the first line to the left on the fixed scale. This gives the first number. In the book example it is 10 mm.", cite: {p: 28}}
          - {t: "Find the line on the movable scale that aligns exactly with a mark on the fixed scale. Several lines can seem close, but only one aligns exactly.", cite: {p: 28}}
          - {t: "Add the value of that line to the first number. The movable scale has 0.05 mm increments. In the book example the value is 0.50 mm and the reading is 10.50 mm.", cite: {p: 28}}

  - id: c01-inch-micrometer-reading
    title: "Standard inch micrometer reading"
    system: "General information"
    source: clymer
    chapter: 1
    section: "01/precision-measuring-tools"
    summary: {t: "A standard inch micrometer is accurate to 0.001 in. The sleeve has marks at 0.025 in. increments. The thimble has 25 lines that each equal 0.001 in.", cite: {p: 30}}
    sections:
      - steps:
          - {t: "Make sure that there is no dirt or burrs between the micrometer and the object. Close the micrometer around the highest point so that you can remove it with a slight drag.", cite: {p: 30}}
          - {kind: caution, t: "Do not force the micrometer closed around an object.", cite: {p: 30}}
          - {t: "Read the sleeve and find the largest number that you can see. Each sleeve number equals 0.100 in.", cite: {p: 30}}
          - {t: "Count the lines between the numbered sleeve mark and the edge of the thimble. Each sleeve mark equals 0.025 in.", cite: {p: 30}}
          - {t: "Read the thimble mark that aligns with the sleeve line. Each thimble mark equals 0.001 in.", cite: {p: 30}}
          - {kind: note, t: "If a thimble mark does not align exactly with the sleeve line, estimate the amount between the lines. For readings in 0.0001 in., use a vernier inch micrometer.", cite: {p: 30}}
          - {t: "Add the three readings. In the book example, 0.200 in. plus 0.025 in. plus 0.006 in. is 0.231 in.", cite: {p: 31}}

  - id: c01-metric-micrometer-reading
    title: "Metric micrometer reading"
    system: "General information"
    source: clymer
    chapter: 1
    section: "01/precision-measuring-tools"
    summary: {t: "A standard metric micrometer is accurate to 0.01 mm. Each mark on the upper half of the sleeve line equals 1.00 mm. Each mark on the lower half equals 0.50 mm. The thimble has 50 lines that each equal 0.01 mm.", cite: {p: 30}}
    sections:
      - steps:
          - {t: "Read the upper half of the sleeve line. Count the lines that you can see. Each upper line equals 1 mm.", cite: {p: 30}}
          - {t: "If you can see the half-millimeter line on the lower sleeve line, add 0.50 mm to the reading.", cite: {p: 30}}
          - {t: "Read the thimble mark that aligns with the sleeve line. Each thimble mark equals 0.01 mm.", cite: {p: 31}}
          - {kind: note, t: "If a thimble mark does not align exactly with the sleeve line, estimate the amount between the lines. For readings in 0.002 mm, use a metric vernier micrometer.", cite: {p: 31}}
          - {t: "Add the readings.", cite: {p: 31}}

  - id: c01-micrometer-adjustment-check
    title: "Micrometer adjustment check and care"
    system: "General information"
    source: clymer
    chapter: 1
    section: "01/precision-measuring-tools"
    summary: {t: "Make sure that the micrometer is in adjustment before you use it. A micrometer is a precision instrument. Store and clean it with care.", cite: {p: 31}}
    sections:
      - title: "Adjustment check"
        steps:
          - {t: "Clean the anvil and spindle faces.", cite: {p: 31}}
          - {t: "To check a 0-1 in. or 0-25 mm micrometer, turn the thimble until the spindle touches the anvil. If the micrometer has a ratchet stop, use it.", cite: {p: 31}}
          - {t: "To check a larger micrometer, put the standard gauge from the manufacturer between the spindle and the anvil. If the micrometer has a ratchet stop, use it.", cite: {p: 31}}
          - {t: "Make sure that the 0 mark on the thimble aligns exactly with the 0 mark on the sleeve line.", cite: {p: 31}}
          - {t: "If the marks do not align, the micrometer is out of adjustment. Adjust it as the manufacturer instructs.", cite: {p: 31}}
      - title: "Care"
        steps:
          - {t: "Store the micrometer in a protective case or a separate padded drawer in a toolbox.", cite: {p: 31}}
          - {t: "In storage, make sure that the spindle and anvil faces do not touch each other or another object. Temperature changes and corrosion can damage the faces.", cite: {p: 31}}
          - {t: "Do not clean a micrometer with compressed air. Dirt forced into the tool causes wear.", cite: {p: 31}}
          - {t: "Lubricate the micrometer with WD-40 to prevent corrosion.", cite: {p: 32}}

  - id: c01-telescoping-gauge-use
    title: "Telescoping gauge use"
    system: "General information"
    source: clymer
    chapter: 1
    section: "01/precision-measuring-tools"
    summary: {t: "A telescoping gauge measures a bore, usually a cylinder bore. The gauge has no scale. Use an outside micrometer to get the reading.", cite: {p: 32}}
    sections:
      - steps:
          - {t: "Select the correct size gauge for the bore.", cite: {p: 32}}
          - {t: "Compress the movable post. Carefully put the gauge into the bore.", cite: {p: 32}}
          - {t: "Carefully move the gauge in the bore. Make sure that it is centered.", cite: {p: 32}}
          - {t: "Tighten the knurled end of the gauge to hold the movable post in position.", cite: {p: 32}}
          - {t: "Remove the gauge. Measure the length of the posts with an outside micrometer.", cite: {p: 32}}

  - id: c01-small-bore-gauge-use
    title: "Small-bore gauge use"
    system: "General information"
    source: clymer
    chapter: 1
    section: "01/precision-measuring-tools"
    summary: {t: "A small-bore (small-hole) gauge measures small bores, usually valve guides. The gauge has no scale. Use an outside micrometer to get the reading.", cite: {p: 32}}
    sections:
      - steps:
          - {t: "Select the correct size gauge for the bore.", cite: {p: 32}}
          - {t: "Carefully put the gauge into the bore.", cite: {p: 32}}
          - {t: "Tighten the knurled end of the gauge to expand the gauge fingers to the limit in the bore.", cite: {p: 32}}
          - {kind: caution, t: "Do not overtighten the gauge. It has no built-in release. Too much force can damage the bore surface and the tool.", cite: {p: 32}}
          - {t: "Remove the gauge. Measure the outside dimension with an outside micrometer.", cite: {p: 32}}
