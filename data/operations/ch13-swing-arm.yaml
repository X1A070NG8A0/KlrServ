operations:
  - id: c13-swing-arm-bearing-check
    title: "Swing arm bearing inspection"
    system: "Rear suspension"
    source: clymer
    chapter: 13
    section: "13/swing-arm"
    summary: {t: "You can examine the swing arm bearings with the swing arm on the motorcycle. Periodically examine the bearings for play, roughness and damage.", cite: {p: 287}}
    spec_refs: ["rear-suspension-torque:Swing arm pivot bolt"]
    sections:
      - steps:
          - {t: "Remove the rear wheel.", cite: {p: 287}, ref: "11/rear-wheel"}
          - {t: "Loosen the swing arm pivot nut.", cite: {p: 287}, figs: [29]}
          - {t: "Tighten the swing arm pivot nut to the specified torque.", cite: {p: 287}, spec_ref: "rear-suspension-torque:Swing arm pivot bolt", conflict: {note: "Kawasaki gives the same torque for the swing arm pivot bolt and nut.", agrees: true, others: [{t: "The swing arm pivot bolt and nut torque is 98 N-m (72 ft-lb).", cite: {s: kaw-supp, p: 15}}]}}
          - {t: "Remove the pivot bolt from the swing arm and the lever arms.", cite: {p: 287}, figs: [30]}
          - {t: "Separate the linkage so that only the swing arm pivot bolt controls the movement of the swing arm.", cite: {p: 287}}
          - {t: "Ask an assistant to hold the motorcycle steady.", cite: {p: 287}}
          - {t: "Hold the ends of the swing arm. Move the swing arm from side to side.", cite: {p: 287}}
          - {t: "Make sure that there is no play in the bearings.", cite: {p: 287}}
          - {t: "Move the swing arm up and down through its full travel. Make sure that the bearings turn smoothly.", cite: {p: 287}}
          - {t: "If there is play or roughness, remove the swing arm. Examine the bearings and the pivot parts for wear.", cite: {p: 287}, op: c13-swing-arm-removal}
          - {t: "Install the lever arms. Tighten the pivot bolt to the specified torque.", cite: {p: 287}, spec_ref: "rear-suspension-torque:Lever arm bolts"}

  - id: c13-swing-arm-removal
    title: "Swing arm removal and installation"
    system: "Rear suspension"
    source: clymer
    chapter: 13
    section: "13/swing-arm"
    summary: {t: "This procedure removes the swing arm from the frame and installs it again. To remove the linkage parts for service, loosen all pivot bolts before you remove the swing arm.", cite: {p: 287}}
    spec_refs: ["rear-suspension-torque:Swing arm pivot bolt"]
    parts:
      - {name: "Molydisulfide grease or waterproof grease", replace: consumable, cite: {p: 289}}
    sections:
      - title: "Removal"
        steps:
          - {kind: note, t: "The bolts are easier to loosen while the linkage is on the motorcycle. Note the direction of each pivot bolt that you remove.", cite: {p: 287}}
          - {t: "Remove the rear wheel.", cite: {p: 288}, ref: "11/rear-wheel"}
          - {t: "Remove the brake hose guide from the swing arm.", cite: {p: 288}, figs: [32]}
          - {t: "Remove the pivot bolt from the swing arm and the lever arms.", cite: {p: 288}, figs: [30]}
          - {t: "Remove the hose guide.", cite: {p: 288}, figs: [33]}
          - {t: "Remove the sprocket guard.", cite: {p: 288}, figs: [34]}
          - {t: "Remove the nut and the washer from the swing arm pivot bolt.", cite: {p: 288}, figs: [35]}
          - {t: "Ask an assistant to hold the swing arm. Pull the pivot bolt out of the swing arm.", cite: {p: 288}}
          - {t: "If you use a drift to drive out the bolt, do not cause damage to the bearing assemblies.", cite: {p: 288}}
          - {t: "Move the chain from behind the guards. Pull the swing arm out of the frame.", cite: {p: 288}, figs: [36]}
          - {t: "Examine and lubricate the swing arm.", cite: {p: 288}, op: c13-swing-arm-inspection}
          - {t: "If necessary, examine and repair the linkage.", cite: {p: 288}, ref: "13/shock-absorber-linkage", op: c13-lever-inspection}
      - title: "Installation"
        steps:
          - {t: "Lubricate all bearings, seals and pivot bolts with grease.", cite: {p: 289}}
          - {t: "Install the swing arm in the frame.", cite: {p: 289}}
          - {t: "Make sure that the chain goes over and under the swing arm pivot bolt.", cite: {p: 289}}
          - {t: "Install the pivot bolts in their correct direction.", cite: {p: 289}}
          - {t: "Tighten the pivot bolt to the specified torque.", cite: {p: 289}, spec_ref: "rear-suspension-torque:Swing arm pivot bolt"}
          - {t: "To install the complete shock linkage, lift the swing arm and hold it in position with wire. This gives more space for the linkage.", cite: {p: 289}}
          - {t: "As an option, install the linkage before you install the swing arm.", cite: {p: 289}, op: c13-lever-removal}
