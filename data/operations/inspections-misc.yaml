# Short inspection operations from Clymer Chapter Three, Maintenance and
# Inspection (PDF p67). One file holds several small operations.
operations:
  - id: evap-system
    title: "Evaporative emissions system inspection (California models only)"
    system: "Fuel system"
    source: clymer
    chapter: 3
    section: "03/maintenance-and-inspection"
    sections:
      - steps:
          - {t: "Do not adjust the evaporative emissions system. No adjustment is necessary.", cite: {p: 67}}
          - {t: "At the Table 1 intervals, examine the hoses and the connections.", cite: {p: 67}}
          - {kind: note, t: "Chapter Eight has a schematic of the system.", cite: {p: 67}, ref: "08/evaporative-emissions-control-system-california-models-only"}

  - id: fasteners
    title: "Fastener inspection"
    system: "General"
    source: clymer
    chapter: 3
    section: "03/maintenance-and-inspection"
    spec_refs:
      - "general-torque:8 mm thread"
    sections:
      - steps:
          - {t: "Examine all fasteners on the motorcycle. Make sure that they are tight and in good condition.", cite: {p: 67}}
          - {t: "Tighten nuts, bolts and screws to the torque in the tables at the end of each chapter (see the Specs page).", cite: {p: 67}}
          - {t: "If no torque value is specified, use the general torque values in Chapter One, Table 4.", cite: {p: 67}, ref: "01/fasteners"}
          - {t: "Make sure that all cotter pins are secure and not damaged.", cite: {p: 67}}
          - {t: "Make sure that the tie straps on the cables and wiring are not broken or missing.", cite: {p: 67}}

  - id: general-lubrication
    title: "General lubrication"
    system: "General"
    source: clymer
    chapter: 3
    section: "03/maintenance-and-inspection"
    sections:
      - steps:
          - {kind: note, t: "Table 1 lists \"Perform general lubrication\" but does not name a procedure.", cite: {p: 88}}
          - {kind: note, t: "The Periodic Lubrication section of Chapter Three has the procedures for engine oil, fork oil, control cables and the drive chain. The next two steps link to the cable and chain procedures.", cite: {p: 59}}
          - {t: "Lubricate the control cables and the lever pivots.", cite: {p: 63}, op: control-cables-lube}
          - {t: "Lubricate the drive chain.", cite: {p: 65}, op: drive-chain-adjust-lube}
