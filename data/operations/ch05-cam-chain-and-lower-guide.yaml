operations:
  - id: c05-cam-chain-and-lower-guide
    title: "Cam chain and lower guide removal, inspection and installation"
    system: "Engine lower end"
    source: clymer
    chapter: 5
    section: "05/cam-chain-and-lower-guide"
    summary: {t: "This procedure removes the cam chain and the lower guide, examines them and installs them again. If you will remove the engine balancer, you can remove the cam chain and the lower guide during the balancer procedure.", cite: {p: 128}}
    spec_refs: ["lower-end:Camshaft chain length (20 links/21 pins)", "lower-end-torque:Cam chain guide bolt"]
    parts:
      - {name: "Cam chain", replace: inspect, cite: {p: 129}, note: "Replace the chain if it is longer than the service limit."}
      - {name: "Cam chain guide", replace: inspect, cite: {p: 129}, note: "Replace the guide if its face is worn."}
      - {name: "Threadlocking compound", replace: consumable, cite: {p: 129}}
    sections:
      - title: "Removal"
        steps:
          - {t: "Remove the camshafts. Remove the cam chain from the camshaft sprockets.", cite: {p: 128}, ref: "04/camshafts-and-cam-chain-tensioner", op: c04-camshaft-removal}
          - {t: "Remove the alternator cover and the rotor.", cite: {p: 128}, ref: "09/alternator-cover", op: c09-rotor-removal-installation}
          - {t: "Remove the cam chain guide and the balancer chain guide.", cite: {p: 128}, figs: [5]}
          - {t: "If necessary, turn the crankshaft to get to the bolt behind the front left balancer weight.", cite: {p: 128}}
          - {t: "Remove the cam chain from the sprocket.", cite: {p: 128}}
      - title: "Inspection"
        steps:
          - {t: "Pull the cam chain tight. Measure the length of a 20-link span (21 pins).", cite: {p: 129}, spec_ref: "lower-end:Camshaft chain length (20 links/21 pins)", figs: [6]}
          - {t: "Do the measurement again on different lengths of the chain.", cite: {p: 129}}
          - {t: "Examine the face of the chain guide for wear.", cite: {p: 129}}
      - title: "Installation"
        steps:
          - {t: "Install the cam chain and the guides in the reverse order of removal.", cite: {p: 129}}
          - {t: "Make sure that the shouldered spacer is correctly seated in the cam chain guide. The guide must pivot on the spacer.", cite: {p: 129}}
          - {t: "Apply threadlocking compound to the threads of the bolts.", cite: {p: 129}}
          - {t: "Tighten the bolts to the specified torque.", cite: {p: 129}, spec_ref: "lower-end-torque:Cam chain guide bolt"}
