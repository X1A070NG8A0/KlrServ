operations:
  - id: c04-cylinder-head-removal
    title: "Cylinder head removal"
    system: "Engine top end"
    source: clymer
    chapter: 4
    section: "04/cylinder-head"
    summary: {t: "This procedure removes the cylinder head with the engine in the frame. The cylinder head comes out of the left side of the engine.", cite: {p: 103}}
    parts:
      - {name: "Cylinder head gasket", replace: always, cite: {p: 106}, note: "Install a new gasket."}
      - {name: "Valve lifter shims", replace: inspect, cite: {p: 103}, note: "Mark the location of each shim. The shims can have different thickness."}
    sections:
      - title: "Removal"
        steps:
          - {t: "Drain the engine coolant.", cite: {p: 103}, op: coolant-replace}
          - {t: "Remove the coolant hose, the thermostat and the thermostat housing.", cite: {p: 103}, figs: [35], ref: "10/thermostat"}
          - {t: "Remove the carburetor.", cite: {p: 103}, ref: "08/carburetor"}
          - {t: "Remove the exhaust pipe.", cite: {p: 103}, op: c04-exhaust-system}
          - {t: "Remove the cylinder head cover, the camshafts and the cam chain tensioner.", cite: {p: 103}, op: c04-camshaft-removal}
          - {t: "Turn each valve lifter so that you can get to the notch in the edge of the lifter.", cite: {p: 103}}
          - {t: "Put a small-tipped tool between the shim and the lifter. Tilt the tool back to break the oil adhesion between the parts.", cite: {p: 103}, figs: [21]}
          - {t: "Remove the shim and mark its location in the cylinder head.", cite: {p: 103}}
          - {t: "Make a drawing of the cylinder head. Put the parts from each location in the correct position on the drawing.", cite: {p: 103}}
          - {t: "Remove the banjo bolt and the seal washers from the oil pipe.", cite: {p: 103}, figs: [36]}
          - {t: "Remove the nut from the rear of the cylinder head.", cite: {p: 103}, figs: [36]}
          - {t: "Remove the nut and the bolt from the front of the cylinder head.", cite: {p: 103}, figs: [37]}
          - {t: "Put clean shop cloths in the cam chain tunnel to prevent parts from going into the engine.", cite: {p: 103}}
          - {t: "On 1987-1995 models, remove the two cylinder head bolts in the cam chain tunnel. Use a socket and an extension. Make sure that the socket and extension fit together tightly and cannot separate when you lower them into the tunnel.", cite: {p: 103}}
          - {kind: note, t: "On later models, these two bolts are the outer bolts that hold the upper chain guide. You removed them during camshaft removal.", cite: {p: 103}}
          - {t: "Loosen the four cylinder head bolts (10 mm) in a crossing pattern and in several passes.", cite: {p: 103}, figs: [38, 39]}
          - {kind: caution, t: "Do not remove the four cylinder head bolts before you remove the nuts and the bolt in the previous steps. If you do, the smaller fasteners have too much stress.", cite: {p: 103}}
          - {t: "Tap lightly around the base of the cylinder head with a soft mallet to loosen it.", cite: {p: 103}}
          - {t: "Lift the head out of the left side of the engine. Route the cam chain out of the head.", cite: {p: 103}}
          - {t: "Secure the chain so that it does not fall into the engine.", cite: {p: 103}}
          - {t: "Put clean shop cloths in the cam chain tunnel.", cite: {p: 104}}
          - {t: "Remove the head gasket, the two dowels, the front chain guide and the rubber damper from the cylinder.", cite: {p: 104}, figs: [40]}
          - {t: "At the workbench, remove the spark plug, the water temperature sending unit, the carburetor intake duct and the rear cam chain guide.", cite: {p: 104}}
          - {t: "Remove the valve lifters. Record their location in the head and keep them with the shims.", cite: {p: 104}, figs: [41]}
          - {t: "If necessary, remove the valve assembly.", cite: {p: 104}, op: c04-valve-removal}
      - title: "Cleaning"
        steps:
          - {t: "Wash all parts in solvent and dry them with compressed air.", cite: {p: 104}}
          - {t: "Remove all gasket residue from the cylinder head and the cylinder. Do not scratch or gouge the surfaces.", cite: {p: 104}}
          - {t: "Remove all carbon deposits from the combustion chamber with solvent and a soft brush or a hardwood scraper.", cite: {p: 104}}
          - {kind: caution, t: "Do not use sharp-edged tools. They can scratch the valves or the combustion chamber.", cite: {p: 104}}
          - {t: "If you clean the piston crown, keep solvent and carbon deposits out of the gap between the piston and the cylinder.", cite: {p: 104}}
          - {kind: caution, t: "If the valves are out of the head, clean the valve seats with care. A scratched or gouged valve seat does not seal correctly.", cite: {p: 104}}
          - {t: "If the cylinder head will be bead-blasted, wash the complete assembly in hot soapy water after the reconditioning. This removes blasting grit from crevices and threads.", cite: {p: 104}}
          - {t: "Clean and chase all threads after bead-blasting. Grit that stays in the head goes into the engine oil and the oil circulates it to other parts. This damages the bearings, the piston and the rings.", cite: {p: 104}}
          - {t: "Make sure that there is no debris or blockage in the oil passages.", cite: {p: 104}}
          - {t: "Examine all parts for wear or damage.", cite: {p: 104}}
          - {t: "Examine the cylinder head.", cite: {p: 104}, op: c04-cylinder-head-inspection}

  - id: c04-cylinder-head-inspection
    title: "Cylinder head inspection"
    system: "Engine top end"
    source: clymer
    chapter: 4
    section: "04/cylinder-head"
    summary: {t: "This procedure examines the cylinder head for thread damage, cracks, wear and warp. Each time that you remove the cylinder head, do the solvent test on the valves.", cite: {p: 104}}
    spec_refs: ["top-end:Cylinder head warp limit"]
    parts:
      - {name: "Cylinder head and camshaft cap set", replace: inspect, cite: {p: 105}, note: "If the camshaft bearing surfaces or the caps have damage, replace the caps and the cylinder head as a set. If the head has cracks and a shop cannot repair it, replace the head and the camshaft cap set."}
      - {name: "Cylinder fasteners", replace: inspect, cite: {p: 105}, note: "Replace fasteners that are rusted."}
      - {name: "Cam chain guides", replace: inspect, cite: {p: 105}}
      - {name: "Antiseize compound", replace: consumable, cite: {p: 105}}
    sections:
      - steps:
          - {t: "Do the solvent test on the valves.", cite: {p: 104}, op: c04-valve-solvent-test}
          - {t: "Examine the threads of the spark plug hole. If the threads are dirty or have minor damage, clean and straighten them with a spark plug thread tap.", cite: {p: 104}}
          - {t: "Keep the tap lubricated while you clean the threads.", cite: {p: 104}}
          - {t: "If the threads are galled, stripped or cross-threaded, install a steel thread insert, for example a HeliCoil, in the cylinder head.", cite: {p: 105}}
          - {kind: note, t: "To decrease thread damage, apply antiseize compound to the spark plug threads before you install the plug. Do not tighten the spark plug too much.", cite: {p: 105}}
          - {t: "If necessary, clean the complete cylinder head after the thread repair.", cite: {p: 105}}
          - {t: "Examine the combustion chamber, the water jackets and the exhaust port for cracks or damage.", cite: {p: 105}, figs: [42]}
          - {t: "Examine the studs for damage or looseness.", cite: {p: 105}, figs: [42]}
          - {t: "Examine the outside of the cylinder head around the holes for the spark plug and the water temperature sending unit for cracks or damage.", cite: {p: 105}, figs: [43]}
          - {t: "Examine the camshaft bearing surfaces and the mating caps for scoring or damage. If either part has damage, replace the caps and the cylinder head as a set.", cite: {p: 105}}
          - {kind: note, t: "The parts are available only as one part number. The caps are machined with the cylinder head. Their dimensions and alignments are unique to that cylinder head.", cite: {p: 105}}
          - {t: "If the head has cracks, take it to a dealership or machine shop to find if they can repair it. If they cannot, replace the head and the camshaft cap set.", cite: {p: 105}}
          - {t: "Put a machinist's straightedge across the cylinder head.", cite: {p: 105}, figs: [44]}
          - {t: "Try to put a flat feeler gauge between the straightedge and the machined surface of the head. If there is clearance, record the maximum measurement.", cite: {p: 105}}
          - {t: "Do again the two previous steps several times. Put the straightedge across the head and diagonally on the head.", cite: {p: 105}}
          - {t: "Compare the measurements to the warp limit.", cite: {p: 105}, spec_ref: "top-end:Cylinder head warp limit"}
          - {t: "If the clearance is more than the limit, take the cylinder head to a dealership or machine shop for more inspection and possible resurfacing.", cite: {p: 105}}
          - {t: "Examine the front and rear cam chain guides for wear and damage.", cite: {p: 105}, figs: [45]}
          - {t: "Examine the cylinder fasteners for damaged threads and heads. Replace fasteners that are rusted.", cite: {p: 105}, figs: [46]}

  - id: c04-cylinder-head-installation
    title: "Cylinder head installation"
    system: "Engine top end"
    source: clymer
    chapter: 4
    section: "04/cylinder-head"
    summary: {t: "This procedure installs the cylinder head, tightens the head fasteners and installs the parts that you removed from the head.", cite: {p: 106}}
    spec_refs: ["top-end-torque:Cylinder head bolts (sequence in text)/10 mm, first stage", "top-end-torque:Cylinder head bolts (sequence in text)/10 mm, second stage", "top-end-torque:Cylinder head nuts", "top-end-torque:Cylinder head bolts (sequence in text)/8 mm", "top-end-torque:Cylinder head bolts (sequence in text)/6 mm", "top-end-torque:Oil pipe/Banjo bolts", "top-end-torque:Oil pipe/Retainer bolt"]
    parts:
      - {name: "Cylinder head gasket", replace: always, cite: {p: 106}}
      - {name: "Oil pipe seal washers", replace: always, cite: {p: 107}}
      - {name: "Spark plug", replace: always, cite: {p: 107}, note: "Install a new spark plug.", }
      - {name: "Molybdenum disulfide grease", replace: consumable, cite: {p: 106}}
      - {name: "Threadlocking compound", replace: consumable, cite: {p: 98}}
    sections:
      - title: "Cylinder head"
        steps:
          - {t: "Make sure that you removed all gasket residue from all mating surfaces. All surfaces of the cylinder head must be clean and dry.", cite: {p: 106}}
          - {kind: note, t: "You can install the valve lifters and the shims after you install the cylinder head.", cite: {p: 106}}
          - {t: "Install the rear cam chain guide in the cam chain tunnel.", cite: {p: 106}}
          - {t: "Install the front cam chain guide and the rubber damper. Seat the guide in the notch.", cite: {p: 106}}
          - {t: "Install the dowels and a new cylinder head gasket on the cylinder.", cite: {p: 106}, figs: [47]}
          - {t: "Lower the cylinder head onto the engine. Route the cam chain through the head.", cite: {p: 106}}
          - {t: "Keep tension on the cam chain so that it does not bind at the crankshaft sprocket. Secure the cam chain when the head is seated.", cite: {p: 106}}
          - {t: "Do not move the dowels out of position when you put the head in position.", cite: {p: 106}}
          - {t: "Cover the engine openings as necessary.", cite: {p: 106}}
          - {t: "Apply molybdenum disulfide grease to the threads of the four cylinder head bolts (10 mm) and to the seating surface on the heads.", cite: {p: 106}, figs: [48]}
          - {t: "Install the four 10 mm bolts. Tighten them in the sequence in the torque sequence figure. In the first pass, tighten the bolts to the first stage torque.", cite: {p: 106}, figs: [49], spec_ref: "top-end-torque:Cylinder head bolts (sequence in text)/10 mm, first stage", conflict: {note: "The supplement gives the same two torque stages for the 10 mm bolts.", agrees: true, others: [{t: "Torque the 10 mm bolts first to 20 N-m (14.5 ft-lb) and then to 65 N-m (48 ft-lb) in the tightening sequence.", cite: {s: kaw-supp, p: 32}}]}, diagram: c04-head-torque-sequence}
          - {t: "In the second pass, tighten the 10 mm bolts to the second stage torque.", cite: {p: 106}, figs: [49], spec_ref: "top-end-torque:Cylinder head bolts (sequence in text)/10 mm, second stage"}
          - {t: "Install the nut at the rear of the cylinder head and the nut and bolt at the front of the head. Tighten them by hand.", cite: {p: 107}, figs: [37]}
          - {t: "Tighten the nuts in the sequence in the torque sequence figure. Tighten each nut two times before you tighten the bolt.", cite: {p: 107}, figs: [49], spec_ref: "top-end-torque:Cylinder head nuts", diagram: c04-head-torque-sequence}
          - {kind: note, t: "A 12 mm crowfoot wrench can help. If necessary, put a torque adapter wrench on the torque wrench to get to the nuts. Adjust the torque reading when you use an adapter.", cite: {p: 107}, ref: "01/basic-tools"}
          - {t: "Tighten the 8 mm bolt to the specified torque.", cite: {p: 107}, spec_ref: "top-end-torque:Cylinder head bolts (sequence in text)/8 mm"}
          - {kind: note, t: "After you start the engine and it cools completely, tighten the nuts and the bolt again.", cite: {p: 107}}
          - {t: "On 1987-1995 models, install the two 6 mm cylinder head bolts in the cam chain tunnel. On 1996-on models, these are the outer bolts that hold the upper chain guide. You install them during camshaft installation.", cite: {p: 106}}
          - {t: "Put clean shop cloths in the cam chain tunnel to prevent parts from going into the engine.", cite: {p: 107}}
          - {t: "Tighten the bolts with a socket and an extension in the sequence in the figure. Make sure that the socket and extension fit together tightly and cannot separate when you lower them into the tunnel.", cite: {p: 107}, figs: [49], diagram: c04-head-torque-sequence}
          - {t: "Tighten the 6 mm bolts to the specified torque.", cite: {p: 107}, spec_ref: "top-end-torque:Cylinder head bolts (sequence in text)/6 mm", conflict: {note: "The supplement gives 9.8 N-m for the 6 mm bolts, almost the same as the Clymer value.", agrees: true, others: [{t: "Tighten the 6 mm cylinder head bolts to 9.8 N-m (87 in-lb).", cite: {s: kaw-supp, p: 32}}]}}
      - title: "Oil pipe, lifters and shims"
        steps:
          - {t: "Install the oil pipe. Install new seal washers and tighten the banjo bolt to the specified torque.", cite: {p: 107}, figs: [36], spec_ref: "top-end-torque:Oil pipe/Banjo bolts"}
          - {t: "If you removed the complete oil pipe assembly from the crankcase, align it and tighten all banjo bolts and the retainer bolt by hand before you tighten them to the torque.", cite: {p: 107}}
          - {t: "Tighten the retainer bolt to the specified torque.", cite: {p: 107}, spec_ref: "top-end-torque:Oil pipe/Retainer bolt"}
          - {t: "Lubricate the valve lifters with engine oil. Put them in their bores.", cite: {p: 107}, figs: [50]}
          - {t: "Put the shims in the valve lifters. If the shim size is stamped on the shim, put the number down. The cam lobe then does not wear it away.", cite: {p: 107}, figs: [51]}
          - {kind: note, t: "If you did not recondition or disturb the valve assembly when you removed the head, install the original shim. If the clearance was not correct before you removed the head, use the valve adjustment procedure to find the correct shim size.", cite: {p: 107}, op: valve-clearance}
          - {kind: note, t: "If you reconditioned the valves, install the original shim now. Measure the valve clearance after you install the camshafts. It is possible that you must remove the camshafts a second time to set the valves correctly.", cite: {p: 107}}
      - title: "Final installation"
        steps:
          - {t: "Install the cam chain tensioner, the camshafts and the cylinder head cover.", cite: {p: 107}, op: c04-camshaft-installation}
          - {t: "Install a new spark plug.", cite: {p: 107}, op: spark-plug}
          - {t: "Install the water temperature sending unit, the thermostat and the coolant hose.", cite: {p: 107}, ref: "10/thermostat"}
          - {t: "Fill the engine with coolant.", cite: {p: 108}, op: coolant-replace}
          - {t: "Install the carburetor.", cite: {p: 108}, ref: "08/carburetor"}
          - {t: "Install the exhaust pipe.", cite: {p: 108}, op: c04-exhaust-system}
