operations:
  - id: c10-water-pump-removal
    title: "Water pump removal, inspection and installation"
    system: "Cooling system"
    source: clymer
    chapter: 10
    section: "10/water-pump"
    summary: {t: "This procedure removes the water pump cover and the impeller, examines the parts and installs them again. You can remove the cover without removal of the right crankcase cover.", cite: {p: 239}}
    spec_refs: ["cooling-torque:Impeller nut"]
    parts:
      - {name: "Water pump cover gasket", replace: always, cite: {p: 240}}
      - {name: "Impeller O-ring", replace: always, cite: {p: 240}}
      - {name: "Waterproof grease", replace: consumable, cite: {p: 240}}
    sections:
      - title: "Removal"
        steps:
          - {t: "Drain the cooling system.", cite: {p: 239}, op: coolant-replace}
          - {t: "If necessary, remove the hoses from the water pump cover.", cite: {p: 239}}
          - {t: "Remove the three bolts that hold the water pump cover.", cite: {p: 239}, figs: [12]}
          - {t: "Tap the cover lightly to loosen it from the crankcase cover.", cite: {p: 239}}
          - {t: "Pull the cover straight out.", cite: {p: 239}, figs: [10]}
          - {t: "Remove the gasket and the two dowels from below the cover.", cite: {p: 239}}
          - {t: "Remove the nut and the washer from the impeller.", cite: {p: 239}, figs: [13]}
          - {t: "Remove the impeller and the washer behind it.", cite: {p: 239}, figs: [14]}
      - title: "Inspection"
        steps:
          - {t: "Examine the impeller and the cover for damage.", cite: {p: 239}}
          - {t: "Examine the face of the mechanical seal on the impeller and in the right crankcase cover.", cite: {p: 239}, figs: [14]}
          - {t: "Make sure that both faces are smooth and have no scoring or damage.", cite: {p: 239}}
          - {t: "If a face is damaged, replace the mechanical seal and the oil seal.", cite: {p: 239}, op: c10-water-pump-seal-replacement}
          - {kind: note, t: "When the parts are installed, the impeller seal must fit firmly against the seal in the crankcase cover. A spring in the crankcase cover seal keeps pressure on the seals and compensates for wear.", cite: {p: 239}}
          - {t: "Install a new O-ring inside the impeller. Lubricate the O-ring with waterproof grease.", cite: {p: 240}, figs: [14]}
          - {t: "If necessary, remove the right crankcase cover.", cite: {p: 240}, ref: "06/right-crankcase-cover"}
      - title: "Installation"
        steps:
          - {t: "Apply waterproof grease to the impeller shaft.", cite: {p: 240}}
          - {t: "Install the impeller, the washers and the nut.", cite: {p: 240}}
          - {t: "Tighten the impeller nut to the specified torque.", cite: {p: 240}, spec_ref: "cooling-torque:Impeller nut"}
          - {t: "Install the two dowels and a new gasket.", cite: {p: 240}}
          - {t: "Install the water pump cover.", cite: {p: 240}}
          - {t: "Fill the cooling system and remove the air from it.", cite: {p: 240}, op: coolant-replace}
          - {t: "Start the engine and let it get warm.", cite: {p: 240}}
          - {t: "Look for leaks.", cite: {p: 240}}

  - id: c10-water-pump-seal-replacement
    title: "Water pump mechanical seal and oil seal replacement"
    system: "Cooling system"
    source: clymer
    chapter: 10
    section: "10/water-pump"
    summary: {t: "This procedure replaces the two-piece mechanical seal and the oil seal of the water pump. Do this procedure when coolant or oil leaks from the inspection hole at the bottom of the case.", cite: {p: 240}}
    parts:
      - {name: "Mechanical seal", replace: always, cite: {p: 240}, note: "The seal has two pieces. One piece is in the impeller and one piece is in the right crankcase cover."}
      - {name: "Oil seal", replace: always, cite: {p: 240}}
      - {name: "Waterproof grease", replace: consumable, cite: {p: 240}}
      - {name: "Molybdenum disulfide grease", replace: consumable, cite: {p: 241}}
    sections:
      - title: "Diagnosis"
        steps:
          - {t: "Look at the inspection hole at the bottom of the case.", cite: {p: 239}, figs: [11]}
          - {t: "If water leaks from the hole, the mechanical seal leaks.", cite: {p: 239}}
          - {t: "If oil leaks from the hole, the oil seal leaks.", cite: {p: 239}}
          - {kind: note, t: "You must remove the right crankcase cover to replace the seals. The mechanical seal keeps coolant out of the right crankcase cover. The oil seal keeps oil out of the pump chamber. The drain hole is between the two seals.", cite: {p: 240}, figs: [15], ref: "06/right-crankcase-cover"}
      - title: "Impeller seal"
        steps:
          - {t: "Lift the impeller seal from the impeller. Clean the seal bore.", cite: {p: 240}, figs: [16]}
          - {t: "Lubricate the rubber edge of the new seal lightly with waterproof grease.", cite: {p: 240}}
          - {t: "Seat the new seal in the impeller by hand.", cite: {p: 240}}
      - title: "Crankcase cover seals"
        steps:
          - {t: "Remove the mechanical seal from the crankcase cover before you remove the oil seal.", cite: {p: 240}}
          - {t: "Put a narrow drift under the oil seal and on the back of the mechanical seal. Work around the seal and drive it from the bore.", cite: {p: 240}, figs: [17]}
          - {t: "Do not let the drift touch the surface of the bore.", cite: {p: 240}}
          - {t: "Do not pry the seal from the front side of the crankcase cover.", cite: {p: 240}}
          - {t: "Put a driver on the oil seal and drive it from the bore.", cite: {p: 241}}
          - {t: "Turn the crankcase cover over. Clean the bore and the drain hole.", cite: {p: 241}}
          - {t: "Pack molybdenum disulfide grease into the lip of the new oil seal.", cite: {p: 241}}
          - {t: "Put the oil seal over the bore of the crankcase cover with the closed side up.", cite: {p: 241}}
          - {t: "Drive the seal into the cover with a driver that fits on the perimeter of the seal.", cite: {p: 241}}
          - {t: "Make sure that the seal is fully seated and that you can see the drain hole.", cite: {p: 241}}
          - {t: "Lubricate the outside of the mechanical seal lightly.", cite: {p: 241}}
          - {t: "Put the mechanical seal over the bore of the crankcase cover.", cite: {p: 241}}
          - {t: "Drive the seal into the bore with a driver that fits on the flange at the perimeter of the seal.", cite: {p: 241}, figs: [18]}
