operations:
  - id: c04-valve-solvent-test
    title: "Valve solvent test"
    system: "Engine top end"
    source: clymer
    chapter: 4
    section: "04/valves"
    summary: {t: "This test shows if the valves seat fully. It can also show cracks in the cylinder head that you did not find before. Do the test with the valve assembly in the cylinder head.", cite: {p: 108}}
    parts:
      - {name: "Solvent or kerosene", replace: consumable, cite: {p: 108}}
    sections:
      - steps:
          - {t: "Remove the cylinder head.", cite: {p: 108}, op: c04-cylinder-head-removal}
          - {t: "Make sure that the combustion chamber is dry and the valves are seated.", cite: {p: 108}}
          - {t: "Support the cylinder head so that the port faces up.", cite: {p: 108}, figs: [52]}
          - {t: "Pour solvent or kerosene into the port.", cite: {p: 108}}
          - {t: "Examine the combustion chamber for leakage around the valve.", cite: {p: 108}}
          - {t: "Do again the previous three steps for the other valves.", cite: {p: 108}}
          - {t: "If there is leakage, the cause can be a worn or damaged valve face, a worn or damaged valve seat in the cylinder head, a bent valve stem or a crack in the combustion chamber.", cite: {p: 108}}

  - id: c04-valve-removal
    title: "Valve removal"
    system: "Engine top end"
    source: clymer
    chapter: 4
    section: "04/valves"
    summary: {t: "This procedure removes the valves from the cylinder head with a valve spring compressor. Do the procedure for each valve.", cite: {p: 108}}
    parts:
      - {name: "Valve spring compressor, part No. 57001-241 or equivalent", replace: consumable, cite: {p: 108}, note: "Special tool."}
      - {name: "Valve spring compressor adapter, part No. 57001-243 or equivalent", replace: consumable, cite: {p: 108}, note: "Special tool."}
      - {name: "Valve oil seal", replace: always, cite: {p: 109}}
      - {name: "Valve oil seal circlip", replace: always, cite: {p: 109}}
    sections:
      - steps:
          - {t: "Remove the cylinder head, the shims and the valve lifters.", cite: {p: 108}, op: c04-cylinder-head-removal}
          - {t: "Do the solvent test on the intake and exhaust valves.", cite: {p: 108}, op: c04-valve-solvent-test}
          - {t: "Put a valve spring compressor (part No. 57001-241 or equivalent) and an adapter (part No. 57001-243 or equivalent) over the valve assembly.", cite: {p: 108}, figs: [54]}
          - {t: "Put the fixed end of the tool squarely over the valve head. Put the other end squarely on the spring retainer.", cite: {p: 108}, figs: [54]}
          - {t: "Tighten the compressor until the spring retainer no longer holds the valve keepers in position.", cite: {p: 109}}
          - {t: "Lift the keepers from the valve stem. A magnetic tool works well.", cite: {p: 109}, figs: [55]}
          - {kind: caution, t: "Do not tighten the compressor too much and compress the valve springs too much. This can cause a loss of valve spring tension.", cite: {p: 109}}
          - {t: "Slowly release the pressure on the valve springs. Remove the compressor from the head.", cite: {p: 109}}
          - {t: "Remove the spring retainer and the valve springs.", cite: {p: 109}}
          - {t: "Slide the circlip on the oil seal down. Remove the oil seal, the circlip and the spring seat.", cite: {p: 109}}
          - {t: "Examine the valve stem for sharp and flared metal around the groove for the keepers.", cite: {p: 109}, figs: [56]}
          - {t: "If necessary, deburr the valve stem before you remove the valve from the head. Burrs on the valve stem can cause damage to the valve guides.", cite: {p: 109}}
          - {t: "Remove the valve from the cylinder head.", cite: {p: 109}}
          - {t: "Keep the parts of each valve assembly with the shim and the valve lifter for that location.", cite: {p: 109}, figs: [57]}
          - {kind: caution, t: "Install valve components that are in specification in their original positions. Replace the oil seal and the circlip.", cite: {p: 109}}
          - {t: "Do again the procedure for the remaining valves.", cite: {p: 109}}

  - id: c04-valve-inspection
    title: "Valve component inspection"
    system: "Engine top end"
    source: clymer
    chapter: 4
    section: "04/valves"
    summary: {t: "This procedure examines and measures the valves, the valve guides, the valve springs and the valve seats. Do not mix the sets of parts. Work with one set at a time and put each set in its container after the inspection.", cite: {p: 109}}
    spec_refs: ["top-end:Valve head thickness (margin above seat)/Intake", "top-end:Valve head thickness (margin above seat)/Exhaust", "top-end:Valve stem/Intake outside diameter", "top-end:Valve stem/Exhaust outside diameter", "top-end:Valve stem/Runout (total indicator reading)", "top-end:Valve guide inside diameter/Intake and exhaust", "top-end:Valve spring free length/Inner intake and exhaust", "top-end:Valve spring free length/Outer intake and exhaust", "top-end:Valve seat/Width"]
    parts:
      - {name: "Valve", replace: inspect, cite: {p: 110}, note: "If the valve has damage, replace it."}
      - {name: "Valve springs", replace: inspect, cite: {p: 111}}
      - {name: "Valve guide", replace: inspect, cite: {p: 111}, note: "If the valve guide, the valve or the valve seat must be replaced or reconditioned, have a dealership do the work."}
    sections:
      - steps:
          - {kind: note, t: "If you must replace or recondition the valves, the valve guides or the valve seats, a dealership must do the work. These parts must be replaced or reconditioned as a set. The work needs special equipment and experience.", cite: {p: 109}}
          - {t: "Clean the valve assembly in solvent.", cite: {p: 110}}
          - {kind: caution, t: "Do not damage the valve seating surface. Do not scrape on it. Do not put the valve where it can roll off the work surface.", cite: {p: 110}}
          - {t: "Examine the top and the perimeter of each valve for burning or other damage on the top and the seating surface. If there is damage, replace the valve.", cite: {p: 110}}
          - {t: "If the valve head is uniform and has only minor wear, you can lap the valve and use it again. The other valve measurements must be in specification.", cite: {p: 110}, op: c04-valve-lapping}
          - {t: "Measure the thickness (margin) of the intake valve head. Record the measurement.", cite: {p: 110}, figs: [58], spec_ref: "top-end:Valve head thickness (margin above seat)/Intake"}
          - {t: "Measure the thickness (margin) of the exhaust valve head. Record the measurement.", cite: {p: 110}, figs: [58], spec_ref: "top-end:Valve head thickness (margin above seat)/Exhaust"}
          - {t: "Examine the valve stem for wear and scoring. Examine the end of the stem for flare.", cite: {p: 110}}
          - {t: "Measure the diameter of the intake valve stem. Record the measurement.", cite: {p: 110}, figs: [59], spec_ref: "top-end:Valve stem/Intake outside diameter"}
          - {t: "Measure the diameter of the exhaust valve stem. Record the measurement.", cite: {p: 110}, figs: [59], spec_ref: "top-end:Valve stem/Exhaust outside diameter"}
          - {t: "Put the valve in a V-block. Measure the runout with a dial indicator. Record the measurement.", cite: {p: 110}, figs: [60], spec_ref: "top-end:Valve stem/Runout (total indicator reading)"}
          - {t: "If you have a small hole gauge and a micrometer, clean the valve guides of all carbon and varnish. Use solvent and a stiff narrow brush.", cite: {p: 110}, figs: [61]}
          - {t: "Measure each valve guide hole at the top, the center and the bottom with the small hole gauge and the micrometer. Record the measurements.", cite: {p: 110}, spec_ref: "top-end:Valve guide inside diameter/Intake and exhaust"}
          - {t: "If you do not have a small hole gauge and a micrometer, put the correct valve into the guide.", cite: {p: 111}}
          - {t: "With the valve head off the seat, move the valve stem from side to side in the guide. Move the valve in several directions.", cite: {p: 111}}
          - {t: "If you can easily detect movement, the valve guide or the valve is worn. Take the valves and the cylinder head to a dealership to have the parts measured accurately.", cite: {p: 111}}
          - {t: "Examine the inner and outer valve springs for damage.", cite: {p: 111}}
          - {t: "Measure the free length of the inner valve spring.", cite: {p: 111}, figs: [62], spec_ref: "top-end:Valve spring free length/Inner intake and exhaust"}
          - {t: "Measure the free length of the outer valve spring.", cite: {p: 111}, figs: [62], spec_ref: "top-end:Valve spring free length/Outer intake and exhaust"}
          - {t: "Examine the valve spring seat, the spring retainer, the keepers and the valve lifter for wear or damage.", cite: {p: 111}}
          - {t: "To find if you must recondition the valve seats, clean and dry the valve seat and the valve mating area with contact cleaner.", cite: {p: 111}, figs: [63]}
          - {t: "Coat the valve seat with machinist's marking fluid.", cite: {p: 111}}
          - {t: "Put the correct valve into the guide. Tap the valve lightly against the seat so that the fluid transfers to the valve contact area. Do not turn the valve.", cite: {p: 111}}
          - {t: "Remove the valve from the guide. Measure the width of the imprinted valve seat at several locations.", cite: {p: 111}, figs: [64], spec_ref: "top-end:Valve seat/Width"}
          - {t: "Clean all marking fluid from the valves and the seats.", cite: {p: 111}}

  - id: c04-valve-installation
    title: "Valve installation"
    system: "Engine top end"
    source: clymer
    chapter: 4
    section: "04/valves"
    summary: {t: "This procedure installs the valves in the cylinder head. Do the procedure for each set of valve components. All components must be clean and dry.", cite: {p: 111}}
    parts:
      - {name: "Valve oil seal", replace: always, cite: {p: 112}}
      - {name: "Valve oil seal circlip", replace: always, cite: {p: 109}}
      - {name: "Molybdenum disulfide grease", replace: consumable, cite: {p: 111}}
    sections:
      - steps:
          - {t: "Coat the valve stem and the inside of the oil seal with molybdenum disulfide grease.", cite: {p: 111}}
          - {t: "Install the spring seat in the head.", cite: {p: 112}}
          - {t: "Install a new oil seal on the valve guide. Make sure that the circlip seats on the seal and the valve guide.", cite: {p: 112}}
          - {t: "Put the correct valve into the cylinder head. Turn the valve stem as it goes into and through the seal.", cite: {p: 112}}
          - {t: "Make sure that the seal stays seated. Hold the valve in position.", cite: {p: 112}}
          - {t: "Install the inner and outer valve springs with the small coil pitch down.", cite: {p: 112}, figs: [65]}
          - {t: "Install the spring retainer.", cite: {p: 112}}
          - {t: "Put a valve spring compressor over the valve assembly. Put the tool squarely on the spring retainer.", cite: {p: 112}}
          - {t: "Tighten the compressor until the spring retainer is compressed enough to install the valve keepers.", cite: {p: 112}}
          - {kind: caution, t: "Do not tighten the compressor too much and compress the valve springs too much. This can cause a loss of valve spring tension.", cite: {p: 112}}
          - {t: "Put the keepers around the groove in the valve stem.", cite: {p: 112}, figs: [66]}
          - {t: "Slowly release the pressure on the spring retainer. Remove the compressor from the head.", cite: {p: 112}}
          - {t: "Tap the end of the valve stem with a soft mallet. Make sure that the keepers are seated in the groove of the valve stem.", cite: {p: 112}}
          - {t: "After you install all the valves, do the solvent test.", cite: {p: 112}, op: c04-valve-solvent-test}
          - {t: "Install the cylinder head.", cite: {p: 112}, op: c04-cylinder-head-installation}

  - id: c04-valve-lapping
    title: "Valve lapping"
    system: "Engine top end"
    source: clymer
    chapter: 4
    section: "04/valves"
    summary: {t: "Valve lapping restores an accurate seal between the valve seat and the valve contact area, without machining. Lap valves and valve seats that are in specification after inspection. Also lap them after they are reconditioned.", cite: {p: 112}}
    parts:
      - {name: "Fine-grade lapping compound", replace: consumable, cite: {p: 113}}
    sections:
      - steps:
          - {t: "Apply a thin layer of fine-grade lapping compound to the valve face.", cite: {p: 113}}
          - {t: "Lubricate the valve stem. Put the valve into the head.", cite: {p: 113}}
          - {t: "Wet the suction cup on the lapping tool. Press it onto the head of the valve.", cite: {p: 113}, figs: [67]}
          - {t: "Spin the tool back and forth between your hands to lap the valve to the seat.", cite: {p: 113}}
          - {t: "Every 5 to 10 seconds, turn the valve 180 degrees and continue to lap.", cite: {p: 113}}
          - {t: "Frequently examine the valve seat. Stop when the valve seat is smooth, even and polished.", cite: {p: 113}, figs: [68]}
          - {t: "Keep each lapped valve identified so that you install it in the correct seat during assembly.", cite: {p: 113}}
          - {t: "Clean the valves and the cylinder head in solvent. Remove all lapping compound.", cite: {p: 113}}
          - {kind: caution, t: "Abrasive that stays in the head causes early wear and damage to other engine parts.", cite: {p: 113}}
          - {t: "After you install the valves in the head, do the solvent test. If there is leakage, remove that valve and do the lapping again.", cite: {p: 113}, op: c04-valve-solvent-test}
