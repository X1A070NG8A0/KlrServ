operations:
  - id: c01-cotter-pin-installation
    title: "Cotter pin installation"
    system: "General information"
    source: clymer
    chapter: 1
    section: "01/fasteners"
    summary: {t: "A cotter pin is a split metal pin that prevents a fastener from loosening. It is used with a castellated (slotted) nut, for example on a rear axle.", cite: {p: 19}}
    parts:
      - {name: "Cotter pin", replace: inspect, cite: {p: 19}, note: "Use a pin with the correct diameter for the hole in the fastener."}
    sections:
      - steps:
          - {t: "Make sure that the diameter of the cotter pin is correct for the hole in the fastener.", cite: {p: 19}}
          - {t: "Tighten the fastener correctly.", cite: {p: 19}}
          - {t: "Align the holes.", cite: {p: 19}}
          - {t: "If the holes do not align, tighten the fastener only until the holes align.", cite: {p: 19}}
          - {kind: caution, t: "Do not loosen a torqued fastener to align the holes, unless the instructions tell you to do so.", cite: {p: 19}}
          - {t: "Put the cotter pin through the hole.", cite: {p: 19}}
          - {t: "Bend the ends of the cotter pin over the fastener.", cite: {p: 19}}
          - {kind: note, t: "To measure the length of a cotter pin, measure from the bottom of the head to the tip of the shortest pin.", cite: {p: 19}}

  - id: c01-snap-ring-installation
    title: "Snap ring and E-clip removal and installation"
    system: "General information"
    source: clymer
    chapter: 1
    section: "01/fasteners"
    summary: {t: "Snap rings and E-clips hold parts on shafts or in bores. Use snap ring pliers for snap rings. Use a flat blade screwdriver for E-clips.", cite: {p: 19}}
    parts:
      - {name: "Snap ring", replace: inspect, cite: {p: 19}, note: "In some applications you must replace the snap ring after you remove it."}
    sections:
      - title: "Snap ring"
        steps:
          - {kind: warning, t: "Wear eye protection when you remove and install snap rings. A snap ring can spring from the pliers.", cite: {p: 20}}
          - {t: "Remove and install the snap ring with snap ring pliers.", cite: {p: 19}}
          - {t: "Compress or expand the snap ring only enough to install it. If you expand it too much, it loses its retaining ability.", cite: {p: 19}}
          - {t: "If the snap ring is a stamped type in a thrust application, install it with the sharp edge face away from the part that causes the thrust.", cite: {p: 19}}
          - {t: "Make sure that the snap ring seats completely.", cite: {p: 19}}
      - title: "E-clip"
        steps:
          - {t: "To remove an E-clip, pry between the shaft and the E-clip with a flat blade screwdriver.", cite: {p: 20}}
          - {t: "To install an E-clip, center it over the shaft groove.", cite: {p: 20}}
          - {t: "Push or tap the E-clip into place.", cite: {p: 20}}

  - id: c01-general-torque
    title: "Tightening a fastener that has no torque specification"
    system: "General information"
    source: clymer
    chapter: 1
    section: "01/fasteners"
    summary: {t: "Use the general torque table as a guide for a fastener that has no specification. Torque specifications for specific parts are in the chapter for that part. Use an accurate torque wrench.", cite: {p: 41}}
    spec_refs: ["general-torque:5 mm thread", "general-torque:6 mm thread", "general-torque:8 mm thread", "general-torque:10 mm thread", "general-torque:12 mm thread", "general-torque:14 mm thread", "general-torque:16 mm thread", "general-torque:18 mm thread", "general-torque:20 mm thread"]
    sections:
      - steps:
          - {t: "Find the thread diameter of the fastener.", cite: {p: 17}}
          - {t: "Tighten a fastener with a 5 mm thread to the torque in the table.", cite: {p: 41}, spec_ref: "general-torque:5 mm thread"}
          - {t: "Tighten a fastener with a 6 mm thread to the torque in the table.", cite: {p: 41}, spec_ref: "general-torque:6 mm thread"}
          - {t: "Tighten a fastener with an 8 mm thread to the torque in the table.", cite: {p: 41}, spec_ref: "general-torque:8 mm thread"}
          - {t: "Tighten a fastener with a 10 mm thread to the torque in the table.", cite: {p: 41}, spec_ref: "general-torque:10 mm thread"}
          - {t: "Tighten a fastener with a 12 mm thread to the torque in the table.", cite: {p: 41}, spec_ref: "general-torque:12 mm thread"}
          - {t: "Tighten a fastener with a 14 mm thread to the torque in the table.", cite: {p: 41}, spec_ref: "general-torque:14 mm thread"}
          - {t: "Tighten a fastener with a 16 mm thread to the torque in the table.", cite: {p: 41}, spec_ref: "general-torque:16 mm thread"}
          - {t: "Tighten a fastener with a thread size between 16 mm and 20 mm to the torque in the table.", cite: {p: 41}, spec_ref: "general-torque:18 mm thread"}
          - {t: "Tighten a fastener with a 20 mm thread to the torque in the table.", cite: {p: 41}, spec_ref: "general-torque:20 mm thread"}
