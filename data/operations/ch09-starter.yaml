operations:
  - id: c09-starter-removal-installation
    title: "Starter removal and installation"
    system: "electrical system"
    source: clymer
    chapter: 9
    section: "09/starter"
    summary: {t: "The O-ring on the starter seals it to the left crankcase cover. The O-ring causes resistance when you remove the starter.", cite: {p: 209}}
    spec_refs: ["electrical-torque:Starter motor mounting bolts"]
    parts:
      - {name: "Starter O-ring", replace: inspect, cite: {p: 209}}
      - {name: "Fiber washers on the cable post", replace: inspect, cite: {p: 209}, note: "The washers must insulate the cable from the housing."}
      - {name: "Dielectric grease", replace: consumable, cite: {p: 209}}
    sections:
      - title: "Removal"
        steps:
          - {t: "Remove the exhaust pipe.", cite: {p: 209}, ref: "04/exhaust-system", figs: [22]}
          - {t: "Disconnect the ground (negative) cable from the battery and from the starter.", cite: {p: 209}, figs: [23]}
          - {t: "Disconnect the positive cable from the starter.", cite: {p: 209}, figs: [23]}
          - {t: "Remove the remaining mounting bolt.", cite: {p: 209}}
          - {t: "Twist the starter out of the left crankcase cover.", cite: {p: 209}, ref: "05/left-crankcase-cover"}
      - title: "Installation"
        steps:
          - {t: "Lubricate the O-ring on the front end cover before you put it in the crankcase cover.", cite: {p: 209}, figs: [24]}
          - {t: "Make sure that the fiber washers on the cable post are in good condition. They must insulate the cable from the housing.", cite: {p: 209}, figs: [24]}
          - {t: "Clean all cable connections. Apply dielectric grease to the fittings and connectors before you tighten them.", cite: {p: 209}}
          - {t: "Tighten the starter mounting bolts to the specified torque.", cite: {p: 209}, spec_ref: "electrical-torque:Starter motor mounting bolts"}

  - id: c09-starter-disassembly-assembly
    title: "Starter disassembly and assembly"
    system: "electrical system"
    source: clymer
    chapter: 9
    section: "09/starter"
    summary: {t: "This procedure disassembles the starter for inspection and assembles it again. To examine only the brushes, remove only the rear end cover.", cite: {p: 209}}
    parts:
      - {name: "Starter housing O-ring (rear end cover)", replace: always, cite: {p: 210}}
      - {name: "Starter housing O-ring (front end cover)", replace: always, cite: {p: 211}}
    sections:
      - title: "Disassembly"
        steps:
          - {t: "Remove the two housing screws, the rear end cover and the O-ring.", cite: {p: 209}, figs: [22]}
          - {kind: note, t: "To examine only the brush condition, remove only the rear end cover. You can examine the brushes and install the cover again if you do not need more disassembly.", cite: {p: 209}}
          - {t: "Remove the front end cover and the O-ring.", cite: {p: 209}}
          - {t: "Remove the armature, the brush plate assembly and the insulator from the housing. Note the position of any shims on the armature shaft.", cite: {p: 209}, figs: [25]}
          - {t: "Examine and test the starter components.", cite: {p: 210}, op: c09-starter-inspection-testing}
      - title: "Assembly"
        steps:
          - {t: "Install the insulator and the positive brush plate. Make sure that the small projection on the insulator is up and that the O-ring fits between the terminal and the housing. The terminal must be insulated from the housing.", cite: {p: 210}, figs: [26]}
          - {t: "Put the positive brushes into the slots of the insulated brush plate. Seat the plate in the housing. Lock the positive brushes in the slots.", cite: {p: 210}}
          - {t: "The tabs on the brush plate are not spaced symmetrically. The plate fits correctly in one position only.", cite: {p: 210}, figs: [27]}
          - {t: "Install the armature. Use small plastic ties or another method to hold back the brushes so that the commutator can go under the brushes.", cite: {p: 210}}
          - {t: "Make sure that the alignment mark on the housing and the vertical tab on the brush plate are as the figure shows.", cite: {p: 210}, figs: [28]}
          - {t: "Install a new O-ring on the housing.", cite: {p: 210}}
          - {t: "Align the vertical tab on the brush plate with the slot in the rear end cover. Seat the cover on the housing.", cite: {p: 210}, figs: [29]}
          - {t: "Make sure that the alignment marks on the outside of the housing and the cover are aligned.", cite: {p: 211}, figs: [30]}
          - {t: "Install a new O-ring on the housing. Align and install the front end cover. The alignment marks on the outside of the housing and the cover must be aligned.", cite: {p: 211}}
          - {t: "Install and tighten the housing screws.", cite: {p: 211}}
          - {t: "Install the fiber washers on the cable terminal. Then install the metal washer and the nut. The fiber washers must be in good condition so that they insulate the cable from the starter housing.", cite: {p: 211}}
          - {t: "Install a new, lubricated O-ring on the front end cover.", cite: {p: 211}}

  - id: c09-starter-inspection-testing
    title: "Starter inspection and testing"
    system: "electrical system"
    source: clymer
    chapter: 9
    section: "09/starter"
    summary: {t: "Use an ohmmeter for all electrical tests in this procedure. If a test result is not correct, the part is shorted or there is an open circuit between the test points. Replace or recondition parts that are worn or damaged.", cite: {p: 211}}
    spec_refs: ["electrical-test:Starter/Commutator outside diameter", "electrical-test:Starter/Commutator outside diameter, service limit", "electrical-test:Starter/Brush length", "electrical-test:Starter/Brush length, service limit"]
    sections:
      - title: "Housing and armature"
        steps:
          - {t: "Clean the parts as necessary. Use a solvent made for electric motors to remove buildup and contamination, especially between the commutator bars.", cite: {p: 211}}
          - {t: "Examine the housing and the end covers. The armature must fit in the covers with little or no play.", cite: {p: 211}}
          - {t: "Examine the armature bearing. It must turn smoothly and freely.", cite: {p: 211}}
          - {t: "Examine the shims for cracks or damage.", cite: {p: 211}}
          - {t: "Examine the windings for obvious shorts or damage.", cite: {p: 211}}
      - title: "Commutator"
        steps:
          - {t: "Measure the outside diameter of the commutator. Compare it with the specification.", cite: {p: 211}, spec_ref: "electrical-test:Starter/Commutator outside diameter", figs: [31]}
          - {t: "If the diameter is less than the service limit, replace the armature.", cite: {p: 211}, spec_ref: "electrical-test:Starter/Commutator outside diameter, service limit"}
          - {t: "Examine the bar height. The commutator bars must be taller than the insulation between the bars.", cite: {p: 211}, figs: [32]}
          - {t: "Examine the bars for discoloration. A pair of bars with discoloration shows grounded armature coils.", cite: {p: 211}}
          - {t: "Examine the bars for scoring. You can repair mild scoring with fine emery cloth.", cite: {p: 211}}
          - {t: "Test for continuity across all adjacent pairs of commutator bars. There must be continuity across all pairs.", cite: {p: 211}, figs: [33]}
          - {t: "Test for continuity between each commutator bar and the armature shaft. There must be no continuity.", cite: {p: 212}, figs: [34]}
      - title: "Brush assembly"
        steps:
          - {kind: note, t: "The positive brushes have insulated leads.", cite: {p: 212}}
          - {t: "Test for continuity between the positive brush and the cable terminal. There must be continuity.", cite: {p: 212}, figs: [35]}
          - {t: "Test for continuity between the cable terminal and the starter housing. There must be no continuity.", cite: {p: 212}}
          - {t: "Test for continuity between the positive brush and the starter housing. There must be no continuity.", cite: {p: 212}, figs: [36]}
          - {t: "Test for continuity between the grounded brush and the brush plate. There must be continuity.", cite: {p: 212}, figs: [37]}
          - {t: "Test for continuity between the brush plate and the positive brush holders. There must be no continuity.", cite: {p: 212}}
          - {t: "Measure the length of each brush. Compare it with the specification.", cite: {p: 212}, spec_ref: "electrical-test:Starter/Brush length", figs: [38]}
          - {t: "If a brush is shorter than the service limit, replace it.", cite: {p: 212}, spec_ref: "electrical-test:Starter/Brush length, service limit"}
          - {t: "Examine the condition of the brush springs.", cite: {p: 212}}
          - {t: "Assemble the starter.", cite: {p: 212}, op: c09-starter-disassembly-assembly}
