operations:
  - id: c01-frozen-fastener-removal
    title: "Frozen fastener removal"
    system: "General information"
    source: clymer
    chapter: 1
    section: "01/repair-methods"
    summary: {t: "This procedure loosens a fastener that does not turn. Do not apply heat unless the instructions tell you to do so.", cite: {p: 33}}
    parts:
      - {name: "Penetrating oil", replace: consumable, cite: {p: 33}, note: "For example Liquid Wrench or WD-40."}
    sections:
      - steps:
          - {t: "Apply penetrating oil to the fastener. Use a large quantity.", cite: {p: 33}}
          - {t: "Let the oil penetrate for 10-15 minutes.", cite: {p: 33}}
          - {t: "Strike the fastener several times with a small hammer. Do not hit it so hard that you cause damage.", cite: {p: 33}}
          - {t: "If necessary, apply penetrating oil again.", cite: {p: 33}}
          - {t: "If the fastener is a frozen screw, put a screwdriver in the slot after you apply the oil. Strike the top of the screwdriver with a hammer. This loosens the rust so that you can turn the screw out.", cite: {p: 33}}
          - {t: "If the screw head is too damaged for this method, grip the head with locking pliers. Twist the screw out.", cite: {p: 33}}
          - {kind: caution, t: "Do not apply heat to a magnesium alloy case. A flame can ignite the case.", cite: {p: 33}}

  - id: c01-broken-fastener-removal
    title: "Broken fastener removal"
    system: "General information"
    source: clymer
    chapter: 1
    section: "01/repair-methods"
    summary: {t: "This procedure removes the remaining part of a screw or bolt when the head breaks off.", cite: {p: 33}}
    sections:
      - title: "Part of the fastener projects"
        steps:
          - {t: "If a large part of the fastener projects out, grip it with locking pliers.", cite: {p: 33}}
          - {t: "If the projecting part is too small for pliers, file it to fit a wrench. Or cut a slot in it to fit a screwdriver.", cite: {p: 33}}
      - title: "Head broken flush"
        steps:
          - {t: "Center-punch the exact center of the remaining part of the screw or bolt.", cite: {p: 33}}
          - {t: "Drill a small hole in the screw.", cite: {p: 34}}
          - {t: "Tap a screw extractor into the hole.", cite: {p: 34}}
          - {t: "Turn the screw out with a wrench on the extractor.", cite: {p: 34}}

  - id: c01-damaged-thread-repair
    title: "Damaged thread repair"
    system: "General information"
    source: clymer
    chapter: 1
    section: "01/repair-methods"
    summary: {t: "A tap or a die can often repair threads that are stripped or damaged by impact. A thread insert can repair a damaged internal thread.", cite: {p: 34}}
    sections:
      - steps:
          - {t: "To repair an internal thread, run a tap through the threads. To repair an external thread, run a die over the threads.", cite: {p: 34}}
          - {t: "To clean or repair spark plug threads, use a spark plug tap.", cite: {p: 34}}
          - {t: "If an internal thread is badly damaged, install a Helicoil or a different type of thread insert. Follow the instructions of the manufacturer.", cite: {p: 34}}
          - {t: "If you must drill and tap a hole, use the metric tap and drill sizes in Table 6.", cite: {p: 42}}

  - id: c01-stud-replacement
    title: "Stud removal and installation"
    system: "General information"
    source: clymer
    chapter: 1
    section: "01/repair-methods"
    summary: {t: "A stud removal tool makes stud removal and installation easier. If you do not have the tool, use two nuts that you tighten against each other.", cite: {p: 34}}
    parts:
      - {name: "Threadlocking compound", replace: consumable, cite: {p: 34}}
    sections:
      - title: "Removal"
        steps:
          - {t: "Measure the height of the stud above the surface.", cite: {p: 34}}
          - {t: "Thread the stud removal tool onto the stud and tighten it. Or thread two nuts onto the stud and tighten them against each other.", cite: {p: 34}}
          - {t: "Turn the stud remover or the lower nut to remove the stud.", cite: {p: 34}}
          - {t: "Remove any threadlocking compound from the threaded hole.", cite: {p: 34}}
          - {t: "Clean the threads with aerosol parts cleaner.", cite: {p: 34}}
      - title: "Installation"
        steps:
          - {t: "Install the stud removal tool onto the new stud. Or thread two nuts onto the stud.", cite: {p: 34}}
          - {t: "Apply threadlocking compound to the threads of the stud.", cite: {p: 34}, op: c01-threadlocking-compound-application}
          - {t: "Install the stud. Tighten it with the stud removal tool or the top nut.", cite: {p: 34}}
          - {t: "Install the stud to the height that you measured, or to its torque specification.", cite: {p: 34}}
          - {t: "Remove the stud removal tool or the two nuts.", cite: {p: 34}}

  - id: c01-hose-removal
    title: "Hose removal"
    system: "General information"
    source: clymer
    chapter: 1
    section: "01/repair-methods"
    summary: {t: "This procedure removes a hose that is difficult to remove. Do not use too much force on the hose or the fitting.", cite: {p: 34}}
    sections:
      - steps:
          - {t: "Remove the hose clamp.", cite: {p: 34}}
          - {t: "Carefully put a small screwdriver or pick tool between the fitting and the hose.", cite: {p: 34}}
          - {t: "Apply a spray lubricant under the hose.", cite: {p: 34}}
          - {t: "Carefully twist the hose off the fitting.", cite: {p: 34}}
          - {t: "Clean corrosion and rubber hose material from the fitting with a wire brush.", cite: {p: 34}}
          - {t: "Clean the inside of the hose.", cite: {p: 34}}
          - {kind: caution, t: "Do not use lubricant to install a hose, new or old. The hose can come off the fitting, also with the clamp tight.", cite: {p: 34}}

  - id: c01-bearing-removal
    title: "Bearing removal"
    system: "General information"
    source: clymer
    chapter: 1
    section: "01/repair-methods"
    summary: {t: "A bad removal method damages the bearing and can damage the shaft or the case half. The best method uses a hydraulic press.", cite: {p: 35}}
    parts:
      - {name: "Bearing", replace: inspect, cite: {p: 34}, note: "If a bearing is damaged, replace it immediately."}
    sections:
      - title: "Puller"
        steps:
          - {t: "Put a piece of metal between the end of the shaft and the puller screw.", cite: {p: 35}}
          - {t: "Put the puller arms next to the inner bearing race.", cite: {p: 35}}
      - title: "Hammer"
        steps:
          - {t: "Do not strike the shaft directly with the hammer. Put a brass or aluminum rod between the hammer and the shaft.", cite: {p: 35}}
          - {t: "Support both bearing races with wooden blocks.", cite: {p: 35}}
      - title: "Hydraulic press"
        steps:
          - {t: "Support the inner and outer bearing races with a wooden or aluminum ring of the correct size. If you support only the outer race, the pressure damages the balls and the inner race.", cite: {p: 35}}
          - {t: "Make sure that the press arm aligns with the center of the shaft. If it does not, it can damage the bearing or the shaft.", cite: {p: 35}}
          - {t: "Secure or hold the shaft. It drops when it is free of the bearing.", cite: {p: 35}}

  - id: c01-bearing-installation
    title: "Bearing installation"
    system: "General information"
    source: clymer
    chapter: 1
    section: "01/repair-methods"
    summary: {t: "This procedure installs a bearing in a housing or on a shaft. Unless the instructions tell you differently, install the bearing with the mark or number of the manufacturer toward the outside.", cite: {p: 35}}
    sections:
      - steps:
          - {t: "To install a bearing in a housing, apply pressure to the outer bearing race.", cite: {p: 36}}
          - {t: "To install a bearing on a shaft, apply pressure to the inner bearing race.", cite: {p: 36}}
          - {t: "Use a length of pipe or a driver with a diameter that matches the bearing race. Do not hit the bearing directly with a hammer.", cite: {p: 36}}
          - {t: "To install a bearing over a shaft and into a housing at the same time, put a spacer under the driver tool. The pressure then goes on both races evenly.", cite: {p: 36}}
          - {t: "Install the bearing with the mark or number of the manufacturer toward the outside, unless the instructions tell you differently.", cite: {p: 35}}

  - id: c01-bearing-shaft-heated-installation
    title: "Bearing installation on a shaft with an interference fit"
    system: "General information"
    source: clymer
    chapter: 1
    section: "01/repair-methods"
    summary: {t: "If a tight fit is necessary, the bearing inside diameter is smaller than the shaft. Heat the bearing in oil before you install it. Do not drive it onto the shaft.", cite: {p: 36}}
    sections:
      - steps:
          - {t: "Secure the shaft so that it is ready for the bearing.", cite: {p: 36}}
          - {t: "Clean all residue from the bearing surface of the shaft. Remove burrs with a file or sandpaper.", cite: {p: 36}}
          - {t: "Fill a suitable container with clean mineral oil.", cite: {p: 36}}
          - {t: "Put a thermometer rated more than 248° F (120° C) in the oil. Support it so that it does not touch the bottom or the side of the container.", cite: {p: 36}}
          - {t: "Remove the bearing from its wrapper. Secure it with a piece of heavy wire that holds it in the container.", cite: {p: 36}}
          - {t: "Hang the bearing so that it does not touch the bottom or the sides.", cite: {p: 36}}
          - {t: "Turn the heat on. Monitor the thermometer.", cite: {p: 36}}
          - {t: "When the oil temperature is approximately 248° F (120° C), remove the bearing and install it quickly.", cite: {p: 36}}
          - {t: "If necessary, put a socket on the inner bearing race and tap the bearing into place.", cite: {p: 36}}
          - {t: "Do the installation quickly. The bearing tightens on the shaft as it cools.", cite: {p: 36}}
          - {t: "Make sure that the bearing is installed completely.", cite: {p: 36}}

  - id: c01-bearing-housing-heated-installation
    title: "Bearing installation in a housing with an interference fit"
    system: "General information"
    source: clymer
    chapter: 1
    section: "01/repair-methods"
    summary: {t: "A bearing usually has a slight interference fit in a housing. Heat the housing before you install the bearing. Heat only one housing at a time.", cite: {p: 37}}
    sections:
      - title: "Removal of the old bearings"
        steps:
          - {kind: caution, t: "Before you heat the housing, wash it with detergent and water. Rinse and wash it again as necessary to remove all oil and chemical deposits.", cite: {p: 37}}
          - {t: "Heat the housing to approximately 212° F (100° C) in an oven or on a hot plate.", cite: {p: 37}}
          - {t: "To make sure that the housing is at the correct temperature, put tiny drops of water on it. If the drops sizzle and evaporate immediately, the temperature is correct.", cite: {p: 37}}
          - {kind: caution, t: "Do not heat the housing or the bearing with a propane or acetylene torch. The direct heat destroys the case hardening of the bearing and can warp the housing. A magnesium alloy case can ignite.", cite: {p: 37}}
          - {t: "Remove the housing from the oven or hot plate. Wear insulated gloves or use kitchen pot holders.", cite: {p: 37}}
          - {t: "Hold the housing with the bearing side down. Tap the bearing out. Do this for all the bearings in the housing.", cite: {p: 37}}
          - {kind: note, t: "Remove and install the bearings with a socket and extension of the correct size.", cite: {p: 37}}
      - title: "Installation of the new bearings"
        steps:
          - {t: "If possible, put the new bearing in a freezer before you heat the housing. A chilled bearing is a little smaller in outside diameter, and the hot housing is a little larger. This makes installation easier.", cite: {p: 37}}
          - {t: "While the housing is hot, install the new bearings. Install them by hand if possible.", cite: {p: 38}}
          - {t: "If necessary, tap the bearing lightly into the housing with a socket on the outer bearing race.", cite: {p: 38}}
          - {kind: caution, t: "Do not install a new bearing by driving on the inner bearing race.", cite: {p: 38}}
          - {t: "Install the bearing until it seats completely.", cite: {p: 38}}
          - {kind: note, t: "Always install bearings with the mark or number of the manufacturer toward the outside.", cite: {p: 38}}

  - id: c01-seal-replacement
    title: "Seal replacement"
    system: "General information"
    source: clymer
    chapter: 1
    section: "01/repair-methods"
    summary: {t: "Seals keep oil, water, grease or combustion gases in a housing or on a shaft. A bad removal method can damage the housing or shaft. A bad installation method can damage the seal.", cite: {p: 38}}
    parts:
      - {name: "Seal", replace: always, cite: {p: 38}}
      - {name: "Waterproof grease", replace: consumable, cite: {p: 38}}
    sections:
      - steps:
          - {t: "Put a shop cloth under the pry tool. This prevents damage to the housing.", cite: {p: 38}}
          - {t: "Pry the seal out of the housing.", cite: {p: 38}}
          - {t: "Pack waterproof grease in the seal lips.", cite: {p: 38}}
          - {t: "Install the seal with the numbers or marks of the manufacturer toward the outside.", cite: {p: 38}}
          - {t: "Put a socket on the outside of the seal. Drive the seal squarely into the housing.", cite: {p: 38}}
          - {kind: caution, t: "Do not install a seal by hitting the top of the seal with a hammer.", cite: {p: 38}}
