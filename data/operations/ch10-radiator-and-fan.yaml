operations:
  - id: c10-fan-removal
    title: "Fan removal and installation"
    system: "Cooling system"
    source: clymer
    chapter: 10
    section: "10/radiator-and-fan"
    summary: {t: "This procedure removes the radiator fan and installs it again. The fan switch and the fan relay turn the fan on and off.", cite: {p: 236}}
    sections:
      - steps:
          - {t: "Remove the fuel tank and the radiator covers.", cite: {p: 236}, ref: "15/fuel-tank"}
          - {t: "Remove the radiator covers.", cite: {p: 236}, ref: "15/radiator-covers"}
          - {t: "Disconnect the battery.", cite: {p: 236}}
          - {kind: warning, t: "The fan is wired directly to the battery. The fan can operate when the ignition switch is off.", cite: {p: 236}}
          - {t: "Trace the wires from the fan. Disconnect the wires at the connector.", cite: {p: 236}}
          - {t: "Remove the wires from the retainers.", cite: {p: 236}, figs: [2]}
          - {t: "Remove the three bolts that hold the fan to the radiator.", cite: {p: 236}, figs: [2]}
          - {t: "To test the fan, do the test procedure in Chapter Nine.", cite: {p: 236}, ref: "09/fan-system"}
          - {t: "To install the fan, do the removal steps in the opposite sequence.", cite: {p: 236}}

  - id: c10-radiator-removal
    title: "Radiator and fan switch removal and installation"
    system: "Cooling system"
    source: clymer
    chapter: 10
    section: "10/radiator-and-fan"
    summary: {t: "This procedure removes the radiator and the fan switch, and installs them again. The fan switch is at the bottom of the radiator.", cite: {p: 236}}
    spec_refs: ["cooling-torque:Radiator fan switch"]
    parts:
      - {name: "Radiator hoses", replace: inspect, cite: {p: 236}, note: "Replace hoses that are hard, cracked or deteriorated. Replace hoses that you cut to remove them."}
    sections:
      - title: "Removal"
        steps:
          - {t: "Drain the cooling system.", cite: {p: 236}, op: coolant-replace}
          - {t: "Remove the fuel tank.", cite: {p: 236}, ref: "15/fuel-tank"}
          - {t: "Remove the radiator covers.", cite: {p: 236}, ref: "15/radiator-covers"}
          - {t: "Remove the fan.", cite: {p: 236}, op: c10-fan-removal}
          - {t: "Remove the wire from the fan switch.", cite: {p: 236}, figs: [3]}
          - {t: "If necessary, remove the fan switch.", cite: {p: 236}, figs: [3]}
          - {t: "Remove the hoses from the radiator.", cite: {p: 236}}
          - {t: "If the hoses are seized to the fittings, cut and split the hoses. Peel them from the fittings. Do not score the fittings.", cite: {p: 236}}
          - {t: "Remove the two bolts at the front of the radiator.", cite: {p: 236}, figs: [4]}
          - {t: "Remove the bolt at the back of the radiator.", cite: {p: 236}}
          - {t: "Examine the radiator.", cite: {p: 236}, op: c10-radiator-inspection}
          - {t: "To test the fan switch and the fan relay, do the test procedure in Chapter Nine.", cite: {p: 236}, ref: "09/fan-system"}
      - title: "Installation"
        steps:
          - {t: "Install the radiator. Do the removal steps in the opposite sequence.", cite: {p: 236}}
          - {t: "Examine each hose. Hold the hose and flex it in several directions. If the hose is hard, cracked or deteriorated inside or outside, replace it.", cite: {p: 236}}
          - {t: "If a hose is difficult to install on a fitting, dip the hose end in hot water until the rubber is soft. Then install the hose.", cite: {p: 236}}
          - {t: "Install the clamps in their original positions.", cite: {p: 236}}
          - {t: "If you removed the fan switch, install it and tighten it to the specified torque.", cite: {p: 236}, spec_ref: "cooling-torque:Radiator fan switch"}
          - {t: "Fill the cooling system and remove the air from it.", cite: {p: 237}, op: coolant-replace}
          - {t: "Start the engine and let it get warm.", cite: {p: 237}}
          - {t: "Look for leaks.", cite: {p: 237}}

  - id: c10-radiator-inspection
    title: "Radiator inspection"
    system: "Cooling system"
    source: clymer
    chapter: 10
    section: "10/radiator-and-fan"
    summary: {t: "This procedure shows how to examine the radiator for damaged fins, corrosion and restricted flow.", cite: {p: 237}}
    parts:
      - {name: "Radiator", replace: inspect, cite: {p: 237}, note: "Replace the radiator if more than 20 percent of the cooling area is damaged."}
    sections:
      - steps:
          - {t: "Clean the outside of the radiator with a low-pressure water spray. Let the radiator dry.", cite: {p: 237}}
          - {t: "Examine the cooling fins for damage. Straighten bent fins with a screwdriver.", cite: {p: 237}}
          - {t: "If more than 20 percent of the cooling area is damaged, replace the radiator.", cite: {p: 237}}
          - {t: "Examine the seams and other soldered connections for corrosion (green residue).", cite: {p: 237}}
          - {t: "If you find corrosion, there can be a leak at that point. Do a cooling system pressure test.", cite: {p: 237}, op: cooling-system-inspect}
          - {t: "If you do not have the test equipment, take the radiator to a radiator repair shop for a flush and a pressure test.", cite: {p: 237}}
          - {t: "Fill the radiator with water and measure the flow rate out of the radiator.", cite: {p: 237}}
          - {t: "If the flow rate is slow, or if there is corrosion or other buildup, take the radiator to a radiator repair shop for a flush and a pressure test.", cite: {p: 237}}
