operations:
  - id: c06-oil-pump-removal
    title: "Oil pump removal and installation"
    system: "Clutch, gearshift linkage and lubrication system"
    source: clymer
    chapter: 6
    section: "06/oil-pump"
    summary: {t: "This procedure removes the oil pump from the right side of the crankcase and installs it again. A gear on the end of the crankshaft drives the pump.", cite: {p: 161}}
    spec_refs: ["oil-pump:Oil pump pressure at 4000 rpm", "oil-pump:Relief valve opening pressure"]
    parts:
      - {name: "Oil pump gasket", replace: always, cite: {p: 162}}
      - {name: "Engine oil", replace: consumable, cite: {p: 162}, note: "Fill the pump with engine oil before you install it."}
      - {name: "Threadlocking compound", replace: consumable, cite: {p: 162}}
    sections:
      - title: "Removal"
        steps:
          - {t: "Remove the right crankcase cover.", cite: {p: 161}, op: c06-right-crankcase-cover}
          - {t: "Put the transmission in neutral.", cite: {p: 162}}
          - {t: "Turn the crankshaft until the holes in the oil pump gear align with the three pump mounting screws. Use an open-end wrench on the primary drive gear nut to turn the crankshaft.", cite: {p: 162}, figs: [57]}
          - {t: "Remove the three mounting screws and the oil pump.", cite: {p: 162}}
          - {t: "Keep the two dowels that connect the pump to the crankcase.", cite: {p: 162}}
          - {t: "Remove the gasket.", cite: {p: 162}, figs: [58]}
          - {t: "Make sure that the plugs are in position. Do not remove the plugs.", cite: {p: 162}, figs: [59]}
          - {t: "Disassemble, examine and assemble the oil pump.", cite: {p: 162}, op: c06-oil-pump-service}
      - title: "Installation"
        steps:
          - {t: "Examine and clean the crankcase oil strainer and the oil passage.", cite: {p: 162}, figs: [60]}
          - {t: "Fill the pump with engine oil.", cite: {p: 162}}
          - {t: "Install a new oil pump gasket.", cite: {p: 162}}
          - {t: "Apply threadlocking compound to the threads of the mounting screws.", cite: {p: 162}}
          - {t: "Install the oil pump and the three mounting screws.", cite: {p: 162}}
          - {t: "Install the right crankcase cover.", cite: {p: 162}, op: c06-right-crankcase-cover}

  - id: c06-oil-pump-service
    title: "Oil pump disassembly, inspection and assembly"
    system: "Clutch, gearshift linkage and lubrication system"
    source: clymer
    chapter: 6
    section: "06/oil-pump"
    summary: {t: "This procedure disassembles the oil pump, shows how to examine the parts and assembles the pump again. Clymer gives no component specifications for the oil pump.", cite: {p: 163}}
    parts:
      - {name: "Oil pump parts", replace: inspect, cite: {p: 163}, note: "Replace parts that have wear or scoring."}
      - {name: "Threadlocking compound", replace: consumable, cite: {p: 163}}
    sections:
      - title: "Disassembly"
        steps:
          - {t: "Remove the retaining screw from the pump body. Remove the rear plate.", cite: {p: 162}, figs: [61]}
          - {t: "Lift out the inner rotor and the outer rotor.", cite: {p: 162}, figs: [62]}
          - {t: "Remove the pin. Pull the gear out of the pump body.", cite: {p: 162}, figs: [63]}
      - title: "Inspection"
        steps:
          - {t: "Clean the parts in solvent.", cite: {p: 163}}
          - {t: "Examine the parts for wear or damage.", cite: {p: 163}, figs: [64]}
          - {t: "Examine the pump shaft, the gear and the pin for wear or scoring.", cite: {p: 163}, figs: [66]}
          - {t: "Make sure that the pin fits firmly in the shaft.", cite: {p: 163}}
          - {t: "Make sure that the pump shaft fits in the pump body and the rear plate with minimal perceptible play.", cite: {p: 163}}
          - {t: "Examine the rotors for wear or scoring.", cite: {p: 163}, figs: [67]}
          - {t: "Make sure that the inner rotor and the pin fit firmly on the shaft when assembled.", cite: {p: 163}}
          - {t: "Examine the pump body and the rear plate for wear or scoring.", cite: {p: 164}, figs: [68]}
      - title: "Assembly"
        steps:
          - {t: "Install the rotors in the pump body so that the marks face down. The marks must not be visible after you install the rotors.", cite: {p: 163}, figs: [65]}
          - {t: "Make sure that the rear plate is fully seated at its edge before you tighten the screw.", cite: {p: 163}}
          - {t: "Apply threadlocking compound to the threads of the retaining screw. Install the screw.", cite: {p: 163}}
          - {t: "Install the oil pump.", cite: {p: 163}, op: c06-oil-pump-removal}
