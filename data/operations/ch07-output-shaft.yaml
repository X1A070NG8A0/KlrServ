operations:
  - id: c07-output-shaft-disassembly
    title: "Output shaft disassembly"
    system: "Transmission and internal shift mechanism"
    source: clymer
    chapter: 7
    section: "07/output-shaft"
    summary: {t: "This procedure removes the parts from the output shaft. The early shaft has a shoulder outside second gear, and you remove all parts from one end. The later shaft is stepped inside second gear, and you remove parts from both ends. This bike has the later shaft.", cite: {p: 174}}
    parts:
      - {name: "Snap rings", replace: always, cite: {p: 169}}
    sections:
      - title: "Later shaft (from KL650AE032210)"
        steps:
          - {t: "Remove the transmission from the crankcase.", cite: {p: 169}, ref: "05/crankcase"}
          - {kind: caution, t: "Keep the parts in the same direction and position as on the shaft. Mark the outer face of each part when you remove it. Note the direction of the sharp inner edge of each snap ring.", cite: {p: 175}, op: c07-snap-ring-installation}
          - {t: "Clean the parts and put them in order as you remove them.", cite: {p: 175}}
          - {t: "At the splined end of the shaft, remove the spacer.", cite: {p: 176}}
          - {t: "Remove second gear.", cite: {p: 176}}
          - {t: "Remove the thrust washer.", cite: {p: 176}}
          - {t: "At the smooth end of the shaft, remove the snap ring.", cite: {p: 176}}
          - {t: "Remove the spacer.", cite: {p: 176}}
          - {t: "Remove the bearing.", cite: {p: 176}}
          - {t: "Remove the thrust washer.", cite: {p: 176}}
          - {t: "Remove first gear.", cite: {p: 176}}
          - {t: "Remove the thrust washer.", cite: {p: 176}}
          - {t: "Remove fifth gear.", cite: {p: 176}}
          - {t: "Remove the snap ring.", cite: {p: 176}}
          - {t: "Remove the spline washer.", cite: {p: 176}}
          - {t: "Remove third gear.", cite: {p: 176}}
          - {t: "Remove the thrust washer.", cite: {p: 176}}
          - {t: "Remove fourth gear.", cite: {p: 176}}
          - {t: "Examine each part. Put it back in its position until assembly.", cite: {p: 176}, op: c07-shaft-inspection}
      - title: "Early shaft (to KL650AE032209)"
        steps:
          - {kind: note, t: "This shaft does not fit this bike. The steps are for reference. Remove all parts from the smooth end of the shaft.", cite: {p: 175}}
          - {t: "Remove the bearing.", cite: {p: 175}}
          - {t: "Remove the thrust washer.", cite: {p: 175}}
          - {t: "Remove first gear.", cite: {p: 175}}
          - {t: "Remove the thrust washer.", cite: {p: 175}, gap: "The text layer of the page lost the list items between first gear and third gear. The next two steps follow the reverse of the assembly order."}
          - {t: "Remove fifth gear.", cite: {p: 175}}
          - {t: "Remove the snap ring.", cite: {p: 175}}
          - {t: "Remove the spline washer.", cite: {p: 175}}
          - {t: "Remove third gear.", cite: {p: 175}}
          - {t: "Remove the third gear bushing.", cite: {p: 175}}
          - {t: "Remove the spline washer.", cite: {p: 175}}
          - {t: "Remove the snap ring.", cite: {p: 175}}
          - {t: "Remove fourth gear.", cite: {p: 175}}
          - {t: "Remove the snap ring.", cite: {p: 175}}
          - {t: "Remove the thrust washer.", cite: {p: 175}}
          - {t: "Remove second gear.", cite: {p: 175}}
          - {t: "Examine each part. Put it back in its position until assembly.", cite: {p: 175}, op: c07-shaft-inspection}

  - id: c07-output-shaft-assembly
    title: "Output shaft assembly"
    system: "Transmission and internal shift mechanism"
    source: clymer
    chapter: 7
    section: "07/output-shaft"
    summary: {t: "This procedure installs the parts on the output shaft. The direction of each part is given in relation to the splined end of the shaft, where the drive sprocket is installed.", cite: {p: 177}}
    parts:
      - {name: "Snap rings", replace: always, cite: {p: 177}, note: "Have new snap rings ready before you start."}
      - {name: "Engine oil", replace: consumable, cite: {p: 177}}
      - {name: "Rubber band", replace: consumable, cite: {p: 178}, note: "A strong rubber band holds the parts on the shaft after assembly."}
    sections:
      - title: "Later shaft (from KL650AE032210)"
        steps:
          - {t: "If you wish, hold the splined end of the shaft in a padded vise. Hold the shaft vertical. Do not let the vise damage the shaft.", cite: {p: 177}, figs: [23]}
          - {kind: caution, t: "Install the notched snap rings with the method in the service notes. The installed snap rings must grip the shaft tightly.", cite: {p: 177}, op: c07-snap-ring-installation}
          - {t: "Clean and dry all parts. Lubricate all parts with engine oil.", cite: {p: 177}}
          - {t: "Install fourth gear. Put the side with the shift fork groove out, away from the splined end.", cite: {p: 177}, figs: [24]}
          - {t: "Install the thrust washer.", cite: {p: 177}, figs: [25]}
          - {t: "Install third gear. Put the side with the gear dog recesses in, toward the splined end.", cite: {p: 177}, figs: [26]}
          - {t: "Install the spline washer.", cite: {p: 177}, figs: [27]}
          - {t: "Install the snap ring. Seat the snap ring in the shaft groove. Put the ends of the snap ring out of line with the spline washer teeth.", cite: {p: 177}, figs: [28]}
          - {t: "Install fifth gear. Put the side with the shift fork groove in, toward the splined end.", cite: {p: 177}, figs: [29]}
          - {t: "Install the thrust washer.", cite: {p: 178}, figs: [30]}
          - {t: "Install first gear. Put the side with the gear dog recesses in, toward the splined end.", cite: {p: 178}, figs: [31]}
          - {t: "Install the thrust washer.", cite: {p: 178}, figs: [32]}
          - {t: "Install the bearing and the spacer.", cite: {p: 178}, figs: [33]}
          - {t: "Install the snap ring. Seat the snap ring in the shaft groove. Put the sharp edge of the snap ring out, away from the splined end.", cite: {p: 178}, figs: [34]}
          - {t: "At the splined end of the shaft, install the thrust washer.", cite: {p: 178}, figs: [35]}
          - {t: "Install second gear. Put the side with the gear dog recesses in, toward the middle of the shaft and away from the splined end.", cite: {p: 178}, figs: [36]}
          - {t: "Install the spacer.", cite: {p: 178}, figs: [37]}
          - {t: "Put a strong rubber band around the end of the shaft.", cite: {p: 178}}
          - {t: "Make sure that all parts are secure. Make sure that the gears turn, slide and engage freely on the shaft.", cite: {p: 178}}
          - {t: "Wrap the assembly and store it until you install it in the crankcase.", cite: {p: 178}, ref: "05/crankcase"}
      - title: "Early shaft (to KL650AE032209)"
        steps:
          - {kind: note, t: "This shaft does not fit this bike. The steps are for reference.", cite: {p: 176}}
          - {t: "If you wish, hold the splined end of the shaft in a padded vise. Do not let the vise damage the shaft.", cite: {p: 177}}
          - {t: "Clean and dry all parts. Lubricate all parts with engine oil.", cite: {p: 177}}
          - {t: "Install second gear. Put the side with the gear dog recesses out, away from the splined end.", cite: {p: 176}}
          - {t: "Install the thrust washer and the snap ring. Seat the snap ring in the shaft groove.", cite: {p: 176}}
          - {t: "Install fourth gear. Put the side with the shift fork groove out, away from the splined end.", cite: {p: 176}}
          - {t: "Install the snap ring and the spline washer. Seat the snap ring in the shaft groove. Put the ends of the snap ring out of line with the spline washer teeth.", cite: {p: 177}}
          - {t: "Align and install the third gear bushing.", cite: {p: 177}}
          - {kind: caution, t: "Align the oil hole in the bushing with the oil hole in the shaft.", cite: {p: 177}}
          - {t: "Install third gear. Put the side with the gear dog recesses in, toward the splined end.", cite: {p: 177}}
          - {t: "Install the spline washer and the snap ring. Seat the snap ring in the shaft groove. Put the ends of the snap ring out of line with the spline washer teeth.", cite: {p: 177}}
          - {t: "Install fifth gear. Put the side with the shift fork groove in, toward the splined end.", cite: {p: 177}}
          - {t: "Install the thrust washer.", cite: {p: 177}}
          - {t: "Install first gear. Put the side with the gear dog recesses in, toward the splined end. This is the deep side of the gear.", cite: {p: 177}}
          - {t: "Install the thrust washer.", cite: {p: 177}}
          - {t: "Install the bearing.", cite: {p: 178}}
          - {t: "Put a strong rubber band around the end of the shaft.", cite: {p: 178}}
          - {t: "Make sure that all parts are secure. Make sure that the gears turn, slide and engage freely on the shaft.", cite: {p: 178}}
          - {t: "Wrap the assembly and store it until you install it in the crankcase.", cite: {p: 178}, ref: "05/crankcase"}
