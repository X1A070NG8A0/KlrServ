operations:
  - id: c01-rtv-sealant-application
    title: "RTV sealant application"
    system: "General information"
    source: clymer
    chapter: 1
    section: "01/shop-supplies"
    summary: {t: "RTV (room temperature vulcanizing) sealant cures at room temperature. This procedure prepares the surfaces and applies the sealant.", cite: {p: 21}}
    parts:
      - {name: "RTV sealant", replace: consumable, cite: {p: 21}, note: "Discard a partial tube that is past its expiration date."}
      - {name: "Aerosol parts cleaner", replace: consumable, cite: {p: 22}}
    sections:
      - steps:
          - {t: "Remove all old gasket residue from the mating surfaces.", cite: {p: 22}}
          - {t: "Remove all gasket material from the blind threaded holes. The material can cause an incorrect bolt torque.", cite: {p: 22}}
          - {t: "Spray the mating surfaces with aerosol parts cleaner.", cite: {p: 22}}
          - {t: "Wipe the mating surfaces with a lint-free cloth.", cite: {p: 22}}
          - {t: "Apply RTV sealant in a continuous bead 2-3 mm (0.08-0.12 in.) thick.", cite: {p: 22}}
          - {t: "Circle all the fastener holes with the bead, unless the instructions tell you not to.", cite: {p: 22}}
          - {t: "Do not let sealant enter the fastener holes.", cite: {p: 22}}
          - {t: "Install the cap on the tube as soon as possible. Moisture in the air cures the sealant.", cite: {p: 21}}
          - {t: "Assemble the parts. Tighten the fasteners to the specified torque in the time that the sealant manufacturer recommends.", cite: {p: 22}}

  - id: c01-threadlocking-compound-application
    title: "Threadlocking compound application"
    system: "General information"
    source: clymer
    chapter: 1
    section: "01/shop-supplies"
    summary: {t: "Threadlocking compound is a fluid that sets between the threads of a fastener. It prevents the fastener from working loose.", cite: {p: 22}}
    parts:
      - {name: "Threadlocking compound", replace: consumable, cite: {p: 22}, note: "Use the type that the manufacturer recommends."}
    sections:
      - steps:
          - {t: "Remove any old compound from both thread areas.", cite: {p: 22}}
          - {t: "Clean the threads with aerosol parts cleaner.", cite: {p: 22}}
          - {t: "Apply a small quantity of compound to the threads. Excess fluid can run into adjoining parts.", cite: {p: 22}}
          - {t: "Tighten the fastener.", cite: {p: 22}}
