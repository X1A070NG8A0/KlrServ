operations:
  - id: c12-fork-disassembly
    title: "Fork disassembly"
    system: "Front suspension and steering"
    source: clymer
    chapter: 12
    section: "12/fork-service"
    summary: {t: "This procedure disassembles one fork leg. Rebuild one fork leg before you rebuild the other. Do not mix the parts of the two legs.", cite: {p: 270}}
    parts:
      - {name: "Fork seal driver, 38 mm (Kawasaki part No. 57001-1219, or equivalent)", replace: consumable, cite: {p: 270}, note: "Special tool."}
      - {name: "Handle and adapter (Kawasaki part No. 57001-183 and part No. 57001-1057, or equivalent)", replace: consumable, cite: {p: 270}, note: "Special tool. You can make an optional tool."}
      - {name: "10 mm Allen socket", replace: consumable, cite: {p: 270}, note: "Use it to loosen and to tighten the damper bolt."}
    sections:
      - title: "Cap, spring and oil"
        steps:
          - {t: "Loosen the fork boot clamp. Remove the boot from the outer tube.", cite: {p: 270}, figs: [31]}
          - {t: "Clean the fork tubes and the fork cap area.", cite: {p: 270}}
          - {kind: note, t: "The removed parts are oily. Put them on absorbent paper or cloth that you can discard.", cite: {p: 270}}
          - {t: "Hold the fork leg upright. Remove the cap, the spring spacer, the spring seat and the spring.", cite: {p: 270}}
          - {t: "If the spring is progressively wound, make a note of which end of the spring is up.", cite: {p: 270}}
          - {t: "Drain the oil from the fork tubes. Pump the fork tubes to help drain the oil.", cite: {p: 270}}
      - title: "Damper"
        steps:
          - {kind: note, t: "The Kawasaki adapter is tapered and square. The tapered end seats into the damper. The edges of the adapter must wedge into the damper to hold it steady.", cite: {p: 270}, figs: [33]}
          - {kind: note, t: "An alternative is to use the 12-point hex at the top of the damper. A 24 mm nut locks into the fitting. You can weld the nut to a T-handle approximately 460 mm (18 in.) long.", cite: {p: 270}, figs: [34]}
          - {t: "Push the fork tubes together. Seat the damper tool into the damper.", cite: {p: 270}, figs: [35]}
          - {t: "If you use the Kawasaki adapter without the nut, tap the handle to seat the tool.", cite: {p: 270}}
          - {t: "Lock the axle holder in a vise with soft jaws. Or turn the fork upside down and lock the tool handle into a floor joint or other stable device.", cite: {p: 270}}
          - {t: "Make sure that the handle cannot turn.", cite: {p: 270}}
          - {kind: caution, t: "If you use a vise, do not tighten it too much. The axle holder can crack.", cite: {p: 270}}
          - {t: "Remove the damper bolt with a 10 mm Allen socket.", cite: {p: 270}, figs: [36]}
          - {t: "Remove the fork damper and the rebound spring.", cite: {p: 270}, figs: [37]}
      - title: "Tubes"
        steps:
          - {t: "Remove the stop ring from the top of the outer tube.", cite: {p: 270}, figs: [38]}
          - {t: "Slide the tubes together. Feel for roughness and binding. If the action is not smooth, examine the tubes for damage when you disassemble them.", cite: {p: 270}}
          - {t: "Pull the fork tubes apart quickly and firmly. The guide bushing and the seals have an interference fit in the outer tube.", cite: {p: 270}}
          - {t: "Do this again until the parts separate.", cite: {p: 270}}
          - {t: "Remove the valve and the collar. They can fall from the inner tube when the tubes separate.", cite: {p: 272}}
          - {t: "Carefully spread open the slide bushing. Remove it from the fork tube. Do not spread it more than necessary.", cite: {p: 272}}
          - {t: "Remove the remaining parts from the fork leg.", cite: {p: 272}}
          - {kind: caution, t: "Do not disassemble the remaining parts in the inner fork tube and the fork damper. The parts are integral to the tube and the damper. Attempts to remove them can cause damage.", cite: {p: 272}}
          - {t: "Clean and examine the parts.", cite: {p: 272}, op: c12-fork-inspection}

  - id: c12-fork-inspection
    title: "Fork inspection"
    system: "Front suspension and steering"
    source: clymer
    chapter: 12
    section: "12/fork-service"
    summary: {t: "This procedure shows how to clean and examine each set of fork parts.", cite: {p: 272}}
    parts:
      - {name: "Drain screw O-ring", replace: always, cite: {p: 274}}
      - {name: "Fork cap O-ring", replace: always, cite: {p: 274}}
      - {name: "Damper bolt seal washer", replace: always, cite: {p: 274}}
      - {name: "Slide bushing and guide bushing", replace: inspect, cite: {p: 275}, note: "Replace both bushings as a set."}
      - {name: "Fork boot", replace: inspect, cite: {p: 275}}
      - {name: "Fork damper assembly", replace: inspect, cite: {p: 274}, note: "The damper bushing, the valve stop ring and the damper are not available separately."}
    sections:
      - steps:
          - {t: "Clean all parts in solvent. Make sure that the solvent is safe for the painted tube, the rubber parts and the coating on the bushings.", cite: {p: 272}}
          - {t: "Wash the parts again with soap and water. Rinse them with clean water. Dry them with compressed air.", cite: {p: 273}}
          - {kind: caution, t: "Do not use harsh cleaning methods or some solvents on the bushings. They can remove or damage the coating.", cite: {p: 273}}
          - {t: "Examine the inner tube for nicks, rust, chrome flaking or creases along its length. These conditions damage the dust seal and the oil seal.", cite: {p: 274}, figs: [43]}
          - {t: "Repair minor roughness with 600 grit sandpaper and solvent.", cite: {p: 274}}
          - {t: "Examine the bore of the outer tube for pitting or abrasion.", cite: {p: 274}, figs: [44]}
          - {t: "Examine the axle holder for wear and stress cracks.", cite: {p: 274}}
          - {t: "Examine the seal and bushing areas for damage.", cite: {p: 274}}
          - {t: "Examine the threads for damage.", cite: {p: 274}}
          - {t: "Examine the fork cap and the threaded fasteners for damaged threads and a damaged air valve and cap.", cite: {p: 274}, figs: [45]}
          - {t: "Install new O-rings on the drain screw and the fork cap.", cite: {p: 274}}
          - {t: "Install a new seal washer on the damper bolt.", cite: {p: 274}}
          - {t: "Examine the spring, the spring seat and the spring spacer for damage. Kawasaki gives no service limits for the spring.", cite: {p: 274}, figs: [46]}
          - {t: "Examine the rebound spring and the top of the fork damper. Make sure that the small holes in the damper are clean.", cite: {p: 274}}
          - {t: "Examine the damper bushing for damage. Do not remove it. If it is damaged, replace the complete fork damper assembly.", cite: {p: 274}}
          - {t: "Examine the rebound spring for damage.", cite: {p: 274}}
          - {t: "Examine the valve, the collar and the lower end of the fork damper. Make sure that the holes in the damper and the valve are clean.", cite: {p: 274}}
          - {t: "Examine the valve for dents. Put the valve on the damper. Make sure that it seats smoothly and fully.", cite: {p: 274}}
          - {t: "Make sure that the valve stop ring is tight and fully seated. Do not try to remove it. If it is damaged, replace the complete fork damper assembly.", cite: {p: 275}}
          - {t: "Examine the collar for damage. The open side of the collar must fully seat against the stop ring on the valve.", cite: {p: 275}, figs: [49]}
          - {t: "Examine the slide bushing and the guide bushing for scoring, scratches and excessive wear.", cite: {p: 275}}
          - {t: "Remove minor metallic buildup from the exterior of the slide bushing and the interior of the guide bushing with fork oil and a nylon brush.", cite: {p: 275}}
          - {t: "If a bushing has a different color, or if the coating is worn and the metal base is visible below it, replace both bushings as a set.", cite: {p: 275}}
          - {t: "Examine the backup ring and the stop ring for damage.", cite: {p: 275}}
          - {t: "Examine the fork boot. If it is damaged, replace it.", cite: {p: 275}, figs: [51]}

  - id: c12-fork-assembly
    title: "Fork assembly and oil filling"
    system: "Front suspension and steering"
    source: clymer
    chapter: 12
    section: "12/fork-service"
    summary: {t: "This procedure assembles one fork leg and fills it with fork oil. Have a new oil seal, a new dust seal, new O-rings and other replacement parts on hand. The work area and all parts must be clean.", cite: {p: 275}}
    spec_refs:
      - "fork-oil:Fork oil grade"
      - "fork-oil:Fork oil capacity (each leg)/Oil change"
      - "fork-oil:Fork oil capacity (each leg)/Fork rebuild (all parts dry)"
      - "fork-oil:Fork tube oil level (from top edge of inner tube)"
      - "front-suspension-torque:Damper bolts (socket head)"
      - "front-suspension-torque:Fork caps"
    parts:
      - {name: "Fork oil", replace: consumable, spec_ref: "fork-oil:Fork oil grade", cite: {p: 275}}
      - {name: "Oil seal", replace: always, cite: {p: 275}}
      - {name: "Dust seal", replace: always, cite: {p: 275}}
      - {name: "Drain screw O-ring", replace: always, cite: {p: 274}}
      - {name: "Fork cap O-ring", replace: always, cite: {p: 274}}
      - {name: "Damper bolt seal washer", replace: always, cite: {p: 274}}
      - {name: "Threadlocking compound", replace: consumable, cite: {p: 276}}
    sections:
      - title: "Assembly"
        steps:
          - {t: "Lubricate the parts with fork oil as you assemble them. Use the same fork oil that you use to fill the fork.", cite: {p: 275}, spec_ref: "fork-oil:Fork oil grade"}
          - {t: "Install the drain screw and the O-ring into the outer tube.", cite: {p: 275}}
          - {t: "Install the slide bushing onto the end of the inner tube. Spread the bushing only far enough to slip it onto the tube. Do not scratch its coating.", cite: {p: 275}, figs: [52]}
          - {t: "Seat the bushing in the groove.", cite: {p: 275}}
          - {t: "Install the rebound spring and the fork damper into the inner tube.", cite: {p: 275}}
          - {t: "Extend the fork damper out of the bottom of the inner tube. Install the valve and the collar on the damper.", cite: {p: 275}, figs: [53]}
          - {t: "Make sure that the open side of the collar fully seats against the stop ring on the valve.", cite: {p: 275}}
          - {t: "With the damper fully extended, hold the inner tube horizontal. Guide it into the outer tube.", cite: {p: 275}}
          - {t: "Fully seat and hold the inner tube. Keep the tubes horizontal.", cite: {p: 275}}
          - {t: "Put the tubes on the workbench so that you can get to the damper bolt hole. The collar and the valve must not fall from the damper.", cite: {p: 276}}
          - {t: "Look into the damper bolt hole. Make sure that the valve is tight against the outer tube.", cite: {p: 276}}
          - {t: "If you see space between the parts, the collar is probably jammed. Disassemble the parts and do the assembly again.", cite: {p: 276}}
          - {t: "Apply threadlocking compound to the damper bolt threads.", cite: {p: 276}}
          - {t: "Install the seal washer and the bolt into the bottom of the fork leg. Tighten the bolt into the damper with your fingers.", cite: {p: 276}}
          - {t: "Tilt the fork leg end to end. Make sure that you hear only the rebound spring.", cite: {p: 276}}
          - {t: "Put the damper holding tool in position. Tighten the damper bolt to the specified torque.", cite: {p: 276}, spec_ref: "front-suspension-torque:Damper bolts (socket head)"}
          - {t: "Slide the guide bushing and the backup ring onto the inner tube.", cite: {p: 276}, figs: [55]}
          - {t: "Hold the fork leg vertical. Align the bushing so that its gap faces to the left or right of the outer tube, not to the front or the back.", cite: {p: 276}}
          - {t: "Fit a 38 mm fork seal driver around the inner tube and against the backup ring.", cite: {p: 276}}
          - {t: "Use the fork seal driver like a slide hammer. Drive the guide bushing and the backup ring into the fork tube.", cite: {p: 276}, figs: [56]}
          - {t: "Make sure that the parts are completely seated.", cite: {p: 276}}
          - {t: "Cover the end of the inner tube with plastic. Coat it with fork oil. The plastic prevents the edge of the tube from tearing the dust seal and the oil seal.", cite: {p: 276}}
          - {t: "Lubricate the seals with fork oil.", cite: {p: 276}}
          - {t: "Slide the oil seal and the dust seal down the inner tube. The lip on both seals must face up.", cite: {p: 276}, figs: [57]}
          - {t: "Put the seals squarely against the bore.", cite: {p: 276}}
          - {t: "Use the fork seal driver like a slide hammer. Drive both seals together into the fork tube until you see the stop ring groove above the seal.", cite: {p: 276}}
          - {t: "Install the stop ring and seat it in the groove.", cite: {p: 277}}
          - {t: "Slide the fork tubes together several times. Make sure that the action is smooth.", cite: {p: 277}}
          - {t: "If there is roughness or binding, disassemble the parts and find the cause.", cite: {p: 277}}
      - title: "Oil filling"
        steps:
          - {t: "Get the specified fork oil and capacity.", cite: {p: 277}, spec_ref: "fork-oil:Fork oil capacity (each leg)/Fork rebuild (all parts dry)"}
          - {t: "Accurately measure the oil. Pour it into the fork leg.", cite: {p: 277}, op: fork-oil}
          - {t: "Pump the leg for several minutes to distribute the oil and to remove air pockets.", cite: {p: 277}}
          - {t: "Compress the fork leg to the bottom of its travel.", cite: {p: 277}}
          - {t: "Measure the distance from the top edge of the fork leg to the oil surface.", cite: {p: 277}, spec_ref: "fork-oil:Fork tube oil level (from top edge of inner tube)"}
          - {t: "If necessary, add or remove oil to get the specified distance. Both legs must have identical levels.", cite: {p: 277}}
          - {kind: note, t: "The oil level sets the size of the air pocket above the oil. Too much oil makes the damping harder and can cause fork seal leaks. Too little oil makes the damping softer. The fork can then bottom and damage fork parts.", cite: {p: 277}}
          - {t: "Extend the fork leg. Install the spring and the spring seat.", cite: {p: 277}, figs: [60]}
          - {t: "If the spring is progressively wound, install the correct end up.", cite: {p: 277}}
          - {t: "Install the spring spacer and the fork cap. Tighten the cap enough to prevent a leak.", cite: {p: 277}}
          - {t: "Tighten the cap to the specified torque after you install the leg on the motorcycle.", cite: {p: 277}, spec_ref: "front-suspension-torque:Fork caps"}
          - {t: "Install the fork boot. Seat the boot into the outer tube. Do not tighten the clamp until you install the fork leg on the motorcycle.", cite: {p: 277}}
