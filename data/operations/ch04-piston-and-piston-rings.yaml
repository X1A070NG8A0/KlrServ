operations:
  - id: c04-piston-removal
    title: "Piston removal"
    system: "Engine top end"
    source: clymer
    chapter: 4
    section: "04/piston-and-piston-rings"
    summary: {t: "This procedure removes the piston from the connecting rod. The piston is aluminum alloy with three rings. A chrome-plated steel piston pin and two circlips hold it on the small end of the connecting rod.", cite: {p: 117}}
    parts:
      - {name: "Piston pin circlips", replace: always, cite: {p: 118}, note: "Discard the circlips. Install new circlips during assembly."}
      - {name: "Piston pin puller, part No. 57001-910", replace: consumable, cite: {p: 118}, note: "Special tool. Available from a Kawasaki dealership."}
      - {name: "Piston pin puller adapter, part No. 57001-1211", replace: consumable, cite: {p: 118}, note: "Special tool. Available from a Kawasaki dealership."}
    sections:
      - steps:
          - {t: "Remove the cylinder.", cite: {p: 117}, op: c04-cylinder-removal}
          - {t: "Before you remove the piston, hold the rod and try to tilt the piston from side to side. Look for play between the piston and the piston pin.", cite: {p: 117}, figs: [82]}
          - {t: "If you feel a tilting motion that is not a sliding motion, the piston pin, the pin bore or the connecting rod has wear. The wear can be on any combination of the three parts.", cite: {p: 117}}
          - {t: "Examine the parts with care to find which parts you must replace.", cite: {p: 117}}
          - {t: "Put clean shop cloths around the connecting rod and in the cam chain tunnel to prevent parts from going into the crankcase.", cite: {p: 118}}
          - {t: "Turn the ends of the circlips to the removal gaps. Remove the circlips from the piston pin bore.", cite: {p: 118}, figs: [83]}
          - {t: "Discard the circlips.", cite: {p: 118}}
          - {t: "Press the piston pin out of the piston by hand.", cite: {p: 118}, figs: [84]}
          - {t: "If the pin is tight, use a pin puller (part No. 57001-910) and an adapter (part No. 57001-1211) from a Kawasaki dealership.", cite: {p: 118}}
          - {t: "You can also make a removal tool. The end of the padded pipe must touch the piston and not the piston pin. The hole in the pipe must be larger than the diameter of the piston pin. When you tighten the nut on the end of the rod, the nut and washer at the opposite end drive the piston pin into the pipe.", cite: {p: 118}, figs: [85]}
          - {kind: caution, t: "Do not use a hammer and a drift to drive out the pin. This can cause damage to the piston and the connecting rod assembly.", cite: {p: 118}}
          - {t: "Lift the piston off the connecting rod.", cite: {p: 118}}
          - {t: "Examine the piston and the piston pin.", cite: {p: 118}, op: c04-piston-inspection}

  - id: c04-piston-inspection
    title: "Piston, piston pin and piston-to-cylinder clearance inspection"
    system: "Engine top end"
    source: clymer
    chapter: 4
    section: "04/piston-and-piston-rings"
    summary: {t: "This procedure cleans and examines the piston and the piston pin and measures the clearance between the piston and the cylinder. Record and identify all measurements for each part.", cite: {p: 117}}
    spec_refs: ["top-end:Piston/Ring groove width, top and second ring", "top-end:Piston/Ring groove width, oil ring", "top-end:Piston/Outside diameter", "top-end:Piston-to-cylinder clearance"]
    parts:
      - {name: "Piston", replace: inspect, cite: {p: 118}, note: "If there is damage, replace the piston."}
      - {name: "Piston pin", replace: inspect, cite: {p: 120}, note: "Replace a worn pin."}
    sections:
      - title: "Piston"
        steps:
          - {t: "Remove the piston rings.", cite: {p: 118}, op: c04-piston-ring-inspection}
          - {t: "Clean the carbon from the piston crown with a soft scraper, brushes and solvent.", cite: {p: 118}}
          - {kind: caution, t: "Do not use tools that can gouge or scratch the surface. This damage can cause hot spots on the piston during engine operation.", cite: {p: 118}}
          - {t: "Clean the piston pin bore, the ring grooves and the piston skirt.", cite: {p: 118}}
          - {t: "Clean the ring grooves with a soft brush. You can also use a broken piston ring to remove carbon and oil residue.", cite: {p: 118}, figs: [86]}
          - {t: "Polish mild galling or discoloration off the piston skirt with fine emery cloth and oil.", cite: {p: 118}}
          - {t: "Examine the piston crown for wear or damage. If the piston is pitted, overheating is likely. A lean fuel mixture or preignition can cause it.", cite: {p: 118}, figs: [87]}
          - {t: "Examine the ring grooves for dents, nicks, cracks or other damage. The grooves must be square and uniform around the piston.", cite: {p: 118}, figs: [87]}
          - {t: "Examine the top compression ring groove with particular care. It has the least lubrication and is nearest the combustion temperatures.", cite: {p: 118}}
          - {t: "If the oil ring was difficult to remove, the piston has likely overheated and distorted.", cite: {p: 119}}
          - {t: "Examine the piston skirt. If there are signs of severe galling or partial seizure (bits of metal in the skirt), replace the piston.", cite: {p: 119}, figs: [87]}
          - {t: "Examine the inside of the piston for cracks or other damage. Examine the crown, the skirt, the piston pin bores and the bosses.", cite: {p: 119}, figs: [88]}
          - {t: "Make sure that the oil holes and the circlip grooves are clean and have no damage.", cite: {p: 119}}
          - {t: "Measure the width of all ring grooves. If a measurement is more than the service limit, replace the piston.", cite: {p: 119}, spec_ref: "top-end:Piston/Ring groove width, top and second ring"}
          - {t: "Measure the width of the oil ring groove.", cite: {p: 119}, spec_ref: "top-end:Piston/Ring groove width, oil ring"}
          - {t: "Examine the ring-to-groove clearance of the piston rings.", cite: {p: 119}, op: c04-piston-ring-inspection}
      - title: "Piston-to-cylinder clearance"
        steps:
          - {t: "Clean and dry the piston and the cylinder before you measure them.", cite: {p: 119}}
          - {t: "Measure the outside diameter of the piston 5 mm (0.2 in.) up from the bottom edge of the piston skirt and 90 degrees to the direction of the piston pin. Record the measurement.", cite: {p: 119}, figs: [89], spec_ref: "top-end:Piston/Outside diameter"}
          - {t: "Subtract the piston measurement from the largest cylinder measurement. The result is the clearance.", cite: {p: 119}, op: c04-cylinder-inspection}
          - {t: "If the clearance is more than the specification, bore the cylinder oversize and install an oversize piston assembly.", cite: {p: 119}, spec_ref: "top-end:Piston-to-cylinder clearance"}
      - title: "Piston pin"
        steps:
          - {t: "Clean the piston pin.", cite: {p: 119}}
          - {t: "Examine the pin for chrome flaking, wear or discoloration from overheating.", cite: {p: 120}}
          - {t: "Examine the bore in the small end of the connecting rod for scoring, uneven wear and discoloration from overheating.", cite: {p: 120}, figs: [90]}
          - {t: "Lubricate the piston pin and slide it into the connecting rod. Slowly turn the pin and examine it for radial play.", cite: {p: 120}, figs: [91]}
          - {t: "If you can detect play, one or both parts are worn. Kawasaki gives no specifications for the pin or the connecting rod bore.", cite: {p: 120}}
          - {t: "If neither part has visible wear, have the pin diameter compared to the diameter of a new pin.", cite: {p: 120}}
          - {t: "If the pin is worn, replace the pin and examine the play in the connecting rod again. If there is still play, replace the rod.", cite: {p: 120}}
          - {t: "Lubricate the piston pin and slide it into the piston bores. Slowly turn the pin and examine it for radial play.", cite: {p: 120}}
          - {t: "If you can detect play, one or both parts are worn. Kawasaki gives no specifications for the pin or the piston pin bore.", cite: {p: 120}}
          - {t: "If neither part has visible wear, have the dimensions of the pin and the piston pin bore compared to the dimensions of new parts. Replace worn parts.", cite: {p: 120}}

  - id: c04-piston-ring-inspection
    title: "Piston ring inspection and removal"
    system: "Engine top end"
    source: clymer
    chapter: 4
    section: "04/piston-and-piston-rings"
    summary: {t: "The piston has two compression rings and an oil control ring assembly. The oil ring assembly has two side rails and an expander ring. This procedure measures the rings and removes them from the piston.", cite: {p: 120}}
    spec_refs: ["top-end:Piston rings/Ring-to-groove clearance, top and second ring", "top-end:Piston rings/Thickness (top and second)", "top-end:Piston rings/End gap, top and second ring", "top-end:Piston rings/Top mark identification, top ring", "top-end:Piston rings/Top mark identification, second ring"]
    parts:
      - {name: "Piston rings", replace: inspect, cite: {p: 121}, note: "Replace the rings as a set. If the clearance is too large after you install new rings, replace the piston."}
    sections:
      - steps:
          - {t: "Clean the rings and the grooves so that you can make accurate measurements with a flat feeler gauge.", cite: {p: 120}}
          - {t: "Press the top ring into the piston groove.", cite: {p: 120}}
          - {t: "Put a flat feeler gauge between the ring and the groove. Record the measurement.", cite: {p: 120}, figs: [92], spec_ref: "top-end:Piston rings/Ring-to-groove clearance, top and second ring"}
          - {t: "Do this again at other points around the piston.", cite: {p: 121}}
          - {t: "If any measurement is more than the service limit, replace the rings. If the clearance is too large after you install new rings, replace the piston.", cite: {p: 121}}
          - {t: "Do the same for the second compression ring. Do not measure the oil control ring.", cite: {p: 121}}
          - {t: "Remove the top and second rings with a ring expander or by hand.", cite: {p: 121}, figs: [93, 94]}
          - {t: "Spread the rings only enough to clear the piston.", cite: {p: 121}}
          - {t: "As you remove each ring, make sure that you can see the top mark. The top ring has the mark N. The second ring has the mark 2N.", cite: {p: 121}, figs: [95], spec_ref: "top-end:Piston rings/Top mark identification, top ring"}
          - {t: "If you will use the rings again, mark their top surfaces if necessary. The oil control ring rails have no marks.", cite: {p: 121}}
          - {t: "Remove the top rail of the oil ring assembly first and then the bottom rail. Remove the expander ring last by hand.", cite: {p: 121}}
          - {t: "Clean and examine the piston.", cite: {p: 121}, op: c04-piston-inspection}
          - {t: "Measure the thickness of the top and second rings. If any measurement is more than the service limit, replace all the rings.", cite: {p: 121}, figs: [96], spec_ref: "top-end:Piston rings/Thickness (top and second)"}
          - {t: "Put a ring into the bottom of the cylinder. Use the piston to square the ring to the cylinder wall. Push the ring about 10 mm (0.4 in.) into the cylinder.", cite: {p: 121}}
          - {t: "Measure the end gap of the top and second rings with a feeler gauge.", cite: {p: 121}, figs: [97], spec_ref: "top-end:Piston rings/End gap, top and second ring"}
          - {t: "If any measurement is more than the service limit, replace all the rings. Always replace rings as a set.", cite: {p: 121}}
          - {t: "If you will install new rings, set the gap of the new rings after you service the cylinder.", cite: {p: 121}}
          - {t: "If the gap of a new ring is too narrow, widen it with a fine-cut file. Work slowly and measure often.", cite: {p: 121}, figs: [98]}
          - {t: "Roll each ring around its piston groove. Look for binding or snags.", cite: {p: 121}, figs: [99]}
          - {t: "Repair minor damage with a fine-cut file.", cite: {p: 121}}

  - id: c04-piston-ring-installation
    title: "Piston ring installation"
    system: "Engine top end"
    source: clymer
    chapter: 4
    section: "04/piston-and-piston-rings"
    summary: {t: "If you install new piston rings, the cylinder must be honed to deglaze it and make a crosshatch pattern. The new surface gives lubrication pockets that help the new rings seat and seal against the cylinder.", cite: {p: 122}}
    parts:
      - {name: "Piston rings", replace: inspect, cite: {p: 122}}
    sections:
      - steps:
          - {t: "If you will install new rings, have a dealership or machine shop hone the cylinder.", cite: {p: 122}, op: c04-cylinder-inspection}
          - {t: "Make sure that the piston and the rings are clean and dry.", cite: {p: 122}}
          - {t: "Install the oil ring expander in the bottom groove. Do not let the ends of the expander overlap.", cite: {p: 122}}
          - {t: "Install the bottom rail and then the top rail of the oil ring. You can install the rails in either position and direction.", cite: {p: 122}}
          - {t: "Install the second ring with the 2N mark up.", cite: {p: 122}, figs: [95], conflict: {note: "The supplement agrees. The top and second rings are not symmetrical and the marked side must face up.", agrees: true, others: [{t: "Do not mix up the top and second rings. Install them with the marked side up.", cite: {s: kaw-supp, p: 33}}]}}
          - {t: "Install the top ring with the N mark up.", cite: {p: 122}, figs: [95]}
          - {t: "When you install the rings, spread them only enough to clear the piston.", cite: {p: 122}}
          - {t: "Make sure that all the rings turn freely in their grooves.", cite: {p: 122}}

  - id: c04-piston-installation
    title: "Piston installation"
    system: "Engine top end"
    source: clymer
    chapter: 4
    section: "04/piston-and-piston-rings"
    summary: {t: "This procedure installs the piston on the connecting rod with new circlips. The arrow on the piston crown must point forward.", cite: {p: 122}}
    parts:
      - {name: "Piston pin circlips", replace: always, cite: {p: 122}, note: "Use new circlips."}
      - {name: "Engine oil", replace: consumable, cite: {p: 122}}
    sections:
      - steps:
          - {t: "Install the piston rings on the piston.", cite: {p: 122}, op: c04-piston-ring-installation}
          - {t: "Make sure that all parts are clean.", cite: {p: 122}}
          - {kind: caution, t: "Do not install used circlips. Circlips become weak and distort when you remove them, even if they look good. The engine can have severe damage.", cite: {p: 122}}
          - {t: "Install a new circlip in the left piston pin boss. Turn the ends of the circlip away from the gap.", cite: {p: 122}}
          - {kind: note, t: "When you install the circlip in the left boss, you install the other circlip at the right side of the engine, where there is more work space.", cite: {p: 122}}
          - {t: "Lubricate the piston pin, the piston pin bores and the connecting rod bore with engine oil.", cite: {p: 122}}
          - {t: "Start the piston pin into the open pin bore. Put the piston over the connecting rod.", cite: {p: 122}}
          - {t: "Make sure that the arrow on the piston crown points forward.", cite: {p: 122}, figs: [100]}
          - {kind: caution, t: "Install the piston correctly. If you do not, the engine can have severe damage.", cite: {p: 122}}
          - {t: "Align the piston with the rod. Slide the pin through the rod and into the other piston bore.", cite: {p: 122}}
          - {t: "Install a new circlip in the right piston pin boss. Turn the ends of the circlip away from the gap.", cite: {p: 122}}
          - {t: "Stagger the piston ring gaps on the piston. The gaps of the top ring and the second ring are opposite each other and point to the front and the back of the piston. The oil ring rails are about 30 degrees apart and point to the sides.", cite: {p: 122}, figs: [81]}
          - {t: "Install the cylinder.", cite: {p: 122}, op: c04-cylinder-installation}
          - {t: "For the break-in procedures, refer to the chapter on maintenance.", cite: {p: 122}, ref: "03/engine-break-in"}
