operations:
  - id: c14-front-brake-pads
    title: "Front brake pad replacement"
    system: "brakes"
    source: clymer
    chapter: 14
    section: "14/front-brake-pads"
    summary: {t: "Remove the front caliper from the fork leg to replace the pads. You do not have to disconnect the brake hose.", cite: {p: 297}}
    spec_refs:
      - "brakes:Pad lining thickness"
      - "brake-torque:Caliper mounting bolts"
    parts:
      - {name: "Front brake pads", replace: inspect, cite: {p: 299}, note: "Replace the pads if they are worn to within 1 mm (0.040 in.) of the backing plate, or if oil or other chemicals contaminate them."}
      - {name: "Pad spring", replace: inspect, cite: {p: 299}}
      - {name: "Pad pin and lock pin", replace: inspect, cite: {p: 299}}
    sections:
      - title: "Removal"
        steps:
          - {t: "Hold the caliper in your hand during this procedure. Keep the caliper supported. Do not let it hang by the brake hose.", cite: {p: 297}}
          - {t: "Remove the caliper mounting bolts.", cite: {p: 297}, figs: [2]}
          - {t: "Remove the lock pin from the pad pin.", cite: {p: 298}, figs: [3]}
          - {t: "Press up on the pads to release the pressure on the pad pin. Then remove the pad pin.", cite: {p: 298}, figs: [4]}
          - {t: "Pivot the outer pad and remove it.", cite: {p: 298}}
          - {t: "Press up on the inner pad to release it. Remove it from the caliper.", cite: {p: 298}, figs: [5]}
          - {t: "Remove the pad spring.", cite: {p: 298}, figs: [6]}
          - {kind: caution, t: "Watch the fluid level in the master cylinder reservoir in the next step. Brake fluid flows back to the reservoir when you press the piston into the bore. Do not let fluid spill from the reservoir. Wash spills immediately with water. Fluid can damage painted and plastic surfaces.", cite: {p: 298}}
          - {t: "Hold the caliper and press the caliper piston into the bore. This makes space for the new pads.", cite: {p: 298}}
          - {kind: note, t: "Do not operate the brake lever when the pads are removed. The caliper piston can come out of the bore.", cite: {p: 298}}
      - title: "Inspection"
        steps:
          - {t: "Clean the inside of the caliper.", cite: {p: 298}}
          - {t: "Examine the area around the piston, the bleeder valve and the hose connection for leaks and damage.", cite: {p: 298}}
          - {t: "Examine the fork seals for leaks. Fork oil contaminates the brake pads.", cite: {p: 298}}
          - {t: "Examine the boots. Replace a boot that is damaged or missing.", cite: {p: 298}}
          - {t: "Move the caliper holder in and out of the caliper. If the drag is too high, or if there is corrosion or water around the slide pin boots, clean the parts. Lubricate them with silicone brake grease.", cite: {p: 298}}
          - {t: "Examine the pad pin, the lock pin and the pad spring. They must be in good condition so that the inner pad can move a small distance.", cite: {p: 299}, figs: [7]}
          - {t: "Make sure that the small tabs on the pad spring are not corroded or missing.", cite: {p: 299}}
          - {t: "Examine the pads for contamination, scoring and wear.", cite: {p: 299}}
          - {t: "If the pads are worn to within 1 mm (0.040 in.) of the backing plate, replace them. Also replace them if oil or other chemicals contaminate them.", cite: {p: 299}, spec_ref: "brakes:Pad lining thickness"}
          - {t: "If the pads wear unevenly, the caliper probably does not slide correctly on the slide pins. Clean the pins. Buildup or corrosion on the pins holds the caliper in one position. This causes brake drag and fast pad wear.", cite: {p: 299}}
      - title: "Installation"
        steps:
          - {t: "Install the pad spring with the narrow arms toward the outside. Seat the spring in the caliper.", cite: {p: 299}}
          - {t: "Put the inner pad in the pad spring and the caliper. Then pivot the outer pad into the caliper.", cite: {p: 299}, figs: [8]}
          - {t: "Seat the outer pad between the small tabs at the top and bottom of the pad spring.", cite: {p: 299}}
          - {t: "Press up on the pads. Align the pad pin and install it.", cite: {p: 299}}
          - {t: "Put the lock pin in the pad pin.", cite: {p: 299}, figs: [9]}
          - {t: "Put the caliper over the brake disc. Guide the disc between the pads.", cite: {p: 299}}
          - {t: "Install the caliper mounting bolts. Tighten them to the specified torque.", cite: {p: 299}, spec_ref: "brake-torque:Caliper mounting bolts"}
          - {t: "Operate the brake lever several times to seat the pads.", cite: {p: 299}}
          - {t: "Examine the brake fluid level in the reservoir. Add or remove fluid as necessary.", cite: {p: 299}, op: brake-fluid-level}
          - {t: "Raise the front wheel. Make sure that the wheel turns freely and that the brake operates correctly.", cite: {p: 299}}

  - id: c14-front-caliper-remove
    title: "Front brake caliper removal and installation"
    system: "brakes"
    source: clymer
    chapter: 14
    section: "14/front-brake-caliper"
    summary: {t: "Remove the front caliper from the fork leg. If you will disassemble the caliper, drain the brake system first.", cite: {p: 299}}
    spec_refs:
      - "brake-torque:Caliper mounting bolts"
      - "brake-torque:Brake hose banjo bolts"
    parts:
      - {name: "Banjo bolt seal washers", replace: always, cite: {p: 300}, note: "Install new seal washers on the banjo bolt."}
    sections:
      - title: "Removal"
        steps:
          - {t: "If you will disassemble the caliper, drain the brake system.", cite: {p: 299}, op: brake-fluid-replace}
          - {t: "Loosen the brake hose banjo bolt while the caliper is on the fork. Leave the bolt finger-tight.", cite: {p: 299}, figs: [10]}
          - {t: "Remove the caliper mounting bolts. Then remove the caliper from the fork. Do not kink the brake hose.", cite: {p: 300}, figs: [10]}
          - {t: "If you leave the hose on the caliper and do not disassemble it, attach a wire to the caliper. Hang the caliper on the motorcycle.", cite: {p: 300}}
          - {t: "Do not let the caliper hang by the brake hose.", cite: {p: 300}}
          - {t: "Put a small wooden block between the brake pads. This prevents the piston from coming out of the caliper if the brake lever is operated.", cite: {p: 300}}
          - {t: "If you will disassemble the caliper, remove the banjo bolt and the seal washers from the brake hose. Keep a shop cloth ready for fluid that drips from the hose.", cite: {p: 300}}
          - {t: "Wrap the end of the hose. This prevents damage to other surfaces from brake fluid.", cite: {p: 300}}
          - {t: "Drain the extra brake fluid from the caliper.", cite: {p: 300}}
          - {t: "Repair the caliper if necessary.", cite: {p: 300}, op: c14-front-caliper-repair}
      - title: "Installation"
        steps:
          - {t: "Put the caliper over the brake disc. Guide the disc between the pads.", cite: {p: 300}}
          - {t: "Install new seal washers on the banjo bolt.", cite: {p: 300}, figs: [11],
             conflict: {
               agrees: true,
               note: "Kawasaki gives more detail: a new washer on each side of the hose fitting.",
               others: [{t: "Discard the used flat washers, and install a new washer on each side of the brake hose fittings.", cite: {s: kaw-600, p: 112}}]}}
          - {t: "Install the caliper mounting bolts. Tighten them to the specified torque.", cite: {p: 300}, spec_ref: "brake-torque:Caliper mounting bolts"}
          - {t: "Install the banjo bolt. Tighten it to the specified torque.", cite: {p: 300}, spec_ref: "brake-torque:Brake hose banjo bolts"}
          - {t: "If you rebuilt the caliper or disconnected the brake hose from it, fill and bleed the brake system.", cite: {p: 300}, op: brake-fluid-replace}
          - {t: "Operate the brake lever several times to seat the pads.", cite: {p: 300}}
          - {t: "Examine the brake fluid level in the reservoir. Add or remove fluid as necessary.", cite: {p: 300}, op: brake-fluid-level}
          - {t: "Raise the front wheel. Make sure that the wheel turns freely and that the brake operates correctly.", cite: {p: 300}}

  - id: c14-front-caliper-repair
    title: "Front brake caliper disassembly, inspection and assembly"
    system: "brakes"
    source: clymer
    chapter: 14
    section: "14/front-brake-caliper"
    summary: {t: "Disassemble the front caliper, examine the parts and assemble it with new seals.", cite: {p: 300}}
    parts:
      - {name: "Caliper piston seal", replace: always, cite: {p: 300}, note: "Install a new seal."}
      - {name: "Caliper piston boot", replace: always, cite: {p: 300}, note: "Install a new boot."}
      - {name: "DOT 4 brake fluid (sealed container)", replace: consumable, spec_ref: "fluids:Brake fluid type", cite: {p: 302}}
      - {name: "Silicone brake grease", replace: consumable, cite: {p: 303}}
    sections:
      - title: "Disassembly"
        steps:
          - {t: "Remove the caliper.", cite: {p: 300}, op: c14-front-caliper-remove}
          - {t: "Press down on the pads to release the pressure on the pad pin. Remove the lock pin and the pad pin.", cite: {p: 300}, figs: [12]}
          - {t: "Pivot the outer pad and remove it. Then remove the inner pad and the pad spring.", cite: {p: 300}, figs: [13]}
          - {t: "Remove the caliper holder and the boots.", cite: {p: 300}, figs: [14]}
          - {t: "Remove the piston from the caliper bore with compressed air. Read the next steps fully before you start.", cite: {p: 300}}
          - {kind: caution, t: "Do not pry the piston out of the caliper.", cite: {p: 300}}
          - {t: "Put the caliper on a padded work surface.", cite: {p: 301}}
          - {t: "Close the bleeder valve on the caliper so that air cannot escape.", cite: {p: 301}}
          - {t: "Put a strip of wood in the caliper to cushion the piston when it comes out.", cite: {p: 301}}
          - {kind: warning, t: "Wear eye protection when you use compressed air to remove the piston. Keep your fingers away from the piston discharge area. If you try to stop the piston with your fingers, injury can occur.", cite: {p: 301}}
          - {t: "Lay the caliper so that the piston discharges downward.", cite: {p: 301}}
          - {t: "Put an air nozzle in the brake hose fitting. If the nozzle has no rubber tip, wrap tape on it. The nozzle then seals tightly and does not damage the threads.", cite: {p: 301}}
          - {t: "Put a shop cloth over the full caliper to catch spray.", cite: {p: 301}}
          - {t: "Apply air pressure. Listen for the piston to pop out of the caliper.", cite: {p: 301}, figs: [15]}
          - {t: "Remove the piston boot and the seal from the cylinder bore.", cite: {p: 301}, figs: [16]}
          - {t: "Remove the bleeder valve and the cap from the caliper.", cite: {p: 301}}
      - title: "Inspection"
        steps:
          - {t: "Clean the parts that you will use again with fresh brake fluid or isopropyl (rubbing) alcohol.", cite: {p: 301}}
          - {t: "Clean the seal and boot grooves of the caliper with a tool that has a wood or plastic tip. Clean the piston, the bore and the seal grooves with clean brake fluid.", cite: {p: 301}}
          - {t: "Examine the cylinder bore and the piston for wear, pitting and corrosion. Kawasaki does not give service limits.", cite: {p: 301}, figs: [17]}
          - {t: "Examine the caliper holder and the slide pins for wear, pitting and corrosion.", cite: {p: 301}, figs: [18]}
          - {t: "Examine the boots for deterioration.", cite: {p: 301}}
          - {t: "Examine the pad pin, the lock pin and the pad spring. If they are worn, corroded or damaged, replace them.", cite: {p: 301}, figs: [19]}
          - {t: "Examine all threaded parts. Make sure that the threads and seats have no corrosion or damage.", cite: {p: 302}, figs: [20]}
          - {t: "Examine the pads for contamination, scoring and wear. If the pads are worn to within 1 mm (0.040 in.) of the backing plate, or if oil or other chemicals contaminate them, replace them.", cite: {p: 302}, spec_ref: "brakes:Pad lining thickness"}
          - {t: "If the pads wear unevenly, the caliper probably does not slide correctly on the slide pins. Clean the pins. The caliper must float freely on the pins.", cite: {p: 302}}
      - title: "Assembly"
        steps:
          - {kind: note, t: "Use new DOT 4 brake fluid to lubricate the parts in the next steps.", cite: {p: 302}, spec_ref: "fluids:Brake fluid type"}
          - {t: "Soak the new piston seal and the new boot in brake fluid for 15 minutes.", cite: {p: 302}, figs: [21]}
          - {t: "Put brake fluid on the caliper bore and on the piston.", cite: {p: 303}}
          - {t: "Seat the seal in the caliper groove, then the boot. The piston seal goes in the back groove.", cite: {p: 303}, figs: [22]}
          - {t: "Install the piston with the insulator toward the outside. Twist the piston past the seal and the boot. Then press the piston to the bottom of the bore.", cite: {p: 303}, figs: [23]}
          - {t: "Put silicone brake grease on the inside of the boots. Install the boots on the caliper.", cite: {p: 303}}
          - {t: "If necessary, put a thin layer of grease on the outside of the large boot. This helps to pass it through the caliper.", cite: {p: 303}}
          - {t: "Lubricate the slide pins on the caliper holder. Put them in the boots.", cite: {p: 303}}
          - {t: "Press the holder against the boots. Lift the boots carefully onto the holder seats.", cite: {p: 303}, figs: [24]}
          - {t: "Install the pad spring with the narrow arms toward the outside. Seat the spring in the caliper.", cite: {p: 303}, figs: [25]}
          - {t: "Install the inner pad. Seat it in the pad spring and the caliper.", cite: {p: 303}, figs: [26]}
          - {t: "Pivot the outer pad into the caliper. Seat it between the small tabs at the top and bottom of the pad spring.", cite: {p: 303}}
          - {t: "Press down on the pads. Align the pad pin and install it.", cite: {p: 303}, figs: [27]}
          - {t: "Put the lock pin in the pad pin. Lock it in position.", cite: {p: 303}, figs: [28]}
          - {t: "Install the bleeder valve and the cap.", cite: {p: 303}}
          - {t: "Install the caliper.", cite: {p: 303}, op: c14-front-caliper-remove}

  - id: c14-front-master-cylinder-remove
    title: "Front master cylinder removal and installation"
    system: "brakes"
    source: clymer
    chapter: 14
    section: "14/front-master-cylinder"
    summary: {t: "Remove the front master cylinder and brake fluid reservoir from the handlebar. The brake lever does not need adjustment. If the brake is bled correctly, the lever adjusts itself.", cite: {p: 305}}
    spec_refs:
      - "brake-torque:Master cylinder mounting bolts/Front"
      - "brake-torque:Brake hose banjo bolts"
    parts:
      - {name: "Banjo bolt seal washers", replace: always, cite: {p: 305}, note: "Install new seal washers on the banjo bolt."}
      - {name: "Dielectric grease", replace: consumable, cite: {p: 305}, note: "Put it on the brake switch connectors."}
    sections:
      - title: "Removal"
        steps:
          - {t: "Cover and protect the fuel tank and the area around the master cylinder.", cite: {p: 305}}
          - {kind: caution, t: "Do not let brake fluid splash from the reservoir or the hose. Brake fluid can damage painted and plastic surfaces. Clean up spills immediately and flood the area with water.", cite: {p: 305}}
          - {t: "Drain the brake system.", cite: {p: 305}, op: brake-fluid-replace}
          - {t: "Pull back the rubber boot.", cite: {p: 305}}
          - {t: "Remove the banjo bolt and the seal washers from the brake hose. Keep a shop cloth ready for fluid that drips from the hose.", cite: {p: 305}, figs: [30]}
          - {t: "Wrap the end of the hose. This prevents damage to other surfaces from brake fluid.", cite: {p: 305}}
          - {t: "Disconnect the brake switch wires.", cite: {p: 305}, figs: [31]}
          - {t: "Remove the bolts that hold the master cylinder to the handlebar. Then remove the master cylinder, the holder and the hand guard.", cite: {p: 305}, figs: [31]}
          - {t: "Repair the master cylinder if necessary.", cite: {p: 305}, op: c14-front-master-cylinder-repair}
      - title: "Installation"
        steps:
          - {t: "Install the mounting bracket so that UP and the arrow point up.", cite: {p: 305}, figs: [31],
             conflict: {
               agrees: false,
               note: "The Kawasaki KLR600 manual describes the clamp position in a different way. Use the Clymer UP mark.",
               others: [{t: "The master cylinder clamp must be installed with the small projection toward the throttle grip. Tighten the upper clamp bolt first, then the lower bolt.", cite: {s: kaw-600, p: 113}}]}}
          - {t: "Tighten the upper bolt first. Then tighten the bottom bolt to the specified torque.", cite: {p: 305}, spec_ref: "brake-torque:Master cylinder mounting bolts/Front"}
          - {t: "Put dielectric grease on the brake switch connectors. Connect the wires.", cite: {p: 305}}
          - {t: "Put the brake hose fitting above the support.", cite: {p: 305}, figs: [32]}
          - {t: "Install new seal washers on the banjo bolt. Install the bolt and tighten it to the specified torque.", cite: {p: 305}, spec_ref: "brake-torque:Brake hose banjo bolts"}
          - {t: "Fill the brake fluid reservoir and bleed the brake system.", cite: {p: 305}, op: brake-fluid-replace}

  - id: c14-front-master-cylinder-repair
    title: "Front master cylinder disassembly, inspection and assembly"
    system: "brakes"
    source: clymer
    chapter: 14
    section: "14/front-master-cylinder"
    summary: {t: "Disassemble the front master cylinder, examine the parts and assemble it with new parts. The piston, the seals and the spring are only available as a complete assembly.", cite: {p: 305}}
    spec_refs:
      - "brake-torque:Brake lever pivot nut"
    parts:
      - {name: "Master cylinder piston, seals and spring assembly", replace: always, cite: {p: 305}, note: "These parts are only available as a complete assembly."}
      - {name: "DOT 4 brake fluid (sealed container)", replace: consumable, spec_ref: "fluids:Brake fluid type", cite: {p: 308}}
      - {name: "Silicone brake grease", replace: consumable, cite: {p: 308}}
      - {name: "Waterproof grease", replace: consumable, cite: {p: 308}, note: "For the lever pivot point."}
    sections:
      - title: "Disassembly"
        steps:
          - {t: "Remove the master cylinder.", cite: {p: 306}, op: c14-front-master-cylinder-remove}
          - {t: "Remove the nut and the bolt that hold the hand guard. Flex the guard carefully to remove it from the master cylinder.", cite: {p: 306}, figs: [33]}
          - {t: "Remove the brake switch.", cite: {p: 306}, figs: [34]}
          - {t: "Remove the pivot bolt and the lever.", cite: {p: 306}, figs: [35]}
          - {t: "Remove the cap and the diaphragm from the reservoir. Drain the reservoir and wipe out the extra fluid.", cite: {p: 306}}
          - {t: "Remove the boot from the piston. The boot is a friction fit. To prevent damage, put penetrating lubricant around the boot. Pull the bottom edge back carefully so that the lubricant can loosen the boot.", cite: {p: 306}, figs: [36]}
          - {t: "Hold the cylinder in a vise with soft jaws. Put a shop cloth between the jaws to absorb drips.", cite: {p: 306}}
          - {kind: caution, t: "Do not tighten the vise too much. This can damage the cylinder.", cite: {p: 306}}
          - {t: "Press down on the piston to release the pressure on the snap ring. Remove the snap ring.", cite: {p: 306}, figs: [37, 38]}
          - {t: "Release the pressure on the piston slowly.", cite: {p: 307}}
          - {t: "Remove the piston assembly from the bore.", cite: {p: 307}, figs: [39]}
      - title: "Inspection"
        steps:
          - {t: "Clean the parts that you will use again with fresh brake fluid or isopropyl (rubbing) alcohol.", cite: {p: 307}}
          - {t: "Examine the cylinder bore for wear, pitting and corrosion.", cite: {p: 307}, figs: [40]}
          - {t: "Clean the threads and the orifices in the reservoir with compressed air. Examine them.", cite: {p: 307}, figs: [41]}
          - {t: "Examine the lever bore and the pivot bolt for wear.", cite: {p: 307}, figs: [42]}
          - {t: "Examine the diaphragm and the reservoir cap for damage.", cite: {p: 307}, figs: [43]}
          - {t: "Examine the boot, the snap ring and the mounting hardware for corrosion and damage.", cite: {p: 307}, figs: [44]}
          - {t: "Clean the brake switch with electrical contact cleaner. Spray into the holes in the switch case. Operate the switch while you flush the contacts.", cite: {p: 307}, figs: [45]}
          - {t: "If you do not know the condition of the switch, connect an ohmmeter to the switch terminals. With the switch not pressed, the meter must show continuity. With the switch pressed, the meter must show no continuity.", cite: {p: 308}}
      - title: "Assembly"
        steps:
          - {t: "Soak the primary seal and the secondary seal in fresh DOT 4 brake fluid for 15 minutes. This softens and lubricates the seals.", cite: {p: 308}, figs: [46]}
          - {t: "Put brake fluid on the piston so that the seals can slide over the ends.", cite: {p: 308}}
          - {t: "Find the wide (open) side of the primary seal. Install the seal on the piston so that the wide side faces in the direction of the arrow.", cite: {p: 308}, figs: [46]}
          - {t: "Find the wide (open) side of the secondary seal. Install the seal on the piston so that the wide side faces in the direction of the arrow.", cite: {p: 308}, figs: [46]}
          - {t: "Install the small end of the spring on the piston. Seat it.", cite: {p: 308}}
          - {t: "Hold the cylinder in a vise with soft jaws.", cite: {p: 308}, figs: [47]}
          - {kind: caution, t: "Do not tighten the vise too much. This can damage the cylinder.", cite: {p: 308}}
          - {t: "Lubricate the cylinder bore and the piston assembly with brake fluid.", cite: {p: 308}}
          - {t: "Put the piston assembly in the cylinder.", cite: {p: 308}}
          - {t: "Put the snap ring over the end of the piston. Rest it on the edge of the bore. The flat side of the snap ring must face out.", cite: {p: 308}}
          - {t: "Put a screwdriver on the end of the piston. Compress the snap ring with snap ring pliers.", cite: {p: 308}}
          - {kind: note, t: "After the piston seals enter the cylinder, hold the piston in position until you install the snap ring. If the seals come out of the cylinder, the seal lips can be damaged when you put them in again.", cite: {p: 308}}
          - {t: "Press the piston into the cylinder. Guide the snap ring into position.", cite: {p: 308}}
          - {t: "If the snap ring does not seat easily, release it. Use the tip of the pliers to press it into the groove. Keep the screwdriver in position until the snap ring seats.", cite: {p: 308}}
          - {t: "Remove the cylinder from the vise.", cite: {p: 308}}
          - {t: "Put silicone brake grease on the end of the piston and inside the boot. Seat the boot in the cylinder.", cite: {p: 308}}
          - {t: "Screw the brake switch to the master cylinder. Seat the contact points of the switch on the points of the cylinder.", cite: {p: 308}, figs: [48]}
          - {t: "Install the lever and the pivot bolt. Lubricate the pivot point with waterproof grease.", cite: {p: 308}, figs: [35]}
          - {t: "Screw the diaphragm and the cap loosely on the reservoir.", cite: {p: 308}}
          - {t: "Install the hand guard. Flex it carefully onto the pivot bolt. Install the nut and the bolt that hold the guard.", cite: {p: 308}, figs: [33]}
          - {t: "Install the master cylinder.", cite: {p: 308}, op: c14-front-master-cylinder-remove}
