operations:
  - id: c12-steering-play-check
    title: "Steering play check and adjustment"
    system: "Front suspension and steering"
    source: clymer
    chapter: 12
    section: "12/steering-stem-and-head"
    summary: {t: "This procedure checks the steering stem and the bearings for play and for binding. It then adjusts them. Too much play or roughness makes the steering imprecise and causes bearing damage. Do this check before you disassemble the steering head.", cite: {p: 267}}
    spec_refs:
      - "front-suspension-torque:Steering stem nut"
      - "front-suspension-torque:Bridge pinch bolts"
    sections:
      - title: "Check"
        steps:
          - {t: "Support the motorcycle so that the front wheel is off the ground.", cite: {p: 267}}
          - {t: "Turn the handlebar from lock to lock. Make sure that the movement is smooth with no resistance.", cite: {p: 267}}
          - {t: "Put the handlebar so that the front wheel points straight ahead.", cite: {p: 267}}
          - {t: "Lightly push the end of the handlebar. The front end must turn fully to the side from the center position under its own weight.", cite: {p: 267}}
          - {t: "Do the check in both directions.", cite: {p: 267}}
          - {t: "If the steering stem moves roughly or stops before the frame stop, make sure that all cables have the correct routing.", cite: {p: 267}}
          - {t: "If the cable routing is correct and the steering binds, the adjustment can be too tight. The bearings and races can also need lubrication or replacement.", cite: {p: 267}}
          - {t: "If the steering binds, do the remaining checks before you adjust the steering.", cite: {p: 267}}
          - {t: "Put the fork so that it points straight ahead. Have an assistant hold the motorcycle.", cite: {p: 267}}
          - {t: "Hold the fork legs near the axle. Lever the fork legs in all directions and feel for play.", cite: {p: 267}}
          - {t: "If you feel movement at the steering stem, tighten the steering.", cite: {p: 267}}
          - {t: "If you feel no excessive movement and the steering turns from side to side correctly, the steering is adjusted correctly and is in good condition.", cite: {p: 267}}
      - title: "Adjustment"
        steps:
          - {t: "Remove the handlebar.", cite: {p: 267}, op: c12-handlebar-removal}
          - {t: "Loosen the lower bridge pinch bolts.", cite: {p: 267}, figs: [20]}
          - {t: "Loosen the steering stem nut.", cite: {p: 267}, figs: [7]}
          - {t: "Loosen or tighten the adjust nut with a pin spanner wrench.", cite: {p: 267}, figs: [19]}
          - {t: "Tighten the stem nut to the specified torque.", cite: {p: 268}, spec_ref: "front-suspension-torque:Steering stem nut"}
          - {t: "Tighten the lower bridge nuts.", cite: {p: 268}}
          - {t: "Do the check for bearing play again. Adjust as necessary.", cite: {p: 268}}
          - {t: "Tighten the lower bridge pinch bolts to the specified torque.", cite: {p: 268}, spec_ref: "front-suspension-torque:Bridge pinch bolts"}
          - {t: "Install the handlebar.", cite: {p: 268}, op: c12-handlebar-removal}

  - id: c12-steering-head-disassembly
    title: "Steering stem and head disassembly"
    system: "Front suspension and steering"
    source: clymer
    chapter: 12
    section: "12/steering-stem-and-head"
    summary: {t: "The steering stem pivots in the steering head on tapered roller bearings at the top and the bottom of the stem. Do the steering play check before you disassemble the steering head. The check shows if the bearings and races are worn or only need adjustment.", cite: {p: 263}}
    parts:
      - {name: "Stem nut wrench (Kawasaki part No. 57001-1100) or similar tool", replace: consumable, cite: {p: 263}, note: "Use it to loosen a tight adjust nut. Order it from a Kawasaki dealership."}
    sections:
      - steps:
          - {t: "Do the steering play check and adjustment.", cite: {p: 263}, op: c12-steering-play-check}
          - {t: "Remove the front wheel.", cite: {p: 263}, ref: "11/front-wheel-and-speedometer-drive-unit"}
          - {t: "Remove the bolts that hold the front fender.", cite: {p: 263}, figs: [6]}
          - {t: "Remove the fuel tank, the radiator covers and the fairing.", cite: {p: 263}, ref: "15/fuel-tank"}
          - {t: "Remove the handlebar.", cite: {p: 263}, op: c12-handlebar-removal}
          - {t: "Loosen the stem nut.", cite: {p: 263}, figs: [7]}
          - {t: "Remove the fork legs.", cite: {p: 263}, op: c12-fork-removal}
          - {t: "Remove the gauges and the ignition switch from the upper fork bridge.", cite: {p: 263}}
          - {t: "Remove the clamps from the left side of the upper and lower fork bridges.", cite: {p: 263}}
          - {t: "Remove the stem nut and the washer.", cite: {p: 263}}
          - {t: "Remove the upper fork bridge.", cite: {p: 263}, figs: [7]}
          - {t: "Hold the steering stem so that it cannot fall.", cite: {p: 263}}
          - {t: "Remove the claw washer and the adjust nut.", cite: {p: 263}, figs: [8]}
          - {kind: note, t: "If the adjust nut is tight, loosen it with the stem nut wrench (part No. 57001-1100) or a similar tool.", cite: {p: 263}}
          - {t: "Lower the steering stem assembly out of the steering head.", cite: {p: 264}}
          - {t: "Remove the seal and the bearing at the top of the steering head.", cite: {p: 264}}
          - {kind: caution, t: "Do not remove the bottom bearing unless it needs replacement. The press fit on the steering stem causes damage during removal.", cite: {p: 264}}

  - id: c12-steering-head-inspection
    title: "Steering stem and head inspection"
    system: "Front suspension and steering"
    source: clymer
    chapter: 12
    section: "12/steering-stem-and-head"
    summary: {t: "This procedure shows how to examine the steering head, the steering stem, the seals, the bearings and the races.", cite: {p: 264}}
    parts:
      - {name: "Steering stem bearings", replace: inspect, cite: {p: 264}, note: "If a race is worn or damaged, replace both races and both bearings."}
      - {name: "Steering head bearing races", replace: inspect, cite: {p: 264}}
      - {name: "Steering head seals", replace: inspect, cite: {p: 264}}
      - {name: "Waterproof grease", replace: consumable, cite: {p: 264}}
    sections:
      - steps:
          - {t: "Clean the bearings and the races with solvent.", cite: {p: 264}}
          - {t: "Examine the steering head on the frame for cracks or other damage. If there is damage, have a qualified welding shop repair it.", cite: {p: 264}}
          - {t: "Examine the steering stem assembly. Examine the clamping and pivot areas for cracks or damage.", cite: {p: 264}, figs: [9]}
          - {t: "Examine the steering stem threads, the stem nut, the washers and the adjust nut for damage.", cite: {p: 264}}
          - {t: "Examine the seals for damage.", cite: {p: 264}}
          - {t: "Examine the bearings for pitting, scratches, corrosion or discoloration.", cite: {p: 264}, figs: [11]}
          - {t: "Examine the bearing races in the frame for pitting, galling or corrosion.", cite: {p: 264}, figs: [12]}
          - {t: "If a race is worn or damaged, replace both races and both bearings.", cite: {p: 264}, op: c12-steering-race-replacement}
          - {t: "If you will use the bearings again, pack them with waterproof grease.", cite: {p: 264}}

  - id: c12-steering-race-replacement
    title: "Steering head bearing race replacement"
    system: "Front suspension and steering"
    source: clymer
    chapter: 12
    section: "12/steering-stem-and-head"
    summary: {t: "Remove the bearing races from the frame only to install new races. When you install new races, always install new bearings. The races are recessed in the bores.", cite: {p: 264}}
    parts:
      - {name: "Steering head bearing races", replace: always, cite: {p: 264}}
      - {name: "Steering stem bearings", replace: always, cite: {p: 264}, note: "Install new bearings with new races."}
      - {name: "Waterproof bearing grease", replace: consumable, cite: {p: 265}}
    sections:
      - steps:
          - {kind: note, t: "The installation tool uses the Kawasaki driver, part No. 57001-1106.", cite: {p: 264}}
          - {kind: note, t: "The tool also uses the Kawasaki driver, part No. 57001-1076, and the driver press shaft, part No. 57001-1075. It is a threaded rod with a disc driver on each end.", cite: {p: 265}}
          - {kind: note, t: "You can make a similar tool from common hardware. The drivers must fit at the outside edge of the races and must enter the steering head bore. The drivers must not touch the surface of the races.", cite: {p: 265}}
          - {t: "Put an aluminum drift into the steering head. Put it on the edge of the lower race.", cite: {p: 265}, figs: [13]}
          - {t: "Drive out the race. Make several passes around the race to prevent binding.", cite: {p: 265}}
          - {t: "Do the same to remove the upper race.", cite: {p: 265}}
          - {t: "Clean the race bores. Examine them for damage.", cite: {p: 265}}
          - {t: "Lubricate a new upper race. Put it squarely in the bore opening with the wide side out.", cite: {p: 265}}
          - {t: "Assemble the tool. Seat a driver at the outer edge of the race. The lower driver can rest on the edge of the steering head or in the stepped bore.", cite: {p: 265}, figs: [14]}
          - {t: "Hold the lower nut with a wrench. Tighten the upper nut to seat the race.", cite: {p: 265}}
          - {t: "Remove the tool from the frame. Make sure that the race is fully seated.", cite: {p: 265}}
          - {t: "Do the same to install the second race.", cite: {p: 265}}
          - {kind: caution, t: "Do not let the driver or the shaft touch the face of the first race during installation. This damages the race.", cite: {p: 265}}
          - {t: "Lubricate the races with waterproof bearing grease.", cite: {p: 265}}

  - id: c12-steering-stem-bearing-replacement
    title: "Steering stem bearing replacement"
    system: "Front suspension and steering"
    source: clymer
    chapter: 12
    section: "12/steering-stem-and-head"
    summary: {t: "The steering stem bearing is a press fit on the steering stem. Use this procedure to replace it.", cite: {p: 265}}
    parts:
      - {name: "Steering stem bearing", replace: always, cite: {p: 266}}
      - {name: "Steering stem bearing seal", replace: always, cite: {p: 266}}
      - {name: "Waterproof grease", replace: consumable, cite: {p: 266}}
    sections:
      - steps:
          - {t: "Thread the stem nut onto the steering stem to protect the threads.", cite: {p: 265}, figs: [15]}
          - {t: "Hold the steering stem steady.", cite: {p: 265}}
          - {kind: warning, t: "Wear safety glasses when you use a hammer and chisel. Pieces can fly off and cause injury.", cite: {p: 265}}
          - {t: "Remove the bearing and the seal with a hammer and chisel. Make several passes around the bearing to prevent binding.", cite: {p: 265}, figs: [15]}
          - {t: "Clean the steering stem. Examine it for damage.", cite: {p: 265}}
          - {t: "Pack the new bearing and the new seal with waterproof grease.", cite: {p: 266}}
          - {t: "Slide the new seal and the new bearing onto the steering stem.", cite: {p: 266}}
          - {t: "Support the steering stem directly below the bearing.", cite: {p: 266}}
          - {t: "Slide a bearing driver or a long pipe over the steering stem. Seat the tool on the inner bearing race.", cite: {p: 266}, figs: [16]}
          - {t: "Drive the bearing onto the steering stem until it is seated.", cite: {p: 266}}
          - {kind: note, t: "If you have a press, you can use it to drive the bearing and the seal.", cite: {p: 266}}

  - id: c12-steering-head-assembly
    title: "Steering stem and head assembly and adjustment"
    system: "Front suspension and steering"
    source: clymer
    chapter: 12
    section: "12/steering-stem-and-head"
    summary: {t: "This procedure installs the steering stem in the steering head and sets the bearing adjustment.", cite: {p: 266}}
    spec_refs:
      - "front-suspension-torque:Steering stem nut"
      - "front-suspension-torque:Bridge pinch bolts"
    parts:
      - {name: "Waterproof grease", replace: consumable, cite: {p: 266}}
    sections:
      - title: "Assembly"
        steps:
          - {t: "Make sure that the upper and lower bearing races are seated in the frame.", cite: {p: 266}}
          - {t: "Make sure that the bearings, the races and the seals have waterproof grease.", cite: {p: 266}}
          - {t: "Guide the steering stem through the bottom of the frame.", cite: {p: 266}, figs: [17]}
          - {t: "Install the upper bearing into its race.", cite: {p: 266}}
          - {t: "Install the bearing seal and the adjust nut. Tighten the adjust nut with your fingers.", cite: {p: 266}}
          - {t: "Tighten the adjust nut with a spanner to seat the bearings. Then loosen the nut.", cite: {p: 266}, figs: [18]}
          - {kind: caution, t: "Do not use excessive force to seat the bearings. This can damage them.", cite: {p: 266}}
          - {t: "Tighten the adjust nut again as necessary. At the same time, check for horizontal and vertical play.", cite: {p: 266}}
          - {t: "Stop when there is no play in both directions. The steering stem then pivots to the lock positions under its own weight, after an initial assist.", cite: {p: 266}}
          - {t: "Install the claw washer, the upper fork bridge, the washer and the stem nut.", cite: {p: 267}}
          - {t: "Tighten the stem nut with your fingers until you install the fork legs.", cite: {p: 267}}
          - {t: "Install the gauges and the ignition switch onto the upper fork bridge.", cite: {p: 267}}
          - {t: "Loosely install the handlebar so that you can route the wiring, hoses and cables.", cite: {p: 267}}
          - {t: "Install the fork legs. Do not tighten the lower bridge pinch bolts until you tighten the steering stem nut. The lower bridge moves a small amount when you tighten the nut.", cite: {p: 267}, op: c12-fork-installation}
          - {t: "Remove the handlebar.", cite: {p: 267}}
          - {t: "Tighten the stem nut to the specified torque.", cite: {p: 267}, spec_ref: "front-suspension-torque:Steering stem nut"}
          - {t: "Tighten the lower bridge pinch bolts only enough to hold the fork legs.", cite: {p: 267}}
      - title: "Final check of bearing play"
        steps:
          - {t: "Turn the steering stem from lock to lock. It must turn smoothly and freely. If it binds, the steering stem is too tight.", cite: {p: 267}}
          - {t: "Hold the fork legs near the axle. Lever the fork legs in all directions and feel for play. If you feel or hear play, the steering stem is too loose.", cite: {p: 267}}
          - {t: "If necessary, loosen the lower bridge pinch bolts and loosen the steering stem nut.", cite: {p: 267}}
          - {t: "Loosen or tighten the adjust nut.", cite: {p: 267}, figs: [19]}
          - {t: "Tighten the stem nut to the specified torque.", cite: {p: 267}, spec_ref: "front-suspension-torque:Steering stem nut"}
          - {t: "Tighten the lower bridge nuts.", cite: {p: 267}}
          - {t: "Do the check for bearing play again. Adjust as necessary.", cite: {p: 267}}
          - {t: "Tighten the lower bridge pinch bolts to the specified torque.", cite: {p: 267}, spec_ref: "front-suspension-torque:Bridge pinch bolts"}
          - {t: "Install the handlebar.", cite: {p: 267}, op: c12-handlebar-removal}
          - {t: "Install the front fender.", cite: {p: 267}}
          - {t: "Install the front wheel.", cite: {p: 267}, ref: "11/front-wheel-and-speedometer-drive-unit"}
          - {t: "Install the fairing, the fuel tank and the radiator covers.", cite: {p: 267}, ref: "15/fairing"}

  - id: c12-steering-bearing-lubrication
    title: "Steering bearing lubrication"
    system: "Front suspension and steering"
    source: clymer
    chapter: 12
    section: "12/steering-stem-and-head"
    summary: {t: "Lubricate the steering bearings at the interval that Chapter Three gives. Improper lubrication is a usual cause of excess play or roughness in the steering stem. This procedure disassembles the steering head, packs the bearings and races with grease, and assembles it again.", cite: {p: 263}}
    spec_refs: ["front-suspension-torque:Steering stem nut"]
    parts:
      - {name: "Waterproof bearing grease", replace: consumable, cite: {p: 264}}
    sections:
      - steps:
          - {t: "Lubricate the steering bearings every 12,000 miles (20,000 km).", cite: {p: 88}, op: steering-bearings}
          - {t: "Disassemble the steering head.", cite: {p: 263}, op: c12-steering-head-disassembly}
          - {t: "Clean the bearings and the races with solvent.", cite: {p: 264}}
          - {t: "Do the inspection of the steering stem and head. Replace worn or damaged parts.", cite: {p: 264}, op: c12-steering-head-inspection}
          - {t: "Pack the bearings with waterproof grease.", cite: {p: 264}}
          - {t: "Lubricate the races with waterproof bearing grease.", cite: {p: 265}}
          - {t: "Make sure that the bearings, the races and the seals have waterproof grease.", cite: {p: 266}}
          - {t: "Assemble the steering head and adjust the bearings.", cite: {p: 266}, op: c12-steering-head-assembly}

