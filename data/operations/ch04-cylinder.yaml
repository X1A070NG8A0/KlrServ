operations:
  - id: c04-cylinder-removal
    title: "Cylinder removal"
    system: "Engine top end"
    source: clymer
    chapter: 4
    section: "04/cylinder"
    summary: {t: "This procedure removes the cylinder and the piston with the engine in the frame. Read all the procedures fully before you start.", cite: {p: 113}}
    parts:
      - {name: "Cylinder base gasket", replace: always, cite: {p: 114}, note: "Install a new gasket."}
      - {name: "Cylinder dowels", replace: inspect, cite: {p: 114}, note: "There are two dowels under the cylinder."}
    sections:
      - steps:
          - {t: "Remove the cylinder head.", cite: {p: 113}, op: c04-cylinder-head-removal}
          - {t: "Remove the coolant hose at the front of the cylinder.", cite: {p: 114}, figs: [70]}
          - {t: "Remove the oil pipe retainer and the bolt at the rear of the cylinder.", cite: {p: 114}, figs: [71]}
          - {t: "If you will split the engine crankcases, remove the remaining banjo bolts and seal washers that hold the oil pipe.", cite: {p: 114}, figs: [72]}
          - {t: "Remove the cylinder mounting bolt in the cam chain tunnel.", cite: {p: 114}, figs: [73]}
          - {t: "Put clean shop cloths in the tunnel to prevent parts from going into the engine.", cite: {p: 114}}
          - {t: "Remove the cylinder mounting nuts at the front and the rear of the cylinder.", cite: {p: 114}, figs: [70, 71]}
          - {t: "Tap around the base of the cylinder to loosen it. If necessary, apply penetrating oil to the joint.", cite: {p: 114}}
          - {t: "Slowly lift the cylinder from the crankcase.", cite: {p: 114}}
          - {t: "Keep the two dowels from under the cylinder. If they are loose, remove them. This prevents them from falling into the engine.", cite: {p: 114}, figs: [74]}
          - {t: "Route the cam chain out of the cylinder and secure it.", cite: {p: 114}}
          - {t: "Remove the base gasket.", cite: {p: 114}}
          - {t: "Put clean shop cloths in the cam chain tunnel and around the piston.", cite: {p: 114}}
          - {t: "Support the piston and the rod so that they do not touch the crankcase or the studs.", cite: {p: 114}, figs: [75]}
          - {t: "Examine the cylinder.", cite: {p: 114}, op: c04-cylinder-inspection}

  - id: c04-cylinder-inspection
    title: "Cylinder inspection"
    system: "Engine top end"
    source: clymer
    chapter: 4
    section: "04/cylinder"
    summary: {t: "This procedure examines the cylinder for damage and measures the bore for wear. If the bore is not in the service limit, a dealership or machine shop must rebore and hone the cylinder.", cite: {p: 115}}
    spec_refs: ["top-end:Cylinder/Inside diameter"]
    parts:
      - {name: "Cylinder", replace: inspect, cite: {p: 115}, note: "If the bore is damaged or out of limit, rebore the cylinder. If the wear is more than the largest replacement piston size, replace the cylinder liner. Use a standard piston and ring set."}
    sections:
      - steps:
          - {t: "Remove all gasket residue from the top and bottom surfaces of the cylinder block.", cite: {p: 114}}
          - {t: "Wash the cylinder in solvent. Dry it with compressed air.", cite: {p: 114}}
          - {t: "Examine the cylinder bore for scoring or gouges. If there is damage, overbore the cylinder.", cite: {p: 115}, figs: [76]}
          - {t: "Examine the water jackets for deposits.", cite: {p: 115}}
          - {t: "Examine all threads for condition and cleanliness.", cite: {p: 115}}
          - {t: "Measure the inside diameter of the cylinder with a bore gauge or an inside micrometer at three points along the bore axis.", cite: {p: 115}, figs: [77], spec_ref: "top-end:Cylinder/Inside diameter"}
          - {t: "At each point, measure the cylinder front to back (measurement X) and side to side (measurement Y). Record the measurements for each location.", cite: {p: 115}, figs: [77]}
          - {t: "Compare the largest X or Y measurement to the specification and the service limit.", cite: {p: 115}, spec_ref: "top-end:Cylinder/Inside diameter"}
          - {t: "If the bore is not in the service limit, rebore and hone the cylinder. The diameter of the rebored cylinder must not change more than 0.01 mm (0.0004 in.) at any point.", cite: {p: 115}}
          - {kind: note, t: "Oversize pistons and ring sets are available in 0.5 mm (0.020 in.) and 1.0 mm (0.040 in.). The new service limit for the cylinder is 0.1 mm (0.004 in.) more than the actual diameter of the cylinder after boring. The new service limit for the piston is 0.15 mm (0.006 in.) less than the actual diameter of the piston. If the wear is more than the replacement piston sizes, replace the cylinder liner. Use a standard piston and ring set.", cite: {p: 115}}
          - {t: "If the cylinder needs boring, take it to a dealership or machine shop. If you will overbore the cylinder for the next size piston and rings, take the new piston to the shop. The shop can then bore and hone the cylinder to the actual piston size.", cite: {p: 115}}
          - {t: "If the cylinder is in all service limits and you will install a new piston and rings, deglaze the cylinder. Use a 240-grit hone if possible.", cite: {p: 115}, figs: [78]}
          - {kind: note, t: "Cylinder glaze is a hard shiny surface. After deglazing, the crosshatch pattern in the cylinder gives a uniform surface that holds oil and mates with the rings.", cite: {p: 115}, figs: [79]}
          - {t: "After the inspection and service, wash and scrub the cylinder in hot soapy water. This removes fine grit and residue from the machine operations.", cite: {p: 116}}
          - {kind: caution, t: "Do not use solvent to wash the cylinder at this step. Solvents do not remove the fine grit. The grit causes early wear of the rings and the cylinder.", cite: {p: 116}}
          - {t: "Rub a clean white cloth over the bore. Make sure that no residue is on the cloth.", cite: {p: 116}}
          - {t: "When the cylinder is clean and dry, immediately coat the bore with oil to prevent corrosion. Wrap the cylinder until you assemble the engine.", cite: {p: 116}}
          - {t: "Do all service on the piston assembly before you install the cylinder.", cite: {p: 116}, op: c04-piston-inspection}

  - id: c04-cylinder-installation
    title: "Cylinder installation"
    system: "Engine top end"
    source: clymer
    chapter: 4
    section: "04/cylinder"
    summary: {t: "This procedure installs the cylinder on the crankcase. Install the base gasket before you install the piston when the piston is out. This is easier because you must also route the cam chain through the gasket. The gasket is then less likely to bend or have damage.", cite: {p: 116}}
    spec_refs: ["top-end-torque:Cylinder mounting nuts", "top-end-torque:Cylinder mounting bolt", "top-end-torque:Oil pipe/Retainer bolt"]
    parts:
      - {name: "Cylinder base gasket", replace: always, cite: {p: 116}}
      - {name: "Oil pipe seal washers", replace: always, cite: {p: 117}, note: "Install new seal washers if you removed the complete oil pipe."}
      - {name: "Engine oil", replace: consumable, cite: {p: 116}}
    sections:
      - steps:
          - {t: "Make sure that you removed all gasket residue from all mating surfaces.", cite: {p: 116}}
          - {t: "Install the dowels and a new base gasket on the crankcase.", cite: {p: 116}, figs: [80]}
          - {t: "Lubricate the piston and the rings with engine oil.", cite: {p: 116}}
          - {t: "Lubricate the piston pin and the connecting rod with engine oil.", cite: {p: 116}}
          - {t: "Lubricate the cylinder bore with engine oil.", cite: {p: 116}}
          - {t: "Support the piston so that you can lower the cylinder into position.", cite: {p: 116}}
          - {t: "Stagger the piston ring gaps on the piston as the figure shows. The gaps of the top ring and the second ring are opposite each other and point to the front and the back of the piston.", cite: {p: 116}, figs: [81]}
          - {t: "Put the oil ring rail gaps about 30 degrees apart and point them to the sides.", cite: {p: 116}, figs: [81]}
          - {t: "Lower the cylinder onto the crankcase. Route the cam chain and the guide through the chain tunnel.", cite: {p: 116}}
          - {t: "Secure the cam chain so that it cannot fall into the engine.", cite: {p: 116}}
          - {t: "As the piston goes into the cylinder, compress each ring so that it can go into the cylinder. You can also use a ring compressor.", cite: {p: 116}}
          - {t: "When the bottom ring is in the cylinder, remove any holding fixture and shop cloths from the crankcase.", cite: {p: 116}}
          - {t: "Install the cylinder mounting nuts at the front and the rear of the cylinder. If necessary, remove the coolant hose fitting to tighten the front nut.", cite: {p: 116}, figs: [70, 71]}
          - {t: "Tighten the nuts equally in several passes to the specified torque.", cite: {p: 116}, spec_ref: "top-end-torque:Cylinder mounting nuts"}
          - {t: "Install the cylinder mounting bolt in the cam chain tunnel. Put clean shop cloths in the tunnel to prevent parts from going into the engine.", cite: {p: 117}, figs: [73]}
          - {t: "Tighten the cylinder mounting bolt to the specified torque.", cite: {p: 117}, spec_ref: "top-end-torque:Cylinder mounting bolt"}
          - {t: "Install the oil pipe retainer and the bolt at the rear of the cylinder. Tighten the bolt to the specified torque.", cite: {p: 117}, figs: [71], spec_ref: "top-end-torque:Oil pipe/Retainer bolt"}
          - {t: "If you removed the complete oil pipe, install new seal washers on the banjo bolts. Tighten the bolts by hand.", cite: {p: 117}, figs: [72]}
          - {t: "Tighten all the oil pipe banjo bolts and the retainer bolt after you install the cylinder head.", cite: {p: 117}}
          - {t: "Install the coolant hose at the front of the cylinder.", cite: {p: 117}, figs: [70]}
          - {t: "Install the cylinder head.", cite: {p: 117}, op: c04-cylinder-head-installation}
