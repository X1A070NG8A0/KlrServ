operations:
  - id: c07-shaft-inspection
    title: "Transmission shaft inspection"
    system: "Transmission and internal shift mechanism"
    source: clymer
    chapter: 7
    section: "07/transmission-inspection"
    summary: {t: "This procedure shows how to examine the shafts and the parts on them. It applies to all models. Some examinations do not apply to some shaft designs.", cite: {p: 179}}
    spec_refs: ["transmission:Gear groove width"]
    parts:
      - {name: "Gears, washers, bearings and shafts", replace: inspect, cite: {p: 180}, note: "Replace a worn or damaged gear and also the gear that it meshes with on the other shaft."}
    sections:
      - title: "Shafts"
        steps:
          - {t: "Examine the input shaft for broken or damaged gear teeth.", cite: {p: 179}, figs: [38]}
          - {t: "Examine the shafts for worn or damaged splines.", cite: {p: 179}, figs: [38]}
          - {t: "Examine the shafts for rounded or damaged snap ring grooves.", cite: {p: 179}, figs: [38]}
          - {t: "Make sure that the oil holes are clean.", cite: {p: 179}, figs: [39]}
          - {t: "Examine the bearing and bushing surfaces for wear, galling or other damage. A blue color shows too much heat.", cite: {p: 179}, figs: [39]}
          - {t: "Examine the threads for damage. If the damage is mild, true the threads with a thread die.", cite: {p: 179}, figs: [39]}
      - title: "Gears"
        steps:
          - {t: "Examine the gears for broken or damaged teeth.", cite: {p: 180}, figs: [40]}
          - {t: "Examine the gears for worn or damaged splines.", cite: {p: 180}, figs: [40]}
          - {t: "Examine the gear bore for scoring, galling or fractures. A blue color shows too much heat.", cite: {p: 180}, figs: [40]}
          - {t: "If the output shaft has a bushing at third gear, examine the fit of the bushing in the gear and on the shaft.", cite: {p: 180}}
          - {t: "Examine the gear dogs and recesses for wear, damage or rounded edges. The wear must be the same on all dogs.", cite: {p: 180}, figs: [40]}
          - {kind: note, t: "The side of the dogs that carries the engine load wears and becomes round. Round dogs cause the transmission to jump out of gear.", cite: {p: 180}}
          - {t: "Put the gears in their positions on the countershaft. Twist the gears together. Make sure that they engage positively in both directions.", cite: {p: 180}}
          - {t: "If the dogs show damage, also examine the shift forks.", cite: {p: 180}, op: c07-shift-drum-and-fork-inspection}
          - {t: "Measure the width of the shift fork groove in the gear. If the width is more than the service limit, replace the gear.", cite: {p: 180}, figs: [41], spec_ref: "transmission:Gear groove width"}
          - {t: "Make sure that each bored gear fits firmly on its shaft and turns smoothly and freely.", cite: {p: 180}}
          - {t: "Make sure that each splined gear fits snugly on its shaft and slides smoothly and freely.", cite: {p: 180}}
      - title: "Bearings, washers and spacers"
        steps:
          - {t: "Examine the needle bearings for damage or heat discoloration.", cite: {p: 181}}
          - {t: "Make sure that the bearings turn freely on the shaft and in their bushings in the crankcase.", cite: {p: 181}}
          - {t: "Examine the thrust washers, spacers and spline washers. They must be smooth, with no wear or damage.", cite: {p: 181}}
          - {t: "Examine the teeth of the spline washers. No tooth can be missing or damaged.", cite: {p: 181}}
          - {t: "Install the parts on their shafts.", cite: {p: 181}, op: c07-input-shaft-assembly}
