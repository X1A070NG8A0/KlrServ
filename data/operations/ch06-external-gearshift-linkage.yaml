operations:
  - id: c06-gearshift-linkage-removal
    title: "External gearshift linkage removal"
    system: "Clutch, gearshift linkage and lubrication system"
    source: clymer
    chapter: 6
    section: "06/external-gearshift-linkage"
    summary: {t: "This procedure removes the complete external gearshift linkage. The linkage is behind the right side cover and the clutch partly covers it. You can examine the shift shaft assembly without removal of the clutch.", cite: {p: 159}}
    sections:
      - steps:
          - {t: "Remove the right crankcase cover.", cite: {p: 159}, op: c06-right-crankcase-cover, figs: [43]}
          - {t: "Remove the clutch.", cite: {p: 159}, op: c06-clutch-removal}
          - {t: "Put the transmission in neutral. Make sure that the roller of the lever is in the neutral detent on the shift cam.", cite: {p: 159}, figs: [44]}
          - {t: "Remove the shift lever from the left side of the engine. Note the position of the lever on the shaft splines, so that you can install it in the same position.", cite: {p: 159}}
          - {t: "Pull the shift shaft assembly out of the engine.", cite: {p: 159}, figs: [45]}
          - {t: "Remove the lever and the torsion spring.", cite: {p: 159}, figs: [46]}
          - {t: "Remove the shift cam.", cite: {p: 159}, figs: [46]}
          - {t: "Remove the pin from the end of the shift drum.", cite: {p: 159}, figs: [47]}
          - {t: "If the return spring post has damage or is loose, remove it.", cite: {p: 159}, figs: [46]}
          - {t: "Examine the parts.", cite: {p: 159}, op: c06-gearshift-linkage-inspection}

  - id: c06-gearshift-linkage-inspection
    title: "External gearshift linkage inspection"
    system: "Clutch, gearshift linkage and lubrication system"
    source: clymer
    chapter: 6
    section: "06/external-gearshift-linkage"
    summary: {t: "This procedure shows how to examine the shift shaft assembly, the shift cam, the lever and the return spring post. Replace parts that are worn, damaged or fatigued.", cite: {p: 159}}
    parts:
      - {name: "Shift shaft return spring", replace: inspect, cite: {p: 160}}
      - {name: "Shift shaft pawl and band spring", replace: inspect, cite: {p: 160}}
      - {name: "Shift cam lever and bolt", replace: inspect, cite: {p: 160}, note: "If one is loose, replace both."}
    sections:
      - steps:
          - {t: "Clean the parts in solvent.", cite: {p: 159}}
          - {t: "Examine the return spring of the shift shaft assembly for fatigue or damage.", cite: {p: 160}, figs: [48]}
          - {t: "Examine the tips of the pawl for wear.", cite: {p: 160}}
          - {t: "Make sure that the pawl slides freely and returns to the extended position.", cite: {p: 160}}
          - {t: "If the pawl jams or drags, remove the band spring and the pawl from the shift shaft. Then find which parts have damage.", cite: {p: 160}, figs: [49]}
          - {t: "When you install the band spring, engage the narrow end with the pawl.", cite: {p: 160}}
          - {t: "Examine the splines on the shaft and in the shift lever.", cite: {p: 160}}
          - {t: "Examine the pawl engagement points on the shift cam for wear.", cite: {p: 160}, figs: [50]}
          - {t: "Examine the lever engagement points on the shift cam for wear in the high areas and the low areas.", cite: {p: 160}}
          - {t: "Make sure that the neutral detent is not worn away and that the lever roller can rest in it.", cite: {p: 160}}
          - {t: "Examine the shift cam bolt, the pin and the pin bore. The pin and the bore must not be worn.", cite: {p: 160}, figs: [51]}
          - {kind: note, t: "It is normal that the pin bore is elongated.", cite: {p: 160}}
          - {t: "Make sure that the pin fits in the shift drum with minimal perceptible play.", cite: {p: 160}}
          - {t: "Examine the threads of the bolt for condition and cleanliness. Remove all threadlocking compound before you tighten the bolt.", cite: {p: 160}}
          - {t: "Examine the lever, the bolt and the spring.", cite: {p: 160}, figs: [52]}
          - {t: "Make sure that the lever roller is round, turns freely and has no play in its pivot.", cite: {p: 160}}
          - {t: "Make sure that the shoulder on the bolt fits in the lever with minimal play or no play. If one part is loose, replace both parts.", cite: {p: 160}}
          - {t: "Examine the ends of the spring for wear.", cite: {p: 160}}
          - {t: "Examine the return spring post for wear and tightness.", cite: {p: 160}, figs: [46]}

  - id: c06-gearshift-linkage-installation
    title: "External gearshift linkage installation"
    system: "Clutch, gearshift linkage and lubrication system"
    source: clymer
    chapter: 6
    section: "06/external-gearshift-linkage"
    summary: {t: "This procedure installs the external gearshift linkage and tests the shifting action.", cite: {p: 161}}
    spec_refs: ["clutch-torque:Shift cam bolt"]
    parts:
      - {name: "Threadlocking compound", replace: consumable, cite: {p: 161}}
    sections:
      - steps:
          - {t: "If you removed the return spring post, apply threadlocking compound to its threads. Install and tighten the post.", cite: {p: 161}, figs: [46]}
          - {t: "Install the pin in the end of the shift drum.", cite: {p: 161}}
          - {t: "Install the shift cam. Engage the bore in the shift cam with the pin.", cite: {p: 161}, figs: [53]}
          - {t: "Apply threadlocking compound to the threads of the shift cam bolt. Install the bolt.", cite: {p: 161}}
          - {t: "Tighten the shift cam bolt to the specified torque.", cite: {p: 161}, spec_ref: "clutch-torque:Shift cam bolt"}
          - {t: "Install the lever and the torsion spring.", cite: {p: 161}, figs: [46]}
          - {t: "Make sure that the spring is correctly installed with the lever and against the crankcase.", cite: {p: 161}, figs: [54]}
          - {t: "Make sure that the shoulder of the bolt is seated in the lever before you tighten the bolt.", cite: {p: 161}}
          - {t: "Put the shift shaft assembly through the engine. Seat the return spring around the post.", cite: {p: 161}, figs: [45, 55]}
          - {t: "Install the shift lever on the left side of the engine. If necessary, ask a person to hold the shaft in position on the right side.", cite: {p: 161}}
          - {t: "Turn the transmission shaft to aid shifting. Shift the transmission through the gears.", cite: {p: 161}}
          - {t: "Make sure that the lever roller locks into each detent on the shift cam. In neutral, the roller must rest in the neutral detent.", cite: {p: 161}, figs: [44]}
          - {t: "Install the clutch.", cite: {p: 161}, op: c06-clutch-installation}
          - {t: "Install the right crankcase cover.", cite: {p: 161}, op: c06-right-crankcase-cover}
