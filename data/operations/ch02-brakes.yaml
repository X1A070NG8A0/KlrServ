operations:
  - id: c02-disc-brake-troubleshooting
    title: "Disc brake troubleshooting"
    system: "troubleshooting"
    source: clymer
    chapter: 2
    section: "02/brakes"
    summary: {t: "The disc brakes are critical to riding performance and safety. Replace worn or damaged parts at once. Both brakes use DOT 4 brake fluid. Always use new fluid from a sealed container.", cite: {p: 52}}
    sections:
      - steps:
          - {kind: note, t: "When you examine the brake pads, make sure that the pads in each caliper touch the disc squarely. Uneven pad wear on one side of the disc can show a warped or bent disc, a damaged caliper or damaged pad pins.", cite: {p: 54}}
      - title: "Brake fluid leakage"
        steps:
          - {t: "Examine the line fittings for looseness or damage.", cite: {p: 52}, op: "brake-hoses"}
          - {t: "Examine the caliper piston seals for wear.", cite: {p: 52}, op: "c14-front-caliper-repair"}
          - {t: "Examine the caliper piston and the bore for scoring.", cite: {p: 52}, op: "c14-front-caliper-repair"}
          - {t: "Make sure that the banjo bolts are not loose.", cite: {p: 52}, op: "brake-hoses"}
          - {t: "Examine the oil line washers for damage.", cite: {p: 52}, op: "brake-hoses"}
          - {t: "Examine the master cylinder diaphragm for a leak.", cite: {p: 52}, op: "c14-front-master-cylinder-repair"}
          - {t: "Examine the master cylinder secondary seal for a leak.", cite: {p: 52}, op: "c14-front-master-cylinder-repair"}
          - {t: "Examine the master cylinder housing for cracks.", cite: {p: 52}, op: "c14-front-master-cylinder-repair"}
          - {t: "Make sure that the brake fluid level is not too high.", cite: {p: 52}, op: "brake-fluid-level"}
          - {t: "Make sure that the master cylinder is not loose or damaged.", cite: {p: 52}, op: "c14-front-master-cylinder-repair"}
      - title: "Brake overheating"
        steps:
          - {t: "Examine the brake disc for warp.", cite: {p: 52}, op: "c14-brake-disc-inspect"}
          - {t: "Make sure that the brake fluid is the correct type.", cite: {p: 52}, op: "brake-fluid-replace"}
          - {t: "Make sure that the caliper piston and the brake pads do not hang up.", cite: {p: 52}, op: "c14-front-caliper-repair"}
          - {t: "Do not ride with the brakes applied.", cite: {p: 52}}
      - title: "Brake chatter"
        steps:
          - {t: "Examine the brake disc for warp.", cite: {p: 52}, op: "c14-brake-disc-inspect"}
          - {t: "Make sure that the caliper alignment is correct.", cite: {p: 52}, op: "c14-front-caliper-remove"}
          - {t: "Make sure that the caliper mounting bolts are not loose.", cite: {p: 52}, op: "c14-front-caliper-remove"}
          - {t: "Make sure that the front axle nut and the clamps are not loose.", cite: {p: 52}, op: "c11-front-wheel"}
          - {t: "Examine the wheel bearings for wear.", cite: {p: 52}, op: "c11-hub-bearing-inspection"}
          - {t: "Examine the hub for damage.", cite: {p: 52}, op: "c11-hub-bearing-inspection"}
          - {t: "Examine the brake hydraulic line for a restriction.", cite: {p: 52}, op: "brake-hoses"}
          - {t: "Examine the brake pads for contamination.", cite: {p: 52}, op: "brake-pads"}
      - title: "Brake locking"
        steps:
          - {t: "Make sure that the brake fluid is the correct type.", cite: {p: 52}, op: "brake-fluid-replace"}
          - {t: "Examine the passages in the master cylinder for a clog.", cite: {p: 52}, op: "c14-front-master-cylinder-repair"}
          - {t: "Make sure that the caliper piston and the brake pads do not hang up.", cite: {p: 52}, op: "c14-front-caliper-repair"}
          - {t: "Examine the brake disc for warp.", cite: {p: 52}, op: "c14-brake-disc-inspect"}
      - title: "Insufficient brakes"
        steps:
          - {t: "Examine the brake lines for air. Bleed the system.", cite: {p: 52}, ref: "14/brake-system-bleeding"}
          - {t: "Examine the brake pads for wear.", cite: {p: 52}, op: "brake-pads"}
          - {t: "Make sure that the brake fluid level is not low.", cite: {p: 52}, op: "brake-fluid-level"}
          - {t: "Make sure that the brake fluid is the correct type.", cite: {p: 52}, op: "brake-fluid-replace"}
          - {t: "Examine the brake disc for wear.", cite: {p: 52}, op: "c14-brake-disc-inspect"}
          - {t: "Examine the caliper piston seals for wear.", cite: {p: 52}, op: "c14-front-caliper-repair"}
          - {t: "Examine the brake pads for glazing.", cite: {p: 52}, op: "brake-pads"}
          - {t: "Examine the primary cup seal in the master cylinder for a leak.", cite: {p: 52}, op: "c14-front-master-cylinder-repair"}
          - {t: "Examine the brake pads and the disc for contamination.", cite: {p: 52}, op: "brake-pads"}
      - title: "Brake squeal"
        steps:
          - {t: "Examine the brake pads and the disc for contamination.", cite: {p: 52}, op: "brake-pads"}
          - {t: "Look for dust or dirt behind the brake pads.", cite: {p: 52}, op: "brake-pads"}
          - {t: "Make sure that no parts are loose.", cite: {p: 52}, op: "c14-front-caliper-remove"}

  - id: c02-steering-handling-troubleshooting
    title: "Steering and handling troubleshooting"
    system: "troubleshooting"
    source: clymer
    chapter: 2
    section: "02/steering-and-handling"
    summary: {t: "Correct poor steering and handling at once, because loss of control is possible.", cite: {p: 53}}
    sections:
      - title: "Excessive handlebar vibration"
        steps:
          - {t: "Make sure that the tire pressure is correct.", cite: {p: 53}, op: "tires"}
          - {t: "Examine the tire and the rim for imbalance.", cite: {p: 53}, op: "c11-wheel-balancing"}
          - {t: "Examine the spokes for looseness or breaks.", cite: {p: 53}, op: "spokes"}
          - {t: "Examine the rim for damage.", cite: {p: 53}, op: "c11-rim-inspection"}
          - {t: "Examine the handlebar clamps for looseness or damage.", cite: {p: 53}, op: "c12-handlebar-inspection"}
          - {t: "Make sure that the steering stem nut is not loose.", cite: {p: 53}, op: "c12-steering-play-check"}
          - {t: "Examine the front wheel bearings for wear or damage.", cite: {p: 53}, op: "c11-hub-bearing-inspection"}
          - {t: "Examine the axle for bends or looseness.", cite: {p: 53}, op: "c11-front-wheel-inspection"}
          - {t: "Examine the frame and the steering head for cracks.", cite: {p: 53}, op: "c12-steering-head-inspection"}
      - title: "Handlebar is hard to turn"
        steps:
          - {t: "Make sure that the tire pressure is not too low.", cite: {p: 53}, op: "tires"}
          - {t: "Make sure that the cable routing is correct.", cite: {p: 53}, op: "control-cables-lube"}
          - {t: "Make sure that the steering stem adjustment is not too tight.", cite: {p: 53}, op: "c12-steering-play-check"}
          - {t: "Examine the steering stem for bends.", cite: {p: 53}, op: "c12-steering-head-inspection"}
          - {t: "Examine the steering bearings for damage or lack of lubricant.", cite: {p: 54}, op: "c12-steering-bearing-lubrication"}
      - title: "Handlebar pulls to one side"
        steps:
          - {t: "Examine the fork legs for bends.", cite: {p: 54}, op: "c12-fork-inspection"}
          - {t: "Make sure that the fork oil levels are equal.", cite: {p: 54}, op: "fork-oil"}
          - {t: "Examine the steering stem for bends.", cite: {p: 54}, op: "c12-steering-head-inspection"}
          - {t: "Examine the frame and the swing arm for bends.", cite: {p: 54}, op: "c13-swing-arm-inspection"}
      - title: "Shock absorption too soft"
        steps:
          - {t: "Make sure that the fork oil level is not low.", cite: {p: 54}, op: "fork-oil"}
          - {t: "Make sure that the fork oil viscosity is not too low.", cite: {p: 54}, op: "fork-oil"}
          - {t: "Make sure that the rebound damping of the shock absorber is not too low.", cite: {p: 54}, op: "c13-rebound-damping-adjustment"}
          - {t: "Make sure that the spring preload of the shock absorber is not too low.", cite: {p: 54}, op: "c13-shock-preload-adjustment"}
          - {t: "Examine the spring of the shock absorber for weakness.", cite: {p: 54}, op: "c13-shock-absorber-inspection"}
      - title: "Shock absorption too hard"
        steps:
          - {t: "Release the air pressure in the fork.", cite: {p: 54}, op: "fork-air-release"}
          - {t: "Make sure that the tire pressure is not too high.", cite: {p: 54}, op: "tires"}
          - {t: "Make sure that the fork oil level is not too high.", cite: {p: 54}, op: "fork-oil"}
          - {t: "Make sure that the fork oil viscosity is not too high.", cite: {p: 54}, op: "fork-oil"}
          - {t: "Examine the fork for bends.", cite: {p: 54}, op: "c12-fork-inspection"}
          - {t: "Make sure that the rebound damping of the shock absorber is not too high.", cite: {p: 54}, op: "c13-rebound-damping-adjustment"}
          - {t: "Make sure that the spring preload of the shock absorber is not too high.", cite: {p: 54}, op: "c13-shock-preload-adjustment"}

