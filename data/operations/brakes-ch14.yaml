# Clymer Chapter Fourteen (Brakes): fluid draining/bleeding (PDF p322-325) and
# brake hose disconnect/reconnect steps (PDF p300, p305, p312), with the
# Kawasaki KLR600 base manual's hose and fluid notes (PDF p110-112).
operations:
  - id: brake-fluid-replace
    title: "Brake fluid replacement: draining and bleeding"
    system: "Brakes"
    source: clymer
    chapter: 14
    section: "14/brake-system-bleeding"
    summary:
      t: "Bleed the brakes when you replace the brake fluid. Also bleed them if the lever or pedal feels spongy. Bleeding removes all air from the system. Before you bleed, find where the air enters the system. Examine all brake parts for leaks. Examine the fittings and hoses for damage, deterioration and looseness."
      cite: {p: 322}
    spec_refs:
      - "fluids:Brake fluid type"
      - "brake-torque:Brake bleeder valve"
    parts:
      - {name: "DOT 4 brake fluid (sealed container)", replace: consumable, spec_ref: "fluids:Brake fluid type", cite: {p: 323}, note: "Do not use fluid from an unsealed container. It has absorbed moisture from the air."}
      - {name: "Clear tubing to fit the bleeder valve", replace: consumable, cite: {p: 322}}
    sections:
      - title: "Draining (front or rear)"
        steps:
          - {kind: caution, t: "Wash brake fluid off painted and finished surfaces immediately with water. Brake fluid can damage these surfaces.", cite: {p: 322}}
          - {t: "Get a 10 mm wrench, a container that does not tip, and clear tubing that fits tightly on the bleeder valve.", cite: {p: 322}}
          - {t: "Connect the tubing to the bleeder valve. Put the other end of the tubing in the container.", cite: {p: 322}, figs: [97]}
          - {t: "Open the bleeder valve so that the fluid can flow into the tubing.", cite: {p: 322}}
          - {t: "Pump the brake lever or pedal to push the fluid out of the system.", cite: {p: 322}}
          - {t: "When fluid no longer drips from the system, close the bleeder valve.", cite: {p: 322}}
          - {t: "Dispose of the brake fluid in an environmentally safe manner.", cite: {p: 322}}
      - title: "Reservoirs during bleeding"
        steps:
          - {kind: caution, t: "Before you bleed the brakes, make sure that the motorcycle is stable and locked in position, mainly the fork. This prevents spills of fluid from the open reservoir.", cite: {p: 322}}
          - {t: "Do not fill the reservoir too much or too little. Remove the cap of the reservoir that you bleed.", cite: {p: 322}}
          - {t: "Front reservoir: remove the cap. Then remove the diaphragm before you fill the reservoir.", cite: {p: 323}}
          - {t: "Front reservoir: during bleeding, keep the fluid level between the top of the sight glass and the lower mark.", cite: {p: 323}, figs: [98]}
          - {t: "Front reservoir: after bleeding, fill the reservoir to the upper mark. Then install the diaphragm and the cap.", cite: {p: 323}}
          - {t: "Rear reservoir: remove the reservoir guard and the backing plate. Then remove the cap, the diaphragm plate and the diaphragm.", cite: {p: 323}}
          - {t: "Rear reservoir: during bleeding, keep the fluid level between the upper and lower marks.", cite: {p: 323}, figs: [99]}
          - {t: "Rear reservoir: after bleeding, fill the reservoir to the upper mark. Then install the diaphragm, the diaphragm plate and the cap.", cite: {p: 323}}
          - {t: "Rear reservoir: install the backing plate and the reservoir guard.", cite: {p: 324}}
          - {kind: note, t: "The reservoir must contain fluid during the full procedure. If the reservoir becomes empty, air gets into the system. Then you must do the bleeding again.", cite: {p: 324}}
      - title: "Manual bleeding"
        steps:
          - {t: "Get a 10 mm wrench, a container that does not tip, and clear tubing that fits tightly on the bleeder valve. The job is easier with two people. One person opens and closes the bleeder valve. The other person operates the lever or pedal.", cite: {p: 323}}
          - {t: "Connect the tubing to the bleeder valve. Put the other end of the tubing in the container.", cite: {p: 323}, figs: [97]}
          - {t: "Fill the reservoir to the upper level with DOT 4 brake fluid.", cite: {p: 323}, spec_ref: "fluids:Brake fluid type",
             conflict: {
               agrees: false,
               note: "The Kawasaki KLR600 manual lists a different fluid grade. Clymer is the only manual for 2003-2006, so use DOT 4.",
               others: [{t: "Brake fluid grade: D.O.T.3.", cite: {s: kaw-600, p: 109}}]}}
          - {kind: caution, t: "Do not use brake fluid from an unsealed container. The fluid absorbs moisture from the air and is contaminated. Use DOT 4 brake fluid from a sealed container.", cite: {p: 323}}
          - {t: "Push the brake lever or pedal one time and hold it. Do not pump it. Then open the bleeder valve. The lever or pedal moves through its full travel as the fluid leaves the system.", cite: {p: 323}}
          - {t: "When the lever or pedal cannot move more, hold it down and close the bleeder valve.", cite: {p: 323}}
          - {kind: caution, t: "Do not let the lever or pedal return before you close the bleeder valve. Air then enters the system.", cite: {p: 323}}
          - {kind: note, t: "Release the lever or pedal slowly. Fluid then does not splash out of the reservoir when the extra fluid returns to it.", cite: {p: 323}}
          - {t: "Release the lever or pedal so that it returns to its up position.", cite: {p: 323}}
          - {t: "Examine the fluid level in the reservoir. If the level is low, add fluid.", cite: {p: 324}}
          - {t: "Do steps again from the push of the lever or pedal, until clear fluid with few air bubbles flows from the bleeder valve.", cite: {p: 324}}
          - {kind: note, t: "A small quantity of air enters the system each time that you open the bleeder valve. To prevent this, wrap the bleeder valve threads with Teflon tape or put silicone brake grease on them.", cite: {p: 324}}
          - {kind: note, t: "If small bubbles (foam) stay in the system after several attempts, close the reservoir. Let the system stand for a few hours without disturbance. The air then comes out as large bubbles.", cite: {p: 324}}
          - {t: "Make sure that the lever or pedal feels firm. Then the bleeding is complete.", cite: {p: 324}}
          - {t: "If necessary, fill the reservoir to the upper level.", cite: {p: 324}}
          - {t: "Tighten the bleeder valve. Do not tighten it too much.", cite: {p: 324}, spec_ref: "brake-torque:Brake bleeder valve",
             conflict: {
               agrees: true,
               note: "The Kawasaki KLR600 manual gives almost the same bleed valve torque value.",
               others: [{t: "Bleed valve: 7.8 N-m (69 in-lb).", cite: {s: kaw-600, p: 111}}]}}
          - {t: "Dispose of the waste brake fluid in an environmentally safe manner.", cite: {p: 324}}
      - title: "Vacuum bleeding (alternative)"
        steps:
          - {t: "Get a 10 mm wrench and a vacuum pump, for example a Mityvac pump.", cite: {p: 324}, figs: [100]}
          - {t: "Make sure that the banjo bolts at the master cylinder and at the caliper are tight.", cite: {p: 324}}
          - {t: "Connect the brake bleeder to the bleeder valve. Hang the tool on a wire. Then you can release it when you must fill the reservoir.", cite: {p: 324}, figs: [100]}
          - {t: "Fill the reservoir to the upper level with DOT 4 brake fluid from a sealed container.", cite: {p: 324}, spec_ref: "fluids:Brake fluid type"}
          - {t: "Pump the handle of the brake bleeder to make a vacuum.", cite: {p: 325}}
          - {t: "Open the bleeder valve to pull air and fluid from the system. Close the valve before the fluid stops. If the pump has a gauge, close the valve before the gauge shows 0 in. Hg.", cite: {p: 325}}
          - {t: "Add fluid to the reservoir to keep the level correct.", cite: {p: 325}}
          - {t: "Do the pump and open steps again until clear fluid with few air bubbles flows from the bleeder valve.", cite: {p: 325}}
          - {t: "Make sure that the lever or pedal feels firm. Then the bleeding is complete.", cite: {p: 325}}
          - {t: "If necessary, fill the reservoir to the upper level.", cite: {p: 325}}
          - {t: "Tighten the bleeder valve. Do not tighten it too much.", cite: {p: 325}, spec_ref: "brake-torque:Brake bleeder valve"}
          - {t: "Dispose of the waste brake fluid in an environmentally safe manner.", cite: {p: 325}}

  - id: brake-hoses
    title: "Brake hose replacement"
    system: "Brakes"
    source: clymer
    chapter: 14
    section: "14/front-master-cylinder"
    summary:
      t: "Clymer has no separate procedure for brake hose replacement. You disconnect and connect the hose at its banjo bolts during the caliper and master cylinder procedures. Then you fill and bleed the system. This procedure collects those steps."
      cite: {p: 305}
    spec_refs:
      - "brake-torque:Brake hose banjo bolts"
      - "fluids:Brake fluid type"
    parts:
      - {name: "Brake hose", replace: always, cite: {p: 88}, note: "Table 1: replace every 4 years."}
      - {name: "Banjo bolt seal washers", replace: always, cite: {p: 300}, note: "Install new seal washers on the banjo bolt."}
      - {name: "DOT 4 brake fluid (sealed container)", replace: consumable, spec_ref: "fluids:Brake fluid type", cite: {p: 323}}
    sections:
      - title: "Disconnect"
        steps:
          - {kind: caution, t: "Do not let brake fluid splash from the reservoir or the hose. Brake fluid can damage painted and plastic surfaces. Clean up spills immediately and flood the area with water.", cite: {p: 305}}
          - {t: "Drain the brake system.", cite: {p: 305}, op: brake-fluid-replace}
          - {t: "At the front master cylinder, pull back the rubber boot.", cite: {p: 305}}
          - {t: "Remove the banjo bolt and the seal washers from the brake hose. Keep a shop cloth ready for fluid that drips from the hose.", cite: {p: 305}, figs: [30]}
          - {t: "Wrap the end of the hose.", cite: {p: 305}}
          - {t: "At the front caliper, remove the banjo bolt and the seal washers from the brake hose. Catch the fluid that drips with a shop cloth. Wrap the end of the hose.", cite: {p: 300}}
          - {t: "At the rear caliper, remove the banjo bolt and the seal washers from the brake hose in the same way. Keep a shop cloth ready.", cite: {p: 312}}
      - title: "Connect and bleed"
        steps:
          - {t: "Install new seal washers on each banjo bolt.", cite: {p: 300}, figs: [11],
             conflict: {
               agrees: true,
               note: "Kawasaki gives more detail: a new washer on each side of the hose fitting.",
               others: [{t: "Discard the used flat washers, and install a new washer on each side of the brake hose fittings.", cite: {s: kaw-600, p: 112}}]}}
          - {t: "At the front master cylinder, put the brake hose fitting above the support.", cite: {p: 305}, figs: [32]}
          - {t: "Tighten the banjo bolts.", cite: {p: 305}, spec_ref: "brake-torque:Brake hose banjo bolts"}
          - {t: "Fill the reservoir and bleed the brake system.", cite: {p: 305}, op: brake-fluid-replace}
          - {t: "Make sure that the brake has good braking power, has no drag and has no fluid leaks.", cite: {s: kaw-600, p: 112}}
          - {kind: warning, t: "Do not ride the motorcycle until the brake lever feels full. Pump the lever until the pads touch the disc. If you do not, the brake does not work on the first application.", cite: {s: kaw-600, p: 112}}
