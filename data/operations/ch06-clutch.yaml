operations:
  - id: c06-clutch-removal
    title: "Clutch removal"
    system: "Clutch, gearshift linkage and lubrication system"
    source: clymer
    chapter: 6
    section: "06/clutch"
    summary: {t: "This procedure removes the clutch assembly from the transmission input shaft. The clutch has an outer housing and a clutch hub. Friction plates and clutch plates lock alternately to these two parts.", cite: {p: 152}}
    spec_refs: ["clutch:Friction plates", "clutch:Steel plates"]
    parts:
      - {name: "Clutch hub locknut", replace: always, cite: {p: 157}, note: "Do not use the locknut again."}
      - {name: "Clutch hub lockwasher", replace: inspect, cite: {p: 157}, note: "Replace the lockwasher if it is no longer cupped."}
    sections:
      - steps:
          - {kind: note, t: "On 1996-on models, the clutch has eight friction plates and seven clutch plates. The removal, inspection and installation procedures are the same for all models.", cite: {p: 152}}
          - {kind: caution, t: "Do not add oil additives to the engine oil. They can cause poor clutch operation and can contaminate the friction plates.", cite: {p: 152}}
          - {t: "Remove the right crankcase cover.", cite: {p: 152}, op: c06-right-crankcase-cover}
          - {t: "Loosen the five bolts that compress the clutch springs. Make several passes to release the pressure equally on the bolts.", cite: {p: 152}, figs: [13]}
          - {t: "Remove the bolts and the springs from the clutch.", cite: {p: 152}, figs: [14]}
          - {t: "Remove the pressure plate. Keep the plate tilted up so that the lifter bearing in the back of the plate does not fall out.", cite: {p: 152}, figs: [15]}
          - {t: "Remove the clutch lifter.", cite: {p: 152}, figs: [16]}
          - {t: "Remove the plates from the clutch housing and the clutch hub.", cite: {p: 152}, figs: [17]}
          - {kind: note, t: "On 1996-on models, the outer friction plate seats in the shallow slots of the outer housing.", cite: {p: 152}, figs: [18]}
          - {t: "Temporarily install the right footpeg.", cite: {p: 152}}
          - {t: "Attach a clutch holder tool to the clutch hub. Put the tool on the footpeg.", cite: {p: 152}, figs: [20], conflict: {note: "Clymer gives two part numbers for the Kawasaki clutch holder tool. This page gives 57001-3035. The installation text gives 57001-305. Use the value on the page for your work and make sure of the number with a Kawasaki dealer.", agrees: false, others: [{t: "57001-305", cite: {p: 157}}]}}
          - {kind: caution, t: "Do not jam the gears with screwdrivers or other tools. This can cause gear breakage.", cite: {p: 152}}
          - {t: "Use a 30 mm socket to loosen the clutch locknut.", cite: {p: 152}, figs: [19]}
          - {t: "Remove the clutch locknut and the lockwasher.", cite: {p: 152}}
          - {t: "Remove the clutch hub.", cite: {p: 152}, figs: [21]}
          - {t: "Remove the washer.", cite: {p: 152}, figs: [22]}
          - {t: "Remove the clutch housing.", cite: {p: 152}, figs: [23]}
          - {t: "Remove the clutch housing collar.", cite: {p: 152}, figs: [24]}
          - {t: "Remove the spacer.", cite: {p: 152}, figs: [25]}
          - {t: "Examine the clutch assembly.", cite: {p: 152}, op: c06-clutch-inspection}

  - id: c06-clutch-inspection
    title: "Clutch inspection"
    system: "Clutch, gearshift linkage and lubrication system"
    source: clymer
    chapter: 6
    section: "06/clutch"
    summary: {t: "This procedure shows how to measure and examine the friction plates, the clutch plates, the springs, the clutch housing, the clutch hub and the pressure plate. Replace plates and springs as a set if they do not meet the specifications.", cite: {p: 152}}
    spec_refs: ["clutch:Friction plate thickness", "clutch:Clutch plate (steel) warp", "clutch:Clutch spring"]
    parts:
      - {name: "Friction plates", replace: inspect, cite: {p: 152}, note: "Replace all plates as a set if one is out of limit."}
      - {name: "Clutch plates (steel)", replace: inspect, cite: {p: 152}, note: "Replace all plates as a set if one is out of limit."}
      - {name: "Clutch springs", replace: inspect, cite: {p: 152}, note: "Replace all springs as a set if one is out of limit."}
      - {name: "Clutch hub locknut", replace: always, cite: {p: 157}}
      - {name: "Clutch hub lockwasher", replace: inspect, cite: {p: 157}}
    sections:
      - title: "Plates and springs"
        steps:
          - {t: "If a plate or a spring does not meet the specifications, replace all the plates or all the springs as a set.", cite: {p: 152}}
          - {t: "If any part has wear or damage, replace it. This applies also if the part is in the specification.", cite: {p: 152}}
          - {t: "Clean the parts in solvent and dry them with compressed air. Clean the transmission shaft also.", cite: {p: 154}}
          - {t: "Measure the thickness of each friction plate at several locations around the edge.", cite: {p: 154}, figs: [26], spec_ref: "clutch:Friction plate thickness", conflict: {note: "The Kawasaki supplement and the KLR600 manual give other values for the friction plate thickness. Use the Clymer value.", agrees: false, others: [{t: "Standard 2.9-3.1 mm, service limit 2.75 mm.", cite: {s: kaw-supp, p: 39}}, {t: "Standard 2.75-3.05 mm, service limit 2.65 mm.", cite: {s: kaw-600, p: 56}}]}}
          - {t: "Examine the tabs on the friction plates. The tabs must not have damage.", cite: {p: 154}, figs: [27]}
          - {t: "Make sure that each friction plate slides smoothly in the clutch housing.", cite: {p: 154}}
          - {t: "Put each clutch plate on a surface plate or on a thick piece of glass. Measure the gap around the edge of the plate. This is the warp.", cite: {p: 155}, figs: [28], spec_ref: "clutch:Clutch plate (steel) warp"}
          - {t: "Examine the inner teeth on the clutch plates. The teeth must not have damage.", cite: {p: 155}, figs: [29]}
          - {t: "Make sure that each clutch plate slides smoothly on the clutch hub.", cite: {p: 155}}
          - {t: "Measure the free length of each clutch spring. Use the value that applies to this model.", cite: {p: 155}, figs: [30], spec_ref: "clutch:Clutch spring", conflict: {note: "The Kawasaki supplement gives the 1987-1995 Clymer value for all models to 2002. Use the Clymer value for 1996-on models.", agrees: false, others: [{t: "Standard 34.2 mm, service limit 33.1 mm.", cite: {s: kaw-supp, p: 39}}]}}
      - title: "Clutch housing and collar"
        steps:
          - {t: "Examine the clutch housing and the collar.", cite: {p: 155}, figs: [31]}
          - {t: "Examine the surface of the collar and the housing bore for wear and damage.", cite: {p: 156}}
          - {t: "Make sure that the collar fits in the bore and on the transmission shaft. The collar must move freely and must have no obvious play.", cite: {p: 156}}
          - {t: "Make sure that the oil pockets in the housing bore are clean.", cite: {p: 156}}
          - {t: "Examine the gear teeth for wear or damage.", cite: {p: 156}, figs: [31]}
          - {t: "Examine the damper springs and the rivets on both sides of the housing for looseness or damage.", cite: {p: 156}, figs: [31]}
          - {t: "Examine the slots for nicks, wear and damage. The slots must be smooth and free of defects so that the friction plates engage and disengage smoothly.", cite: {p: 156}, figs: [32]}
          - {t: "If chatter marks are present, smooth light damage with a fine-cut file or an oilstone.", cite: {p: 156}, figs: [33]}
      - title: "Clutch hub"
        steps:
          - {t: "Examine the shaft splines of the clutch hub. The hub must fit on the transmission shaft with no obvious play.", cite: {p: 156}, figs: [34]}
          - {t: "Examine the contact area on the edge of the hub for wear and damage.", cite: {p: 156}, figs: [34]}
          - {t: "Examine the bosses for damage.", cite: {p: 156}, figs: [34]}
          - {t: "Examine the outer splines for nicks, wear and damage. The splines must be smooth and free of defects so that the clutch plates engage and disengage smoothly.", cite: {p: 156}, figs: [34]}
          - {t: "If chatter marks are present, smooth light damage with a fine-cut file or an oilstone.", cite: {p: 156}}
      - title: "Pressure plate, lifter and bearing"
        steps:
          - {t: "Examine the pressure plate for cracks, particularly around the bosses and the bearing seat.", cite: {p: 156}, figs: [35]}
          - {t: "Examine the contact area on the edge of the pressure plate for wear and damage.", cite: {p: 156}}
          - {t: "Examine the bearing for radial play and axial play. The bearing must fit in the pressure plate with minimal play.", cite: {p: 157}}
          - {t: "If you replace the bearing, install it with the marks of the manufacturer up.", cite: {p: 157}}
          - {t: "Examine the lifter for wear at the contact area with the bearing.", cite: {p: 157}}
          - {kind: note, t: "The lifter is a loose fit in the bearing. The parts center themselves when the lifter is in the transmission shaft and the bearing is in the pressure plate.", cite: {p: 157}}
          - {t: "Examine the fit of the lifter with the release lever. If one part has damage, replace both parts.", cite: {p: 157}, figs: [36]}
      - title: "Other parts"
        steps:
          - {t: "Examine the bolts, the washers and the spacer for damage.", cite: {p: 157}}
          - {kind: note, t: "Do not use the locknut again. If the lockwasher is no longer cupped, replace the lockwasher.", cite: {p: 157}}
          - {t: "Examine the splines, the threads and the polished surfaces on the transmission shaft for damage.", cite: {p: 157}}
          - {t: "Install the clutch assembly.", cite: {p: 157}, op: c06-clutch-installation}

  - id: c06-clutch-installation
    title: "Clutch installation"
    system: "Clutch, gearshift linkage and lubrication system"
    source: clymer
    chapter: 6
    section: "06/clutch"
    summary: {t: "This procedure installs the clutch assembly on the transmission input shaft. Lubricate the parts and the transmission shaft with engine oil during assembly, unless the step says otherwise.", cite: {p: 157}}
    spec_refs: ["clutch-torque:Clutch hub locknut", "clutch-torque:Clutch spring bolts"]
    parts:
      - {name: "Clutch hub locknut", replace: always, cite: {p: 157}}
      - {name: "Clutch hub lockwasher", replace: inspect, cite: {p: 157}, note: "Replace the lockwasher if it is no longer cupped."}
      - {name: "Engine oil", replace: consumable, cite: {p: 157}}
      - {name: "Molybdenum disulfide grease", replace: consumable, cite: {p: 158}}
    sections:
      - steps:
          - {t: "Install the spacer.", cite: {p: 157}}
          - {t: "Install the clutch housing collar.", cite: {p: 157}}
          - {t: "Install the clutch housing on the collar.", cite: {p: 157}}
          - {t: "Install the washer.", cite: {p: 157}}
          - {t: "Install the clutch hub.", cite: {p: 157}}
          - {t: "Install the lockwasher so that the words OUT SIDE face out.", cite: {p: 157}, figs: [37]}
          - {t: "Install a new locknut so that the wide side of the nut is in contact with the lockwasher.", cite: {p: 157}, figs: [38]}
          - {t: "Temporarily install the right footpeg.", cite: {p: 157}}
          - {t: "Attach a clutch holder tool to the clutch hub. Put the tool against the footpeg.", cite: {p: 157}, figs: [39]}
          - {kind: caution, t: "Do not jam the gears with screwdrivers or other tools. This can cause gear breakage.", cite: {p: 157}}
          - {t: "Use a 30 mm socket to tighten the locknut to the specified torque.", cite: {p: 158}, spec_ref: "clutch-torque:Clutch hub locknut", conflict: {note: "The Kawasaki supplement gives the same torque in other units, with a different ft-lb value.", agrees: true, others: [{t: "130 N-m (98 ft-lb).", cite: {s: kaw-supp, p: 14}}]}}
          - {t: "Lubricate the plates with engine oil. Coat the faces of the friction plates completely with oil. This prevents seizure, particularly with new friction plates.", cite: {p: 158}, figs: [40]}
          - {t: "If possible, let the plates soak in engine oil before you install them.", cite: {p: 158}}
          - {t: "Install a friction plate first. Then install the clutch plates and the friction plates alternately in the clutch housing and on the clutch hub.", cite: {p: 158}, figs: [41]}
          - {kind: note, t: "On 1996-on models, the outer friction plate seats in the shallow slots of the outer housing.", cite: {p: 158}, figs: [18]}
          - {t: "Install the clutch lifter.", cite: {p: 158}}
          - {t: "Apply molybdenum disulfide grease to the lifter, particularly at the contact point with the bearing.", cite: {p: 158}}
          - {t: "Install the pressure plate and the bearing.", cite: {p: 158}}
          - {t: "Install the clutch springs on the hub bosses.", cite: {p: 158}}
          - {t: "Tighten the five bolts with your fingers.", cite: {p: 158}, figs: [42]}
          - {t: "Tighten the bolts in a crossing pattern. Make several passes so that all the bolts tighten in equal steps to the specified torque. Use the value that applies to this model.", cite: {p: 158}, spec_ref: "clutch-torque:Clutch spring bolts", conflict: {note: "The Kawasaki supplement gives a different torque for the clutch spring bolts. Use the Clymer value for 1996-on models.", agrees: false, others: [{t: "9.8 N-m (87 in-lb).", cite: {s: kaw-supp, p: 14}}]}}
          - {t: "Install the right crankcase cover.", cite: {p: 158}, op: c06-right-crankcase-cover}
