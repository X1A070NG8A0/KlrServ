    cite: {s: clymer, p: 241, ref: "Chapter Ten, Table 2"}
    rows:
      - {item: "Impeller nut", nm: "10", inlb: "88"}
      - {item: "Radiator fan switch", nm: "7.4", inlb: "65"}
