      - {group: "Main jet number", item: "Below 1220 m (4000 ft.)", value: "148"}
      - {group: "Main jet number", item: "Above 1220 m (4000 ft.)", value: "145"}
      - {item: "Main air jet number", value: "50"}
      - {item: "Needle jet number", value: "6"}
      - {item: "Jet needle", value: "N31R"}
      - {group: "Pilot jet number", item: "Below 1220 m (4000 ft.)", value: "40"}
      - {group: "Pilot jet number", item: "Above 1220 m (4000 ft.)", value: "38"}
      - {item: "Pilot air jet number", value: "70"}
