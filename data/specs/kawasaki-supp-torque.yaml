# Kawasaki KLR650/500 supplement, "Torque and Locking Agent" (PDF p14-16,
# printed 1-7 to 1-9), transcribed from page images.
#
# This PDF is a re-typeset copy, not a scan. On p15 several values are
# printed on the section-heading line instead of on the fastener line below
# it (e.g. "Wheels/Tires: 78 8.0 58" then "Front axle nut" with no values).
# Those rows are re-aligned here and marked `realigned: true`; each one was
# checked against the matching Clymer row before re-aligning.
#
# Remarks legend (p14): L = apply non-permanent locking agent to the threads;
# LG = apply liquid gasket to the threads; LS = apply liquid gasket (silicone
# sealant) to the threads; M = apply molybdenum disulfide lubricant (grease
# or oil) to the threads and seated surface, or washer; S = tighten the
# fasteners following the specified sequence.
