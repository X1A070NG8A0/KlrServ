# Queue for the STE paraphrase of the Clymer book. One writer at a time.
# A writer that stops (usage limit, crash) leaves its finished sections on
# disk; the next writer for that chapter continues from them (AUTHORING.md §7).
# After each chapter: run `node site/build.ts --check`, then commit a local
# checkpoint. Status: done | in-progress | todo.
order: [3, 14, 15, 12, 13, 11, 9, 8, 10, 4, 5, 6, 7, 2, 1, issues]
chapters:
  3: done
  14: done
  15: done
  12: done
  13: done
  11: done
  9: done
  8: done
  10: done
  4: done
  5: in-progress
  6: todo
  7: todo
  2: todo
  1: todo
  issues: todo   # data/issues/*.yaml rewrite in STE
after_writers:
  - Rebuild (npm run build), update README, check the site in the browser.
review:   # drawing-only values: read from the page image, recreate as an HTML diagram, set image_checked
  - "ch4 fig 25: camshaft cap bolt tightening sequence (PDF p99, p102)"
  - "ch4 fig 49: cylinder head bolt and nut tightening sequence (PDF p106-107)"
  - "ch4 figs 22-24: camshaft timing mark layout (PDF p97-98)"
